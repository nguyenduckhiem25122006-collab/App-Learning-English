<title>Nhịp Học Tiếng Anh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Học từ mới (Lớp 7 & TOEIC 750), câu giao tiếp và 44 âm IPA mỗi ngày — chạy offline.">
<!--PWA_HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* Layout concept: a student's notebook — ruled index cards on cool paper, the one bold mark is a yellow highlighter swipe on what to remember. */
:root {
  --paper: #F3F5F9; --card: #FFFFFF; --ink: #15223A; --muted: #59687F; --rule: #DAE1EC; --chip: #E7EDF7;
  --hl: #FFE066; --hl-swipe: #FFE066; --hl-ink: #3A2F00; --action: #2450B8; --action-ink: #FFFFFF;
  --good: #1D8556; --warn: #A86A12; --bad: #BE3B35;
  --f-display: "Lexend", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ipa: "Noto Sans", "Lucida Sans Unicode", "DejaVu Sans", "Segoe UI", sans-serif;
  --r: 14px; --shadow: 0 1px 2px rgba(21,34,58,.06), 0 6px 18px rgba(21,34,58,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0D1421; --card: #142034; --ink: #E4EBF5; --muted: #98A7BD; --rule: #24324B; --chip: #1C2A43;
  --hl: #E3C23C; --hl-swipe: rgba(227, 194, 60, .34); --hl-ink: #211A00; --action: #84A6FF; --action-ink: #0A1430;
  --good: #4BC48B; --warn: #E2A64C; --bad: #F2807A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0D1421; --card: #142034; --ink: #E4EBF5; --muted: #98A7BD; --rule: #24324B; --chip: #1C2A43;
  --hl: #E3C23C; --hl-swipe: rgba(227, 194, 60, .34); --hl-ink: #211A00; --action: #84A6FF; --action-ink: #0A1430;
  --good: #4BC48B; --warn: #E2A64C; --bad: #F2807A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card) }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; border-radius: 6px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2 }
h2 { font-size: 1.35rem } h3 { font-size: 1.05rem }
p { margin: 0 }
.ipa { font-family: var(--f-ipa); letter-spacing: .01em }
.hl { background: linear-gradient(transparent 52%, var(--hl-swipe) 52%, var(--hl-swipe) 90%, transparent 90%); color: inherit; padding: 0 .08em }
.muted { color: var(--muted) }
.small { font-size: .86rem }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.num { font-variant-numeric: tabular-nums }

/* Shell */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid var(--rule) }
.top-in { max-width: 980px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto }
.brand b { font: 700 1.25rem var(--f-display); letter-spacing: -.01em }
.brand b span { background: linear-gradient(transparent 58%, var(--hl-swipe) 58%, var(--hl-swipe) 92%, transparent 92%); padding: 0 .06em }
.levels { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px }
.levels button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: .9rem; color: var(--muted) }
.levels button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow) }
.streak { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .9rem }
.tabs { max-width: 980px; margin: 0 auto; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)) }
.tabs::-webkit-scrollbar { display: none }
.tabs button { border: 0; background: none; padding: 10px 12px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 6px }
.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--hl) }
.tabs svg { width: 18px; height: 18px }
main { max-width: 980px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px }
@media (max-width: 640px) {
  .tabs-wrap { position: fixed; inset: auto 0 0 0; z-index: 25; background: var(--card); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px) }
  .tabs { justify-content: space-between; gap: 0 }
  .tabs button { flex-direction: column; gap: 2px; font-size: .7rem; padding: 8px 4px 6px; border-bottom: 0; border-top: 3px solid transparent; flex: 1 }
  .tabs button[aria-current="page"] { border-top-color: var(--hl) }
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) }
  .streak .xp { display: none }
}

/* Building blocks */
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px; min-width: 0 }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
.grid { display: grid; gap: 14px }
.g3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }
.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)) }
.stack { display: grid; gap: 10px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--rule); background: var(--card); padding: 9px 14px; border-radius: 10px; font-weight: 600; min-height: 40px }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--action); color: var(--action-ink); border-color: var(--action) }
.btn.primary:hover { filter: brightness(1.08) }
.btn.ghost { border-color: transparent; background: transparent }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: .86rem }
.btn:disabled { opacity: .5; cursor: not-allowed }
.icon-btn { width: 40px; height: 40px; padding: 0; border-radius: 50% }
.btn svg, .icon-btn svg { width: 18px; height: 18px; flex: none }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--chip); font-size: .78rem; font-weight: 600; color: var(--muted) }
.chip.good { color: var(--good) } .chip.warn { color: var(--warn) } .chip.new { color: var(--action) }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--chip); padding: 3px; border-radius: 10px }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: .88rem; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow) }
.bar { height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden }
.bar > i { display: block; height: 100%; background: var(--action); border-radius: inherit }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden }
.stepper button { border: 0; background: var(--chip); width: 38px; height: 38px; font-size: 1.1rem; font-weight: 700 }
.stepper output { min-width: 46px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums }
input[type=search], input[type=text], input[type=password], select { border: 1px solid var(--rule); background: var(--card); border-radius: 10px; padding: 9px 12px; min-height: 40px; min-width: 0 }
input[type=range] { accent-color: var(--action); width: 100% }

/* Today */
.hello { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px }
.hello h1 { font-size: clamp(1.5rem, 4vw, 2rem) }
.goal { display: grid; gap: 10px; align-content: start }
.goal .big { font: 700 2rem var(--f-display); font-variant-numeric: tabular-nums }
.goal .big small { font-size: 1rem; color: var(--muted); font-weight: 600 }
.goal.done { border-color: var(--good) }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 84px }
.week div { display: grid; gap: 4px; justify-items: center; align-content: end; height: 100% }
.week i { width: 100%; max-width: 30px; border-radius: 6px 6px 3px 3px; background: var(--chip); min-height: 4px }
.week i.on { background: var(--action) }
.week i.today { outline: 2px solid var(--hl); outline-offset: 1px }
.week span { font-size: .72rem; color: var(--muted) }

/* Flashcard */
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-columns: minmax(0, 240px) 1fr }
.card .pic-wrap { position: relative; padding: 18px; border-right: 1px solid var(--rule); display: grid; place-items: center }
.card .body { padding: 20px 22px 20px 26px; display: grid; gap: 10px; align-content: start; min-width: 0;
  box-shadow: inset 3px 0 0 color-mix(in srgb, var(--bad) 35%, transparent) }
.word { font: 700 clamp(1.8rem, 6vw, 2.6rem) var(--f-display); letter-spacing: -.015em; overflow-wrap: anywhere }
.pos { font-style: italic; color: var(--muted); font-weight: 600 }
.meaning { font-size: 1.15rem; font-weight: 600 }
.example { padding: 4px 0; border-top: 1px dashed var(--rule); padding-top: 10px }
.example em { font-style: normal }
@media (max-width: 640px) { .card { grid-template-columns: 1fr } .card .pic-wrap { border-right: 0; border-bottom: 1px solid var(--rule) } }
.pic { width: 100%; max-width: 200px; aspect-ratio: 1; border-radius: 16px; display: grid; place-items: center; background: var(--chip); overflow: hidden; font-size: clamp(64px, 18vw, 110px); line-height: 1; user-select: none }
.pic img { width: 100%; height: 100%; object-fit: cover }
.pic.sm { width: 44px; height: 44px; max-width: 44px; font-size: 26px; border-radius: 10px }
.pic.md { max-width: 120px; font-size: 64px }
.edit-pic { position: absolute; right: 12px; bottom: 12px }
.dots { display: flex; gap: 6px; flex-wrap: wrap }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--chip) }
.dots i.on { background: var(--action) } .dots i.cur { background: var(--hl); outline: 2px solid var(--ink) }

/* Quiz */
.choices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) }
.choice { text-align: left; border: 2px solid var(--rule); background: var(--card); border-radius: 12px; padding: 12px 14px; font-weight: 600; min-height: 52px }
.choice:hover:not(:disabled) { border-color: var(--action) }
.choice.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--card)) }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--card)) }
.feedback { font-weight: 600 } .feedback.ok { color: var(--good) } .feedback.no { color: var(--bad) }

/* Lists */
.list { display: grid }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--rule); min-width: 0 }
.item:last-child { border-bottom: 0 }
.item .t { min-width: 0 }
.item .t b { font-family: var(--f-display) }
.item button.linkish { all: unset; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; min-width: 0 }
.item button.linkish:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; border-radius: 6px }
.topic { display: grid; gap: 6px }
.topic-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline }

/* Sentences */
.sent { display: grid; gap: 10px }
.sent .en { font: 600 clamp(1.15rem, 3.2vw, 1.4rem)/1.4 var(--f-display) }
.sent .vi { color: var(--muted) }
.note { font-size: .86rem; border-left: 3px solid var(--hl); padding-left: 10px }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; min-height: 44px; padding: 6px; border: 1px dashed var(--rule); border-radius: 10px }
.tile { border: 1px solid var(--rule); background: var(--chip); padding: 4px 10px; border-radius: 8px; font-weight: 600 }
.score { font: 700 1.6rem var(--f-display) }

/* IPA */
.ipa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px }
.snd { position: relative; border: 1px solid var(--rule); background: var(--card); border-radius: 12px; padding: 10px 4px 8px; display: grid; justify-items: center; gap: 2px }
.snd b { font: 600 1.6rem var(--f-ipa) }
.snd span { font-size: .7rem; color: var(--muted); text-align: center; line-height: 1.2 }
.snd.learned { border-color: var(--good) }
.snd.learned::after { content: ""; position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--good) }
.snd[aria-pressed="true"] { border-color: var(--action); box-shadow: 0 0 0 2px var(--action) inset }
.snd-detail { display: grid; gap: 14px }
.snd-sym { font: 600 3.4rem/1 var(--f-ipa) }
.ex-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px }
.ex { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--rule); border-radius: 10px; padding: 6px 6px 6px 12px; min-width: 0 }
.ex div { min-width: 0 }
.path { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px }
.path button { text-align: left; border: 1px solid var(--rule); background: var(--card); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px }
details { border-top: 1px solid var(--rule); padding: 10px 0 }
details summary { cursor: pointer; font-weight: 600; font-family: var(--f-display) }
details[open] summary { margin-bottom: 8px }

/* Progress */
.boxes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 110px }
.boxes div { display: grid; justify-items: center; gap: 4px; align-content: end; height: 100% }
.boxes i { width: 100%; max-width: 34px; background: var(--action); border-radius: 6px 6px 2px 2px; min-height: 2px }
.boxes span { font-size: .72rem; color: var(--muted) }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px }
.badge { border: 1px solid var(--rule); border-radius: 12px; padding: 10px; display: grid; gap: 4px; justify-items: center; text-align: center; font-size: .82rem; font-weight: 600 }
.badge .m { font-size: 1.7rem; filter: grayscale(1); opacity: .45 }
.badge.on { border-color: var(--hl) } .badge.on .m { filter: none; opacity: 1 }
.setting { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule) }
.setting:last-child { border-bottom: 0 }
@media (max-width: 520px) { .setting { grid-template-columns: 1fr } }

/* Farm — a bright game skin that stays sunny in dark mode too */
.farm-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; color: #fff; font-weight: 700; font-size: .9rem; min-height: 38px; padding: 6px 14px; border-radius: 999px;
  background: linear-gradient(#6CCB5F, #3FA34D); box-shadow: 0 3px 0 #2E7D32; text-shadow: 0 1px 0 rgba(0,0,0,.25) }
.farm-btn b { font-family: var(--f-display); background: rgba(255,255,255,.22); border-radius: 999px; padding: 1px 8px }
.farm-btn[aria-pressed="true"] { box-shadow: 0 3px 0 #2E7D32, 0 0 0 3px #FFD84D }
.farmv { --ink: #3B2A14; --muted: #7A5C3A; --rule: #EBD3A0; --chip: #FFE7A8; --card: #FFF8E6; --action: #3FA34D;
  color: var(--ink); display: grid; gap: 16px }
.farmv .panel { background: #FFF6DC; border: 3px solid #E7BF79; border-radius: 20px; box-shadow: 0 5px 0 #D29F55 }
.farmv h2 { color: #7A4514 }
.farmv .btn { border: 0; background: #fff; color: #5A3A12; box-shadow: 0 3px 0 #D9B57A; border-radius: 12px }
.farmv .btn.primary { background: linear-gradient(#6CCB5F, #3FA34D); color: #fff; box-shadow: 0 3px 0 #2E7D32; text-shadow: 0 1px 0 rgba(0,0,0,.2) }
.farmv .btn.ghost { background: transparent; box-shadow: none }
.farmv .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #D9B57A }
.farmv .chip { background: #FFE7A8; color: #7A4514 } .farmv .chip.good { background: #D8F5C8; color: #2E7D32 }
.farmv .bar { background: #F1DDB0; height: 10px } .farmv .bar > i { background: linear-gradient(90deg, #9BE36D, #3FA34D) }
.farmv .pic { background: #FFE9B8 }
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 18px; border-radius: 22px;
  background: linear-gradient(#FFF3C4, #FFE08A); border: 3px solid #E7BF79; box-shadow: 0 5px 0 #D29F55 }
.hud .lvl { width: 58px; height: 58px; flex: none; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: radial-gradient(circle at 35% 30%, #FFE98A, #F5A623); border: 3px solid #fff; box-shadow: 0 3px 0 #C77D12 }
.hud .lvl span { font-size: 2rem; line-height: 1 } .hud .lvl b { position: absolute; font: 700 1.05rem var(--f-display); color: #7A3E00 }
.hud .main { flex: 1 1 200px; display: grid; gap: 4px; min-width: 0 } .hud h1 { color: #6B3410; font-size: clamp(1.35rem, 4vw, 1.8rem) }
.pills { display: flex; flex-wrap: wrap; gap: 8px }
.pill { display: inline-flex; align-items: center; gap: 6px; background: #fff; border-radius: 999px; padding: 5px 12px 5px 8px; font-weight: 700; color: #5A3A12; box-shadow: 0 3px 0 #D9B57A }
.pill b { font-family: var(--f-display); font-variant-numeric: tabular-nums }
.pill.time { background: #E3F6FF; box-shadow: 0 3px 0 #8CC8E6; color: #0E5A7D }
.scene-wrap { position: relative; border-radius: 22px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 5px 0 #8CC8E6, 0 10px 24px rgba(30,80,120,.18); background: #8FD8FF }
svg.scene { display: block; width: 100%; height: clamp(200px, 33vw, 300px) }
svg.scene.wide { height: auto; aspect-ratio: 1300 / 300 }
.bubble { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); background: #fff; color: #3B2A14;
  border-radius: 16px; padding: 8px 14px; font-weight: 600; font-size: .92rem; text-align: center; box-shadow: 0 3px 0 rgba(0,0,0,.12) }
@media (max-width: 640px) { .bubble { font-size: .78rem; padding: 6px 10px; top: 8px } }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; border: 8px solid transparent; border-bottom: 0; border-top-color: #fff; transform: translateX(-50%) }
.field { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; padding: 12px; border-radius: 16px; background: #7CC85A; border: 3px solid #5DAA3E;
  background-image: radial-gradient(#8FD66B 2px, transparent 2.5px); background-size: 18px 18px }
.plot { position: relative; aspect-ratio: 1; border: 0; border-radius: 14px; color: #fff; display: grid; place-items: center; align-content: center; gap: 4px; padding: 6px; min-width: 0;
  background: repeating-linear-gradient(180deg, #A8723F 0 9px, #8E5D30 9px 12px); box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), 0 3px 0 #6E4423 }
.plot .e { font-size: 2.3rem; line-height: 1; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)) }
.plot .e.s1 { font-size: 1.3rem } .plot .e.s2 { font-size: 1.8rem } .plot .e.s3 { font-size: 2rem; opacity: .8 }
.plot.empty .e { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.9); color: #3FA34D; font: 700 1.5rem/34px var(--f-display); text-align: center; filter: none }
.plot .lbl, .plot .t { background: rgba(255,255,255,.9); color: #5A3A12; border-radius: 999px; padding: 1px 8px; font-size: .72rem; font-weight: 700 }
.plot .bar { width: 78%; height: 6px; background: rgba(255,255,255,.45) }
.plot.ready { box-shadow: 0 0 0 3px #FFD84D, inset 0 -5px 0 rgba(0,0,0,.18), 0 3px 0 #6E4423 }
.plot.ready::after { content: "✨"; position: absolute; top: 4px; right: 6px; font-size: .9rem }
.orders { display: grid; gap: 10px }
.order { background: #fff; border-radius: 14px; padding: 12px; display: grid; gap: 10px; box-shadow: 0 3px 0 #EBD3A0; border-left: 6px solid #F5A623 }
.need { display: flex; flex-wrap: wrap; gap: 6px }
.need span { padding: 3px 10px; border-radius: 999px; background: #FFF1CC; font-weight: 700; font-size: .9rem }

n.",""],["How are you doing?","Bạn dạo này thế nào?","Thân mật hơn \"How are you?\""],["I'm doing well, thanks. And you?","Mình ổn, cảm ơn. Còn bạn?",""],["Not bad, thanks for asking.","Cũng không tệ, cảm ơn đã hỏi.",""],["Where are you from?","Bạn đến từ đâu?",""],["I'm from Vietnam. I live in Hanoi.","Mình đến từ Việt Nam. Mình sống ở Hà Nội.",""],["What do you do?","Bạn làm nghề gì?","Hỏi về công việc một cách tự nhiên"],["I'm a student. / I work as an engineer.","Mình là sinh viên. / Mình làm kỹ sư.",""],["What brings you to Vietnam?","Điều gì đưa bạn đến Việt Nam?",""],["How long have you been here?","Bạn ở đây được bao lâu rồi?",""],["It was great talking to you.","Nói chuyện với bạn rất vui.",""],["See you later!","Hẹn gặp lại nhé!",""],["Take care!","Bảo trọng nhé!",""],["Have a nice day!","Chúc một ngày tốt lành!",""]]},{"stage":"Basic","en":"Polite expressions","vi":"Cảm ơn, xin lỗi & lịch sự","items":[["Thank you so much.","Cảm ơn bạn rất nhiều.",""],["You're welcome.","Không có gì.",""],["No problem at all.","Không sao cả.",""],["I really appreciate it.","Mình thực sự cảm kích.",""],["Sorry, I didn't catch that.","Xin lỗi, mình nghe chưa rõ.","Lịch sự hơn \"What?\""],["Could you say that again, please?","Bạn nói lại được không?",""],["Could you speak a little more slowly?","Bạn nói chậm hơn một chút được không?",""],["Excuse me, may I ask you something?","Xin lỗi, cho mình hỏi chút được không?",""],["Sorry I'm late.","Xin lỗi mình đến muộn.",""],["That's very kind of you.","Bạn thật tốt bụng.",""],["Don't worry about it.","Đừng lo về chuyện đó.",""],["After you.","Mời bạn đi trước.","Nhường đường/nhường lượt"]]},{"stage":"Basic","en":"Small talk","vi":"Nói chuyện phiếm","items":[["Lovely weather today, isn't it?","Hôm nay trời đẹp nhỉ?",""],["It's really hot today.","Hôm nay nóng thật.",""],["What do you do in your free time?","Lúc rảnh bạn làm gì?",""],["I like reading and playing badminton.","Mình thích đọc sách và chơi cầu lông.",""],["Have you tried Vietnamese food yet?","Bạn đã thử đồ ăn Việt chưa?",""],["What kind of music do you like?","Bạn thích thể loại nhạc nào?",""],["Did you have a good weekend?","Cuối tuần của bạn vui chứ?",""],["Yes, I went to the beach with my family.","Có, mình đi biển với gia đình.",""],["That sounds fun!","Nghe vui đấy!",""],["Me too! / Me neither.","Mình cũng vậy! / Mình cũng không.",""],["What a coincidence!","Trùng hợp thật!",""],["I know what you mean.","Mình hiểu ý bạn.",""]]},{"stage":"Basic","en":"Asking for help & directions","vi":"Hỏi đường & nhờ giúp đỡ","items":[["Excuse me, how do I get to the station?","Xin lỗi, đường đến nhà ga đi thế nào ạ?",""],["Is it far from here?","Có xa đây không?",""],["It's about a ten-minute walk.","Đi bộ khoảng mười phút.",""],["Go straight and turn left at the lights.","Đi thẳng rồi rẽ trái ở đèn giao thông.",""],["It's on your right, next to the bank.","Nó ở bên phải bạn, cạnh ngân hàng.",""],["Could you show me on the map?","Bạn chỉ giúp mình trên bản đồ được không?",""],["Is there a pharmacy near here?","Gần đây có hiệu thuốc không?",""],["Where is the restroom?","Nhà vệ sinh ở đâu?",""],["Can you help me, please?","Bạn giúp mình được không?",""],["I'm lost.","Mình bị lạc rồi.",""],["Which bus goes to the Old Quarter?","Xe buýt nào đi đến Phố Cổ?",""],["Can I walk there?","Mình đi bộ đến đó được không?",""],["You can't miss it.","Bạn không thể không thấy đâu.","Ý nói rất dễ tìm"],["Let me take you there.","Để mình dẫn bạn đến đó.",""]]},{"stage":"Basic","en":"Shopping","vi":"Mua sắm","items":[["How much is this?","Cái này bao nhiêu tiền?",""],["Can I try it on?","Mình mặc thử được không?",""],["Do you have this in a bigger size?","Có cỡ lớn hơn không?",""],["Do you have it in another color?","Có màu khác không?",""],["It's a bit expensive. Can you lower the price?","Hơi đắt. Bớt cho mình được không?",""],["I'll take it.","Mình lấy cái này.",""],["I'm just looking, thanks.","Mình chỉ xem thôi, cảm ơn.",""],["Can I pay by card?","Mình trả bằng thẻ được không?",""],["Could I have a bag, please?","Cho mình xin cái túi.",""],["Could I get a receipt?","Cho mình xin hoá đơn.",""],["Where can I find the milk?","Sữa để ở đâu vậy?",""],["Is this on sale?","Món này có giảm giá không?",""]]},{"stage":"Basic","en":"Eating out","vi":"Ăn uống ngoài hàng","items":[["A table for two, please.","Cho mình bàn hai người.",""],["Can I see the menu, please?","Cho mình xem thực đơn.",""],["What do you recommend?","Bạn gợi ý món gì?",""],["I'd like the chicken noodle soup.","Mình muốn gọi phở gà.",""],["Not too spicy, please.","Đừng cay quá nhé.",""],["I'm allergic to peanuts.","Mình bị dị ứng đậu phộng.",""],["Could I have some water, please?","Cho mình xin chút nước.",""],["This is delicious!","Món này ngon quá!",""],["Excuse me, we're ready to order.","Xin lỗi, bọn mình sẵn sàng gọi món rồi.",""],["Can we have the bill, please?","Cho mình xin hoá đơn thanh toán.",""],["Can we split the bill?","Mình chia hoá đơn được không?",""],["It's my treat.","Để mình mời.",""],["Is service included?","Đã bao gồm phí phục vụ chưa?",""],["Can I take this away?","Mình mang phần này về được không?",""],["Enjoy your meal!","Chúc ngon miệng!",""]]},{"stage":"Basic","en":"Time, dates & numbers","vi":"Thời gian, ngày tháng, con số","items":[["What time is it?","Mấy giờ rồi?",""],["It's half past seven.","Bảy giờ rưỡi.",""],["What's the date today?","Hôm nay ngày bao nhiêu?",""],["It's the fifteenth of May.","Hôm nay là ngày 15 tháng 5.",""],["When is your birthday?","Sinh nhật bạn khi nào?",""],["What time does it open?","Mấy giờ mở cửa?",""],["It's open from nine to five.","Mở cửa từ 9 giờ đến 5 giờ.",""],["How old are you? (to a child)","Cháu bao nhiêu tuổi?","Tránh hỏi tuổi người lớn khi mới quen"],["What's your phone number?","Số điện thoại của bạn là gì?",""],["Could you spell that, please?","Bạn đánh vần giúp mình được không?",""]]},{"stage":"Intermediate","en":"Travel & hotels","vi":"Du lịch & khách sạn","items":[["I have a reservation under the name Nguyen.","Tôi có đặt phòng tên Nguyễn.",""],["What time is check-out?","Mấy giờ trả phòng?",""],["Is breakfast included?","Có bao gồm bữa sáng không?",""],["Could I have a late check-out?","Tôi trả phòng muộn được không?",""],["The air conditioner in my room isn't working.","Máy lạnh phòng tôi không hoạt động.",""],["Could you call a taxi for me?","Bạn gọi giúp tôi một chiếc taxi được không?",""],["What's the Wi-Fi password?","Mật khẩu Wi-Fi là gì?",""],["Can I leave my luggage here?","Tôi gửi hành lý ở đây được không?",""],["I'd like to book a tour for tomorrow.","Tôi muốn đặt một tour cho ngày mai.",""],["What are the must-see places around here?","Quanh đây có chỗ nào nhất định phải đi không?",""],["How long does it take to get there?","Đi đến đó mất bao lâu?",""],["Is it safe to walk around at night?","Đi dạo buổi tối có an toàn không?",""],["Could you take a photo of us?","Bạn chụp giúp bọn mình một tấm ảnh được không?",""],["I'm here on holiday.","Tôi đến đây để đi nghỉ.",""],["My flight has been delayed.","Chuyến bay của tôi bị hoãn.",""]]},{"stage":"Intermediate","en":"Getting around","vi":"Di chuyển","items":[["Where can I buy a ticket?","Tôi mua vé ở đâu?",""],["A one-way ticket to Da Nang, please.","Cho tôi một vé một chiều đi Đà Nẵng.",""],["Does this bus stop at the museum?","Xe buýt này có dừng ở bảo tàng không?",""],["Please let me know when we get there.","Đến nơi thì báo tôi nhé.",""],["Could you drop me off here?","Cho tôi xuống ở đây được không?",""],["How much is the fare?","Giá vé là bao nhiêu?",""],["Please take me to this address.","Làm ơn chở tôi đến địa chỉ này.",""],["Is there a quicker way?","Có đường nào nhanh hơn không?",""],["I think we're going the wrong way.","Tôi nghĩ chúng ta đi sai đường rồi.",""],["Keep the change.","Không cần trả lại tiền thừa.",""]]},{"stage":"Intermediate","en":"Phone calls","vi":"Gọi điện thoại","items":[["Hello, this is Lan speaking.","Alô, tôi là Lan đây.",""],["Could I speak to Mr. Brown, please?","Cho tôi gặp ông Brown được không?",""],["Who's calling, please?","Xin hỏi ai đang gọi ạ?",""],["Hold on a moment, please.","Vui lòng chờ một chút.",""],["He's not available right now.","Anh ấy hiện không thể nghe máy.",""],["Can I take a message?","Tôi có thể nhận lời nhắn không?",""],["Could you ask him to call me back?","Nhờ bạn bảo anh ấy gọi lại cho tôi.",""],["Sorry, you're breaking up.","Xin lỗi, tín hiệu chập chờn quá.",""],["I think you have the wrong number.","Tôi nghĩ bạn gọi nhầm số rồi.",""],["Thanks for calling.","Cảm ơn đã gọi.",""]]},{"stage":"Intermediate","en":"Making plans & invitations","vi":"Lên kế hoạch & mời","items":[["Are you free this Saturday?","Thứ Bảy này bạn rảnh không?",""],["Would you like to grab a coffee?","Bạn có muốn đi uống cà phê không?",""],["How about seven o'clock?","Bảy giờ thì sao?",""],["That works for me.","Giờ đó mình được.",""],["Sorry, I can't make it. Maybe next time?","Tiếc quá, mình không đi được. Hẹn lần sau nhé?",""],["Let's meet in front of the cinema.","Gặp nhau trước rạp chiếu phim nhé.",""],["I'll text you the address.","Mình sẽ nhắn địa chỉ cho bạn.",""],["Shall we invite Nam too?","Mình mời cả Nam nhé?",""],["I'm running a bit late.","Mình đến muộn một chút.",""],["Count me in!","Tính cả mình nhé!",""],["Let me check and get back to you.","Để mình xem lại rồi báo bạn sau.",""],["Thanks for inviting me.","Cảm ơn bạn đã mời.",""]]},{"stage":"Intermediate","en":"Health","vi":"Sức khoẻ","items":[["I don't feel very well.","Mình thấy không khoẻ lắm.",""],["I have a headache and a sore throat.","Mình bị đau đầu và đau họng.",""],["I need to see a doctor.","Mình cần gặp bác sĩ.",""],["How long have you had these symptoms?","Bạn bị các triệu chứng này bao lâu rồi?",""],["Do I need a prescription for this?","Thuốc này có cần đơn không?",""],["How often should I take it?","Tôi nên uống mấy lần?",""],["Take one tablet twice a day after meals.","Uống một viên, ngày hai lần sau ăn.",""],["I hope you feel better soon.","Mong bạn sớm khoẻ.",""],["Get some rest.","Nghỉ ngơi đi nhé.",""],["Where is the nearest hospital?","Bệnh viện gần nhất ở đâu?",""]]},{"stage":"Intermediate","en":"Opinions & preferences","vi":"Ý kiến & sở thích","items":[["What do you think about it?","Bạn nghĩ sao về điều đó?",""],["In my opinion, it's a great idea.","Theo mình, đó là ý hay.",""],["I prefer tea to coffee.","Mình thích trà hơn cà phê.",""],["I'd rather stay home tonight.","Tối nay mình muốn ở nhà hơn.",""],["I'm not a big fan of horror films.","Mình không mê phim kinh dị lắm.",""],["It's not my cup of tea.","Đó không phải gu của mình.","Thành ngữ phổ biến"],["I can't stand loud music.","Mình không chịu nổi nhạc ồn.",""],["I'm really into photography.","Mình rất mê nhiếp ảnh.",""],["It depends.","Cái đó còn tuỳ.",""],["To be honest, I'm not sure.","Thật lòng thì mình không chắc.",""],["That makes sense.","Nghe hợp lý đấy.",""],["Fair enough.","Cũng phải.",""]]},{"stage":"Intermediate","en":"Showing visitors around","vi":"Dẫn khách nước ngoài tham quan","items":[["Welcome to Hanoi!","Chào mừng đến Hà Nội!",""],["This is one of the oldest streets in the city.","Đây là một trong những con phố lâu đời nhất thành phố.",""],["You should try egg coffee—it's a local specialty.","Bạn nên thử cà phê trứng—đặc sản ở đây.",""],["Be careful when crossing the street.","Cẩn thận khi sang đường nhé.",""],["Just walk slowly and steadily.","Cứ đi chậm và đều.","Mẹo sang đường ở VN"],["This temple was built in the 11th century.","Ngôi đền này được xây vào thế kỷ 11.",""],["You need to take off your shoes here.","Bạn cần cởi giày ở đây.",""],["Let me help you order.","Để mình giúp bạn gọi món.",""],["It's usually cheaper at the local market.","Ở chợ địa phương thường rẻ hơn.",""],["Have you been to Ha Long Bay?","Bạn đến Vịnh Hạ Long chưa?",""],["The best time to visit is in autumn.","Thời điểm đẹp nhất để đến là mùa thu.",""],["I hope you enjoy your stay.","Mong bạn có kỳ lưu trú vui vẻ.",""]]},{"stage":"Advanced","en":"Agreeing & disagreeing politely","vi":"Đồng ý & phản đối lịch sự","items":[["I couldn't agree more.","Mình hoàn toàn đồng ý.",""],["That's a good point.","Ý đó hay đấy.",""],["I see what you mean, but…","Mình hiểu ý bạn, nhưng…",""],["I'm afraid I don't quite agree.","E là mình không đồng ý lắm.",""],["I see it a bit differently.","Mình nhìn nhận hơi khác một chút.",""],["You might be right, but have you considered…?","Có thể bạn đúng, nhưng bạn đã nghĩ đến… chưa?",""],["Let's agree to disagree.","Mình cứ giữ quan điểm riêng nhé.",""],["That's not entirely true.","Điều đó không hoàn toàn đúng.",""],["Fair point, I hadn't thought of that.","Ý hay, mình chưa nghĩ đến điều đó.",""],["I'm with you on that.","Mình đứng về phía bạn ở điểm này.",""],["I'd have to disagree there.","Ở điểm này mình phải không đồng ý.",""],["Absolutely!","Chắc chắn rồi!",""]]},{"stage":"Advanced","en":"Complaints & solving problems","vi":"Phàn nàn & giải quyết vấn đề","items":[["I'm afraid there's a problem with my order.","E là đơn hàng của tôi có vấn đề.",""],["This isn't what I ordered.","Đây không phải món tôi gọi.",""],["I'd like to speak to the manager, please.","Tôi muốn gặp quản lý.",""],["I was charged twice for the same item.","Tôi bị tính tiền hai lần cho cùng một món.",""],["Could you look into this for me?","Bạn kiểm tra giúp tôi được không?",""],["I'd appreciate it if you could fix this today.","Tôi sẽ rất cảm kích nếu bạn xử lý trong hôm nay.",""],["What can you do to make it right?","Bạn có thể làm gì để khắc phục?",""],["I'd like a refund, please.","Tôi muốn được hoàn tiền.",""],["It's been more than a week and I still haven't heard back.","Đã hơn một tuần mà tôi vẫn chưa nhận phản hồi.",""],["Thank you for sorting this out so quickly.","Cảm ơn bạn đã giải quyết nhanh như vậy.",""],["I understand it's not your fault.","Tôi hiểu đây không phải lỗi của bạn.",""],["Let's see what we can do.","Để xem chúng ta có thể làm gì.",""]]},{"stage":"Advanced","en":"Telling stories & experiences","vi":"Kể chuyện & trải nghiệm","items":[["You won't believe what happened to me yesterday.","Bạn sẽ không tin chuyện xảy ra với mình hôm qua đâu.",""],["It all started when I missed my bus.","Mọi chuyện bắt đầu khi mình lỡ chuyến xe buýt.",""],["To make a long story short, we got there late.","Nói ngắn gọn là bọn mình đến muộn.",""],["The funny thing is…","Điều buồn cười là…",""],["Luckily, someone helped us.","May mắn là có người đã giúp.",""],["I'll never forget that day.","Mình sẽ không bao giờ quên ngày đó.",""],["Have you ever been in a situation like that?","Bạn đã bao giờ gặp tình huống như vậy chưa?",""],["It was the best trip of my life.","Đó là chuyến đi tuyệt nhất đời mình.",""],["Looking back, it was a great lesson.","Nhìn lại thì đó là bài học quý.",""],["Anyway, that's what happened.","Dù sao thì chuyện là vậy.",""]]},{"stage":"Advanced","en":"Culture & deeper conversations","vi":"Văn hoá & trò chuyện sâu","items":[["What's the biggest culture shock you've had here?","Cú sốc văn hoá lớn nhất của bạn ở đây là gì?",""],["In Vietnam, we usually greet older people first.","Ở Việt Nam, chúng tôi thường chào người lớn tuổi trước.",""],["How do people celebrate New Year in your country?","Ở nước bạn người ta đón năm mới thế nào?",""],["Family is very important in our culture.","Gia đình rất quan trọng trong văn hoá chúng tôi.",""],["That's really interesting. Tell me more.","Thú vị thật. Kể thêm đi.",""],["I've always wondered about that.","Mình luôn thắc mắc về điều đó.",""],["It's considered rude to point at people.","Chỉ tay vào người khác bị coi là bất lịch sự.",""],["I hope I'm not being too personal.","Mong là mình không hỏi quá riêng tư.",""],["What do you miss most about home?","Bạn nhớ điều gì nhất ở quê nhà?",""],["Every culture has its own way of doing things.","Mỗi nền văn hoá có cách làm riêng.",""],["I'd love to visit your country someday.","Mình rất muốn đến nước bạn một ngày nào đó.",""],["Thanks for sharing that with me.","Cảm ơn bạn đã chia sẻ.",""]]},{"stage":"Advanced","en":"Emergencies","vi":"Tình huống khẩn cấp","items":[["Help! Somebody call an ambulance!","Cứu với! Ai đó gọi xe cấp cứu đi!",""],["I've lost my passport.","Tôi bị mất hộ chiếu.",""],["My wallet has been stolen.","Ví của tôi bị lấy cắp.",""],["Where is the nearest police station?","Đồn cảnh sát gần nhất ở đâu?",""],["I need to contact my embassy.","Tôi cần liên hệ đại sứ quán.",""],["There's been an accident.","Có tai nạn xảy ra.",""],["Is anyone hurt?","Có ai bị thương không?",""],["Please stay calm.","Xin hãy bình tĩnh.",""],["Can I use your phone? It's an emergency.","Cho tôi mượn điện thoại được không? Việc khẩn cấp.",""],["Fire! Get out of the building!","Cháy! Ra khỏi toà nhà ngay!",""]]},{"stage":"Advanced","en":"Keeping a conversation going","vi":"Duy trì cuộc trò chuyện","items":[["By the way, …","Nhân tiện thì…",""],["Speaking of travel, have you been to Hue?","Nói về du lịch, bạn đã đến Huế chưa?",""],["What do you mean by that?","Ý bạn là sao?",""],["So what happened next?","Rồi sao nữa?",""],["That reminds me of…","Điều đó làm mình nhớ đến…",""],["Where was I?","Mình đang nói đến đâu rồi nhỉ?",""],["Sorry, go on.","Xin lỗi, bạn nói tiếp đi.",""],["Let me put it another way.","Để mình nói theo cách khác.",""],["How did you get into that?","Bạn bắt đầu với việc đó thế nào?",""],["I'd better get going. It was lovely chatting!","Mình phải đi rồi. Nói chuyện vui lắm!",""],["Let's keep in touch.","Giữ liên lạc nhé.",""],["Feel free to message me anytime.","Cứ nhắn mình bất cứ lúc nào.",""]]}],"work":[{"stage":"Basic","en":"Introducing yourself at work","vi":"Giới thiệu bản thân ở công ty","items":[["Hi everyone, I'm Hoa. I just joined the marketing team.","Chào mọi người, tôi là Hoa. Tôi vừa vào nhóm marketing.",""],["I'll be working on the new product launch.","Tôi sẽ phụ trách đợt ra mắt sản phẩm mới.",""],["I'm responsible for customer accounts in the south.","Tôi phụ trách các tài khoản khách hàng khu vực phía Nam.",""],["I report directly to Ms. Smith.","Tôi báo cáo trực tiếp cho chị Smith.",""],["I've been with the company for three years.","Tôi đã làm ở công ty được ba năm.",""],["Before this, I worked in finance.","Trước đây tôi làm trong ngành tài chính.",""],["Let me know if there's anything I can help with.","Có gì tôi giúp được thì cứ báo tôi nhé.",""],["Which team are you on?","Bạn thuộc nhóm nào?",""],["How long have you been working here?","Bạn làm ở đây bao lâu rồi?",""],["Welcome aboard!","Chào mừng bạn gia nhập!","Câu chào đồng nghiệp mới"],["I'm looking forward to working with you.","Tôi mong được làm việc cùng bạn.",""],["Could you show me how this works?","Bạn chỉ tôi cách dùng cái này được không?",""],["Who should I ask about access to the system?","Tôi nên hỏi ai về quyền truy cập hệ thống?",""],["Where can I find the onboarding documents?","Tôi tìm tài liệu hướng dẫn nhân viên mới ở đâu?",""],["Thanks for making me feel welcome.","Cảm ơn mọi người đã đón tiếp tôi.",""]]},{"stage":"Basic","en":"Office small talk","vi":"Trò chuyện ở văn phòng","items":[["How was your weekend?","Cuối tuần của bạn thế nào?",""],["Are you heading to lunch?","Bạn đi ăn trưa à?",""],["Do you want to join us for lunch?","Bạn muốn đi ăn trưa cùng bọn mình không?",""],["It's been a busy week.","Tuần này bận thật.",""],["Are you working on anything interesting?","Bạn có đang làm gì thú vị không?",""],["Any plans for the holiday?","Kỳ nghỉ có kế hoạch gì không?",""],["Congratulations on your promotion!","Chúc mừng bạn được thăng chức!",""],["I heard you did a great job on the presentation.","Nghe nói bạn thuyết trình rất tốt.",""],["Long time no see!","Lâu rồi không gặp!",""],["How's the project going?","Dự án tiến triển thế nào rồi?",""],["Have a good evening. See you tomorrow.","Chúc buổi tối vui vẻ. Mai gặp nhé.",""],["Happy Friday!","Thứ Sáu vui vẻ!",""]]},{"stage":"Basic","en":"Asking colleagues for help","vi":"Nhờ đồng nghiệp giúp","items":[["Do you have a minute?","Bạn có rảnh một phút không?",""],["Could you give me a hand with this?","Bạn giúp tôi việc này một tay được không?",""],["Would you mind checking this for me?","Bạn có phiền kiểm tra giúp tôi không?",""],["Sorry to bother you, but…","Xin lỗi làm phiền bạn, nhưng…",""],["I'm not sure how to do this. Could you help?","Tôi không chắc làm việc này thế nào. Bạn giúp được không?",""],["Who's the best person to ask about this?","Ai là người phù hợp nhất để hỏi việc này?",""],["Could you send me that file?","Bạn gửi tôi file đó được không?",""],["Thanks, that's really helpful.","Cảm ơn, thật sự rất hữu ích.",""],["I owe you one.","Tôi nợ bạn một lần nhé.","Cách cảm ơn thân mật"],["Let me know if you need anything from me.","Bạn cần gì từ tôi thì cứ báo nhé.",""],["No rush.","Không gấp đâu.",""],["Whenever you have time.","Khi nào bạn rảnh cũng được.",""]]},{"stage":"Basic","en":"Phone basics at work","vi":"Điện thoại công việc","items":[["Good morning, ABC Company. How may I help you?","Chào buổi sáng, công ty ABC xin nghe. Tôi có thể giúp gì?",""],["May I ask who's calling?","Cho tôi hỏi ai đang gọi ạ?",""],["I'm calling about the order we placed last week.","Tôi gọi về đơn hàng chúng tôi đặt tuần trước.",""],["I'll put you through.","Tôi sẽ chuyển máy cho bạn.",""],["She's in a meeting at the moment.","Hiện chị ấy đang họp.",""],["Would you like to leave a message?","Bạn có muốn để lại lời nhắn không?",""],["Could you spell your name, please?","Bạn đánh vần tên giúp tôi được không?",""],["Let me read that back to you.","Để tôi đọc lại cho bạn kiểm tra.",""],["I'll make sure he gets your message.","Tôi sẽ đảm bảo anh ấy nhận được lời nhắn.",""],["What's the best number to reach you?","Số nào liên lạc với bạn tốt nhất?",""],["Thank you for holding.","Cảm ơn bạn đã chờ máy.",""],["Is there anything else I can help you with?","Bạn còn cần tôi giúp gì nữa không?",""]]},{"stage":"Basic","en":"Email openings & closings","vi":"Mở đầu & kết thúc email","items":[["Dear Mr. Tanaka,","Kính gửi ông Tanaka,",""],["I hope this email finds you well.","Hy vọng anh/chị vẫn khoẻ.",""],["I'm writing to ask about…","Tôi viết thư này để hỏi về…",""],["Thank you for your email.","Cảm ơn email của anh/chị.",""],["As requested, I've attached the report.","Theo yêu cầu, tôi đã đính kèm báo cáo.",""],["Please find the details below.","Vui lòng xem chi tiết bên dưới.",""],["Just a quick reminder that…","Xin nhắc nhanh rằng…",""],["Please let me know if you have any questions.","Nếu có câu hỏi gì, xin vui lòng cho tôi biết.",""],["I look forward to hearing from you.","Tôi mong nhận được phản hồi của anh/chị.",""],["Thanks in advance for your help.","Cảm ơn trước sự giúp đỡ của anh/chị.",""],["Best regards,","Trân trọng,",""],["Sorry for the late reply.","Xin lỗi vì phản hồi muộn.",""]]},{"stage":"Basic","en":"Scheduling","vi":"Sắp xếp lịch","items":[["When are you available this week?","Tuần này khi nào anh/chị rảnh?",""],["Does Tuesday at 10 work for you?","Thứ Ba lúc 10 giờ có tiện không?",""],["I'm afraid I'm busy then. How about Wednesday?","E là lúc đó tôi bận. Thứ Tư thì sao?",""],["Let's set up a meeting to discuss it.","Hãy sắp xếp một cuộc họp để bàn việc này.",""],["I'll send you a calendar invite.","Tôi sẽ gửi lời mời trên lịch.",""],["Can we move the meeting to the afternoon?","Chúng ta dời cuộc họp sang buổi chiều được không?",""],["I need to reschedule our call.","Tôi cần dời lịch cuộc gọi của chúng ta.",""],["Let's keep it to 30 minutes.","Hãy giữ trong 30 phút thôi.",""],["What time zone are you in?","Anh/chị đang ở múi giờ nào?",""],["I'll be out of the office next Monday.","Thứ Hai tới tôi không có mặt ở văn phòng.",""],["Could we push the deadline back a few days?","Chúng ta lùi hạn chót vài ngày được không?",""],["Let's touch base on Friday.","Thứ Sáu chúng ta trao đổi lại nhé.",""]]},{"stage":"Intermediate","en":"Meetings","vi":"Họp","items":[["Shall we get started?","Chúng ta bắt đầu nhé?",""],["Thanks, everyone, for coming.","Cảm ơn mọi người đã đến.",""],["The purpose of today's meeting is to…","Mục đích cuộc họp hôm nay là…",""],["Let's go over the agenda.","Hãy cùng xem qua chương trình họp.",""],["Could you give us an update on the project?","Anh/chị cập nhật cho chúng tôi về dự án được không?",""],["Can I add something here?","Tôi bổ sung một ý được không?",""],["Sorry to interrupt, but…","Xin lỗi đã ngắt lời, nhưng…",""],["Let's get back to the main point.","Hãy quay lại vấn đề chính.",""],["I think we're running out of time.","Tôi nghĩ chúng ta sắp hết thời gian.",""],["Let's take this offline.","Việc này mình bàn riêng sau nhé.","Không bàn tiếp trong cuộc họp"],["Who will take the lead on this?","Ai sẽ phụ trách việc này?",""],["What are the next steps?","Các bước tiếp theo là gì?",""],["Let's recap what we've agreed.","Hãy tóm tắt lại những gì đã thống nhất.",""],["I'll send out the minutes after the meeting.","Tôi sẽ gửi biên bản sau cuộc họp.",""],["Does anyone have any questions?","Có ai có câu hỏi không?",""],["Let's schedule a follow-up meeting.","Hãy lên lịch một cuộc họp tiếp theo.",""],["I'd like to hear everyone's thoughts.","Tôi muốn nghe ý kiến của mọi người.",""],["That's all for today. Thanks, everyone.","Hôm nay đến đây thôi. Cảm ơn mọi người.",""]]},{"stage":"Intermediate","en":"Giving updates","vi":"Báo cáo tiến độ","items":[["We're on track to finish by Friday.","Chúng tôi đang đúng tiến độ để xong trước thứ Sáu.",""],["We're slightly behind schedule.","Chúng tôi hơi chậm tiến độ.",""],["The first phase is complete.","Giai đoạn đầu đã hoàn thành.",""],["We've run into a few issues with the supplier.","Chúng tôi gặp vài vấn đề với nhà cung cấp.",""],["I'm still waiting for approval from finance.","Tôi vẫn đang chờ phòng tài chính phê duyệt.",""],["The main challenge right now is…","Thách thức chính hiện nay là…",""],["We expect to have results by next week.","Chúng tôi dự kiến có kết quả vào tuần sau.",""],["Sales are up 12% compared to last quarter.","Doanh số tăng 12% so với quý trước.",""],["Here's a quick summary of where we are.","Đây là tóm tắt nhanh tình hình hiện tại.",""],["I'll keep you posted.","Tôi sẽ cập nhật thường xuyên cho anh/chị.",""],["Everything is going according to plan.","Mọi thứ đang diễn ra theo kế hoạch.",""],["We need more resources to meet the deadline.","Chúng tôi cần thêm nguồn lực để kịp hạn chót.",""]]},{"stage":"Intermediate","en":"Asking for clarification","vi":"Hỏi lại cho rõ","items":[["Could you clarify what you mean by…?","Anh/chị làm rõ ý … được không?",""],["Just to make sure I understand, you want…?","Để chắc là tôi hiểu đúng, anh/chị muốn…?",""],["Could you give me an example?","Anh/chị cho tôi một ví dụ được không?",""],["What's the deadline for this?","Hạn chót cho việc này là khi nào?",""],["Sorry, could you repeat the last part?","Xin lỗi, anh/chị nhắc lại phần cuối được không?",""],["Do you mean we should cancel it?","Ý anh/chị là chúng ta nên huỷ nó?",""],["Could you walk me through it?","Anh/chị hướng dẫn tôi từng bước được không?",""],["So, if I understand correctly, …","Vậy nếu tôi hiểu đúng thì…",""],["Is that a priority?","Việc đó có phải ưu tiên không?",""],["What exactly do you need from me?","Chính xác anh/chị cần gì từ tôi?",""]]},{"stage":"Intermediate","en":"Requests & offers","vi":"Đề nghị & đề xuất giúp đỡ","items":[["Would it be possible to get the report by noon?","Có thể có báo cáo trước buổi trưa không?",""],["I was wondering if you could help me with this.","Không biết anh/chị có thể giúp tôi việc này không.",""],["Could you please send me the latest figures?","Anh/chị gửi tôi số liệu mới nhất được không?",""],["Would you mind reviewing my draft?","Anh/chị có phiền xem bản nháp của tôi không?",""],["I'd be happy to help.","Tôi rất sẵn lòng giúp.",""],["Let me take care of that.","Để tôi lo việc đó.",""],["Would you like me to prepare the slides?","Anh/chị có muốn tôi chuẩn bị slide không?",""],["I can cover for you tomorrow.","Mai tôi có thể làm thay anh/chị.",""],["Is there anything I can do to help?","Tôi có thể giúp gì không?",""],["I'm afraid I can't take on any more work this week.","E là tuần này tôi không nhận thêm việc được nữa.",""],["Could we discuss this after lunch?","Chúng ta bàn việc này sau bữa trưa được không?",""],["That would be a great help.","Điều đó sẽ giúp ích rất nhiều.",""]]},{"stage":"Intermediate","en":"Presentations","vi":"Thuyết trình","items":[["Good morning, everyone. Thank you for being here.","Chào buổi sáng mọi người. Cảm ơn mọi người đã có mặt.",""],["Today, I'm going to talk about our new strategy.","Hôm nay tôi sẽ nói về chiến lược mới của chúng ta.",""],["My presentation is divided into three parts.","Bài thuyết trình của tôi chia làm ba phần.",""],["Let's start with some background.","Hãy bắt đầu với một chút bối cảnh.",""],["As you can see on this slide, …","Như các bạn thấy trên slide này…",""],["This chart shows our sales over the past year.","Biểu đồ này cho thấy doanh số trong năm qua.",""],["Let me draw your attention to this figure.","Tôi xin lưu ý các bạn đến con số này.",""],["Moving on to the next point, …","Chuyển sang ý tiếp theo…",""],["This brings me to my next point.","Điều này dẫn tôi đến ý tiếp theo.",""],["To sum up, …","Tóm lại…",""],["The key takeaway is…","Điểm mấu chốt cần nhớ là…",""],["I'll be happy to take any questions.","Tôi sẵn lòng trả lời câu hỏi.",""],["That's a great question.","Đó là một câu hỏi hay.",""],["I don't have that information right now, but I'll get back to you.","Hiện tôi chưa có thông tin đó, nhưng tôi sẽ phản hồi sau.",""],["Thank you for your attention.","Cảm ơn mọi người đã lắng nghe.",""]]},{"stage":"Intermediate","en":"Customer service","vi":"Chăm sóc khách hàng","items":[["Thank you for contacting us.","Cảm ơn quý khách đã liên hệ.",""],["How can I assist you today?","Hôm nay tôi có thể hỗ trợ gì cho quý khách?",""],["I'm sorry to hear about that.","Tôi rất tiếc khi nghe điều đó.",""],["Could you give me your order number?","Quý khách cho tôi xin mã đơn hàng được không?",""],["Let me check that for you.","Để tôi kiểm tra cho quý khách.",""],["I completely understand your frustration.","Tôi hoàn toàn hiểu sự bực bội của quý khách.",""],["We'll send you a replacement free of charge.","Chúng tôi sẽ gửi sản phẩm thay thế miễn phí.",""],["I've escalated your case to our technical team.","Tôi đã chuyển trường hợp của quý khách lên đội kỹ thuật.",""],["You should receive it within three business days.","Quý khách sẽ nhận được trong vòng ba ngày làm việc.",""],["Is there anything else I can do for you?","Tôi còn có thể giúp gì nữa không?",""],["We appreciate your patience.","Chúng tôi trân trọng sự kiên nhẫn của quý khách.",""],["Thank you for your business.","Cảm ơn quý khách đã tin dùng.",""]]},{"stage":"Intermediate","en":"Video calls","vi":"Họp trực tuyến","items":[["Can everyone hear me?","Mọi người có nghe tôi nói không?",""],["I think you're on mute.","Tôi nghĩ bạn đang tắt mic.",""],["Your screen is frozen.","Màn hình của bạn bị đứng.",""],["Let me share my screen.","Để tôi chia sẻ màn hình.",""],["Can you see my screen?","Mọi người thấy màn hình của tôi không?",""],["Sorry, my connection is a bit unstable.","Xin lỗi, kết nối của tôi hơi chập chờn.",""],["Could you turn on your camera?","Bạn bật camera lên được không?",""],["I'll drop the link in the chat.","Tôi sẽ gửi đường link vào khung chat.",""],["You cut out for a second.","Tiếng của bạn bị mất một lúc.",""],["Let's wait a couple of minutes for others to join.","Hãy đợi vài phút để mọi người vào.",""]]},{"stage":"Advanced","en":"Negotiation","vi":"Đàm phán","items":[["What would you need to see in order to move forward?","Anh/chị cần thấy điều gì để có thể tiến tới?",""],["We're looking for a long-term partnership.","Chúng tôi đang tìm kiếm quan hệ đối tác lâu dài.",""],["Is there any flexibility on the price?","Giá có thể linh hoạt không?",""],["That's a bit higher than our budget.","Mức đó hơi cao so với ngân sách của chúng tôi.",""],["If you can lower the price, we can increase the order.","Nếu anh/chị giảm giá, chúng tôi có thể tăng số lượng đặt hàng.",""],["We could offer a 5% discount for bulk orders.","Chúng tôi có thể giảm 5% cho đơn hàng số lượng lớn.",""],["I'm afraid that's our final offer.","E rằng đó là đề nghị cuối cùng của chúng tôi.",""],["Let's find a solution that works for both sides.","Hãy tìm giải pháp có lợi cho cả hai bên.",""],["I need to run this by my manager.","Tôi cần trao đổi việc này với quản lý.",""],["Can we put that in writing?","Chúng ta ghi việc đó thành văn bản được không?",""],["I think we have a deal.","Tôi nghĩ chúng ta đã thoả thuận xong.",""],["Let's meet halfway.","Mỗi bên nhượng bộ một chút nhé.",""]]},{"stage":"Advanced","en":"Disagreeing diplomatically","vi":"Phản đối khéo léo","items":[["I understand your point, but I have some concerns.","Tôi hiểu quan điểm của anh/chị, nhưng tôi có vài băn khoăn.",""],["I'm not sure that's the best approach.","Tôi không chắc đó là cách tiếp cận tốt nhất.",""],["Have we considered the risks?","Chúng ta đã cân nhắc rủi ro chưa?",""],["I see where you're coming from, however…","Tôi hiểu lý do của anh/chị, tuy nhiên…",""],["With respect, I'd like to suggest an alternative.","Với sự tôn trọng, tôi muốn đề xuất một phương án khác.",""],["Could we look at this from a different angle?","Chúng ta nhìn vấn đề từ góc khác được không?",""],["The data suggest otherwise.","Số liệu lại cho thấy điều ngược lại.",""],["I'm not fully convinced yet.","Tôi chưa hoàn toàn bị thuyết phục.",""],["Let's weigh the pros and cons.","Hãy cân nhắc ưu và nhược điểm.",""],["I'd be cautious about committing to that.","Tôi sẽ thận trọng khi cam kết việc đó.",""],["That might work, but let's test it first.","Có thể ổn, nhưng hãy thử nghiệm trước.",""],["I'm happy to go with the team's decision.","Tôi sẵn sàng theo quyết định của nhóm.",""]]},{"stage":"Advanced","en":"Giving & receiving feedback","vi":"Góp ý & nhận góp ý","items":[["You did a great job on the report.","Bạn làm báo cáo rất tốt.",""],["One thing you could improve is…","Một điểm bạn có thể cải thiện là…",""],["Have you thought about trying…?","Bạn đã nghĩ đến việc thử… chưa?",""],["I really appreciate your attention to detail.","Tôi rất trân trọng sự tỉ mỉ của bạn.",""],["It might be clearer if you…","Có lẽ sẽ rõ hơn nếu bạn…",""],["Thanks for the feedback. That's really useful.","Cảm ơn góp ý. Rất hữu ích.",""],["Could you be more specific?","Anh/chị nói cụ thể hơn được không?",""],["I'll take that on board.","Tôi sẽ tiếp thu điều đó.",""],["How do you think I could do better next time?","Anh/chị nghĩ lần sau tôi có thể làm tốt hơn thế nào?",""],["I take full responsibility for the mistake.","Tôi chịu hoàn toàn trách nhiệm về lỗi đó.",""],["Let's discuss how to avoid this in the future.","Hãy bàn cách tránh việc này trong tương lai.",""],["Keep up the good work!","Cứ tiếp tục phát huy nhé!",""]]},{"stage":"Advanced","en":"Job interviews","vi":"Phỏng vấn xin việc","items":[["Thank you for inviting me to this interview.","Cảm ơn anh/chị đã mời tôi phỏng vấn.",""],["Could you tell me a little about yourself?","Bạn giới thiệu đôi chút về bản thân được không?",""],["I have three years of experience in sales.","Tôi có ba năm kinh nghiệm bán hàng.",""],["My greatest strength is my ability to learn quickly.","Điểm mạnh lớn nhất của tôi là khả năng học nhanh.",""],["One area I'm working on is public speaking.","Một mảng tôi đang cải thiện là nói trước đám đông.",""],["I'm interested in this role because…","Tôi quan tâm vị trí này vì…",""],["In my previous role, I led a team of five.","Ở vị trí trước, tôi dẫn dắt một nhóm năm người.",""],["I handled the situation by…","Tôi đã xử lý tình huống đó bằng cách…",""],["As a result, we increased sales by 20%.","Kết quả là chúng tôi tăng doanh số 20%.",""],["I see myself growing into a leadership role.","Tôi thấy mình phát triển lên vị trí lãnh đạo.",""],["What does a typical day look like in this position?","Một ngày làm việc điển hình ở vị trí này thế nào?",""],["What are the next steps in the hiring process?","Các bước tiếp theo của quy trình tuyển dụng là gì?",""],["I'm a quick learner and a strong team player.","Tôi học nhanh và làm việc nhóm tốt.",""],["Thank you for your time. I look forward to hearing from you.","Cảm ơn anh/chị đã dành thời gian. Tôi mong nhận được phản hồi.",""]]},{"stage":"Advanced","en":"Leading teams","vi":"Điều hành nhóm","items":[["Let's set clear goals for this quarter.","Hãy đặt mục tiêu rõ ràng cho quý này.",""],["I'd like each of you to own one part of the project.","Tôi muốn mỗi người phụ trách một phần của dự án.",""],["What do you need from me to get this done?","Mọi người cần tôi hỗ trợ gì để hoàn thành?",""],["Let's prioritize the most urgent tasks.","Hãy ưu tiên các việc gấp nhất.",""],["I trust you to make the call.","Tôi tin bạn sẽ quyết định đúng.",""],["Please flag any risks early.","Hãy báo sớm mọi rủi ro.",""],["Great teamwork, everyone!","Mọi người làm việc nhóm tuyệt lắm!",""],["Let's learn from this and move on.","Hãy rút kinh nghiệm và tiếp tục.",""],["My door is always open.","Cứ đến gặp tôi bất cứ lúc nào.",""],["Let's align on the timeline.","Hãy thống nhất về tiến độ.",""]]},{"stage":"Advanced","en":"Handling problems & escalation","vi":"Xử lý sự cố & báo cáo cấp trên","items":[["We have an urgent issue that needs your attention.","Chúng ta có một vấn đề khẩn cần anh/chị lưu ý.",""],["Here's what happened and what we've done so far.","Đây là những gì đã xảy ra và những gì chúng tôi đã làm.",""],["The root cause seems to be…","Nguyên nhân gốc rễ có vẻ là…",""],["I suggest we take the following steps.","Tôi đề xuất chúng ta làm các bước sau.",""],["I'll keep you updated every two hours.","Tôi sẽ cập nhật cho anh/chị mỗi hai giờ.",""],["We need a decision by the end of the day.","Chúng ta cần quyết định trước cuối ngày.",""],["I apologize for the inconvenience this has caused.","Tôi xin lỗi vì sự bất tiện đã gây ra.",""],["We've put measures in place to prevent this from happening again.","Chúng tôi đã có biện pháp để tránh việc này lặp lại.",""]]},{"stage":"Advanced","en":"Networking","vi":"Mở rộng quan hệ","items":[["What line of work are you in?","Anh/chị làm trong lĩnh vực nào?",""],["I really enjoyed your talk this morning.","Tôi rất thích bài nói sáng nay của anh/chị.",""],["How did you get started in this field?","Anh/chị bắt đầu trong lĩnh vực này thế nào?",""],["We should definitely stay in touch.","Chúng ta chắc chắn nên giữ liên lạc.",""],["Here's my card.","Đây là danh thiếp của tôi.",""],["Would you be open to a quick call next week?","Tuần sau anh/chị có sẵn lòng gọi nhanh một cuộc không?",""],["I'd love to hear more about your company.","Tôi rất muốn nghe thêm về công ty anh/chị.",""],["Let me introduce you to my colleague, Tom.","Để tôi giới thiệu anh/chị với đồng nghiệp của tôi, Tom.",""],["It was a pleasure meeting you.","Rất hân hạnh được gặp anh/chị.",""],["Let's connect on LinkedIn.","Hãy kết nối trên LinkedIn nhé.",""]]}]},"ipa":{"groups":[{"id":"vowel","en":"Monophthongs","vi":"Nguyên âm đơn"},{"id":"diphthong","en":"Diphthongs","vi":"Nguyên âm đôi"},{"id":"consonant","en":"Consonants","vi":"Phụ âm"}],"path":[{"vi":"Nguyên âm dài – ngắn","sounds":["iː","ɪ","uː","ʊ","ɑː","ʌ","ɔː","ɒ","ɜː","ə"]},{"vi":"Cặp e – æ","sounds":["e","æ"]},{"vi":"Nguyên âm đôi","sounds":["eɪ","aɪ","ɔɪ","aʊ","əʊ","ɪə","eə","ʊə"]},{"vi":"Phụ âm vô thanh – hữu thanh","sounds":["p","b","t","d","k","ɡ","f","v","s","z","ʃ","ʒ","tʃ","dʒ"]},{"vi":"Âm “th” khó","sounds":["θ","ð"]},{"vi":"Âm mũi & âm lướt","sounds":["m","n","ŋ","l","r","w","j","h"]}],"sounds":[{"s":"iː","type":"vowel","vi":"i dài","tip":"Kéo dài âm “i”, môi dàn sang hai bên như đang cười.","ex":[["see","siː"],["green","ɡriːn"],["teacher","ˈtiːtʃə"],["meet","miːt"]],"pairs":[["sheep","ship","ɪ"],["leave","live","ɪ"],["seat","sit","ɪ"],["feel","fill","ɪ"],["eat","it","ɪ"]]},{"s":"ɪ","type":"vowel","vi":"i ngắn","tip":"Âm “i” ngắn và gọn, lưỡi thả lỏng hơn /iː/. Không kéo dài.","ex":[["sit","sɪt"],["ship","ʃɪp"],["big","bɪɡ"],["English","ˈɪŋɡlɪʃ"]],"pairs":[["ship","sheep","iː"],["live","leave","iː"],["sit","seat","iː"],["fill","feel","iː"]]},{"s":"ʊ","type":"vowel","vi":"u ngắn","tip":"Âm “u” ngắn, môi tròn nhẹ, không kéo dài.","ex":[["book","bʊk"],["good","ɡʊd"],["put","pʊt"],["foot","fʊt"]],"pairs":[["full","fool","uː"],["pull","pool","uː"],["look","Luke","uː"]]},{"s":"uː","type":"vowel","vi":"u dài","tip":"Kéo dài âm “u”, môi tròn và chu ra phía trước.","ex":[["food","fuːd"],["blue","bluː"],["school","skuːl"],["two","tuː"]],"pairs":[["fool","full","ʊ"],["pool","pull","ʊ"],["Luke","look","ʊ"]]},{"s":"e","type":"vowel","vi":"e","tip":"Giống “e” tiếng Việt, miệng mở vừa phải.","ex":[["bed","bed"],["red","red"],["pen","pen"],["friend","frend"]],"pairs":[["bed","bad","æ"],["pen","pan","æ"],["men","man","æ"],["said","sad","æ"]]},{"s":"ə","type":"vowel","vi":"ơ nhẹ","tip":"Âm “ơ” rất nhẹ, không bao giờ được nhấn. Đây là âm xuất hiện nhiều nhất trong tiếng Anh.","ex":[["about","əˈbaʊt"],["banana","bəˈnɑːnə"],["today","təˈdeɪ"],["teacher","ˈtiːtʃə"]],"pairs":[]},{"s":"ɜː","type":"vowel","vi":"ơ dài","tip":"Kéo dài âm “ơ”, lưỡi đặt ở giữa miệng, môi không tròn.","ex":[["bird","bɜːd"],["work","wɜːk"],["learn","lɜːn"],["nurse","nɜːs"]],"pairs":[["bird","board","ɔː"],["work","walk","ɔː"],["firm","form","ɔː"],["shirt","short","ɔː"]]},{"s":"ɔː","type":"vowel","vi":"o dài","tip":"Kéo dài âm “o”, môi tròn.","ex":[["door","dɔː"],["ball","bɔːl"],["walk","wɔːk"],["four","fɔː"]],"pairs":[["port","pot","ɒ"],["caught","cot","ɒ"],["short","shot","ɒ"],["walk","work","ɜː"]]},{"s":"æ","type":"vowel","vi":"e bẹt","tip":"Nằm giữa “a” và “e”: mở miệng rộng, hạ hàm dưới, kéo môi sang hai bên.","ex":[["cat","kæt"],["apple","ˈæpl"],["black","blæk"],["man","mæn"]],"pairs":[["bad","bed","e"],["man","men","e"],["cat","cut","ʌ"],["cap","cup","ʌ"]]},{"s":"ʌ","type":"vowel","vi":"ă","tip":"Giống “ă” tiếng Việt: ngắn, dứt khoát, miệng mở vừa.","ex":[["cup","kʌp"],["sun","sʌn"],["love","lʌv"],["mother","ˈmʌðə"]],"pairs":[["cut","cat","æ"],["cup","cap","æ"],["hut","hat","æ"],["much","March","ɑː"]]},{"s":"ɑː","type":"vowel","vi":"a dài","tip":"Kéo dài âm “a”, miệng mở rộng, lưỡi hạ thấp.","ex":[["car","kɑː"],["father","ˈfɑːðə"],["start","stɑːt"],["heart","hɑːt"]],"pairs":[["heart","hut","ʌ"],["cart","cut","ʌ"],["calm","come","ʌ"],["March","much","ʌ"]]},{"s":"ɒ","type":"vowel","vi":"o ngắn","tip":"Âm “o” ngắn, miệng mở tròn (giọng Anh). Giọng Mỹ thường đọc gần /ɑː/.","ex":[["hot","hɒt"],["dog","dɒɡ"],["box","bɒks"],["watch","wɒtʃ"]],"pairs":[["pot","port","ɔː"],["cot","caught","ɔː"],["shot","short","ɔː"],["spot","sport","ɔː"]]},{"s":"ɪə","type":"diphthong","vi":"ia","tip":"Trượt từ /ɪ/ sang /ə/, giống “ia” trong “bia”.","ex":[["ear","ɪə"],["here","hɪə"],["near","nɪə"],["idea","aɪˈdɪə"]],"pairs":[["ear","air","eə"],["here","hair","eə"],["beer","bear","eə"],["fear","fair","eə"]]},{"s":"eə","type":"diphthong","vi":"e-ơ","tip":"Trượt từ /e/ sang /ə/, giống “e-ơ” đọc liền.","ex":[["hair","heə"],["where","weə"],["care","keə"],["chair","tʃeə"]],"pairs":[["air","ear","ɪə"],["hair","here","ɪə"],["bear","beer","ɪə"],["fair","fear","ɪə"]]},{"s":"ʊə","type":"diphthong","vi":"u-ơ","tip":"Trượt từ /ʊ/ sang /ə/, giống “u-ơ”. Nhiều người bản xứ đọc gần /ɔː/.","ex":[["tour","tʊə"],["pure","pjʊə"],["cure","kjʊə"],["sure","ʃʊə"]],"pairs":[]},{"s":"eɪ","type":"diphthong","vi":"ây","tip":"Trượt từ /e/ sang /ɪ/, giống “ây” trong “đây”.","ex":[["day","deɪ"],["name","neɪm"],["rain","reɪn"],["great","ɡreɪt"]],"pairs":[["late","let","e"],["wait","wet","e"],["sale","sell","e"],["lake","like","aɪ"]]},{"s":"aɪ","type":"diphthong","vi":"ai","tip":"Giống “ai” tiếng Việt, mở miệng rộng rồi khép dần.","ex":[["my","maɪ"],["time","taɪm"],["bike","baɪk"],["light","laɪt"]],"pairs":[["like","lake","eɪ"],["time","tame","eɪ"],["white","wait","eɪ"],["buy","boy","ɔɪ"]]},{"s":"ɔɪ","type":"diphthong","vi":"oi","tip":"Giống “oi” tiếng Việt, môi tròn rồi dàn ra.","ex":[["boy","bɔɪ"],["toy","tɔɪ"],["coin","kɔɪn"],["noise","nɔɪz"]],"pairs":[["boy","buy","aɪ"],["toy","tie","aɪ"],["foil","file","aɪ"],["boil","bile","aɪ"]]},{"s":"əʊ","type":"diphthong","vi":"âu","tip":"Trượt từ /ə/ sang /ʊ/, giống “âu” (giọng Anh); giọng Mỹ đọc /oʊ/ như “ôu”.","ex":[["go","ɡəʊ"],["home","həʊm"],["phone","fəʊn"],["know","nəʊ"]],"pairs":[["coat","caught","ɔː"],["boat","bought","ɔː"],["low","law","ɔː"],["tone","town","aʊ"]]},{"s":"aʊ","type":"diphthong","vi":"ao","tip":"Giống “ao” tiếng Việt, mở rộng rồi tròn môi.","ex":[["now","naʊ"],["house","haʊs"],["cow","kaʊ"],["mouth","maʊθ"]],"pairs":[["town","tone","əʊ"],["now","know","əʊ"],["loud","load","əʊ"],["found","phoned","əʊ"]]},{"s":"p","type":"consonant","vi":"p bật hơi","tip":"Mím môi rồi bật hơi mạnh. Đặt tờ giấy trước miệng sẽ thấy giấy rung. Âm vô thanh.","ex":[["pen","pen"],["apple","ˈæpl"],["cup","kʌp"],["happy","ˈhæpi"]],"pairs":[["pig","big","b"],["pat","bat","b"],["pear","bear","b"],["cap","cab","b"]]},{"s":"b","type":"consonant","vi":"b","tip":"Mím môi rồi mở, rung dây thanh (đặt tay lên cổ sẽ thấy rung). Âm hữu thanh.","ex":[["bag","bæɡ"],["baby","ˈbeɪbi"],["job","dʒɒb"],["number","ˈnʌmbə"]],"pairs":[["big","pig","p"],["bat","pat","p"],["bear","pear","p"],["cab","cap","p"]]},{"s":"t","type":"consonant","vi":"t bật hơi","tip":"Đầu lưỡi chạm lợi trên rồi bật hơi mạnh – mạnh hơn “t” tiếng Việt. Đừng bỏ /t/ ở cuối từ.","ex":[["tea","tiː"],["time","taɪm"],["water","ˈwɔːtə"],["cat","kæt"]],"pairs":[["ten","den","d"],["try","dry","d"],["time","dime","d"],["bet","bed","d"]]},{"s":"d","type":"consonant","vi":"đ","tip":"Như /t/ nhưng rung dây thanh. Đầu lưỡi chạm lợi trên, không chạm răng.","ex":[["dog","dɒɡ"],["day","deɪ"],["window","ˈwɪndəʊ"],["bed","bed"]],"pairs":[["den","ten","t"],["dry","try","t"],["dime","time","t"],["bed","bet","t"]]},{"s":"k","type":"consonant","vi":"k bật hơi","tip":"Cuống lưỡi chạm vòm mềm rồi bật hơi. Đừng nuốt /k/ ở cuối từ.","ex":[["cat","kæt"],["key","k <script>/* Pure logic shared by the app and the Node tests: dates, Leitner review schedule, streaks, quizzes, scoring. */
(function (root) {
  "use strict";

  // ===== CONFIG =====
  const INTERVALS = [1, 2, 4, 7, 15, 30, 60]; // days until next review, by box
  const MASTER_BOX = 5;                        // box at which a word counts as "thuộc"
  const BATCH = 5;                             // new words per learn session
  // ==================

  const pad = (n) => String(n).padStart(2, "0");

  }

  // ---- Quiz ----
  /** Word objects: { w, pos, ipa, vi, ex, emo }. Returns one question per word, mixing three types. */
  function makeQuiz(batch, pool, r = Math.random) {

      const type = types[i % types.length];

    ["📗", "50 từ", (s) => s.words >= 50],

    ["🎓", "Đủ 44 âm", (s) => s.ipa >= 44],

  ];

    if (!a || !animalReady(a, now)) return fail("Chưa có sản phẩm");
    if (stock(f) >= f.cap) return fail("Nhà kho đầy — bán bớt hoặc nâng cấp kho");
    const p = ITEMS[ANIMAL[a.a].prod];
    f.barn[p.id] = (f.barn[p.id] || 0) + 1; a.at = now;
    return { ok: true, item: p.id, levelUp: addXp(f, p.xp) };
  }
  function feedBoost(f, i, now) {
    const a = f.animals[i];
    if (!a || animalReady(a, now)) return fail("Con vật đã sẵn sàng");
    if (f.fert < 1) return fail("Hết phân bón — hoàn thành bài học để nhận thêm");

  // ---- Barn & shop ----
  function sell(f, id, qty = 1) {
    const it = ITEMS[id], have = f.barn[id] || 0;
    if (!it || have < qty || qty < 1) return fail("Không đủ hàng để bán");
    f.barn[id] = have - qty; if (!f.barn[id]) delete f.barn[id];
    f.coins += it.sell * qty;
    return { ok: true, coins: it.sell * qty };
  }
  const barnCost = (f) => 100 * ((f.cap - START.cap) / CAP_STEP + 1);
  function upgradeBarn(f) {
    const cost = barnCost(f);
    if (f.coins < cost) return fail("Chưa đủ xu để nâng cấp kho");
    f.coins -= cost; f.cap += CAP_STEP;
    return { ok: true };
  }
  function buyDeco(f, id) {
    const d = DECO[id];
    if (!d) return fail("Không có món này");
    if (f.deco.includes(id)) return fail("Bạn đã có món này");
    if (d.lv > level(f.xp)) return fail(`Cần nông trại cấp ${d.lv}`);
    if (f.coins < d.cost) return fail("Chưa đủ xu");
    f.coins -= d.cost; f.deco.push(id);
    return { ok: true };
  }

  // ---- Orders (Hay Day style delivery board) ----
  function makeOrder(lv, r) {
    const pool = unlockedItems(lv), kinds = Math.min(pool.length, 1 + Math.floor(r() * (lv >= 3 ? 3 : 2)));
    const need = {};
    while (Object.keys(need).length < kinds) {
      const it = pool[Math.floor(r() * pool.length)];
      need[it.id] = 1 + Math.floor(r() * (it.sell <= 25 ? 4 : 2));
    }
    const value = Object.entries(need).reduce((n, [id, q]) => n + ITEMS[id].sell * q, 0);
    const xp = Object.entries(need).reduce((n, [id, q]) => n + ITEMS[id].xp * q, 0) + 3;
    return { need, coins: Math.round(value * 1.5), xp };
  }
  function fillOrders(f, r) { while (f.orders.length < ORDERS) f.orders.push(makeOrder(level(f.xp), r)); }
  const canDeliver = (f, o) => Object.entries(o.need).every(([id, q]) => (f.barn[id] || 0) >= q);
  function deliver(f, i, r) {
    const o = f.orders[i];
    if (!o) return fail("Không có đơn hàng này");
    if (!canDeliver(f, o)) return fail("Chưa đủ hàng cho đơn này");
    for (const [id, q] of Object.entries(o.need)) { f.barn[id] -= q; if (!f.barn[id]) delete f.barn[id]; }
    f.coins += o.coins;
    const levelUp = addXp(f, o.xp);
    f.orders.splice(i, 1); fillOrders(f, r);
    return { ok: true, coins: o.coins, levelUp };
  }
  function skipOrder(f, i, r) { if (!f.orders[i]) return fail("Không có đơn hàng này"); f.orders.splice(i, 1); fillOrders(f, r); return { ok: true }; }

  // ---- Play-time gate ----
  const gateLive = (g, now) => !!g && now - g.start < GATE.WINDOW;
  /** Effective gate state now: study/play ms in the current window, play budget left, open or locked. */
  function gate(g, now) {
    const live = gateLive(g, now), study = live ? g.study : 0, play = live ? g.play : 0;
    const budget = Math.max(0, study * GATE.RATIO - play);
    return { study, play, budget, open: study >= GATE.MIN_STUDY && budget > 0,
      need: Math.max(0, GATE.MIN_STUDY - study), resetIn: live ? g.start + GATE.WINDOW - now : null };
  }
  /** Count study time; starts a new window when the previous one has expired. */
  function addStudy(g, ms, now) {
    const w = gateLive(g, now) ? { ...g } : { start: now, study: 0, play: 0 };
    w.study += ms;
    return w;
  }
  function addPlay(g, ms, now) {
    if (!gateLive(g, now)) return g;
    return { ...g, play: Math.min(g.play + ms, g.study * GATE.RATIO) };
  }

  // ---- Spirit beasts (Linh Thú) ----
  const has = (f, items) => Object.entries(items).every(([id, q]) => (f.barn[id] || 0) >= q);
  const take = (f, items) => { for (const [id, q] of Object.entries(items)) { f.barn[id] -= q; if (!f.barn[id]) delete f.barn[id]; } };
  const missing = (f, items) => Object.fromEntries(Object.entries(items).filter(([id, q]) => (f.barn[id] || 0) < q).map(([id, q]) => [id, q - (f.barn[id] || 0)]));
  /** Effect of a beast at a level: { speed, price } in %. */
  function beastPower(id, lv) {
    const b = BEAST[id], t = (lv - 1) / (BEAST_MAX_LV - 1);
    return { speed: Math.round(b.speed[0] + (b.speed[1] - b.speed[0]) * t), price: Math.round(b.price[0] + (b.price[1] - b.price[0]) * t) };
  }
  /** Stamina left today (refills to STAMINA at each new day). */
  const stamina = (f, id, today) => { const s = f.beasts[id]; return !s ? 0 : s.day === today ? s.st : STAMINA; };
  /** Stamina for buffing n crops: more crops cost more, higher levels cost less per crop. */
  const castCost = (lv, n) => (n <= 0 ? 0 : Math.ceil(n * STAMINA_PER_CROP[lv - 1] - 1e-9));
  function buyBeast(f, id, today) {
    const b = BEAST[id];
    if (!b) return fail("Không có Linh Thú này");
    if (f.beasts[id]) return fail("Bạn đã có Linh Thú này");
    if (b.lv > level(f.xp)) return fail(`Cần nông trại cấp ${b.lv}`);
    if (f.coins < b.cost) return fail("Chưa đủ xu");
    if (!has(f, b.need)) return fail("Chưa đủ nguyên liệu trong kho");
    f.coins -= b.cost; take(f, b.need);
    f.beasts[id] = { lv: 1, st: STAMINA, day: today };
    return { ok: true };
  }
  /** Coins and harvested crops needed to go from the current level to the next; null at max level. */
  function upgradeCost(f, id) {
    const s = f.beasts[id], b = BEAST[id];
    if (!s || s.lv >= BEAST_MAX_LV) return null;
    const L = s.lv, need = { [b.fav[0]]: 3 + 2 * L };
    if (L >= 3) need[b.fav[1]] = L;
    return { coins: Math.round(b.cost * 0.5 * L), need };
  }
  function upgradeBeast(f, id) {
    const c = upgradeCost(f, id);
    if (!c) return fail(f.beasts[id] ? `Đã đạt cấp tối đa ${BEAST_MAX_LV}` : "Bạn chưa có Linh Thú này");
    if (f.coins < c.coins) return fail("Chưa đủ xu để nâng cấp");
    if (!has(f, c.need)) return fail("Chưa đủ nông sản để nâng cấp");
    f.coins -= c.coins; take(f, c.need); f.beasts[id].lv++;
    return { ok: true, lv: f.beasts[id].lv };
  }
  /** Plots this beast can buff now: planted, not yet buffed by it; ripe plots only if it raises the price. */
  function castTargets(f, id, now) {
    const pw = f.beasts[id] ? beastPower(id, f.beasts[id].lv) : null;
    if (!pw) return [];
    return f.plots.map((p, i) => [p, i]).filter(([p]) => p.c && !(p.bf || []).includes(id) && (!plotReady(p, now) || pw.price > 0)).map(([, i]) => i);
  }
  function cast(f, id, idxs, now, today) {
    const s = f.beasts[id];
    if (!s) return fail("Bạn chưa có Linh Thú này");
    const ok = new Set(castTargets(f, id, now)), list = [...new Set(idxs)].filter((i) => ok.has(i));
    if (!list.length) return fail("Không có cây nào để ban phúc");
    const cost = castCost(s.lv, list.length), st = stamina(f, id, today);
    if (cost > st) return fail(`Không đủ thể lực (cần ${cost}, còn ${st})`);
    const pw = beastPower(id, s.lv);
    for (const i of list) {
      const p = f.plots[i];
      if (pw.speed && !plotReady(p, now)) p.at -= Math.round(remaining(p.at, CROP[p.c].min, now) * pw.speed / 100);
      if (pw.price) p.pb = Math.min(PRICE_CAP, (p.pb || 0) + pw.price);
      p.bf = [...(p.bf || []), id];
    }
    s.st = st - cost; s.day = today;
    return { ok: true, n: list.length, cost };
  }

  const unlocks = (lv) => [...CROPS, ...ANIMALS, ...DECOS, ...BEASTS].filter((x) => x.lv === lv);

  const Farm = {
    MIN, CROPS, PRODUCTS, ANIMALS, DECOS, ITEMS, CROP, ANIMAL, DECO, LVXP, START, MAX_PLOTS, plotLevel, MAX_PER_ANIMAL, REWARD, GATE, gate, addStudy, addPlay,
    fresh, level, nextXp, bonus, stock, unlockedItems, earn, reward, remaining, plotReady, plant, harvest, fertilize, plotCost, buyPlot,
    animalReady, buyAnimal, collect, feedBoost, sell, barnCost, upgradeBarn, buyDeco, makeOrder, fillOrders, canDeliver, deliver, skipOrder, unlocks, uproot,
    BEASTS, BEAST, BEAST_MAX_LV, STAMINA, STAMINA_PER_CROP, PRICE_CAP, beastPower, stamina, castCost, buyBeast, upgradeCost, upgradeBeast, castTargets, cast, missing,
  };
  if (typeof module === "object" && module.exports) module.exports = Farm;
  else root.Farm = Farm;
})(typeof window !== "undefined" ? window : globalThis);
