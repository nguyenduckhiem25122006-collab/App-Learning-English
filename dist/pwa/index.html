4/5) = −4/6 = −2/3.\nCộng: 4/9 + (−2/3) = 4/9 − 6/9 = −2/9."},"terms":[["power","lũy thừa"],["exponent","số mũ"],["base","cơ số"],["reciprocal","số nghịch đảo"],["order of operations","thứ tự thực hiện phép tính"]],"quiz":[{"q":"(−1/2)³ bằng bao nhiêu?","opts":["1/8","−1/6","−1/8","−3/2"],"a":2,"why":"(−1/2)³ = (−1)³/2³ = −1/8; mũ lẻ nên kết quả âm."},{"q":"(2/5)⁷ : (2/5)⁴ bằng?","opts":["(2/5)³","(2/5)¹¹","(2/5)²⁸","1"],"a":0,"why":"Chia hai lũy thừa cùng cơ số thì trừ số mũ: 7 − 4 = 3."},{"q":"Tìm x, biết x − 3/4 = −1/2.","opts":["−5/4","1/4","5/4","−1/4"],"a":1,"why":"Chuyển vế: x = −1/2 + 3/4 = −2/4 + 3/4 = 1/4."},{"q":"Số nghịch đảo của −0,25 là?","opts":["4","0,25","−1/4","−4"],"a":3,"why":"−0,25 = −1/4; nghịch đảo là −4 vì (−1/4)·(−4) = 1."}]},{"id":"m7-03","subj":"math","grade":7,"chap":"Số thực","title":"Căn bậc hai số học, số vô tỉ, số thực","sum":"Số vô tỉ là số thập phân vô hạn không tuần hoàn như √2, π. Số hữu tỉ và số vô tỉ hợp thành tập số thực ℝ; |x| là khoảng cách từ x đến 0.","points":["Số thập phân vô hạn tuần hoàn biểu diễn số hữu tỉ: 1/3 = 0,(3).","Số vô tỉ là số viết được dưới dạng số thập phân vô hạn không tuần hoàn (kí hiệu tập hợp: I).","Căn bậc hai số học của a ≥ 0 là số x ≥ 0 sao cho x² = a, kí hiệu √a.","Số hữu tỉ và số vô tỉ gọi chung là số thực (ℝ); mỗi số thực ứng với đúng một điểm trên trục số.","|x| là khoảng cách từ điểm x đến gốc O, nên |x| ≥ 0 với mọi x.","Hai số đối nhau có cùng giá trị tuyệt đối: |−3| = |3| = 3."],"formulas":["√a = x ⇔ x ≥ 0 và x² = a (a ≥ 0)","(√a)² = a (a ≥ 0)","|x| = x nếu x ≥ 0 ; |x| = −x nếu x < 0"],"viz":{"type":"numberline"},"vizNote":"Kéo điểm x sang hai phía của 0: x và −x luôn có cùng |x| vì cách gốc O như nhau.","memo":"Căn bậc hai số học không bao giờ âm: √9 = 3 (không viết ±3). Giá trị tuyệt đối là “khoảng cách”, nên luôn ≥ 0.","example":{"q":"Tính √49 − |−2,5| + √0,16.","a":"√49 = 7 (vì 7 ≥ 0 và 7² = 49).\n|−2,5| = 2,5.\n√0,16 = 0,4 (vì 0,4² = 0,16).\nVậy 7 − 2,5 + 0,4 = 4,9."},"terms":[["square root","căn bậc hai"],["irrational number","số vô tỉ"],["real number","số thực"],["absolute value","giá trị tuyệt đối"],["repeating decimal","số thập phân vô hạn tuần hoàn"]],"quiz":[{"q":"√0,09 bằng?","opts":["±0,3","0,03","0,0081","0,3"],"a":3,"why":"0,3 ≥ 0 và 0,3² = 0,09. Căn bậc hai số học chỉ lấy giá trị không âm."},{"q":"Số nào sau đây là số vô tỉ?","opts":["√16","0,(6)","√5","−7/3"],"a":2,"why":"5 không là bình phương của số hữu tỉ, √5 = 2,236… vô hạn không tuần hoàn. √16 = 4; 0,(6) = 2/3."},{"q":"Tìm x, biết |x| = 2,5.","opts":["x = 2,5 hoặc x = −2,5","x = 2,5","x = −2,5","Không có giá trị nào của x"],"a":0,"why":"Có hai điểm cách gốc O một khoảng 2,5: đó là 2,5 và −2,5."},{"q":"Giá trị của |−7| − |3| + √25 là?","opts":["−5","9","−1","15"],"a":1,"why":"|−7| = 7, |3| = 3, √25 = 5 ⇒ 7 − 3 + 5 = 9."}]},{"id":"m7-04","subj":"math","grade":7,"chap":"Góc và đường thẳng song song","title":"Góc đối đỉnh, góc kề bù, tia phân giác","sum":"Hai đường thẳng cắt nhau tạo các cặp góc đối đỉnh (bằng nhau) và kề bù (tổng 180°). Tia phân giác chia một góc thành hai góc bằng nhau.","points":["Hai góc kề nhau: có chung một cạnh, hai cạnh còn lại nằm về hai phía của cạnh chung.","Hai góc bù nhau có tổng số đo 180°; hai góc kề bù là hai góc vừa kề nhau vừa bù nhau.","Hai góc đối đỉnh: mỗi cạnh của góc này là tia đối của một cạnh của góc kia.","Hai góc đối đỉnh thì bằng nhau (nhưng hai góc bằng nhau chưa chắc đối đỉnh).","Tia phân giác Ot của ∠xOy nằm giữa Ox, Oy và tạo với hai cạnh hai góc bằng nhau."],"formulas":["Kề bù: ∠xOy + ∠yOx' = 180°","Đối đỉnh: ∠xOy = ∠x'Oy'","Ot là tia phân giác của ∠xOy ⇒ ∠xOt = ∠tOy = ∠xOy : 2"],"viz":{"type":"angles","mode":"vertical"},"vizNote":"Kéo thanh trượt đổi số đo góc: hai góc đối đỉnh luôn cùng màu (bằng nhau), hai góc kề bù luôn cộng lại 180°.","memo":"“Đối đỉnh – bằng nhau; kề bù – đủ 180°.” Hai đường thẳng cắt nhau tạo 4 góc nhưng chỉ có 2 số đo: α và 180° − α.","example":{"q":"Hai đường thẳng xx' và yy' cắt nhau tại O, ∠xOy = 50°. Tính ∠x'Oy, ∠x'Oy', ∠xOy'.","a":"∠x'Oy kề bù với ∠xOy ⇒ ∠x'Oy = 180° − 50° = 130°.\n∠x'Oy' đối đỉnh với ∠xOy ⇒ ∠x'Oy' = 50°.\n∠xOy' đối đỉnh với ∠x'Oy ⇒ ∠xOy' = 130°."},"terms":[["vertical angles","hai góc đối đỉnh"],["adjacent angles","hai góc kề nhau"],["supplementary angles","hai góc bù nhau"],["linear pair","hai góc kề bù"],["angle bisector","tia phân giác của góc"]],"quiz":[{"q":"Hai đường thẳng cắt nhau tạo thành một góc 65°. Số đo ba góc còn lại là?","opts":["65°, 65°, 65°","115°, 65°, 115°","25°, 65°, 25°","115°, 115°, 115°"],"a":1,"why":"Góc kề bù với 65° là 115°; góc đối đỉnh với 65° là 65°; góc còn lại đối đỉnh với 115°."},{"q":"Ot là tia phân giác của ∠xOy = 130°. Số đo ∠xOt là?","opts":["50°","130°","260°","65°"],"a":3,"why":"Tia phân giác chia đôi góc: 130° : 2 = 65°."},{"q":"Hai góc kề bù có số đo hơn kém nhau 40°. Góc lớn hơn bằng?","opts":["110°","70°","140°","90°"],"a":0,"why":"Tổng 180°, hiệu 40° ⇒ góc lớn = (180° + 40°) : 2 = 110°, góc nhỏ = 70°."},{"q":"Khẳng định nào sau đây đúng?","opts":["Hai góc bằng nhau thì đối đỉnh","Hai góc bù nhau thì kề nhau","Hai góc đối đỉnh thì bằng nhau","Hai góc kề nhau thì bù nhau"],"a":2,"why":"Đối đỉnh ⇒ bằng nhau là định lí; chiều ngược lại sai (hai góc bằng nhau có thể ở xa nhau)."}]},{"id":"m7-05","subj":"math","grade":7,"chap":"Góc và đường thẳng song song","title":"Hai đường thẳng song song. Tiên đề Euclid","sum":"Một đường thẳng cắt hai đường thẳng song song tạo các góc so le trong bằng nhau, đồng vị bằng nhau. Qua một điểm ngoài đường thẳng chỉ có một đường song song với nó.","points":["Đường thẳng c cắt a, b tạo các cặp góc so le trong, đồng vị, trong cùng phía.","Dấu hiệu: nếu có một cặp góc so le trong (hoặc đồng vị) bằng nhau thì a ∥ b.","Tiên đề Euclid: qua một điểm ở ngoài một đường thẳng chỉ có một đường thẳng song song với nó.","Nếu a ∥ b thì các góc so le trong bằng nhau, đồng vị bằng nhau, trong cùng phía bù nhau.","a ⊥ c và b ⊥ c ⇒ a ∥ b; a ∥ b và c ⊥ a ⇒ c ⊥ b.","Hai đường thẳng phân biệt cùng song song với đường thẳng thứ ba thì song song với nhau."],"formulas":["a ∥ b ⇔ so le trong bằng nhau ⇔ đồng vị bằng nhau","a ∥ b ⇒ hai góc trong cùng phía: α + β = 180°","a ⊥ c, b ⊥ c ⇒ a ∥ b"],"viz":{"type":"angles","mode":"parallel"},"vizNote":"Kéo thanh trượt đổi góc của cát tuyến: các góc đồng vị và so le trong luôn bằng nhau, hai góc trong cùng phía luôn có tổng 180°.","memo":"Nhìn hình chữ: F → đồng vị (bằng nhau), Z → so le trong (bằng nhau), U → trong cùng phía (bù nhau, tổng 180°).","example":{"q":"Cho a ∥ b; đường thẳng c cắt a tại A, cắt b tại B. Biết ∠A₁ = 70°. Tính ∠B₁ (đồng vị với ∠A₁) và ∠B₂ (kề bù với ∠B₁).","a":"a ∥ b ⇒ hai góc đồng vị bằng nhau: ∠B₁ = ∠A₁ = 70°.\n∠B₂ kề bù với ∠B₁ ⇒ ∠B₂ = 180° − 70° = 110°.\nNhận xét: tại mỗi giao điểm chỉ có hai số đo là 70° và 110°."},"terms":[["parallel lines","hai đường thẳng song song"],["transversal","cát tuyến (đường thẳng cắt)"],["corresponding angles","hai góc đồng vị"],["alternate interior angles","hai góc so le trong"],["co-interior angles","hai góc trong cùng phía"]],"quiz":[{"q":"Cho a ∥ b, một cát tuyến tạo hai góc trong cùng phía, trong đó một góc bằng 125°. Góc còn lại bằng?","opts":["125°","35°","55°","65°"],"a":2,"why":"Hai góc trong cùng phía bù nhau: 180° − 125° = 55°."},{"q":"Qua điểm M nằm ngoài đường thẳng d, có bao nhiêu đường thẳng song song với d?","opts":["Đúng một","Không có","Hai","Vô số"],"a":0,"why":"Theo tiên đề Euclid, qua M chỉ có duy nhất một đường thẳng song song với d."},{"q":"Đường thẳng c cắt hai đường thẳng a, b tạo một cặp góc đồng vị có số đo 72° và 70°. Kết luận nào đúng?","opts":["a ∥ b","a ⊥ b","Chưa đủ dữ kiện","a và b cắt nhau"],"a":3,"why":"Nếu a ∥ b thì hai góc đồng vị phải bằng nhau. 72° ≠ 70° nên a, b không song song, tức là cắt nhau."},{"q":"Hai đường thẳng phân biệt a và b cùng vuông góc với đường thẳng c. Khi đó?","opts":["a ⊥ b","a ∥ b","a trùng với c","b ∥ c"],"a":1,"why":"c tạo với a, b hai góc đồng vị cùng bằng 90° ⇒ a ∥ b."}]},{"id":"m7-06","subj":"math","grade":7,"chap":"Tam giác bằng nhau","title":"Tổng các góc của tam giác. Tam giác bằng nhau","sum":"Ba góc của một tam giác có tổng 180°; góc ngoài bằng tổng hai góc trong không kề với nó. Hai tam giác bằng nhau khi có đủ yếu tố theo c.c.c, c.g.c hoặc g.c.g.","points":["Tổng ba góc của một tam giác bằng 180°.","Trong tam giác vuông, hai góc nhọn phụ nhau (tổng 90°).","Góc ngoài của tam giác bằng tổng hai góc trong không kề với nó.","Hai tam giác bằng nhau có các cạnh và các góc tương ứng bằng nhau; viết các đỉnh tương ứng theo đúng thứ tự.","Ba trường hợp bằng nhau: c.c.c; c.g.c (góc xen giữa hai cạnh); g.c.g (cạnh xen giữa hai góc).","Tam giác vuông còn có: cạnh huyền – góc nhọn; cạnh huyền – cạnh góc vuông."],"formulas":["∠A + ∠B + ∠C = 180°","Góc ngoài tại đỉnh C: ∠ACx = ∠A + ∠B","ΔABC vuông tại A ⇒ ∠B + ∠C = 90°"],"viz":{"type":"triangle"},"vizNote":"Kéo hai thanh trượt đổi hai góc: góc thứ ba tự điều chỉnh để tổng luôn là 180°, góc ngoài luôn bằng tổng hai góc trong không kề.","memo":"Ba góc ghép lại thành một đường thẳng (180°). Góc ngoài “ôm” hai góc ở xa. c.g.c: góc phải KẸP GIỮA hai cạnh; g.c.g: cạnh phải NẰM GIỮA hai góc.","example":{"q":"Tam giác ABC có ∠A = 60°, ∠B = 45°. Tính ∠C và góc ngoài tại đỉnh C.","a":"∠C = 180° − (60° + 45°) = 75°.\nGóc ngoài tại C kề bù với ∠C: 180° − 75° = 105°.\nKiểm tra: 105° = ∠A + ∠B = 60° + 45° ✓."},"terms":[["angle sum of a triangle","tổng các góc của tam giác"],["exterior angle","góc ngoài"],["congruent triangles","hai tam giác bằng nhau"],["SSS, SAS, ASA","c.c.c, c.g.c, g.c.g"],["hypotenuse","cạnh huyền"]],"quiz":[{"q":"Tam giác ABC vuông tại A có ∠B = 37°. Số đo ∠C là?","opts":["143°","53°","63°","37°"],"a":1,"why":"Hai góc nhọn của tam giác vuông phụ nhau: 90° − 37° = 53°."},{"q":"Góc ngoài tại đỉnh C của ΔABC bằng 120°, ∠A = 70°. Số đo ∠B là?","opts":["60°","110°","70°","50°"],"a":3,"why":"Góc ngoài tại C = ∠A + ∠B ⇒ ∠B = 120° − 70° = 50°."},{"q":"ΔABC và ΔDEF có AB = DE, ∠B = ∠E, BC = EF. Hai tam giác bằng nhau theo trường hợp nào?","opts":["c.g.c","c.c.c","g.c.g","Không đủ để kết luận"],"a":0,"why":"∠B xen giữa hai cạnh AB, BC; ∠E xen giữa DE, EF ⇒ cạnh – góc – cạnh."},{"q":"Biết ΔMNP = ΔHIK, MN = 5 cm, ∠P = 40°. Khẳng định nào đúng?","opts":["IK = 5 cm","∠H = 40°","HI = 5 cm","∠I = 40°"],"a":2,"why":"Đỉnh tương ứng theo thứ tự: M↔H, N↔I, P↔K ⇒ HI = MN = 5 cm và ∠K = ∠P = 40°."}]},{"id":"m7-07","subj":"math","grade":7,"chap":"Tỉ lệ thức và đại lượng tỉ lệ","title":"Tỉ lệ thức và đại lượng tỉ lệ thuận","sum":"Tỉ lệ thức là đẳng thức của hai tỉ số; dãy tỉ số bằng nhau giúp chia một tổng theo tỉ lệ. Hai đại lượng tỉ lệ thuận khi y = kx, tức thương y/x không đổi.","points":["Tỉ lệ thức là đẳng thức của hai tỉ số a/b = c/d; a, d là ngoại tỉ, b, c là trung tỉ.","Trong tỉ lệ thức, tích hai ngoại tỉ bằng tích hai trung tỉ: a·d = b·c.","Dãy tỉ số bằng nhau: cộng (hoặc trừ) các tử và các mẫu tương ứng được tỉ số bằng tỉ số đã cho.","y tỉ lệ thuận với x theo hệ số k (k ≠ 0) nếu y = kx; khi đó x tỉ lệ thuận với y theo hệ số 1/k.","Hai đại lượng tỉ lệ thuận: x tăng (giảm) bao nhiêu lần thì y tăng (giảm) bấy nhiêu lần."],"formulas":["a/b = c/d ⇒ a·d = b·c","a/b = c/d = (a + c)/(b + d) = (a − c)/(b − d)","y = kx (k ≠ 0)","y₁/x₁ = y₂/x₂ = … = k ; x₁/x₂ = y₁/y₂"],"viz":{"type":"proportion","kind":"direct"},"vizNote":"Kéo thanh trượt k: đường y = kx luôn đi qua gốc O; trong bảng giá trị, thương y/x luôn bằng k.","memo":"Tỉ lệ thuận: cùng tăng, cùng giảm, THƯƠNG không đổi. Tỉ lệ thức: “nhân chéo” — ngoài nhân ngoài bằng trong nhân trong.","example":{"q":"Ba lớp 7A, 7B, 7C trồng được 120 cây. Số cây tỉ lệ thuận với số học sinh 32, 28, 36. Mỗi lớp trồng bao nhiêu cây?","a":"Gọi số cây là x, y, z: x/32 = y/28 = z/36 và x + y + z = 120.\nTheo dãy tỉ số bằng nhau: x/32 = y/28 = z/36 = 120/(32 + 28 + 36) = 120/96 = 1,25.\nx = 32·1,25 = 40; y = 28·1,25 = 35; z = 36·1,25 = 45 (cây).\nThử lại: 40 + 35 + 45 = 120 ✓"},"terms":[["ratio","tỉ số"],["proportion","tỉ lệ thức"],["directly proportional","tỉ lệ thuận"],["constant of proportionality","hệ số tỉ lệ"]],"quiz":[{"q":"Tìm x, biết x/6 = 10/15.","opts":["9","2,5","4","25"],"a":2,"why":"Nhân chéo: 15·x = 6·10 = 60 ⇒ x = 4."},{"q":"y tỉ lệ thuận với x; khi x = 4 thì y = −12. Hệ số tỉ lệ của y đối với x là?","opts":["−3","3","−1/3","−48"],"a":0,"why":"k = y/x = −12/4 = −3."},{"q":"y tỉ lệ thuận với x theo hệ số 2/3. Khi đó x tỉ lệ thuận với y theo hệ số?","opts":["2/3","−2/3","−3/2","3/2"],"a":3,"why":"y = (2/3)x ⇒ x = (3/2)y, hệ số là nghịch đảo 3/2."},{"q":"Mua 5 quyển vở hết 40 000 đồng. Mua 8 quyển vở cùng loại hết bao nhiêu tiền?","opts":["25 000 đồng","64 000 đồng","48 000 đồng","320 000 đồng"],"a":1,"why":"Số tiền tỉ lệ thuận với số vở: mỗi quyển 40 000 : 5 = 8 000 đồng ⇒ 8·8 000 = 64 000 đồng."}]},{"id":"m7-08","subj":"math","grade":7,"chap":"Tỉ lệ thức và đại lượng tỉ lệ","title":"Đại lượng tỉ lệ nghịch","sum":"Hai đại lượng tỉ lệ nghịch khi y = a/x, tức tích x·y luôn không đổi: đại lượng này tăng bao nhiêu lần thì đại lượng kia giảm bấy nhiêu lần.","points":["y tỉ lệ nghịch với x theo hệ số a (a ≠ 0) nếu y = a/x, hay x·y = a.","Khi đó x cũng tỉ lệ nghịch với y theo cùng hệ số a.","Tích hai giá trị tương ứng luôn không đổi: x₁y₁ = x₂y₂ = … = a.","Tỉ số hai giá trị của x bằng nghịch đảo tỉ số hai giá trị tương ứng của y: x₁/x₂ = y₂/y₁.","Cùng quãng đường: vận tốc và thời gian tỉ lệ nghịch; cùng công việc: số người và số ngày tỉ lệ nghịch."],"formulas":["y = a/x (a ≠ 0) ⇔ x·y = a","x₁y₁ = x₂y₂ = … = a","x₁/x₂ = y₂/y₁"],"viz":{"type":"proportion","kind":"inverse"},"vizNote":"Kéo thanh trượt a: khi x tăng thì y = a/x giảm; trong bảng giá trị, tích x·y luôn bằng a.","memo":"Thuận ↔ THƯƠNG không đổi; Nghịch ↔ TÍCH không đổi. “Thêm người, bớt ngày.”","example":{"q":"12 công nhân xây xong một bức tường trong 10 ngày. Nếu có 15 công nhân (năng suất như nhau) thì xây xong trong bao nhiêu ngày?","a":"Số công nhân và số ngày là hai đại lượng tỉ lệ nghịch.\nGọi số ngày cần tìm là x: 15·x = 12·10 = 120.\nx = 120 : 15 = 8 (ngày)."},"terms":[["inversely proportional","tỉ lệ nghịch"],["constant of proportionality","hệ số tỉ lệ"],["product","tích"],["quotient","thương"]],"quiz":[{"q":"x và y tỉ lệ nghịch; khi x = 3 thì y = 8. Khi x = 6 thì y bằng?","opts":["16","24","2","4"],"a":3,"why":"a = 3·8 = 24 ⇒ y = 24 : 6 = 4 (x gấp đôi thì y giảm một nửa)."},{"q":"Bảng giá trị nào cho y tỉ lệ nghịch với x?","opts":["x = 1; 2; 4 → y = 2; 4; 8","x = 1; 2; 4 → y = 8; 4; 2","x = 1; 2; 4 → y = 8; 6; 4","x = 1; 2; 4 → y = 8; 4; 1"],"a":1,"why":"Chỉ ở bảng này tích x·y luôn bằng 8: 1·8 = 2·4 = 4·2 = 8."},{"q":"Ô tô đi từ A đến B với vận tốc 40 km/h hết 3 giờ. Nếu đi với vận tốc 60 km/h thì hết bao lâu?","opts":["2 giờ","4,5 giờ","1,5 giờ","2,5 giờ"],"a":0,"why":"Quãng đường không đổi nên v·t không đổi: 40·3 = 60·t ⇒ t = 120 : 60 = 2 giờ."},{"q":"Chia số 52 thành ba phần tỉ lệ nghịch với 2; 3; 4. Ba phần đó là?","opts":["12; 16; 24","26; 13; 13","24; 16; 12","8; 18; 26"],"a":2,"why":"2x = 3y = 4z ⇒ x : y : z = 6 : 4 : 3; 52 : 13 = 4 ⇒ 24; 16; 12 (kiểm tra 2·24 = 3·16 = 4·12 = 48)."}]},{"id":"m7-09","subj":"math","grade":7,"chap":"Một số hình khối trong thực tiễn","title":"Hình hộp chữ nhật, hình lập phương, lăng trụ đứng","sum":"Hình hộp chữ nhật, hình lập phương và hình lăng trụ đứng tam giác đều có thể tích bằng diện tích đáy nhân chiều cao, diện tích xung quanh bằng chu vi đáy nhân chiều cao.","points":["Hình hộp chữ nhật có 6 mặt là hình chữ nhật, 8 đỉnh, 12 cạnh, 4 đường chéo.","Hình lập phương là hình hộp chữ nhật có 6 mặt là hình vuông, 12 cạnh bằng nhau.","Lăng trụ đứng tam giác: hai đáy là hai tam giác bằng nhau, nằm trong hai mặt song song; ba mặt bên là hình chữ nhật.","Diện tích xung quanh lăng trụ đứng = chu vi đáy × chiều cao.","Thể tích lăng trụ đứng = diện tích đáy × chiều cao.","Diện tích toàn phần = diện tích xung quanh + 2 × diện tích đáy."],"formulas":["Hình hộp chữ nhật: Sxq = 2(a + b)·c ; V = a·b·c","Hình lập phương: Sxq = 4a² ; V = a³","Lăng trụ đứng: Sxq = C(đáy)·h ; V = S(đáy)·h"],"viz":{"type":"solid","shape":"cuboid"},"vizNote":"Kéo các thanh trượt chiều dài, chiều rộng, chiều cao: quan sát thể tích V = a·b·c và diện tích xung quanh 2(a + b)·c thay đổi.","memo":"Mọi lăng trụ đứng (kể cả hình hộp): thể tích = “ĐÁY nhân CAO”, xung quanh = “CHU VI ĐÁY nhân CAO”.","example":{"q":"Một bể cá hình hộp chữ nhật không nắp dài 60 cm, rộng 40 cm, cao 50 cm. Tính thể tích bể và diện tích kính để làm bể.","a":"V = 60·40·50 = 120 000 cm³ (= 120 lít).\nSxq = 2·(60 + 40)·50 = 10 000 cm².\nĐáy: 60·40 = 2 400 cm² (không nắp nên chỉ 1 đáy).\nDiện tích kính: 10 000 + 2 400 = 12 400 cm²."},"terms":[["cuboid (rectangular box)","hình hộp chữ nhật"],["cube","hình lập phương"],["right triangular prism","hình lăng trụ đứng tam giác"],["volume","thể tích"],["lateral surface area","diện tích xung quanh"]],"quiz":[{"q":"Hình lập phương có cạnh 3 cm. Thể tích của nó là?","opts":["27 cm³","9 cm³","36 cm³","54 cm³"],"a":0,"why":"V = a³ = 3·3·3 = 27 cm³ (36 cm² là Sxq, 54 cm² là diện tích toàn phần)."},{"q":"Lăng trụ đứng có đáy là tam giác vuông với hai cạnh góc vuông 3 cm và 4 cm, chiều cao lăng trụ 10 cm. Thể tích là?","opts":["120 cm³","70 cm³","60 cm³","20 cm³"],"a":2,"why":"S(đáy) = 3·4 : 2 = 6 cm² ⇒ V = 6·10 = 60 cm³."},{"q":"Lăng trụ đứng có đáy là tam giác với ba cạnh 3 cm, 4 cm, 5 cm; chiều cao 10 cm. Diện tích xung quanh là?","opts":["60 cm²","120 cm²","132 cm²","600 cm²"],"a":1,"why":"Chu vi đáy = 3 + 4 + 5 = 12 cm ⇒ Sxq = 12·10 = 120 cm²."},{"q":"Nếu mỗi cạnh của một hình lập phương tăng gấp 2 lần thì thể tích tăng bao nhiêu lần?","opts":["2 lần","4 lần","6 lần","8 lần"],"a":3,"why":"(2a)³ = 8a³, nên thể tích tăng 8 lần."}]},{"id":"m7-10","subj":"math","grade":7,"chap":"Dữ liệu và xác suất","title":"Biểu đồ và xác suất của biến cố","sum":"Biểu đồ hình quạt tròn cho thấy tỉ lệ các phần trong một tổng thể, biểu đồ đoạn thẳng cho thấy sự thay đổi theo thời gian. Xác suất là số từ 0 đến 1 đo khả năng xảy ra của một biến cố.","points":["Biểu đồ hình quạt tròn: cả hình tròn là 100%, mỗi hình quạt là tỉ lệ của một phần.","Biểu đồ đoạn thẳng biểu diễn sự thay đổi của một đại lượng theo thời gian.","Biến cố chắc chắn luôn xảy ra; biến cố không thể không bao giờ xảy ra; biến cố ngẫu nhiên có thể xảy ra hoặc không.","Xác suất của biến cố chắc chắn là 1, của biến cố không thể là 0.","Nếu có k biến cố đồng khả năng và luôn xảy ra đúng một trong chúng thì xác suất của mỗi biến cố là 1/k."],"formulas":["Phần chiếm p% ứng với góc ở tâm p% · 360° = p · 3,6°","0 ≤ xác suất của một biến cố ≤ 1","k biến cố đồng khả năng ⇒ xác suất mỗi biến cố = 1/k"],"viz":{"type":"dice"},"vizNote":"Kéo thanh trượt n (số lần gieo): khi n càng lớn, tỉ lệ số lần xuất hiện của mỗi mặt càng gần 1/6 ≈ 0,167.","memo":"Xác suất luôn ở trong đoạn từ 0 đến 1: “Không thể = 0, Chắc chắn = 1”, đồng khả năng thì chia đều 1/k. Quạt tròn = “chia bánh”, đoạn thẳng = “theo thời gian”.","example":{"q":"Gieo một con xúc xắc cân đối. Tìm xác suất của các biến cố A: “Số chấm xuất hiện là số chẵn”, B: “Số chấm nhỏ hơn 7”, C: “Số chấm bằng 7”.","a":"A và “Số chấm là số lẻ” là hai biến cố đồng khả năng, luôn xảy ra đúng một ⇒ xác suất của A là 1/2.\nB luôn xảy ra (mọi mặt từ 1 đến 6 chấm) ⇒ biến cố chắc chắn, xác suất 1.\nC không bao giờ xảy ra ⇒ biến cố không thể, xác suất 0."},"terms":[["pie chart","biểu đồ hình quạt tròn"],["line graph","biểu đồ đoạn thẳng"],["event","biến cố"],["probability","xác suất"],["equally likely","đồng khả năng"]],"quiz":[{"q":"Trong biểu đồ hình quạt tròn, phần chiếm 25% ứng với hình quạt có góc ở tâm bằng?","opts":["25°","45°","90°","100°"],"a":2,"why":"25% của 360° là 0,25·360° = 90° (một phần tư hình tròn)."},{"q":"Gieo một con xúc xắc cân đối. Xác suất để xuất hiện mặt 5 chấm là?","opts":["1/6","1/5","5/6","1/2"],"a":0,"why":"6 mặt đồng khả năng và luôn xuất hiện đúng một mặt ⇒ mỗi mặt có xác suất 1/6."},{"q":"Một hộp chỉ có 4 bút xanh. Lấy ngẫu nhiên 1 bút. Biến cố “Lấy được bút đỏ” là?","opts":["Biến cố chắc chắn, xác suất 1","Biến cố ngẫu nhiên, xác suất 1/4","Biến cố ngẫu nhiên, xác suất 1/2","Biến cố không thể, xác suất 0"],"a":3,"why":"Hộp không có bút đỏ nên biến cố không bao giờ xảy ra: biến cố không thể, xác suất 0."},{"q":"Để biểu diễn nhiệt độ trung bình của 12 tháng trong năm (thay đổi theo thời gian), nên dùng loại biểu đồ nào?","opts":["Biểu đồ hình quạt tròn","Biểu đồ đoạn thẳng","Không dùng được biểu đồ nào"],"a":1,"why":"Biểu đồ đoạn thẳng cho thấy xu hướng tăng, giảm theo thời gian; quạt tròn chỉ dùng cho các phần của một tổng thể."}]},{"id":"m8-01","subj":"math","grade":8,"chap":"Hằng đẳng thức đáng nhớ","title":"Bảy hằng đẳng thức đáng nhớ","sum":"Hằng đẳng thức là đẳng thức đúng với mọi giá trị của biến. Bảy hằng đẳng thức đáng nhớ giúp khai triển, rút gọn và tính nhanh.","points":["Hằng đẳng thức là đẳng thức đúng với mọi giá trị của các biến.","Bảy hằng đẳng thức: bình phương tổng/hiệu, hiệu hai bình phương, lập phương tổng/hiệu, tổng/hiệu hai lập phương.","Bình phương một tổng (hiệu): bình phương số đầu, cộng (trừ) hai lần tích, cộng bình phương số sau.","(a − b)² = (b − a)², nhưng (a − b)³ = −(b − a)³.","Dùng để tính nhanh: 99² = (100 − 1)², 101·99 = 100² − 1²."],"formulas":["(a ± b)² = a² ± 2ab + b²","a² − b² = (a − b)(a + b)","(a ± b)³ = a³ ± 3a²b + 3ab² ± b³","a³ ± b³ = (a ± b)(a² ∓ ab + b²)"],"viz":{"type":"identity"},"vizNote":"Kéo thanh trượt a, b: hình vuông cạnh a + b chia thành a², hai hình chữ nhật ab và b², nên (a + b)² = a² + 2ab + b².","memo":"Bình phương: “đầu bình – hai tích – cuối bình”. Tổng/hiệu hai lập phương: dấu thứ nhất CÙNG, dấu thứ hai NGƯỢC, dấu cuối luôn DƯƠNG.","example":{"q":"Tính nhanh: a) 102²; b) 98·102.","a":"a) 102² = (100 + 2)² = 100² + 2·100·2 + 2² = 10 000 + 400 + 4 = 10 404.\nb) 98·102 = (100 − 2)(100 + 2) = 100² − 2² = 10 000 − 4 = 9 996."},"terms":[["algebraic identity","hằng đẳng thức"],["square of a sum","bình phương của một tổng"],["difference of two squares","hiệu hai bình phương"],["cube of a difference","lập phương của một hiệu"],["sum of two cubes","tổng hai lập phương"]],"quiz":[{"q":"Khai triển (2x − 3)² được kết quả nào?","opts":["4x² − 9","4x² − 6x + 9","4x² − 12x + 9","2x² − 12x + 9"],"a":2,"why":"(2x)² − 2·2x·3 + 3² = 4x² − 12x + 9."},{"q":"Tính nhanh 51² − 49².","opts":["200","4","100","2 500"],"a":0,"why":"51² − 49² = (51 − 49)(51 + 49) = 2·100 = 200."},{"q":"x³ + 8 bằng biểu thức nào?","opts":["(x + 2)(x² + 2x + 4)","(x + 2)³","(x − 2)(x² + 2x + 4)","(x + 2)(x² − 2x + 4)"],"a":3,"why":"a³ + b³ = (a + b)(a² − ab + b²) với a = x, b = 2."},{"q":"Giá trị của biểu thức x² − 10x + 25 tại x = 105 là bao nhiêu?","opts":["1 000","10 000","10 025","11 025"],"a":1,"why":"x² − 10x + 25 = (x − 5)² = (105 − 5)² = 100² = 10 000."}]},{"id":"m8-02","subj":"math","grade":8,"chap":"Hằng đẳng thức đáng nhớ","title":"Phân tích đa thức thành nhân tử","sum":"Phân tích đa thức thành nhân tử là viết đa thức thành tích của những đa thức. Ba cách cơ bản: đặt nhân tử chung, dùng hằng đẳng thức, nhóm hạng tử.","points":["Phân tích thành nhân tử là biến đổi đa thức thành một tích của những đa thức.","Đặt nhân tử chung: AB + AC = A(B + C); lấy ƯCLN của hệ số và lũy thừa nhỏ nhất của biến.","Dùng hằng đẳng thức: nhận ra dạng a² − b², a² ± 2ab + b², a³ ± b³ rồi viết thành tích.","Nhóm hạng tử: gom các hạng tử thành nhóm có nhân tử chung, rồi đặt nhân tử chung lần nữa.","Tìm x: phân tích về dạng A·B = 0 thì A = 0 hoặc B = 0.","Kiểm tra lại bằng cách nhân các nhân tử, phải ra đúng đa thức ban đầu."],"formulas":["AB + AC = A(B + C)","a² − b² = (a − b)(a + b)","a² ± 2ab + b² = (a ± b)²","A·B = 0 ⇔ A = 0 hoặc B = 0"],"viz":{"type":"identity"},"vizNote":"Kéo a, b: bốn mảnh a², ab, ab, b² ghép lại thành đúng một hình vuông cạnh a + b, tức là a² + 2ab + b² = (a + b)².","memo":"Thứ tự thử “CHUNG – HẰNG – NHÓM”: đặt nhân tử Chung trước, rồi soi Hằng đẳng thức, bí quá thì Nhóm hạng tử.","example":{"q":"Phân tích thành nhân tử: a) 2x³ − 8x; b) x² − 2xy + y² − 9.","a":"a) Đặt nhân tử chung 2x: 2x³ − 8x = 2x(x² − 4).\nDùng hiệu hai bình phương: = 2x(x − 2)(x + 2).\nb) Nhóm ba hạng tử đầu: (x² − 2xy + y²) − 9 = (x − y)² − 3².\nHiệu hai bình phương: = (x − y − 3)(x − y + 3)."},"terms":[["factorization (factoring)","phân tích thành nhân tử"],["common factor","nhân tử chung"],["grouping terms","nhóm hạng tử"],["polynomial","đa thức"]],"quiz":[{"q":"Phân tích 3x² − 6x thành nhân tử được kết quả nào?","opts":["3x(x − 6)","3x(x − 2)","3x²(1 − 2x)","x(3x − 2)"],"a":1,"why":"Nhân tử chung là 3x: 3x² − 6x = 3x·x − 3x·2 = 3x(x − 2)."},{"q":"x² − 4x + 4 bằng biểu thức nào?","opts":["(x − 4)²","(x + 2)²","(x − 2)(x + 2)","(x − 2)²"],"a":3,"why":"x² − 2·x·2 + 2² = (x − 2)² (bình phương một hiệu)."},{"q":"Phân tích xy + x + y + 1 thành nhân tử.","opts":["(x + 1)(y + 1)","(x + y)(y + 1)","(x − 1)(y − 1)","(xy + 1)(x + y)"],"a":0,"why":"Nhóm: (xy + x) + (y + 1) = x(y + 1) + (y + 1) = (y + 1)(x + 1)."},{"q":"Tìm x biết x² − 5x = 0.","opts":["x = 5","x = −5","x = 0 hoặc x = 5","x = 0 hoặc x = −5"],"a":2,"why":"x² − 5x = x(x − 5) = 0 nên x = 0 hoặc x − 5 = 0, tức x = 5."}]},{"id":"m8-03","subj":"math","grade":8,"chap":"Tứ giác","title":"Tứ giác và các tứ giác đặc biệt","sum":"Tổng các góc của một tứ giác bằng 360°. Hình thang cân, hình bình hành, hình chữ nhật, hình thoi, hình vuông có những tính chất riêng về cạnh, góc và đường chéo.","points":["Tổng bốn góc của một tứ giác bằng 360°.","Hình thang cân: hai góc kề một đáy bằng nhau, hai đường chéo bằng nhau.","Hình bình hành: cạnh đối song song và bằng nhau, góc đối bằng nhau, đường chéo cắt nhau tại trung điểm mỗi đường.","Hình chữ nhật: bốn góc vuông; hai đường chéo bằng nhau và cắt nhau tại trung điểm mỗi đường.","Hình thoi: bốn cạnh bằng nhau; hai đường chéo vuông góc và là phân giác các góc.","Hình vuông vừa là hình chữ nhật vừa là hình thoi."],"formulas":["∠A + ∠B + ∠C + ∠D = 360°","Tổng các góc của đa giác n cạnh = (n − 2)·180°","Mỗi góc của đa giác đều n cạnh = (n − 2)·180°/n"],"viz":{"type":"polygon"},"vizNote":"Đặt n = 4: tổng các góc là (4 − 2)·180° = 360°, mỗi góc của hình vuông bằng 90°; tăng n để so sánh với đa giác khác.","memo":"“Cây gia phả”: hình bình hành + một góc vuông = hình chữ nhật; hình bình hành + hai cạnh kề bằng nhau = hình thoi; chữ nhật + thoi = hình vuông.","example":{"q":"Tứ giác ABCD có ∠A = 75°, ∠B = 105°, ∠C = 75°. Tính ∠D. ABCD có phải hình bình hành không?","a":"∠D = 360° − (75° + 105° + 75°) = 360° − 255° = 105°.\nTa có ∠A = ∠C = 75° và ∠B = ∠D = 105°: các góc đối bằng nhau.\nVậy ABCD là hình bình hành."},"terms":[["quadrilateral","tứ giác"],["isosceles trapezoid","hình thang cân"],["parallelogram","hình bình hành"],["rhombus","hình thoi"],["diagonal","đường chéo"]],"quiz":[{"q":"Một tứ giác có ba góc là 90°, 100°, 70°. Góc còn lại bằng bao nhiêu?","opts":["80°","90°","100°","110°"],"a":2,"why":"360° − (90° + 100° + 70°) = 360° − 260° = 100°."},{"q":"Hình bình hành có thêm điều kiện nào thì là hình thoi?","opts":["Hai đường chéo vuông góc","Có một góc vuông","Hai đường chéo bằng nhau","Hai cạnh đối song song"],"a":0,"why":"Hình bình hành có hai đường chéo vuông góc là hình thoi. Góc vuông hay đường chéo bằng nhau cho hình chữ nhật."},{"q":"Hình chữ nhật ABCD có AC = 10 cm, O là giao điểm hai đường chéo. Độ dài OB là?","opts":["10 cm","5 cm","20 cm","Không tính được"],"a":1,"why":"Hai đường chéo bằng nhau (BD = AC = 10 cm) và cắt nhau tại trung điểm, nên OB = 10 : 2 = 5 cm."},{"q":"Hình thang cân ABCD (AB ∥ CD) có ∠D = 70°. Số đo ∠A là?","opts":["70°","90°","140°","110°"],"a":3,"why":"AB ∥ CD nên ∠A + ∠D = 180° (hai góc trong cùng phía), suy ra ∠A = 180° − 70° = 110°."}]},{"id":"m8-04","subj":"math","grade":8,"chap":"Định lí Thalès","title":"Định lí Thalès và đường trung bình của tam giác","sum":"Một đường thẳng song song với một cạnh của tam giác thì định ra trên hai cạnh kia những đoạn thẳng tương ứng tỉ lệ. Đường trung bình song song và bằng nửa cạnh thứ ba.","points":["Định lí Thalès: đường thẳng song song với một cạnh tam giác, cắt hai cạnh kia, tạo ra các đoạn tương ứng tỉ lệ.","Định lí Thalès đảo: M ∈ AB, N ∈ AC và AM/AB = AN/AC thì MN ∥ BC.","Hệ quả: MN ∥ BC thì tam giác AMN có ba cạnh tỉ lệ với ba cạnh tam giác ABC.","Đường trung bình nối trung điểm hai cạnh; nó song song với cạnh thứ ba và bằng nửa cạnh đó.","Phân giác AD của tam giác ABC chia cạnh BC theo tỉ lệ hai cạnh kề: DB/DC = AB/AC."],"formulas":["MN ∥ BC ⇔ AM/AB = AN/AC (⇔ AM/MB = AN/NC)","MN ∥ BC ⇒ AM/AB = AN/AC = MN/BC","Đường trung bình: MN ∥ BC, MN = BC/2","AD là phân giác ⇒ DB/DC = AB/AC"],"viz":{"type":"thales"},"vizNote":"Kéo MN (luôn song song với BC): ba tỉ số AM/AB, AN/AC, MN/BC luôn bằng nhau; khi M là trung điểm AB, tỉ số bằng 1/2 – đó là đường trung bình.","memo":"“Song song sinh tỉ lệ – tỉ lệ sinh song song”. Đường trung bình: “song song và một nửa”.","example":{"q":"Tam giác ABC có MN ∥ BC (M ∈ AB, N ∈ AC), AM = 3 cm, MB = 2 cm, AN = 4,5 cm, BC = 10 cm. Tính NC và MN.","a":"Theo định lí Thalès: AM/MB = AN/NC ⇒ 3/2 = 4,5/NC ⇒ NC = 4,5·2 : 3 = 3 cm.\nAB = 3 + 2 = 5 cm. Theo hệ quả: MN/BC = AM/AB = 3/5.\n⇒ MN = 10·3/5 = 6 cm."},"terms":[["Thales's theorem (intercept theorem)","định lí Thalès"],["midsegment of a triangle","đường trung bình của tam giác"],["ratio","tỉ số"],["parallel","song song"],["angle bisector","đường phân giác"]],"quiz":[{"q":"Tam giác ABC có MN ∥ BC (M ∈ AB, N ∈ AC), AM = 2 cm, AB = 6 cm, AC = 9 cm. Độ dài AN là?","opts":["4,5 cm","6 cm","3 cm","2 cm"],"a":2,"why":"AN/AC = AM/AB = 2/6 = 1/3 ⇒ AN = 9 : 3 = 3 cm."},{"q":"M, N là trung điểm của AB, AC; BC = 14 cm. Độ dài MN là?","opts":["3,5 cm","7 cm","14 cm","28 cm"],"a":1,"why":"MN là đường trung bình nên MN = BC/2 = 14 : 2 = 7 cm."},{"q":"M ∈ AB, N ∈ AC với AM = 4 cm, MB = 6 cm, AN = 6 cm, NC = 9 cm. Kết luận nào đúng?","opts":["MN ⊥ BC","MN = BC","Không đủ dữ kiện","MN ∥ BC"],"a":3,"why":"AM/MB = 4/6 = 2/3 và AN/NC = 6/9 = 2/3 bằng nhau, theo định lí Thalès đảo thì MN ∥ BC."},{"q":"Tam giác ABC có AB = 6 cm, AC = 9 cm, BC = 10 cm, AD là phân giác (D ∈ BC). Độ dài DB là?","opts":["4 cm","5 cm","6 cm","3 cm"],"a":0,"why":"DB/DC = AB/AC = 6/9 = 2/3 nên DB = 10·2/(2 + 3) = 4 cm."}]},{"id":"m8-05","subj":"math","grade":8,"chap":"Phương trình và hàm số bậc nhất","title":"Phương trình bậc nhất một ẩn","sum":"Phương trình bậc nhất một ẩn có dạng ax + b = 0 (a ≠ 0) và có nghiệm duy nhất x = −b/a. Dùng quy tắc chuyển vế và quy tắc nhân để giải, rồi áp dụng vào bài toán thực tế.","points":["Phương trình bậc nhất một ẩn có dạng ax + b = 0, với a, b là số đã biết và a ≠ 0.","Phương trình ax + b = 0 (a ≠ 0) luôn có đúng một nghiệm x = −b/a.","Quy tắc chuyển vế: chuyển một hạng tử sang vế kia thì phải đổi dấu hạng tử đó.","Quy tắc nhân: nhân (hoặc chia) cả hai vế với cùng một số khác 0.","Giải toán bằng lập phương trình: chọn ẩn và điều kiện → lập phương trình → giải → đối chiếu, trả lời."],"formulas":["ax + b = 0 (a ≠ 0) ⇔ ax = −b ⇔ x = −b/a"],"viz":{"type":"linear"},"vizNote":"Nghiệm của ax + b = 0 là hoành độ giao điểm của đường thẳng y = ax + b với trục Ox; kéo a, b để thấy điểm đó luôn ở x = −b/a.","memo":"“Qua cầu đổi áo”: hạng tử sang vế bên kia thì đổi dấu. Nhân hay chia hai vế: cùng một số, và số đó khác 0.","example":{"q":"a) Giải phương trình 3(x − 2) + 5 = x + 7.\nb) Một hình chữ nhật có chu vi 50 m, chiều dài hơn chiều rộng 5 m. Tính các kích thước.","a":"a) 3x − 6 + 5 = x + 7 ⇔ 3x − 1 = x + 7 ⇔ 3x − x = 7 + 1 ⇔ 2x = 8 ⇔ x = 4.\nThử lại: 3·2 + 5 = 11 và 4 + 7 = 11 ✓.\nb) Gọi chiều rộng là x (m), x > 0; chiều dài là x + 5.\n2(x + x + 5) = 50 ⇔ 4x + 10 = 50 ⇔ x = 10.\nVậy chiều rộng 10 m, chiều dài 15 m."},"terms":[["linear equation in one variable","phương trình bậc nhất một ẩn"],["solution (root)","nghiệm"],["unknown","ẩn"],["side of an equation","vế của phương trình"]],"quiz":[{"q":"Phương trình nào là phương trình bậc nhất một ẩn?","opts":["0x + 3 = 0","x² − 1 = 0","2x − 5 = 0","1/x + 2 = 0"],"a":2,"why":"2x − 5 = 0 có dạng ax + b = 0 với a = 2 ≠ 0. Phương trình 0x + 3 = 0 có a = 0 nên không phải."},{"q":"Nghiệm của phương trình 5x + 15 = 0 là?","opts":["x = −3","x = 3","x = 1/3","x = −15"],"a":0,"why":"5x = −15 ⇒ x = −15 : 5 = −3."},{"q":"Giải phương trình 2(x + 3) = x − 4.","opts":["x = 10","x = −2","x = 2","x = −10"],"a":3,"why":"2x + 6 = x − 4 ⇔ 2x − x = −4 − 6 ⇔ x = −10."},{"q":"Tổng hai số là 48, số lớn gấp 3 lần số bé. Số bé là bao nhiêu?","opts":["16","12","36","24"],"a":1,"why":"Gọi số bé là x thì số lớn là 3x: x + 3x = 48 ⇔ 4x = 48 ⇔ x = 12."}]},{"id":"m8-06","subj":"math","grade":8,"chap":"Phương trình và hàm số bậc nhất","title":"Hàm số bậc nhất y = ax + b và đồ thị","sum":"Hàm số bậc nhất y = ax + b (a ≠ 0) có đồ thị là một đường thẳng. Hệ số góc a cho biết độ nghiêng, còn b cho biết điểm cắt trục tung.","points":["Hàm số bậc nhất có dạng y = ax + b, trong đó a ≠ 0.","Đồ thị là một đường thẳng, cắt trục tung tại điểm (0; b).","Vẽ đồ thị: lấy hai điểm, thường là (0; b) và (−b/a; 0), rồi kẻ đường thẳng qua chúng.","a là hệ số góc: a > 0 thì góc tạo với Ox là góc nhọn; a < 0 thì là góc tù.","Hai đường y = ax + b và y = a'x + b': song song khi a = a', b ≠ b'; cắt nhau khi a ≠ a'."],"formulas":["y = ax + b (a ≠ 0)","Cắt Oy tại (0; b), cắt Ox tại (−b/a; 0)","d ∥ d' ⇔ a = a' và b ≠ b'; d ≡ d' ⇔ a = a' và b = b'","d cắt d' ⇔ a ≠ a'"],"viz":{"type":"linear"},"vizNote":"Kéo a: đường thẳng xoay (a > 0 đi lên, a < 0 đi xuống từ trái sang phải); kéo b: đường thẳng dịch lên xuống, luôn cắt Oy tại (0; b).","memo":"“a là độ dốc, b là chỗ xuất phát”: a quyết định nghiêng thế nào, b quyết định cắt trục tung ở đâu. Cùng a, khác b ⇒ song song.","example":{"q":"a) Vẽ đồ thị hàm số y = 2x − 4.\nb) Tìm đường thẳng song song với nó và đi qua điểm A(1; 5).","a":"a) x = 0 ⇒ y = −4: điểm (0; −4). y = 0 ⇒ 2x = 4 ⇒ x = 2: điểm (2; 0).\nKẻ đường thẳng qua hai điểm. Hệ số góc 2 > 0 nên tạo với Ox góc nhọn.\nb) Song song ⇒ cùng a = 2: y = 2x + b (b ≠ −4).\nQua A(1; 5): 5 = 2·1 + b ⇒ b = 3. Vậy y = 2x + 3."},"terms":[["linear function","hàm số bậc nhất"],["graph","đồ thị"],["slope","hệ số góc"],["y-intercept","giao điểm với trục tung"],["coordinate plane","mặt phẳng tọa độ"]],"quiz":[{"q":"Hệ số góc của đường thẳng y = 3 − 2x là?","opts":["3","2","−3","−2"],"a":3,"why":"Viết lại y = −2x + 3, hệ số của x là a = −2."},{"q":"y = (m − 1)x + 3 là hàm số bậc nhất khi nào?","opts":["m ≠ 1","m = 1","m > 1","m ≠ 0"],"a":0,"why":"Cần hệ số a = m − 1 ≠ 0, tức là m ≠ 1."},{"q":"Đường thẳng nào song song với đường thẳng y = 3x − 1?","opts":["y = −3x − 1","y = 3x + 2","y = 3x − 1","y = x + 3"],"a":1,"why":"Song song khi cùng a = 3 và khác b: y = 3x + 2. Còn y = 3x − 1 thì trùng nhau."},{"q":"Đồ thị hàm số y = −x + 4 cắt trục hoành tại điểm nào?","opts":["(0; 4)","(−4; 0)","(4; 0)","(0; −4)"],"a":2,"why":"Cho y = 0: −x + 4 = 0 ⇒ x = 4, nên giao điểm là (4; 0)."}]},{"id":"m8-07","subj":"math","grade":8,"chap":"Xác suất của biến cố","title":"Xác suất của biến cố và xác suất thực nghiệm","sum":"Khi các kết quả đồng khả năng, xác suất của biến cố bằng tỉ số giữa số kết quả thuận lợi và số kết quả có thể. Thử càng nhiều lần, xác suất thực nghiệm càng gần xác suất đó.","points":["Kết quả thuận lợi cho biến cố A là kết quả làm cho A xảy ra.","Nếu các kết quả đồng khả năng: P(A) = số kết quả thuận lợi cho A : số kết quả có thể.","0 ≤ P(A) ≤ 1; biến cố chắc chắn có xác suất 1, biến cố không thể có xác suất 0.","Xác suất thực nghiệm của A = số lần A xảy ra : tổng số lần thực hiện.","Số lần thử càng lớn, xác suất thực nghiệm càng gần P(A), nên dùng nó để ước lượng xác suất."],"formulas":["P(A) = số kết quả thuận lợi cho A / số kết quả có thể","Xác suất thực nghiệm = k/n (A xảy ra k lần trong n lần thử)","0 ≤ P(A) ≤ 1"],"viz":{"type":"dice"},"vizNote":"Tăng số lần gieo n: tỉ lệ xuất hiện của mỗi mặt dao động mạnh khi n nhỏ, rồi tiến dần về 1/6 ≈ 0,167 khi n lớn.","memo":"Xác suất = “phần được chia cho phần có thể”. Thử càng nhiều, thực nghiệm càng gần lí thuyết.","example":{"q":"Hộp có 3 bi đỏ, 5 bi xanh, 2 bi vàng cùng kích cỡ. Lấy ngẫu nhiên 1 bi.\na) Tính xác suất lấy được bi đỏ.\nb) Lấy 200 lần (mỗi lần trả bi lại), dự đoán khoảng bao nhiêu lần ra bi đỏ?","a":"a) Có 3 + 5 + 2 = 10 kết quả đồng khả năng, 3 kết quả thuận lợi.\nP(đỏ) = 3/10 = 0,3.\nb) Xác suất thực nghiệm sẽ gần 0,3 nên số lần ra bi đỏ khoảng 200·0,3 = 60 lần."},"terms":[["probability","xác suất"],["event","biến cố"],["favourable outcome","kết quả thuận lợi"],["equally likely","đồng khả năng"],["experimental probability","xác suất thực nghiệm"]],"quiz":[{"q":"Gieo một con xúc xắc cân đối. Xác suất xuất hiện mặt có số chấm chẵn là?","opts":["1/6","1/3","1/2","2/3"],"a":2,"why":"Có 6 kết quả, 3 kết quả thuận lợi (2, 4, 6): P = 3/6 = 1/2."},{"q":"Rút ngẫu nhiên 1 thẻ từ 20 thẻ ghi số 1 đến 20. Xác suất rút được số chia hết cho 3 là?","opts":["1/3","3/10","1/4","7/20"],"a":1,"why":"Các số 3, 6, 9, 12, 15, 18 (6 số): P = 6/20 = 3/10."},{"q":"Tung đồng xu 50 lần thấy mặt sấp 22 lần. Xác suất thực nghiệm của mặt ngửa là?","opts":["0,44","0,5","0,28","0,56"],"a":3,"why":"Mặt ngửa xuất hiện 50 − 22 = 28 lần: 28/50 = 0,56."},{"q":"Kiểm tra 500 sản phẩm thấy 10 sản phẩm lỗi. Ước lượng số sản phẩm lỗi trong lô 2 000 sản phẩm.","opts":["40","20","100","200"],"a":0,"why":"Xác suất thực nghiệm 10/500 = 0,02, nên ước lượng 2 000·0,02 = 40 sản phẩm lỗi."}]},{"id":"m8-08","subj":"math","grade":8,"chap":"Tam giác đồng dạng","title":"Tam giác đồng dạng và các trường hợp đồng dạng","sum":"Hai tam giác đồng dạng có các góc tương ứng bằng nhau và các cạnh tương ứng tỉ lệ. Ba trường hợp nhận biết: cạnh – cạnh – cạnh, cạnh – góc – cạnh, góc – góc.","points":["ΔA'B'C' ∽ ΔABC khi các góc tương ứng bằng nhau và các cạnh tương ứng tỉ lệ, với tỉ số đồng dạng k.","Nếu MN ∥ BC (M ∈ AB, N ∈ AC) thì ΔAMN ∽ ΔABC.","Trường hợp cạnh – cạnh – cạnh (c.c.c): ba cạnh tương ứng tỉ lệ.","Trường hợp cạnh – góc – cạnh (c.g.c): hai cạnh tương ứng tỉ lệ và góc xen giữa bằng nhau.","Trường hợp góc – góc (g.g): có hai góc tương ứng bằng nhau.","Hai tam giác vuông đồng dạng nếu có một góc nhọn bằng nhau, hoặc hai cạnh góc vuông tương ứng tỉ lệ."],"formulas":["A'B'/AB = B'C'/BC = C'A'/CA = k","∠A' = ∠A, ∠B' = ∠B, ∠C' = ∠C","Chu vi ΔA'B'C' : chu vi ΔABC = k"],"viz":{"type":"thales"},"vizNote":"Kéo MN (song song với BC): tam giác AMN luôn đồng dạng với ABC, tỉ số đồng dạng k = AM/AB thay đổi theo vị trí MN.","memo":"Đồng dạng nghĩa là “cùng hình, khác cỡ”. Viết đúng thứ tự đỉnh: ΔABC ∽ ΔDEF ⇒ A↔D, B↔E, C↔F. Cách nhanh nhất: tìm hai góc bằng nhau (g.g).","example":{"q":"ΔABC có AB = 4 cm, AC = 6 cm, BC = 8 cm; ΔDEF có DE = 6 cm, DF = 9 cm, EF = 12 cm. Hai tam giác có đồng dạng không? Tính tỉ số chu vi.","a":"DE/AB = 6/4 = 1,5; DF/AC = 9/6 = 1,5; EF/BC = 12/8 = 1,5.\nBa cạnh tương ứng tỉ lệ ⇒ ΔDEF ∽ ΔABC (c.c.c), k = 1,5.\nChu vi: ΔABC = 18 cm, ΔDEF = 27 cm; 27 : 18 = 1,5 = k."},"terms":[["similar triangles","tam giác đồng dạng"],["scale factor (ratio of similarity)","tỉ số đồng dạng"],["corresponding sides","cạnh tương ứng"],["included angle","góc xen giữa"]],"quiz":[{"q":"ΔABC ∽ ΔMNP có AB = 4 cm, BC = 6 cm, MN = 6 cm. Độ dài NP là?","opts":["4 cm","8 cm","9 cm","12 cm"],"a":2,"why":"NP/BC = MN/AB = 6/4 = 1,5 ⇒ NP = 6·1,5 = 9 cm."},{"q":"ΔABC có ∠A = 50°, ∠B = 60°; ΔDEF có ∠D = 50°, ∠F = 70°. Khẳng định nào đúng?","opts":["ΔABC ∽ ΔDEF","ΔABC ∽ ΔDFE","ΔABC ∽ ΔEDF","Không đồng dạng"],"a":0,"why":"∠C = 180° − 110° = 70° = ∠F và ∠A = ∠D, nên ΔABC ∽ ΔDEF (g.g), đỉnh B ứng với E."},{"q":"ΔABC và ΔDEF có AB/DE = AC/DF. Cần thêm điều kiện nào để chúng đồng dạng theo trường hợp c.g.c?","opts":["∠B = ∠E","∠C = ∠F","BC = EF","∠A = ∠D"],"a":3,"why":"Góc bằng nhau phải là góc xen giữa hai cạnh tỉ lệ: ∠A (giữa AB, AC) và ∠D (giữa DE, DF)."},{"q":"Cọc cao 1,5 m có bóng dài 2 m. Cùng lúc đó, bóng của một cây dài 12 m. Cây cao bao nhiêu?","opts":["8 m","9 m","16 m","10,5 m"],"a":1,"why":"Hai tam giác vuông đồng dạng (cùng góc nắng): h/12 = 1,5/2 ⇒ h = 12·0,75 = 9 m."}]},{"id":"m8-09","subj":"math","grade":8,"chap":"Tam giác đồng dạng","title":"Định lí Pythagore và ứng dụng","sum":"Trong tam giác vuông, bình phương cạnh huyền bằng tổng bình phương hai cạnh góc vuông. Định lí đảo dùng để nhận biết tam giác vuông.","points":["Trong tam giác vuông, bình phương cạnh huyền bằng tổng bình phương hai cạnh góc vuông.","Định lí Pythagore đảo: nếu BC² = AB² + AC² thì tam giác ABC vuông tại A.","Cạnh huyền đối diện góc vuông và là cạnh dài nhất.","Biết hai cạnh thì tính được cạnh thứ ba: c = √(a² + b²), a = √(c² − b²).","Bộ ba quen thuộc: (3; 4; 5), (5; 12; 13), (8; 15; 17) và các bội như (6; 8; 10).","Ứng dụng: tính đường chéo hình chữ nhật, chiều cao thang dựa tường, khoảng cách hai điểm."],"formulas":["ΔABC vuông tại A ⇒ BC² = AB² + AC²","BC² = AB² + AC² ⇒ ΔABC vuông tại A","Đường chéo hình chữ nhật: d = √(a² + b²)","Đường chéo hình vuông cạnh a: d = a√2"],"viz":{"type":"pythagoras"},"vizNote":"Kéo a, b: diện tích hình vuông dựng trên cạnh huyền luôn bằng tổng diện tích hai hình vuông dựng trên hai cạnh góc vuông.","memo":"“Huyền bình bằng tổng hai bình”. Thuộc bộ 3 – 4 – 5 (và các bội 6 – 8 – 10, 9 – 12 – 15) để nhẩm nhanh.","example":{"q":"Một cái thang dài 5 m dựa vào tường, chân thang cách chân tường 1,4 m. Đầu thang chạm tường ở độ cao bao nhiêu?","a":"Thang, tường và mặt đất tạo thành tam giác vuông với cạnh huyền là thang (5 m).\nh² = 5² − 1,4² = 25 − 1,96 = 23,04.\nh = √23,04 = 4,8 m."},"terms":[["Pythagorean theorem","định lí Pythagore"],["hypotenuse","cạnh huyền"],["leg (of a right triangle)","cạnh góc vuông"],["right triangle","tam giác vuông"],["converse","định lí đảo"]],"quiz":[{"q":"Tam giác vuông có hai cạnh góc vuông 9 cm và 12 cm. Cạnh huyền dài bao nhiêu?","opts":["13 cm","15 cm","21 cm","17 cm"],"a":1,"why":"9² + 12² = 81 + 144 = 225 = 15², nên cạnh huyền là 15 cm."},{"q":"Bộ ba độ dài nào là ba cạnh của một tam giác vuông?","opts":["4 cm, 5 cm, 6 cm","6 cm, 7 cm, 9 cm","5 cm, 11 cm, 12 cm","7 cm, 24 cm, 25 cm"],"a":3,"why":"7² + 24² = 49 + 576 = 625 = 25². Các bộ khác: 41 ≠ 36, 85 ≠ 81, 146 ≠ 144."},{"q":"Tam giác vuông có cạnh huyền 13 cm, một cạnh góc vuông 5 cm. Cạnh góc vuông còn lại là?","opts":["12 cm","8 cm","18 cm","√194 cm"],"a":0,"why":"13² − 5² = 169 − 25 = 144 = 12². Lưu ý: lấy hiệu, không lấy tổng các bình phương."},{"q":"Hình chữ nhật có hai cạnh 20 cm và 21 cm. Đường chéo dài bao nhiêu?","opts":["25 cm","41 cm","29 cm","31 cm"],"a":2,"why":"d² = 20² + 21² = 400 + 441 = 841 = 29², nên d = 29 cm."}]},{"id":"m9-01","subj":"math","grade":9,"chap":"Hệ hai phương trình bậc nhất hai ẩn","title":"Hệ hai phương trình bậc nhất hai ẩn","sum":"Phương trình bậc nhất hai ẩn ax + by = c có vô số nghiệm, biểu diễn bởi một đường thẳng. Hệ hai phương trình như vậy có 1 nghiệm, vô nghiệm hoặc vô số nghiệm và được giải bằng phương pháp thế hoặc cộng đại số.","points":["Phương trình bậc nhất hai ẩn: ax + by = c, với a, b không đồng thời bằng 0.","Mỗi nghiệm là một cặp số (x; y); tập nghiệm được biểu diễn bởi một đường thẳng.","Nghiệm của hệ là nghiệm chung của hai phương trình = giao điểm của hai đường thẳng.","Phương pháp thế: rút một ẩn từ một phương trình rồi thế vào phương trình còn lại.","Phương pháp cộng đại số: nhân hệ số thích hợp rồi cộng/trừ vế theo vế để khử một ẩn.","Hai đường thẳng cắt nhau ⇒ 1 nghiệm; song song ⇒ vô nghiệm; trùng nhau ⇒ vô số nghiệm."],"formulas":["ax + by = c (a ≠ 0 hoặc b ≠ 0)","Hệ: a₁x + b₁y = c₁ và a₂x + b₂y = c₂"],"viz":{"type":"system"},"vizNote":"Kéo bốn thanh trượt a₁, b₁, a₂, b₂: giao điểm hai đường thẳng là nghiệm của hệ; khi a₁ = a₂ và b₁ ≠ b₂ hai đường song song ⇒ hệ vô nghiệm.","memo":"“Cắt – một, Song – không, Trùng – vô số”: nhìn vị trí hai đường thẳng là biết hệ có bao nhiêu nghiệm.","example":{"q":"Giải hệ phương trình: x + y = 5 và 2x − y = 1.","a":"Cộng vế theo vế hai phương trình (khử y): 3x = 6 ⇒ x = 2.\nThế x = 2 vào x + y = 5 ⇒ y = 3.\nThử lại: 2·2 − 3 = 1 ✓.\nVậy hệ có nghiệm duy nhất (x; y) = (2; 3)."},"terms":[["linear equation in two variables","phương trình bậc nhất hai ẩn"],["system of equations","hệ phương trình"],["substitution method","phương pháp thế"],["elimination method","phương pháp cộng đại số"],["solution","nghiệm"]],"quiz":[{"q":"Cặp số nào là nghiệm của phương trình 2x + 3y = 7?","opts":["(1; 2)","(2; 1)","(3; 1)","(0; 2)"],"a":1,"why":"Thay vào: 2·2 + 3·1 = 4 + 3 = 7. Các cặp khác cho 8, 9, 6."},{"q":"Nghiệm của hệ x − y = 1 và x + y = 7 là:","opts":["(4; 3)","(3; 4)","(5; 2)","(8; 7)"],"a":0,"why":"Cộng hai phương trình: 2x = 8 ⇒ x = 4, rồi y = 7 − 4 = 3."},{"q":"Hệ gồm y = 2x + 1 và y = 2x − 3 có bao nhiêu nghiệm?","opts":["1 nghiệm","2 nghiệm","Vô nghiệm","Vô số nghiệm"],"a":2,"why":"Cùng hệ số góc 2 nhưng tung độ gốc khác nhau ⇒ hai đường thẳng song song, không có điểm chung."},{"q":"Mua 2 bút và 3 vở hết 36 000 đ; mua 1 bút và 2 vở hết 22 000 đ. Giá một chiếc bút là:","opts":["8 000 đ","5 000 đ","4 000 đ","6 000 đ"],"a":3,"why":"Gọi giá bút b, vở v (nghìn đồng): b = 22 − 2v; 2(22 − 2v) + 3v = 36 ⇒ v = 8, b = 6."}]},{"id":"m9-02","subj":"math","grade":9,"chap":"Phương trình và bất phương trình bậc nhất một ẩn","title":"Bất đẳng thức và bất phương trình bậc nhất một ẩn","sum":"Bất đẳng thức so sánh hai số hoặc hai biểu thức bằng <, >, ≤, ≥. Giải bất phương trình bậc nhất một ẩn bằng cách chuyển vế rồi chia hai vế cho hệ số, nhớ đổi chiều khi chia cho số âm.","points":["Bất đẳng thức có dạng a < b, a > b, a ≤ b, a ≥ b (a là vế trái, b là vế phải).","Tính chất bắc cầu: a < b và b < c ⇒ a < c.","Cộng cùng một số vào hai vế: chiều bất đẳng thức giữ nguyên.","Nhân hai vế với số dương: giữ nguyên chiều; nhân với số âm: đổi chiều.","Bất phương trình bậc nhất một ẩn: ax + b > 0 (hoặc <, ≤, ≥) với a ≠ 0.","Cách giải: chuyển vế đổi dấu, rồi chia hai vế cho a (a < 0 thì đổi chiều)."],"formulas":["a < b ⇒ a + c < b + c","a < b, c > 0 ⇒ ac < bc","a < b, c < 0 ⇒ ac > bc","ax + b > 0 (a > 0) ⇔ x > −b/a"],"viz":{"type":"numberline"},"vizNote":"Kéo điểm x trên trục số và nhìn số đối −x: x tăng thì −x giảm — đó là lí do nhân hai vế với số âm phải đổi chiều bất đẳng thức.","memo":"“Nhân, chia số âm – lật ngược dấu ngay; số dương thì cứ để yên.”","example":{"q":"Giải bất phương trình 3 − 2x ≥ 7 và biểu diễn tập nghiệm trên trục số.","a":"Chuyển 3 sang vế phải: −2x ≥ 7 − 3 = 4.\nChia hai vế cho −2 (số âm ⇒ đổi chiều): x ≤ −2.\nTrục số: lấy cả điểm −2 và toàn bộ phần bên trái nó.\nThử x = −3: 3 − 2·(−3) = 9 ≥ 7 ✓."},"terms":[["inequality","bất đẳng thức"],["linear inequality in one variable","bất phương trình bậc nhất một ẩn"],["solution set","tập nghiệm"],["less than or equal to","nhỏ hơn hoặc bằng"]],"quiz":[{"q":"Cho a < b. Khẳng định nào đúng?","opts":["−3a < −3b","a − 5 < b − 5","2a > 2b","a + 1 > b + 1"],"a":1,"why":"Cộng −5 vào hai vế giữ nguyên chiều. Nhân với −3 phải đổi chiều: −3a > −3b."},{"q":"Nghiệm của bất phương trình −4x + 8 ≤ 0 là:","opts":["x ≥ 2","x ≤ 2","x ≥ −2","x ≤ −2"],"a":0,"why":"−4x ≤ −8; chia hai vế cho −4 (số âm) nên đổi chiều: x ≥ 2."},{"q":"Bất phương trình nào là bất phương trình bậc nhất một ẩn?","opts":["0x + 3 > 0","x² − 1 < 0","5 − 2x ≥ 0","1/x + 2 > 0"],"a":2,"why":"5 − 2x ≥ 0 có dạng ax + b ≥ 0 với a = −2 ≠ 0. Còn 0x + 3 > 0 có a = 0 nên không phải."},{"q":"Số nguyên x lớn nhất thỏa mãn 3x + 1 < 14 là:","opts":["5","13","3","4"],"a":3,"why":"3x < 13 ⇒ x < 13/3 ≈ 4,33. Số nguyên lớn nhất nhỏ hơn 4,33 là 4."}]},{"id":"m9-03","subj":"math","grade":9,"chap":"Căn bậc hai và căn bậc ba","title":"Căn bậc hai, căn bậc ba và biến đổi biểu thức chứa căn","sum":"Căn bậc hai số học của a ≥ 0 là số không âm có bình phương bằng a; căn bậc ba của a là số có lập phương bằng a. Khai căn tích, thương, đưa thừa số ra ngoài dấu căn và trục căn ở mẫu giúp rút gọn biểu thức.","points":["Số dương a có hai căn bậc hai là √a và −√a; số 0 có căn bậc hai là 0; số âm không có.","√(A²) = |A|: khai căn một bình phương nhớ lấy giá trị tuyệt đối.","Căn thức bậc hai √A xác định khi A ≥ 0.","Khai căn tích, thương: √(ab) = √a·√b (a, b ≥ 0); √(a/b) = √a/√b (a ≥ 0, b > 0).","Đưa thừa số ra ngoài dấu căn: √(a²b) = |a|·√b (b ≥ 0); trục căn ở mẫu để mẫu không còn căn.","Mọi số thực có đúng một căn bậc ba: ∛8 = 2, ∛(−27) = −3."],"formulas":["√(A²) = |A|","√(AB) = √A·√B (A, B ≥ 0)","√(A/B) = √A/√B (A ≥ 0, B > 0)","(∛a)³ = ∛(a³) = a"],"viz":{"type":"numberline"},"vizNote":"Kéo điểm x sang trái và sang phải 0, quan sát |x|: dù x âm hay dương, √(x²) luôn bằng |x| ≥ 0.","memo":"“Căn chẵn đòi dương, căn lẻ chẳng ngại âm”: √ chỉ nhận số ≥ 0, còn ∛ nhận mọi số. Bình phương rồi khai căn thì khoác áo trị tuyệt đối.","example":{"q":"Rút gọn A = √50 − √18 + √8 và trục căn thức ở mẫu của 6/√3.","a":"√50 = √(25·2) = 5√2; √18 = √(9·2) = 3√2; √8 = √(4·2) = 2√2.\nA = 5√2 − 3√2 + 2√2 = 4√2.\n6/√3 = 6·√3/(√3·√3) = 6√3/3 = 2√3."},"terms":[["square root","căn bậc hai"],["principal square root","căn bậc hai số học"],["cube root","căn bậc ba"],["rationalize the denominator","trục căn thức ở mẫu"],["radical expression","biểu thức chứa căn"]],"quiz":[{"q":"Rút gọn √((3 − √10)²) được:","opts":["3 − √10","√10 − 3","3 + √10","−3 − √10"],"a":1,"why":"√(A²) = |A|; vì √10 ≈ 3,16 > 3 nên |3 − √10| = √10 − 3."},{"q":"Biểu thức √(2x − 6) xác định khi:","opts":["x > 3","x ≤ 3","x ≥ −3","x ≥ 3"],"a":3,"why":"Cần 2x − 6 ≥ 0 ⇒ x ≥ 3 (x = 3 vẫn được vì √0 = 0)."},{"q":"Giá trị của ∛(−64) + √49 là:","opts":["3","11","−11","Không xác định"],"a":0,"why":"∛(−64) = −4 vì (−4)³ = −64; √49 = 7; tổng là −4 + 7 = 3."},{"q":"Trục căn thức ở mẫu: 2/(√5 − √3) bằng:","opts":["√5 − √3","2(√5 + √3)","√5 + √3","(√5 + √3)/2"],"a":2,"why":"Nhân tử và mẫu với √5 + √3: mẫu = 5 − 3 = 2, nên được 2(√5 + √3)/2 = √5 + √3."}]},{"id":"m9-04","subj":"math","grade":9,"chap":"Hệ thức lượng trong tam giác vuông","title":"Tỉ số lượng giác của góc nhọn","sum":"Trong tam giác vuông, với góc nhọn α: sin = đối/huyền, cos = kề/huyền, tan = đối/kề, cot = kề/đối. Hai góc phụ nhau thì sin góc này bằng cos góc kia, tan góc này bằng cot góc kia.","points":["sin α = cạnh đối / cạnh huyền; cos α = cạnh kề / cạnh huyền.","tan α = cạnh đối / cạnh kề; cot α = cạnh kề / cạnh đối.","Với góc nhọn α: 0 < sin α < 1, 0 < cos α < 1 và tan α · cot α = 1.","α + β = 90° ⇒ sin α = cos β, cos α = sin β, tan α = cot β, cot α = tan β.","Góc đặc biệt: sin 30° = 1/2, sin 45° = √2/2, sin 60° = √3/2; tan 45° = 1.","Khi góc α tăng (0° < α < 90°): sin α, tan α tăng; cos α, cot α giảm."],"formulas":["sin α = đối/huyền; cos α = kề/huyền","tan α = đối/kề; cot α = kề/đối","sin α = cos(90° − α); tan α = cot(90° − α)","tan α · cot α = 1"],"viz":{"type":"trig"},"vizNote":"Kéo góc α: cạnh đối dài ra nên sin α và tan α tăng, còn cos α và cot α giảm; tại α = 45° thì sin α = cos α và tan α = cot α = 1.","memo":"“Sin đi học, Cos không hư, Tan đoàn kết, Cot kết đoàn”: sin = Đối/Huyền, cos = Kề/Huyền, tan = Đối/Kề, cot = Kề/Đối.","example":{"q":"Tam giác ABC vuông tại A có AB = 3 cm, AC = 4 cm. Tính các tỉ số lượng giác của góc B.","a":"BC = √(3² + 4²) = √25 = 5 (cm).\nVới góc B: cạnh đối là AC = 4, cạnh kề là AB = 3, cạnh huyền BC = 5.\nsin B = 4/5; cos B = 3/5; tan B = 4/3; cot B = 3/4.\n(Góc C phụ góc B nên sin C = cos B = 3/5.)"},"terms":[["trigonometric ratio","tỉ số lượng giác"],["acute angle","góc nhọn"],["hypotenuse","cạnh huyền"],["opposite side","cạnh đối"],["adjacent side","cạnh kề"]],"quiz":[{"q":"Tam giác vuông có cạnh huyền 10, cạnh đối của góc α bằng 6. cos α bằng:","opts":["0,6","0,75","0,8","4/3"],"a":2,"why":"Cạnh kề = √(10² − 6²) = √64 = 8, nên cos α = 8/10 = 0,8."},{"q":"sin 50° bằng:","opts":["cos 50°","cos 40°","sin 40°","tan 40°"],"a":1,"why":"50° và 40° là hai góc phụ nhau (tổng 90°) nên sin 50° = cos 40°."},{"q":"tan 60° bằng:","opts":["√3","√3/3","1/2","√3/2"],"a":0,"why":"Tam giác vuông có góc 60°: cạnh đối : cạnh kề = √3 : 1, nên tan 60° = √3."},{"q":"Khẳng định nào SAI với góc nhọn α?","opts":["0 < sin α < 1","tan α · cot α = 1","sin α = cos(90° − α)","cos α có thể lớn hơn 1"],"a":3,"why":"Cạnh kề luôn ngắn hơn cạnh huyền nên cos α < 1 với mọi góc nhọn α."}]},{"id":"m9-05","subj":"math","grade":9,"chap":"Hệ thức lượng trong tam giác vuông","title":"Hệ thức giữa cạnh và góc trong tam giác vuông","sum":"Trong tam giác vuông, mỗi cạnh góc vuông bằng cạnh huyền nhân sin góc đối (hay cos góc kề), hoặc bằng cạnh góc vuông kia nhân tan góc đối (hay cot góc kề). Hệ thức này dùng để giải tam giác vuông, đo chiều cao và khoảng cách.","points":["Tam giác ABC vuông tại A: BC = a là cạnh huyền, AC = b và AB = c là hai cạnh góc vuông.","Cạnh góc vuông = cạnh huyền × sin góc đối = cạnh huyền × cos góc kề.","Cạnh góc vuông = cạnh góc vuông kia × tan góc đối = cạnh góc vuông kia × cot góc kề.","Giải tam giác vuông: tìm mọi cạnh, góc khi biết 2 yếu tố (trong đó có ít nhất 1 cạnh).","Hai góc nhọn phụ nhau: B̂ + Ĉ = 90°.","Ứng dụng: đo chiều cao cây, tháp từ góc nâng và khoảng cách đến chân."],"formulas":["b = a·sin B = a·cos C","c = a·sin C = a·cos B","b = c·tan B = c·cot C","c = b·tan C = b·cot B"],"viz":{"type":"trig"},"vizNote":"Kéo góc α và đối chiếu: cạnh đối = cạnh huyền · sin α, cạnh kề = cạnh huyền · cos α, cạnh đối = cạnh kề · tan α.","memo":"“Huyền nhân sin đối, nhân cos kề; vuông nhân tan đối, nhân cot kề.”","example":{"q":"Một cái thang dài 4 m dựa vào tường, tạo với mặt đất góc 65°. Đầu thang cao bao nhiêu mét và chân thang cách tường bao xa (làm tròn đến 0,01 m)?","a":"Thang là cạnh huyền; chiều cao là cạnh đối của góc 65°, khoảng cách đến tường là cạnh kề.\nChiều cao: h = 4·sin 65° ≈ 4·0,9063 ≈ 3,63 (m).\nKhoảng cách: d = 4·cos 65° ≈ 4·0,4226 ≈ 1,69 (m)."},"terms":[["right triangle","tam giác vuông"],["leg","cạnh góc vuông"],["solve a right triangle","giải tam giác vuông"],["angle of elevation","góc nâng"]],"quiz":[{"q":"Tam giác ABC vuông tại A, BC = 12 cm, B̂ = 30°. Độ dài AC là:","opts":["6√3 cm","6 cm","12√3 cm","4√3 cm"],"a":1,"why":"AC đối diện góc B: AC = BC·sin B = 12·sin 30° = 12·1/2 = 6 cm."},{"q":"Tam giác ABC vuông tại A, AB = 5 cm, B̂ = 45°. Độ dài AC là:","opts":["5 cm","5√2 cm","10 cm","5√2/2 cm"],"a":0,"why":"AC = AB·tan B = 5·tan 45° = 5·1 = 5 cm (tam giác vuông cân)."},{"q":"Tam giác ABC vuông tại A có AB = 6, AC = 6√3. Góc B bằng:","opts":["30°","45°","60°","90°"],"a":2,"why":"tan B = AC/AB = 6√3/6 = √3 ⇒ B̂ = 60°."},{"q":"Đứng cách chân tháp 50 m, nhìn đỉnh tháp với góc nâng 60°. Chiều cao tháp là:","opts":["25 m","50√3/3 m ≈ 28,9 m","100 m","50√3 m ≈ 86,6 m"],"a":3,"why":"Chiều cao là cạnh đối, 50 m là cạnh kề: h = 50·tan 60° = 50√3 ≈ 86,6 m."}]},{"id":"m9-06","subj":"math","grade":9,"chap":"Đường tròn","title":"Góc ở tâm, góc nội tiếp và tứ giác nội tiếp","sum":"Góc ở tâm có đỉnh là tâm, số đo bằng số đo cung bị chắn; góc nội tiếp có đỉnh trên đường tròn, số đo bằng nửa số đo cung bị chắn. Tứ giác nội tiếp đường tròn có tổng hai góc đối bằng 180°.","points":["Góc ở tâm có đỉnh là tâm O; số đo cung nhỏ bằng số đo góc ở tâm chắn cung đó.","Góc nội tiếp có đỉnh nằm trên đường tròn và hai cạnh chứa hai dây cung.","Góc nội tiếp = ½ số đo cung bị chắn = ½ góc ở tâm cùng chắn cung đó.","Các góc nội tiếp cùng chắn một cung thì bằng nhau; chắn nửa đường tròn thì là góc vuông.","Tứ giác nội tiếp có 4 đỉnh cùng nằm trên một đường tròn; tổng hai góc đối bằng 180°.","Ngược lại: tứ giác có tổng hai góc đối bằng 180° thì nội tiếp được đường tròn."],"formulas":["∠AOB = sđ cung AB nhỏ (góc ở tâm)","∠ACB = ½·sđ cung AB (góc nội tiếp)","ABCD nội tiếp ⇔ ∠A + ∠C = 180°"],"viz":{"type":"circle","mode":"inscribed"},"vizNote":"Kéo điểm M chạy trên cung lớn: góc nội tiếp AMB không đổi và luôn bằng một nửa góc ở tâm AOB cùng chắn cung AB; đổi số đo cung AB để thấy cả hai góc cùng thay đổi.","memo":"“Ở tâm thì trọn, nội tiếp thì nửa”: đỉnh ở tâm lấy đủ số đo cung, đỉnh trên đường tròn chỉ lấy một nửa. Chắn nửa đường tròn ⇒ góc vuông.","example":{"q":"Cho đường tròn (O) có ∠AOB = 110°. Điểm C thuộc cung lớn AB, điểm D thuộc cung nhỏ AB. Tính ∠ACB và ∠ADB.","a":"∠ACB là góc nội tiếp chắn cung nhỏ AB (sđ 110°): ∠ACB = ½·110° = 55°.\nTứ giác ACBD nội tiếp, ∠ACB và ∠ADB là hai góc đối: ∠ADB = 180° − 55° = 125°.\nKiểm tra: ∠ADB chắn cung lớn AB = 360° − 110° = 250°, ½·250° = 125° ✓."},"terms":[["central angle","góc ở tâm"],["inscribed angle","góc nội tiếp"],["arc","cung"],["chord","dây cung"],["cyclic quadrilateral","tứ giác nội tiếp"]],"quiz":[{"q":"Góc nội tiếp chắn cung có số đo 80° thì bằng:","opts":["80°","160°","40°","20°"],"a":2,"why":"Góc nội tiếp bằng nửa số đo cung bị chắn: 80° : 2 = 40°."},{"q":"Tứ giác ABCD nội tiếp có ∠A = 70°, ∠B = 95°. Khi đó ∠C và ∠D lần lượt bằng:","opts":["110° và 85°","70° và 95°","85° và 110°","20° và 5°"],"a":0,"why":"Hai góc đối có tổng 180°: ∠C = 180° − 70° = 110°, ∠D = 180° − 95° = 85°."},{"q":"AB là đường kính của (O), C là điểm trên đường tròn (C khác A, B). Góc ACB bằng:","opts":["45°","60°","180°","90°"],"a":3,"why":"∠ACB là góc nội tiếp chắn nửa đường tròn (cung 180°) nên bằng 90°."},{"q":"Tứ giác nào sau đây luôn nội tiếp được đường tròn?","opts":["Hình thoi","Hình bình hành","Hình chữ nhật","Hình thang vuông"],"a":2,"why":"Hình chữ nhật có hai góc đối 90° + 90° = 180°. Các hình còn lại chỉ nội tiếp trong trường hợp đặc biệt."}]},{"id":"m9-07","subj":"math","grade":9,"chap":"Đường tròn","title":"Độ dài cung tròn, diện tích hình quạt tròn và hình vành khuyên","sum":"Đường tròn bán kính R có độ dài C = 2πR; cung n° dài l = πRn/180. Hình quạt tròn n° có diện tích S = πR²n/360; hình vành khuyên giữa hai đường tròn đồng tâm có S = π(R² − r²).","points":["Độ dài đường tròn (chu vi): C = 2πR = πd.","Cung n° chiếm n/360 đường tròn ⇒ độ dài cung l = πRn/180.","Diện tích hình tròn S = πR²; hình quạt tròn n°: S = πR²n/360 = l·R/2.","Hình vành khuyên là phần nằm giữa hai đường tròn đồng tâm bán kính R và r (R > r).","Diện tích hình vành khuyên: S = π(R² − r²)."],"formulas":["C = 2πR","l = πRn/180","S quạt = πR²n/360 = lR/2","S vành khuyên = π(R² − r²)"],"viz":{"type":"circle","mode":"arc"},"vizNote":"Kéo R và n°: l và S quạt tăng tỉ lệ thuận với n; tăng R gấp đôi thì l gấp đôi, còn diện tích hình quạt gấp bốn.","memo":"“Cả vòng nhân n/360”: l = 2πR · n/360, S = πR² · n/360 — chỉ cần nhớ chu vi và diện tích hình tròn.","example":{"q":"Một chiếc quạt giấy khi mở ra là hình quạt tròn bán kính 20 cm, góc 120°. Tính độ dài cung và diện tích mặt quạt (lấy π ≈ 3,14).","a":"l = πRn/180 = π·20·120/180 = 40π/3 ≈ 41,87 (cm).\nS = πR²n/360 = π·400·120/360 = 400π/3 ≈ 418,67 (cm²).\nKiểm tra: S = l·R/2 = (40π/3)·20/2 = 400π/3 ✓."},"terms":[["circumference","độ dài đường tròn"],["arc length","độ dài cung"],["sector","hình quạt tròn"],["annulus","hình vành khuyên"],["concentric circles","đường tròn đồng tâm"]],"quiz":[{"q":"Độ dài cung 90° của đường tròn bán kính 6 cm là:","opts":["6π cm","3π cm","9π cm","1,5π cm"],"a":1,"why":"l = πRn/180 = π·6·90/180 = 3π cm (một phần tư chu vi 12π)."},{"q":"Diện tích hình quạt tròn bán kính 4 cm, góc ở tâm 45° là:","opts":["2π cm²","4π cm²","π cm²","16π cm²"],"a":0,"why":"S = πR²n/360 = π·16·45/360 = 2π cm² (một phần tám hình tròn 16π)."},{"q":"Hình vành khuyên giới hạn bởi hai đường tròn đồng tâm bán kính 5 cm và 3 cm có diện tích:","opts":["4π cm²","2π cm²","34π cm²","16π cm²"],"a":3,"why":"S = π(R² − r²) = π(25 − 9) = 16π cm². Chú ý: không phải π(5 − 3)²."},{"q":"Tăng bán kính lên 3 lần, giữ nguyên số đo cung thì diện tích hình quạt tăng:","opts":["3 lần","6 lần","9 lần","27 lần"],"a":2,"why":"S = πR²n/360 tỉ lệ với R²; R gấp 3 ⇒ S gấp 3² = 9 lần."}]},{"id":"m9-08","subj":"math","grade":9,"chap":"Hàm số y = ax² và phương trình bậc hai một ẩn","title":"Hàm số y = ax² (a ≠ 0)","sum":"Đồ thị hàm số y = ax² (a ≠ 0) là một parabol đỉnh O, nhận trục Oy làm trục đối xứng. Nếu a > 0 parabol nằm phía trên trục hoành, nếu a < 0 parabol nằm phía dưới trục hoành.","points":["Đồ thị y = ax² là parabol đỉnh O(0; 0), nhận trục Oy làm trục đối xứng.","a > 0: đồ thị nằm phía trên trục Ox, O là điểm thấp nhất.","a < 0: đồ thị nằm phía dưới trục Ox, O là điểm cao nhất.","x và −x cho cùng giá trị y: hai điểm (x; y) và (−x; y) đối xứng nhau qua Oy.","|a| càng lớn thì parabol càng hẹp (càng khép về phía trục Oy).","Điểm M(x₀; y₀) thuộc đồ thị ⇔ y₀ = a·x₀²."],"formulas":["y = ax² (a ≠ 0)","M(x₀; y₀) ∈ (P) ⇔ y₀ = a·x₀²","Biết (P) qua M(x₀; y₀), x₀ ≠ 0 ⇒ a = y₀/x₀²"],"viz":{"type":"parabola","mode":"ax2"},"vizNote":"Kéo a: a > 0 parabol quay bề lõm lên trên, a < 0 quay xuống dưới; |a| càng lớn parabol càng hẹp, đỉnh luôn ở O.","memo":"“a dương thì cười ∪, a âm thì mếu ∩” — miệng parabol luôn mở về phía dấu của a.","example":{"q":"Cho hàm số y = ax². Tìm a biết đồ thị đi qua A(2; 8). Điểm B(−3; 18) có thuộc đồ thị không?","a":"A thuộc đồ thị ⇒ 8 = a·2² = 4a ⇒ a = 2, hàm số là y = 2x².\nThay x = −3: y = 2·(−3)² = 2·9 = 18.\nVậy B(−3; 18) thuộc đồ thị (B đối xứng với điểm (3; 18) qua Oy)."},"terms":[["parabola","parabol"],["vertex","đỉnh"],["axis of symmetry","trục đối xứng"],["graph of a function","đồ thị hàm số"]],"quiz":[{"q":"Cho y = −2x². Giá trị của y tại x = −3 là:","opts":["18","−18","36","12"],"a":1,"why":"(−3)² = 9, nên y = −2·9 = −18."},{"q":"Đồ thị hàm số y = ax² đi qua điểm (−2; 3). Giá trị của a là:","opts":["3/4","−3/2","3/2","−3/4"],"a":0,"why":"3 = a·(−2)² = 4a ⇒ a = 3/4."},{"q":"Đồ thị hàm số y = −0,5x² có đặc điểm nào?","opts":["Nằm phía trên trục Ox","Đi qua điểm (2; 2)","Đối xứng qua trục Ox","Nằm phía dưới trục Ox, đỉnh O là điểm cao nhất"],"a":3,"why":"a = −0,5 < 0 nên parabol nằm dưới Ox, đỉnh O cao nhất. Tại x = 2 thì y = −2, không phải 2."},{"q":"Hai điểm thuộc đồ thị y = 3x² có tung độ bằng 12. Hoành độ của chúng là:","opts":["4 và −4","√12 và −√12","2 và −2","0 và 4"],"a":2,"why":"3x² = 12 ⇒ x² = 4 ⇒ x = 2 hoặc x = −2 (hai điểm đối xứng qua Oy)."}]},{"id":"m9-09","subj":"math","grade":9,"chap":"Hàm số y = ax² và phương trình bậc hai một ẩn","title":"Phương trình bậc hai một ẩn và định lí Viète","sum":"Phương trình ax² + bx + c = 0 (a ≠ 0) được giải nhờ biệt thức Δ = b² − 4ac: Δ > 0 có hai nghiệm phân biệt, Δ = 0 có nghiệm kép, Δ < 0 vô nghiệm. Định lí Viète cho tổng và tích hai nghiệm mà không cần giải.","points":["Dạng tổng quát: ax² + bx + c = 0 với a ≠ 0.","Δ = b² − 4ac: Δ > 0 ⇒ 2 nghiệm phân biệt; Δ = 0 ⇒ nghiệm kép; Δ < 0 ⇒ vô nghiệm.","Công thức nghiệm: x = (−b ± √Δ)/(2a); nghiệm kép x₁ = x₂ = −b/(2a).","Khi b = 2b': dùng Δ' = b'² − ac và x = (−b' ± √Δ')/a cho gọn.","Viète: nếu có hai nghiệm thì x₁ + x₂ = −b/a và x₁·x₂ = c/a.","a + b + c = 0 ⇒ x₁ = 1, x₂ = c/a; a − b + c = 0 ⇒ x₁ = −1, x₂ = −c/a."],"formulas":["Δ = b² − 4ac","x₁,₂ = (−b ± √Δ)/(2a)","x₁ + x₂ = −b/a; x₁·x₂ = c/a","u + v = S, u·v = P ⇒ u, v là nghiệm của x² − Sx + P = 0"],"viz":{"type":"parabola","mode":"quadratic"},"vizNote":"Kéo b và c của y = x² + bx + c: khi Δ = b² − 4c đổi từ dương sang 0 rồi âm, số giao điểm với trục Ox (số nghiệm) đổi từ 2 sang 1 rồi 0.","memo":"“Δ dương hai nghiệm, Δ không nghiệm kép, Δ âm vô nghiệm.” Viète: “tổng là trừ b trên a, tích là c trên a”.","example":{"q":"Giải phương trình 2x² − 7x + 3 = 0 rồi kiểm tra bằng định lí Viète.","a":"a = 2, b = −7, c = 3.\nΔ = (−7)² − 4·2·3 = 49 − 24 = 25 > 0, √Δ = 5.\nx₁ = (7 + 5)/4 = 3; x₂ = (7 − 5)/4 = 1/2.\nViète: x₁ + x₂ = 7/2 = −b/a ✓; x₁·x₂ = 3/2 = c/a ✓."},"terms":[["quadratic equation","phương trình bậc hai"],["discriminant","biệt thức"],["double root","nghiệm kép"],["Vieta's formulas","định lí Viète"],["coefficient","hệ số"]],"quiz":[{"q":"Phương trình x² − 6x + 9 = 0 có:","opts":["Hai nghiệm phân biệt","Nghiệm kép x = 3","Nghiệm kép x = −3","Vô nghiệm"],"a":1,"why":"Δ = 36 − 36 = 0 ⇒ nghiệm kép x = −b/(2a) = 6/2 = 3. Thật vậy x² − 6x + 9 = (x − 3)²."},{"q":"Phương trình 3x² + 5x − 8 = 0 có nghiệm x₁ = 1. Nghiệm còn lại là:","opts":["8/3","−5/3","−8/3","5/3"],"a":2,"why":"a + b + c = 3 + 5 − 8 = 0 nên x₂ = c/a = −8/3."},{"q":"Phương trình x² − 5x + 2 = 0 có hai nghiệm x₁, x₂. Giá trị x₁² + x₂² là:","opts":["21","25","29","23"],"a":0,"why":"Δ = 17 > 0. x₁² + x₂² = (x₁ + x₂)² − 2x₁x₂ = 5² − 2·2 = 21."},{"q":"Hai số có tổng 7 và tích 12 là nghiệm của phương trình:","opts":["x² + 7x + 12 = 0","x² − 12x + 7 = 0","x² + 7x − 12 = 0","x² − 7x + 12 = 0"],"a":3,"why":"Hai số là nghiệm của x² − Sx + P = 0, tức x² − 7x + 12 = 0; đó là 3 và 4."}]},{"id":"m9-10","subj":"math","grade":9,"chap":"Một số hình khối trong thực tiễn","title":"Hình trụ, hình nón, hình cầu","sum":"Hình trụ, hình nón, hình cầu là các hình khối quen thuộc như lon nước, nón lá, quả bóng. Cần nhớ công thức diện tích xung quanh (diện tích mặt cầu) và thể tích của từng hình.","points":["Hình trụ bán kính đáy r, chiều cao h: Sxq = 2πrh, V = πr²h.","Diện tích toàn phần hình trụ = Sxq + 2 đáy = 2πrh + 2πr².","Hình nón bán kính đáy r, chiều cao h, đường sinh l: Sxq = πrl, V = (1/3)πr²h.","Trong hình nón: l² = r² + h² (định lí Pythagore).","Hình cầu bán kính R: diện tích mặt cầu S = 4πR², thể tích V = (4/3)πR³.","Nón và trụ cùng đáy, cùng chiều cao: V nón = 1/3 V trụ."],"formulas":["Trụ: Sxq = 2πrh; V = πr²h","Nón: Sxq = πrl; V = (1/3)πr²h","Cầu: S = 4πR²; V = (4/3)πR³","l² = r² + h²"],"viz":{"type":"solid","shape":"cylinder"},"vizNote":"Kéo r và h của hình trụ: tăng h gấp đôi thì V gấp đôi, nhưng tăng r gấp đôi thì V gấp bốn (vì V = πr²h).","memo":"“Nón bằng một phần ba trụ.” Diện tích đi với R², thể tích đi với R³: cầu có S = 4πR², V = (4/3)πR³.","example":{"q":"Một chiếc nón lá có bán kính đáy 20 cm, chiều cao 15 cm. Tính đường sinh, diện tích xung quanh và thể tích của nón (lấy π ≈ 3,14).","a":"Đường sinh: l = √(20² + 15²) = √(400 + 225) = √625 = 25 (cm).\nSxq = πrl = π·20·25 = 500π ≈ 1570 (cm²).\nV = (1/3)πr²h = (1/3)·π·400·15 = 2000π ≈ 6280 (cm³)."},"terms":[["cylinder","hình trụ"],["cone","hình nón"],["sphere","hình cầu"],["slant height","đường sinh"],["lateral surface area","diện tích xung quanh"]],"quiz":[{"q":"Hình trụ có bán kính đáy 3 cm, chiều cao 10 cm. Thể tích của nó là:","opts":["30π cm³","60π cm³","90π cm³","300π cm³"],"a":2,"why":"V = πr²h = π·9·10 = 90π cm³."},{"q":"Quả bóng hình cầu bán kính 6 cm có thể tích:","opts":["144π cm³","288π cm³","864π cm³","48π cm³"],"a":1,"why":"V = (4/3)πR³ = (4/3)·π·216 = 288π cm³. (144π cm² là diện tích mặt cầu.)"},{"q":"Hình nón có bán kính đáy 6 cm, chiều cao 8 cm. Diện tích xung quanh là:","opts":["48π cm²","96π cm²","80π cm²","60π cm²"],"a":3,"why":"l = √(6² + 8²) = 10 cm; Sxq = πrl = π·6·10 = 60π cm²."},{"q":"Cốc hình trụ và phễu hình nón có cùng đáy, cùng chiều cao. Đổ đầy phễu nước mấy lần thì đầy cốc?","opts":["2 lần","3 lần","4 lần","6 lần"],"a":1,"why":"V nón = (1/3)πr²h = 1/3 V trụ, nên cần 3 phễu nước."}]},{"id":"p7-01","subj":"phys","grade":7,"chap":"Tốc độ","title":"Tốc độ chuyển động","sum":"Tốc độ cho biết vật chuyển động nhanh hay chậm, bằng quãng đường đi được trong một đơn vị thời gian. Đơn vị thường dùng là m/s và km/h.","points":["Tốc độ = quãng đường đi được chia cho thời gian đi hết quãng đường đó.","Tốc độ càng lớn, vật chuyển động càng nhanh.","Đơn vị đo tốc độ trong hệ SI là m/s; trong giao thông hay dùng km/h.","1 m/s = 3,6 km/h: đổi m/s sang km/h thì nhân 3,6; đổi km/h sang m/s thì chia 3,6.","Trước khi tính phải đưa s và t về cùng hệ đơn vị: m với s, hoặc km với h."],"formulas":["v = s/t","s = v·t ; t = s/v","1 m/s = 3,6 km/h"],"viz":{"type":"motion"},"vizNote":"Kéo thanh trượt v và t: xe chạy trên đường, quãng đường s = v·t tăng khi tăng tốc độ hoặc tăng thời gian.","memo":"Tam giác “s ở trên, v và t ở dưới”: che đại lượng cần tìm là ra công thức. Đổi đơn vị nhớ số 3,6 vì 1 h = 3 600 s và 1 km = 1 000 m.","example":{"q":"Một xe máy đi quãng đường 54 km hết 1,5 h. Tính tốc độ của xe theo km/h và m/s.","a":"v = s/t = 54 km : 1,5 h = 36 km/h.\nĐổi sang m/s: 36 : 3,6 = 10 m/s.\nVậy v = 36 km/h = 10 m/s."},"terms":[["speed","tốc độ"],["distance","quãng đường"],["time","thời gian"],["metre per second (m/s)","mét trên giây"],["kilometre per hour (km/h)","kilômét trên giờ"]],"quiz":[{"q":"Đổi 72 km/h sang m/s.","opts":["259,2 m/s","7,2 m/s","20 m/s","72 m/s"],"a":2,"why":"Đổi km/h sang m/s thì chia cho 3,6: 72 : 3,6 = 20 m/s."},{"q":"Bạn An đi bộ 1,2 km hết 20 phút. Tốc độ của An là bao nhiêu?","opts":["1 m/s","0,06 m/s","6 m/s","60 m/s"],"a":0,"why":"1,2 km = 1 200 m; 20 phút = 1 200 s ⇒ v = 1 200 : 1 200 = 1 m/s (= 3,6 km/h)."},{"q":"Ô tô chạy đều với tốc độ 15 m/s trong 2 phút. Quãng đường ô tô đi được là","opts":["30 m","1,8 km","180 m","900 m"],"a":1,"why":"Đổi 2 phút = 120 s; s = v·t = 15 · 120 = 1 800 m = 1,8 km."},{"q":"Xe A chạy với tốc độ 10 m/s, xe B chạy với tốc độ 30 km/h. Xe nào nhanh hơn?","opts":["Xe B, vì 30 > 10","Hai xe nhanh như nhau","Không so sánh được vì khác đơn vị","Xe A, vì 10 m/s = 36 km/h > 30 km/h"],"a":3,"why":"Phải đổi về cùng đơn vị: 10 m/s · 3,6 = 36 km/h, lớn hơn 30 km/h."}]},{"id":"p7-02","subj":"phys","grade":7,"chap":"Tốc độ","title":"Đo tốc độ, đồ thị quãng đường – thời gian","sum":"Đo tốc độ bằng cách đo quãng đường và thời gian rồi tính v = s/t. Đồ thị quãng đường – thời gian cho biết vật đi nhanh, chậm hay đứng yên; tốc độ ảnh hưởng trực tiếp đến an toàn giao thông.","points":["Đo tốc độ: đo s bằng thước, đo t bằng đồng hồ bấm giây, rồi tính v = s/t.","Đo chính xác hơn: dùng đồng hồ đo thời gian hiện số nối với cổng quang điện.","Trên đường, cảnh sát giao thông dùng thiết bị “bắn tốc độ” (camera, súng đo tốc độ).","Đồ thị s–t: trục ngang là t, trục đứng là s; tốc độ không đổi ⇒ đồ thị là đoạn thẳng xiên.","Đoạn càng dốc ⇒ tốc độ càng lớn; đoạn nằm ngang ⇒ vật đứng yên.","Tốc độ càng cao, quãng đường dừng xe càng dài ⇒ không vượt tốc độ cho phép, giữ khoảng cách an toàn."],"formulas":["v = s/t (đọc s và t trên đồ thị)","v = (s₂ − s₁)/(t₂ − t₁)"],"viz":{"type":"motion"},"vizNote":"Thay đổi v rồi nhìn đồ thị s–t: v càng lớn đường thẳng càng dốc, v càng nhỏ đường càng thoải.","memo":"“Dốc đứng – chạy nhanh, nằm ngang – đứng im”: chỉ cần nhìn độ dốc của đồ thị s–t là biết vật nhanh hay chậm.","example":{"q":"Đồ thị s–t của một người đi xe đạp: từ 0 đến 2 h đi được 30 km; từ 2 h đến 3 h đồ thị nằm ngang; từ 3 h đến 4 h, s tăng từ 30 km lên 50 km. Mô tả chuyển động và tính tốc độ từng đoạn.","a":"Đoạn 1 (0 – 2 h): v₁ = 30 : 2 = 15 km/h.\nĐoạn 2 (2 – 3 h): s không đổi ⇒ người dừng nghỉ, v₂ = 0.\nĐoạn 3 (3 – 4 h): v₃ = (50 − 30) : (4 − 3) = 20 km/h.\nĐoạn 3 dốc hơn đoạn 1 nên người đi nhanh hơn."},"terms":[["distance–time graph","đồ thị quãng đường – thời gian"],["stopwatch","đồng hồ bấm giây"],["photogate","cổng quang điện"],["speed limit","tốc độ giới hạn"],["safe distance","khoảng cách an toàn"]],"quiz":[{"q":"Trên đồ thị s–t, đoạn thẳng song song với trục thời gian cho biết vật","opts":["chuyển động nhanh dần","đứng yên","chuyển động với tốc độ lớn nhất","chuyển động ngược chiều"],"a":1,"why":"Thời gian tăng mà s không đổi ⇒ vật không đi thêm quãng đường nào, tức là đứng yên."},{"q":"Đồ thị s–t là đường thẳng đi qua gốc toạ độ; tại t = 4 s thì s = 20 m. Tốc độ của vật là","opts":["80 m/s","0,2 m/s","16 m/s","5 m/s"],"a":3,"why":"v = s/t = 20 : 4 = 5 m/s."},{"q":"Muốn đo thật chính xác thời gian viên bi chạy qua một đoạn ngắn, nên dùng dụng cụ nào?","opts":["Đồng hồ đo thời gian hiện số nối với cổng quang điện","Đồng hồ treo tường","Thước cuộn","Nhiệt kế"],"a":0,"why":"Cổng quang điện tự bật, tắt đồng hồ khi vật đi qua nên sai số nhỏ hơn nhiều so với bấm tay."},{"q":"Camera đo được một ô tô chạy 25 m/s trên đoạn đường giới hạn 80 km/h. Ô tô có vi phạm không?","opts":["Không, vì 25 < 80","Có, vượt 10 km/h vì 25 m/s = 90 km/h","Có, vượt 55 km/h","Không, vì 25 m/s ≈ 69 km/h"],"a":1,"why":"25 · 3,6 = 90 km/h > 80 km/h ⇒ ô tô vượt quá tốc độ cho phép 10 km/h."}]},{"id":"p7-03","subj":"phys","grade":7,"chap":"Âm thanh","title":"Sóng âm và sự truyền âm","sum":"Âm do các vật dao động phát ra và lan truyền thành sóng âm qua chất rắn, lỏng, khí. Âm không truyền được trong chân không.","points":["Nguồn âm là vật dao động phát ra âm (dây đàn, mặt trống, dây thanh quản).","Sóng âm là dao động lan truyền trong môi trường, từ nguồn âm ra xung quanh.","Âm truyền được qua chất rắn, lỏng, khí; không truyền được trong chân không.","Tốc độ truyền âm: rắn > lỏng > khí (thép ≈ 6 000 m/s, nước ≈ 1 500 m/s, không khí ≈ 340 m/s).","Sóng âm truyền đến tai làm màng nhĩ dao động, nhờ đó ta nghe được âm."],"formulas":["s = v·t","v (không khí) ≈ 340 m/s"],"viz":{"type":"sound"},"vizNote":"Kéo thanh trượt tần số và biên độ: quan sát sóng âm là dao động lặp đi lặp lại, lan ra từ nguồn âm.","memo":"“Rắn – Lỏng – Khí: nhanh – vừa – chậm”; chân không thì im lặng tuyệt đối (ngoài vũ trụ không nghe được tiếng nổ).","example":{"q":"Thấy tia chớp, 3 s sau mới nghe tiếng sấm. Tốc độ âm trong không khí là 340 m/s. Chỗ sét đánh cách bạn bao xa?","a":"Ánh sáng truyền rất nhanh nên coi như thấy chớp ngay lúc sét đánh.\nQuãng đường âm truyền: s = v·t = 340 · 3 = 1 020 m.\nVậy chỗ sét đánh cách khoảng 1 020 m ≈ 1 km."},"terms":[["sound wave","sóng âm"],["vibration","dao động"],["sound source","nguồn âm"],["medium","môi trường (truyền âm)"],["vacuum","chân không"]],"quiz":[{"q":"Âm KHÔNG truyền được trong môi trường nào?","opts":["Nước","Tường bê tông","Không khí","Chân không"],"a":3,"why":"Âm cần môi trường vật chất (rắn, lỏng, khí) để truyền; chân không không có hạt nào để dao động."},{"q":"Sắp xếp tốc độ truyền âm từ lớn đến nhỏ:","opts":["Khí > lỏng > rắn","Rắn > lỏng > khí","Lỏng > rắn > khí","Như nhau trong mọi môi trường"],"a":1,"why":"Ví dụ: thép ≈ 6 000 m/s, nước ≈ 1 500 m/s, không khí ≈ 340 m/s."},{"q":"Thấy chớp 5 s sau mới nghe tiếng sấm. Chỗ sét đánh cách bạn khoảng (âm trong không khí 340 m/s)","opts":["68 m","850 m","1 700 m","3 400 m"],"a":2,"why":"s = v·t = 340 · 5 = 1 700 m."},{"q":"Áp tai xuống đường ray, ta nghe tiếng tàu sớm hơn nghe qua không khí vì","opts":["âm truyền trong thép nhanh hơn trong không khí","đường ray làm âm to hơn","không khí không truyền được âm","tai áp sát nên chỉ nghe rõ hơn chứ không sớm hơn"],"a":0,"why":"Âm truyền trong chất rắn (thép) nhanh hơn nhiều so với trong chất khí."}]},{"id":"p7-04","subj":"phys","grade":7,"chap":"Âm thanh","title":"Độ to và độ cao của âm","sum":"Độ to của âm phụ thuộc biên độ dao động; độ cao của âm phụ thuộc tần số dao động của nguồn âm.","points":["Biên độ dao động là độ lệch lớn nhất của vật so với vị trí cân bằng.","Biên độ càng lớn ⇒ âm càng to; độ to của âm đo bằng đêxiben (dB).","Tần số là số dao động vật thực hiện trong 1 giây; đơn vị là héc (Hz).","Tần số càng lớn ⇒ âm càng cao (bổng); tần số càng nhỏ ⇒ âm càng thấp (trầm).","Tai người nghe được âm từ 20 Hz đến 20 000 Hz; dưới 20 Hz là hạ âm, trên 20 000 Hz là siêu âm."],"formulas":["f = N/t (N: số dao động, t: thời gian tính bằng s)","1 Hz = 1 dao động trong 1 giây"],"viz":{"type":"sound"},"vizNote":"Tăng tần số: sóng dày hơn, âm cao hơn; tăng biên độ: sóng nhô cao hơn, âm to hơn.","memo":"“To nhờ Biên, Cao nhờ Tần”: gảy đàn mạnh thì tiếng to; dây căng hơn, ngắn hơn thì tần số lớn, tiếng bổng.","example":{"q":"Trong 10 s, cánh một con ong thực hiện 3 000 dao động. Tính tần số dao động và cho biết tai người có nghe được âm này không.","a":"f = N/t = 3 000 : 10 = 300 Hz.\nVì 20 Hz < 300 Hz < 20 000 Hz nên tai người nghe được tiếng vo ve của ong."},"terms":[["amplitude","biên độ"],["frequency","tần số"],["loudness","độ to"],["pitch","độ cao (của âm)"],["ultrasound","siêu âm"]],"quiz":[{"q":"Một con lắc thực hiện 40 dao động trong 20 s. Tần số của nó là bao nhiêu và tai người có nghe được âm nó phát ra không?","opts":["2 Hz, không nghe được (hạ âm)","800 Hz, nghe được","0,5 Hz, nghe được","2 Hz, nghe được"],"a":0,"why":"f = 40 : 20 = 2 Hz < 20 Hz ⇒ hạ âm, tai người không nghe được."},{"q":"Gảy cùng một dây đàn mạnh hơn thì","opts":["âm cao hơn vì tần số tăng","âm trầm hơn","âm to hơn vì biên độ dao động lớn hơn","âm nhỏ hơn"],"a":2,"why":"Gảy mạnh làm dây lệch xa hơn (biên độ lớn hơn) nên âm to hơn; dây không đổi nên độ cao gần như không đổi."},{"q":"Vật A dao động 500 lần trong 5 s, vật B dao động 3 000 lần trong 20 s. Vật nào phát âm cao hơn?","opts":["Vật A","Vật B","Hai vật như nhau","Không đủ dữ kiện"],"a":1,"why":"f_A = 500 : 5 = 100 Hz; f_B = 3 000 : 20 = 150 Hz ⇒ B có tần số lớn hơn nên âm cao hơn."},{"q":"Dơi phát ra âm có tần số 50 000 Hz. Âm này là","opts":["hạ âm","âm tai người nghe được","tiếng ồn","siêu âm"],"a":3,"why":"50 000 Hz > 20 000 Hz ⇒ siêu âm, tai người không nghe được."}]},{"id":"p7-05","subj":"phys","grade":7,"chap":"Âm thanh","title":"Phản xạ âm, chống ô nhiễm tiếng ồn","sum":"Âm gặp vật cản bị dội lại gọi là âm phản xạ. Hiểu sự phản xạ và hấp thụ âm giúp ta giải thích tiếng vang, đo khoảng cách và chống ô nhiễm tiếng ồn.","points":["Âm gặp vật cản bị dội ngược lại gọi là âm phản xạ.","Vật cứng, bề mặt nhẵn (tường gạch, kính, kim loại) phản xạ âm tốt.","Vật mềm, xốp, bề mặt gồ ghề (thảm, rèm, đệm mút) phản xạ âm kém, hấp thụ âm tốt.","Tiếng vang: nghe được âm phản xạ tách rời âm phát ra (đến tai chậm hơn ít nhất 1/15 s).","Đo độ sâu đáy biển bằng siêu âm: âm đi xuống rồi dội về nên độ sâu d = v·t/2.","Chống ồn: giảm độ to tại nguồn, ngăn đường truyền (cây xanh, tường cách âm), dùng vật liệu hấp thụ âm."],"formulas":["d = v·t/2 (t: thời gian âm đi và về)"],"viz":{"type":"sound"},"vizNote":"Giảm biên độ để thấy âm nhỏ đi: giảm độ to ngay tại nguồn là cách chống tiếng ồn hiệu quả nhất.","memo":"“Cứng – nhẵn dội lại, mềm – xốp nuốt vào”. Tính khoảng cách bằng âm phản xạ nhớ chia 2, vì âm đi một vòng: đi + về.","example":{"q":"Tàu phát siêu âm thẳng xuống đáy biển, sau 1,2 s nhận được âm phản xạ. Tốc độ âm trong nước biển là 1 500 m/s. Tính độ sâu của biển.","a":"Quãng đường âm đi cả đi lẫn về: s = v·t = 1 500 · 1,2 = 1 800 m.\nĐộ sâu bằng nửa quãng đường đó: d = 1 800 : 2 = 900 m."},"terms":[["echo","tiếng vang"],["reflection of sound","phản xạ âm"],["noise pollution","ô nhiễm tiếng ồn"],["soundproofing","cách âm"]],"quiz":[{"q":"Vật nào phản xạ âm TỐT nhất?","opts":["Rèm nhung","Đệm mút","Tấm kim loại phẳng","Thảm len"],"a":2,"why":"Vật cứng, có bề mặt nhẵn phản xạ âm tốt; rèm, đệm, thảm mềm và xốp nên hấp thụ âm."},{"q":"Bạn hét to trước một vách núi và nghe tiếng vang sau 2 s. Vách núi cách bạn bao xa? (âm trong không khí 340 m/s)","opts":["680 m","340 m","170 m","1 360 m"],"a":1,"why":"Âm đi và về mất 2 s ⇒ d = 340 · 2 : 2 = 340 m."},{"q":"Biện pháp nào chống ô nhiễm tiếng ồn bằng cách NGĂN ĐƯỜNG TRUYỀN âm?","opts":["Trồng nhiều cây xanh quanh trường học","Treo biển cấm bóp còi","Bảo dưỡng máy móc cho chạy êm","Vặn nhỏ âm lượng loa"],"a":0,"why":"Cây xanh chặn và làm phân tán âm trên đường truyền; ba cách còn lại làm giảm độ to ngay tại nguồn."},{"q":"Phòng thu âm thường dán mút xốp lên tường và trải thảm để","opts":["âm phản xạ mạnh hơn","hấp thụ âm, giảm âm phản xạ và tiếng vang","tăng tần số của âm","làm âm truyền nhanh hơn"],"a":1,"why":"Vật liệu mềm, xốp hấp thụ âm tốt nên giảm âm phản xạ, tiếng thu được rõ, không bị vang."}]},{"id":"p7-06","subj":"phys","grade":7,"chap":"Ánh sáng","title":"Ánh sáng, tia sáng và sự phản xạ ánh sáng","sum":"Ánh sáng là một dạng năng lượng, truyền theo đường thẳng và được biểu diễn bằng tia sáng. Khi gặp gương phẳng, ánh sáng phản xạ theo định luật: góc phản xạ bằng góc tới.","points":["Ánh sáng là một dạng năng lượng (pin mặt trời biến năng lượng ánh sáng thành điện năng).","Tia sáng: đường thẳng có mũi tên chỉ hướng truyền; chùm sáng có thể song song, hội tụ hoặc phân kì.","Sau vật cản sáng có vùng tối (không nhận ánh sáng) và vùng nửa tối (nhận một phần ánh sáng).","Định luật phản xạ: tia phản xạ nằm trong mặt phẳng chứa tia tới và pháp tuyến tại điểm tới.","Góc phản xạ bằng góc tới: i' = i (góc đo so với pháp tuyến, không phải so với mặt gương).","Mặt nhẵn ⇒ phản xạ gương; mặt gồ ghề ⇒ phản xạ khuếch tán (ánh sáng hắt ra mọi hướng)."],"formulas":["i' = i","i = 90° − (góc giữa tia tới và mặt gương)","góc giữa tia tới và tia phản xạ = i + i' = 2i"],"viz":{"type":"reflection"},"vizNote":"Kéo góc tới i: tia phản xạ luôn đối xứng với tia tới qua pháp tuyến, góc phản xạ i' = i.","memo":"“Tới bao nhiêu, phản bấy nhiêu” — nhưng nhớ đo góc từ PHÁP TUYẾN (đường vuông góc với gương), không đo từ mặt gương.","example":{"q":"Chiếu một tia sáng tới gương phẳng, tia tới hợp với mặt gương góc 30°. Tính góc tới, góc phản xạ và góc tạo bởi tia tới với tia phản xạ.","a":"Pháp tuyến vuông góc với gương ⇒ góc tới i = 90° − 30° = 60°.\nĐịnh luật phản xạ: i' = i = 60°.\nGóc giữa tia tới và tia phản xạ: i + i' = 60° + 60° = 120°."},"te
