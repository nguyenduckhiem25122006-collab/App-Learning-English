rms":[["light ray","tia sáng"],["reflection","sự phản xạ"],["angle of incidence","góc tới"],["angle of reflection","góc phản xạ"],["normal","pháp tuyến"]],"quiz":[{"q":"Tia tới hợp với mặt gương phẳng một góc 25°. Góc phản xạ bằng","opts":["25°","50°","65°","130°"],"a":2,"why":"Góc tới i = 90° − 25° = 65°; theo định luật phản xạ i' = i = 65°."},{"q":"Góc tạo bởi tia tới và tia phản xạ trên gương phẳng là 80°. Góc tới bằng","opts":["40°","80°","160°","10°"],"a":0,"why":"i + i' = 2i = 80° ⇒ i = 40°."},{"q":"Hiện tượng phản xạ khuếch tán xảy ra khi chiếu ánh sáng vào","opts":["gương soi","mặt nước phẳng lặng","tấm kim loại nhẵn bóng","tờ giấy trắng"],"a":3,"why":"Bề mặt tờ giấy gồ ghề (nhìn rõ dưới kính lúp) nên hắt ánh sáng ra mọi hướng."},{"q":"Phía sau vật cản sáng, vùng chỉ nhận được một phần ánh sáng từ nguồn sáng gọi là","opts":["vùng tối","vùng nửa tối","vùng sáng","vùng phản xạ"],"a":1,"why":"Vùng tối không nhận ánh sáng; vùng nửa tối nhận ánh sáng từ một phần của nguồn sáng."}]},{"id":"p7-07","subj":"phys","grade":7,"chap":"Ánh sáng","title":"Ảnh của vật tạo bởi gương phẳng","sum":"Gương phẳng tạo ảnh ảo, lớn bằng vật và đối xứng với vật qua mặt gương.","points":["Ảnh tạo bởi gương phẳng là ảnh ảo: không hứng được trên màn chắn.","Ảnh lớn bằng vật.","Khoảng cách từ ảnh đến gương bằng khoảng cách từ vật đến gương.","Ảnh và vật đối xứng nhau qua mặt gương ⇒ chữ nhìn trong gương bị đảo ngược trái – phải.","Vẽ ảnh của điểm S: lấy S' đối xứng với S qua gương; mọi tia phản xạ có đường kéo dài đi qua S'."],"formulas":["d' = d (ảnh – gương = vật – gương)","khoảng cách vật – ảnh = 2d","chiều cao ảnh = chiều cao vật"],"viz":{"type":"reflection"},"vizNote":"Đổi góc tới i: tia phản xạ luôn đối xứng với tia tới qua pháp tuyến; ảnh S' của điểm sáng S nằm sau gương, đối xứng với S qua mặt gương.","memo":"“Gương phẳng là gương công bằng”: ảnh ảo, bằng vật, cách gương đúng bằng vật — vật lùi 1 bước, ảnh cũng lùi 1 bước.","example":{"q":"Bạn Lan cao 1,6 m đứng cách gương phẳng treo thẳng đứng 1,5 m. a) Ảnh của Lan cao bao nhiêu, cách Lan bao xa? b) Lan tiến lại gần gương 0,5 m thì ảnh cách Lan bao xa?","a":"a) Ảnh lớn bằng vật: cao 1,6 m. Ảnh cách gương 1,5 m ⇒ cách Lan 1,5 + 1,5 = 3 m.\nb) Lan cách gương 1,5 − 0,5 = 1 m ⇒ ảnh cách gương 1 m ⇒ ảnh cách Lan 1 + 1 = 2 m."},"terms":[["plane mirror","gương phẳng"],["image","ảnh"],["virtual image","ảnh ảo"],["symmetric","đối xứng"]],"quiz":[{"q":"Ảnh của một vật tạo bởi gương phẳng có tính chất nào?","opts":["Ảnh thật, lớn hơn vật","Ảnh ảo, lớn bằng vật","Ảnh ảo, nhỏ hơn vật","Ảnh thật, hứng được trên màn"],"a":1,"why":"Gương phẳng luôn cho ảnh ảo (không hứng được trên màn), lớn bằng vật."},{"q":"Một vật đặt cách gương phẳng 40 cm. Khoảng cách giữa vật và ảnh của nó là","opts":["40 cm","20 cm","80 cm","160 cm"],"a":2,"why":"Ảnh cách gương 40 cm, ở phía sau gương ⇒ vật cách ảnh 40 + 40 = 80 cm."},{"q":"Bạn Nam đứng cách gương phẳng 2 m rồi lùi ra xa gương thêm 1 m. Lúc này ảnh cách Nam","opts":["6 m","3 m","4 m","5 m"],"a":0,"why":"Nam cách gương 3 m ⇒ ảnh cách gương 3 m ⇒ ảnh cách Nam 3 + 3 = 6 m."},{"q":"Bóng đèn treo cách mặt nước ao phẳng lặng 3 m (mặt nước coi như gương phẳng). Ảnh của đèn cách đèn bao nhiêu?","opts":["3 m","1,5 m","9 m","6 m"],"a":3,"why":"Ảnh nằm dưới mặt nước 3 m, đối xứng với đèn ⇒ cách đèn 3 + 3 = 6 m."}]},{"id":"p7-08","subj":"phys","grade":7,"chap":"Từ","title":"Nam châm, từ trường và la bàn","sum":"Nam châm có hai cực, hút các vật liệu từ và tạo ra từ trường xung quanh. Trái Đất cũng có từ trường nên kim la bàn luôn chỉ hướng Bắc – Nam.","points":["Nam châm có hai cực: cực Bắc (N) và cực Nam (S); bẻ đôi, mỗi mảnh vẫn có đủ hai cực.","Các cực cùng tên thì đẩy nhau, khác tên thì hút nhau.","Nam châm hút sắt, thép, niken, coban; không hút đồng, nhôm, nhựa, gỗ.","Quanh nam châm và quanh dòng điện có từ trường, tác dụng lực từ lên kim nam châm đặt trong đó.","Đường sức từ bên ngoài nam châm đi ra từ cực Bắc, đi vào cực Nam; chỗ đường sức dày thì từ trường mạnh.","Trái Đất là nam châm khổng lồ: cực Bắc địa lí gần cực Nam địa từ ⇒ kim la bàn chỉ hướng Bắc – Nam."],"formulas":["Cùng tên (N–N, S–S): đẩy · Khác tên (N–S): hút","Bên ngoài nam châm: đường sức từ đi từ N sang S"],"viz":{"type":"magnet"},"vizNote":"Kéo la bàn đi quanh thanh nam châm: kim luôn nằm dọc đường sức từ, cực Bắc của kim chỉ theo chiều đường sức (từ N sang S).","memo":"“Bắc ra – Nam vào” cho đường sức từ; “khác tên thì thương, cùng tên thì ghét” cho tương tác giữa hai cực.","example":{"q":"Một thanh nam châm bị mờ chữ ở hai đầu A và B. Dùng la bàn, làm sao biết đầu A là cực gì?","a":"Đưa đầu A lại gần cực Bắc của kim la bàn (đầu kim chỉ hướng Bắc).\nNếu cực Bắc của kim bị đẩy ra ⇒ A cùng tên ⇒ A là cực Bắc (N).\nNếu cực Bắc của kim bị hút lại ⇒ A khác tên ⇒ A là cực Nam (S), còn B là cực Bắc.\nCách khác: treo thanh nam châm tự do, đầu quay về hướng Bắc địa lí là cực Bắc."},"terms":[["magnet","nam châm"],["north pole / south pole","cực Bắc / cực Nam"],["magnetic field","từ trường"],["magnetic field line","đường sức từ"],["compass","la bàn"]],"quiz":[{"q":"Nam châm hút được vật nào sau đây?","opts":["Dây đồng","Thìa nhôm","Đinh sắt","Thước nhựa"],"a":2,"why":"Nam châm hút vật liệu từ như sắt, thép, niken, coban; đồng, nhôm, nhựa không bị hút."},{"q":"Đưa cực Nam của nam châm A lại gần cực Nam của nam châm B thì hai nam châm","opts":["đẩy nhau","hút nhau","không tương tác","hút nhau rồi dính chặt"],"a":0,"why":"Hai cực cùng tên (S – S) thì đẩy nhau."},{"q":"Bên ngoài thanh nam châm, đường sức từ có chiều","opts":["đi ra từ cực Nam, đi vào cực Bắc","đi ra từ cực Bắc, đi vào cực Nam","là các đường tròn quanh tâm nam châm","không có chiều xác định"],"a":1,"why":"Quy ước: bên ngoài nam châm, đường sức từ đi ra từ cực Bắc (N), đi vào cực Nam (S)."},{"q":"Đầu kim la bàn chỉ về hướng Bắc địa lí là cực nào của kim? Vì sao?","opts":["Cực Nam, vì bị cực Bắc địa từ hút","Cực Bắc, vì bị cực Bắc địa từ đẩy","Cực Nam, vì gần xích đạo hơn","Cực Bắc, vì gần Bắc địa lí là cực Nam địa từ, hút cực Bắc của kim"],"a":3,"why":"Khác tên thì hút: cực Nam địa từ (nằm gần Bắc địa lí) hút cực Bắc của kim la bàn."}]},{"id":"p8-01","subj":"phys","grade":8,"chap":"Khối lượng riêng và áp suất","title":"Khối lượng riêng","sum":"Khối lượng riêng cho biết khối lượng của một đơn vị thể tích chất: D = m/V. Mỗi chất có một khối lượng riêng xác định.","points":["Khối lượng riêng D là khối lượng của 1 đơn vị thể tích của chất: D = m/V.","Đơn vị: kg/m³ hoặc g/cm³; 1 g/cm³ = 1000 kg/m³.","Mỗi chất có một D riêng: nước 1000 kg/m³, nhôm 2700 kg/m³, sắt 7800 kg/m³.","Đo D: dùng cân đo m, dùng bình chia độ (hoặc đo kích thước) để có V, rồi lấy m chia V.","Cắt nhỏ vật thì m và V cùng giảm, nên D của chất không đổi.","Trọng lượng riêng d = 10·D (N/m³); nước có d = 10 000 N/m³."],"formulas":["D = m/V","m = D·V ; V = m/D","1 g/cm³ = 1000 kg/m³","d = 10·D"],"viz":{"type":"density"},"vizNote":"Kéo m và V: quan sát D = m/V thay đổi; khối hộp chìm khi D > 1 g/cm³ và nổi khi D < 1 g/cm³.","memo":"“Mờ trên Vờ”: D = m/V, khối lượng chia thể tích. Đổi g/cm³ sang kg/m³ thì nhân 1000 (nước: 1 g/cm³ = 1000 kg/m³).","example":{"q":"Một khối nhôm có khối lượng 540 g và thể tích 200 cm³. Tính khối lượng riêng của nhôm theo g/cm³ và kg/m³.","a":"Tóm tắt: m = 540 g; V = 200 cm³.\nD = m/V = 540 : 200 = 2,7 g/cm³.\nĐổi: 2,7 g/cm³ = 2,7 · 1000 = 2700 kg/m³.\nĐáp số: D = 2,7 g/cm³ = 2700 kg/m³."},"terms":[["density","khối lượng riêng"],["mass","khối lượng"],["volume","thể tích"],["specific weight","trọng lượng riêng"]],"quiz":[{"q":"Một vật có khối lượng 2 kg và thể tích 0,0025 m³. Khối lượng riêng của vật là bao nhiêu?","opts":["8000 kg/m³","800 kg/m³","80 kg/m³","0,005 kg/m³"],"a":1,"why":"D = m/V = 2 : 0,0025 = 800 kg/m³."},{"q":"Khối lượng của 2 lít nước (D = 1000 kg/m³) là bao nhiêu?","opts":["0,2 kg","20 kg","2 kg","2000 kg"],"a":2,"why":"2 lít = 2 dm³ = 0,002 m³; m = D·V = 1000 · 0,002 = 2 kg."},{"q":"Cắt đôi một thanh sắt. Khối lượng riêng của mỗi nửa thanh thay đổi thế nào?","opts":["Giảm một nửa","Tăng gấp đôi","Không đổi"],"a":2,"why":"m và V cùng giảm một nửa nên D = m/V giữ nguyên; D chỉ phụ thuộc chất làm vật."},{"q":"Khối lượng riêng của sắt là 7,8 g/cm³. Đổi ra kg/m³ được bao nhiêu?","opts":["78 kg/m³","780 kg/m³","78 000 kg/m³","7800 kg/m³"],"a":3,"why":"1 g/cm³ = 1000 kg/m³ nên 7,8 g/cm³ = 7,8 · 1000 = 7800 kg/m³."}]},{"id":"p8-02","subj":"phys","grade":8,"chap":"Khối lượng riêng và áp suất","title":"Áp suất trên một bề mặt","sum":"Áp suất là độ lớn của áp lực trên một đơn vị diện tích bị ép: p = F/S. Muốn tăng áp suất thì tăng lực hoặc giảm diện tích bị ép.","points":["Áp lực là lực ép có phương vuông góc với mặt bị ép.","Áp suất là độ lớn áp lực trên một đơn vị diện tích bị ép: p = F/S.","Đơn vị áp suất là pascal (Pa): 1 Pa = 1 N/m².","Tăng áp suất: tăng F hoặc giảm S (mài dao sắc, đinh có mũi nhọn).","Giảm áp suất: giảm F hoặc tăng S (xe tăng có bánh xích, móng nhà xây rộng).","Vật đặt trên mặt nằm ngang có áp lực bằng trọng lượng: F = P = 10·m."],"formulas":["p = F/S","1 Pa = 1 N/m²","1 cm² = 0,0001 m²","P = 10·m"],"viz":{"type":"pressure","mode":"solid"},"vizNote":"Kéo F và S: F tăng hoặc S giảm thì p tăng, viên gạch lún sâu hơn vào cát.","memo":"Áp suất là một “phép chia”: lực càng to, mặt ép càng nhỏ ⇒ lún càng sâu. Đinh nhọn đâm dễ, ván rộng đỡ lún.","example":{"q":"Một thùng hàng khối lượng 60 kg đặt trên sàn nằm ngang, diện tích mặt tiếp xúc là 0,4 m². Tính áp suất thùng hàng tác dụng lên sàn.","a":"Áp lực bằng trọng lượng: F = P = 10·m = 10 · 60 = 600 N.\nÁp suất: p = F/S = 600 : 0,4 = 1500 Pa.\nĐáp số: p = 1500 Pa (= 1500 N/m²)."},"terms":[["pressure","áp suất"],["normal force","áp lực (lực ép vuông góc)"],["surface area","diện tích bề mặt"],["pascal (Pa)","pascal – đơn vị áp suất"]],"quiz":[{"q":"Một người nặng 50 kg đứng trên hai bàn chân, tổng diện tích tiếp xúc với sàn là 0,025 m². Áp suất người đó tác dụng lên sàn là?","opts":["2000 Pa","20 000 Pa","12,5 Pa","200 000 Pa"],"a":1,"why":"F = 10·50 = 500 N; p = F/S = 500 : 0,025 = 20 000 Pa."},{"q":"Vì sao lưỡi dao cần được mài sắc?","opts":["Để giảm áp lực lên vật cắt","Để giảm diện tích bị ép, làm tăng áp suất","Để tăng diện tích bị ép","Để dao nhẹ hơn"],"a":1,"why":"Lưỡi sắc có S rất nhỏ, cùng lực F thì p = F/S lớn, dễ cắt vật."},{"q":"Một lực 20 N ép vuông góc lên diện tích 4 cm². Áp suất gây ra là bao nhiêu?","opts":["5 Pa","80 Pa","500 Pa","50 000 Pa"],"a":3,"why":"4 cm² = 0,0004 m²; p = 20 : 0,0004 = 50 000 Pa. Nhớ đổi cm² ra m² trước khi chia."},{"q":"Một viên gạch có thể đặt nằm, nghiêng hoặc dựng đứng trên sàn. Cách đặt nào gây áp suất lên sàn lớn nhất?","opts":["Dựng đứng (mặt tiếp xúc nhỏ nhất)","Đặt nằm (mặt tiếp xúc lớn nhất)","Như nhau vì trọng lượng không đổi"],"a":0,"why":"F = P không đổi, S nhỏ nhất khi dựng đứng nên p = F/S lớn nhất."}]},{"id":"p8-03","subj":"phys","grade":8,"chap":"Khối lượng riêng và áp suất","title":"Áp suất chất lỏng. Áp suất khí quyển","sum":"Chất lỏng gây áp suất theo mọi phương, càng xuống sâu áp suất càng lớn: p = d·h. Lớp không khí bao quanh Trái Đất gây ra áp suất khí quyển.","points":["Chất lỏng gây áp suất theo mọi phương lên đáy bình, thành bình và các vật trong lòng nó.","Áp suất chất lỏng tăng theo độ sâu: p = d·h (d: trọng lượng riêng chất lỏng, h: độ sâu).","Các điểm cùng độ sâu trong một chất lỏng đứng yên có áp suất bằng nhau (bình thông nhau).","Áp suất tác dụng lên chất lỏng được truyền nguyên vẹn theo mọi hướng (máy nén thủy lực).","Không khí bao quanh Trái Đất gây áp suất khí quyển theo mọi phương, khoảng 76 cmHg ≈ 10⁵ Pa.","Ví dụ áp suất khí quyển: hút sữa bằng ống hút, giác mút dính vào tường, ù tai khi lên cao."],"formulas":["p = d·h","d(nước) = 10 000 N/m³","p₀ ≈ 76 cmHg ≈ 10⁵ Pa"],"viz":{"type":"pressure","mode":"liquid"},"vizNote":"Kéo độ sâu h: người thợ lặn xuống sâu hơn, áp suất p = d·h tăng tỉ lệ thuận với h.","memo":"“Càng sâu càng nén”: p = d·h. Cứ xuống thêm 10 m nước, áp suất tăng 100 000 Pa ≈ 1 lần áp suất khí quyển.","example":{"q":"Một thợ lặn ở độ sâu 12 m dưới mặt hồ (d = 10 000 N/m³). Tính áp suất do nước gây ra tại đó. Nếu lặn sâu thêm 3 m thì áp suất là bao nhiêu?","a":"Ở độ sâu 12 m: p = d·h = 10 000 · 12 = 120 000 Pa.\nSâu thêm 3 m ⇒ h = 15 m: p = 10 000 · 15 = 150 000 Pa.\nVậy áp suất tăng thêm 30 000 Pa."},"terms":[["liquid pressure","áp suất chất lỏng"],["atmospheric pressure","áp suất khí quyển"],["depth","độ sâu"],["communicating vessels","bình thông nhau"],["hydraulic press","máy nén thủy lực"]],"quiz":[{"q":"Tính áp suất của nước tại điểm A sâu 2,5 m dưới mặt nước (d = 10 000 N/m³).","opts":["2500 Pa","4000 Pa","25 000 Pa","250 000 Pa"],"a":2,"why":"p = d·h = 10 000 · 2,5 = 25 000 Pa."},{"q":"Áp suất của nước tại đáy một bể là 18 000 Pa. Nước trong bể sâu bao nhiêu?","opts":["1,8 m","18 m","0,18 m","180 m"],"a":0,"why":"h = p/d = 18 000 : 10 000 = 1,8 m."},{"q":"Vì sao thân đập thủy điện được xây dày dần về phía chân đập?","opts":["Vì nước ở dưới lạnh hơn","Vì càng sâu, áp suất nước càng lớn","Để chống gió thổi","Vì chân đập chịu áp suất khí quyển lớn hơn"],"a":1,"why":"p = d·h tăng theo độ sâu nên phần dưới của đập chịu áp suất lớn nhất, phải làm dày hơn."},{"q":"Hiện tượng nào chứng tỏ có áp suất khí quyển?","opts":["Thả hòn đá thì nó chìm xuống nước","Thanh sắt dài ra khi bị nung nóng","Lá cây rơi xuống đất","Hút hết sữa trong hộp giấy, vỏ hộp bị bẹp lại"],"a":3,"why":"Khi hút, áp suất trong hộp giảm; áp suất khí quyển bên ngoài lớn hơn nên ép bẹp vỏ hộp."}]},{"id":"p8-04","subj":"phys","grade":8,"chap":"Khối lượng riêng và áp suất","title":"Lực đẩy Archimedes. Vật nổi, vật chìm","sum":"Chất lỏng đẩy vật nhúng trong nó một lực hướng lên FA = d·V. So sánh FA với trọng lượng P (hay d vật với d chất lỏng) để biết vật nổi hay chìm.","points":["Vật nhúng trong chất lỏng bị đẩy thẳng đứng từ dưới lên bởi lực đẩy Archimedes.","FA = d·V: d là trọng lượng riêng chất lỏng, V là thể tích phần chất lỏng bị vật chiếm chỗ.","Vật chìm khi P > FA, nổi lên khi P < FA, lơ lửng khi P = FA.","So sánh nhanh: d vật > d lỏng ⇒ chìm; d vật < d lỏng ⇒ nổi; bằng nhau ⇒ lơ lửng.","Vật nổi trên mặt thoáng thì FA = P và V chỉ là thể tích phần chìm.","Đo FA bằng lực kế: FA = số chỉ trong không khí − số chỉ khi nhúng chìm trong chất lỏng."],"formulas":["FA = d·V","P = 10·m","Vật nổi trên mặt: FA = P","d = 10·D"],"viz":{"type":"density"},"vizNote":"Kéo m và V: D vật > 1 g/cm³ (P > FA) thì khối hộp chìm; D < 1 g/cm³ thì nó nổi, chỉ chìm một phần.","memo":"“Chiếm chỗ bao nhiêu, đẩy lên bấy nhiêu”: FA bằng trọng lượng phần chất lỏng bị vật chiếm chỗ.","example":{"q":"Một quả cầu sắt có thể tích 200 cm³ được nhúng chìm hoàn toàn trong nước (d = 10 000 N/m³; D sắt = 7800 kg/m³). Tính FA và cho biết quả cầu nổi hay chìm.","a":"Đổi V = 200 cm³ = 0,0002 m³.\nFA = d·V = 10 000 · 0,0002 = 2 N.\nKhối lượng: m = D·V = 7800 · 0,0002 = 1,56 kg ⇒ P = 10·m = 15,6 N.\nP = 15,6 N > FA = 2 N ⇒ quả cầu chìm."},"terms":[["buoyant force","lực đẩy Archimedes"],["float","nổi"],["sink","chìm"],["displaced volume","thể tích chất lỏng bị chiếm chỗ"]],"quiz":[{"q":"Một vật có thể tích 300 cm³ được nhúng chìm hoàn toàn trong nước. Lực đẩy Archimedes tác dụng lên vật là?","opts":["3000 N","30 N","3 N","0,3 N"],"a":2,"why":"V = 300 cm³ = 0,0003 m³; FA = d·V = 10 000 · 0,0003 = 3 N."},{"q":"Treo vật vào lực kế, ngoài không khí lực kế chỉ 4 N; nhúng chìm vật trong nước lực kế chỉ 2,5 N. Lực đẩy Archimedes là?","opts":["1,5 N","6,5 N","2,5 N","4 N"],"a":0,"why":"FA = 4 − 2,5 = 1,5 N: lực kế chỉ ít đi đúng bằng lực nước đẩy lên."},{"q":"Lực đẩy Archimedes lên một vật chìm hẳn trong nước là 1,5 N. Thể tích của vật là?","opts":["15 cm³","150 cm³","1500 cm³","0,15 cm³"],"a":1,"why":"V = FA/d = 1,5 : 10 000 = 0,00015 m³ = 150 cm³."},{"q":"Vì sao con tàu bằng thép nặng hàng nghìn tấn vẫn nổi trên mặt nước?","opts":["Vì thép nhẹ hơn nước","Vì sóng biển nâng tàu lên","Vì động cơ đẩy tàu lên","Vì tàu rỗng, chiếm chỗ rất nhiều nước nên FA đủ cân bằng trọng lượng"],"a":3,"why":"Thép nặng hơn nước, nhưng tàu rỗng nên V chiếm chỗ lớn, FA = d·V bằng được P của tàu."}]},{"id":"p8-05","subj":"phys","grade":8,"chap":"Tác dụng làm quay của lực","title":"Moment lực. Đòn bẩy","sum":"Lực có thể làm vật quay quanh một trục; tác dụng làm quay đo bằng moment lực M = F·d. Đòn bẩy cân bằng khi F₁·d₁ = F₂·d₂.","points":["Lực làm vật quay quanh trục khi giá của lực không song song và không đi qua trục quay.","Moment lực M = F·d, với d là khoảng cách từ trục quay đến giá của lực (cánh tay đòn).","Đơn vị moment lực là N·m; lực càng lớn, tay đòn càng dài thì tác dụng làm quay càng mạnh.","Đòn bẩy là thanh cứng quay quanh điểm tựa O; nó giúp đổi hướng lực hoặc được lợi về lực.","Đòn bẩy cân bằng khi F₁·d₁ = F₂·d₂; tay đòn của lực ta tác dụng dài hơn thì ta lợi về lực.","Ví dụ đòn bẩy: bập bênh, kéo cắt giấy, xà beng, xe cút kít, cần câu."],"formulas":["M = F·d","F₁·d₁ = F₂·d₂","F₁/F₂ = d₂/d₁"],"viz":{"type":"lever"},"vizNote":"Kéo hai quả nặng và khoảng cách đến điểm tựa: bập bênh nghiêng về phía có F·d lớn hơn, cân bằng khi F₁·d₁ = F₂·d₂.","memo":"“Lực nhân tay đòn ra moment”. Muốn đỡ tốn sức thì cầm xa điểm tựa: tay đòn dài gấp mấy lần, lực nhỏ đi bấy nhiêu lần.","example":{"q":"Trên bập bênh, An (30 kg) ngồi cách trục quay 1,5 m. Bình (45 kg) phải ngồi phía bên kia, cách trục bao xa để bập bênh cân bằng?","a":"F₁ = 10 · 30 = 300 N; d₁ = 1,5 m ⇒ M₁ = 300 · 1,5 = 450 N·m.\nF₂ = 10 · 45 = 450 N.\nCân bằng: F₂·d₂ = M₁ ⇒ d₂ = 450 : 450 = 1 m.\nBình ngồi cách trục 1 m (người nặng hơn ngồi gần trục hơn)."},"terms":[["moment of force (torque)","moment lực"],["lever","đòn bẩy"],["fulcrum (pivot)","điểm tựa"],["lever arm","cánh tay đòn"],["axis of rotation","trục quay"]],"quiz":[{"q":"Tay tác dụng lực 20 N vuông góc với cờ lê, cách trục ốc 0,25 m. Moment lực bằng bao nhiêu?","opts":["5 N·m","80 N·m","0,0125 N·m","20,25 N·m"],"a":0,"why":"M = F·d = 20 · 0,25 = 5 N·m."},{"q":"Dùng đòn bẩy nâng vật nặng 600 N đặt cách điểm tựa 0,2 m; tay ấn cách điểm tựa 1,2 m. Lực tay tối thiểu là?","opts":["3600 N","100 N","720 N","120 N"],"a":1,"why":"F₁·d₁ = F₂·d₂ ⇒ F = 600 · 0,2 : 1,2 = 100 N. Tay đòn dài gấp 6 lần nên lực nhỏ đi 6 lần."},{"q":"Vì sao tay nắm cửa được lắp ở mép xa bản lề?","opts":["Để cửa nhẹ hơn","Để giảm moment lực","Để tay đòn dài, chỉ cần lực nhỏ đã đủ moment làm cửa quay"],"a":2,"why":"M = F·d: d lớn thì cần F nhỏ mà vẫn có cùng moment."},{"q":"Đẩy cánh cửa bằng một lực có giá đi qua trục bản lề thì cửa sẽ thế nào?","opts":["Quay nhanh nhất","Quay ngược chiều","Quay chậm","Không quay vì d = 0 nên M = 0"],"a":3,"why":"Giá lực đi qua trục thì cánh tay đòn d = 0, moment M = F·0 = 0, không gây quay."}]},{"id":"p8-06","subj":"phys","grade":8,"chap":"Điện","title":"Nhiễm điện, dòng điện và mạch điện đơn giản","sum":"Cọ xát làm vật nhiễm điện do electron dịch chuyển. Dòng điện là dòng các hạt mang điện dịch chuyển có hướng, chạy trong mạch kín nối với nguồn điện.","points":["Cọ xát làm vật nhiễm điện: vật nhận thêm electron nhiễm điện âm, mất bớt electron nhiễm điện dương.","Có hai loại điện tích: cùng loại thì đẩy nhau, khác loại thì hút nhau.","Dòng điện là dòng các hạt mang điện dịch chuyển có hướng; trong kim loại đó là các electron.","Nguồn điện (pin, acquy) có hai cực (+) và (−), cung cấp dòng điện cho các thiết bị điện.","Chiều dòng điện quy ước: từ cực dương qua dây dẫn và thiết bị tới cực âm của nguồn.","Mạch kín gồm nguồn, dây nối, công tắc, thiết bị; công tắc ngắt hoặc dây đứt ⇒ mạch hở, không có dòng điện."],"formulas":["Cùng loại: đẩy nhau · Khác loại: hút nhau","Chiều quy ước: cực (+) → mạch ngoài → cực (−)"],"viz":{"type":"circuit","mode":"series"},"vizNote":"Kéo U của nguồn và R₁, R₂ của hai bóng đèn: mạch kín chỉ có một vòng nên dòng điện qua hai đèn như nhau; tăng U thì đèn sáng hơn.","memo":"“Cùng đẩy, khác hút”. Dòng điện “dương ra, âm về”; còn electron thì chạy ngược lại, từ cực âm sang cực dương.","example":{"q":"Cọ xát thanh nhựa vào mảnh vải khô, thanh nhựa nhiễm điện âm. a) Electron đã dịch chuyển thế nào? b) Mảnh vải nhiễm điện gì? c) Đưa thanh nhựa lại gần quả cầu nhiễm điện dương thì sao?","a":"a) Electron dịch chuyển từ mảnh vải sang thanh nhựa (thanh nhựa nhận thêm electron ⇒ âm).\nb) Mảnh vải mất bớt electron ⇒ nhiễm điện dương.\nc) Thanh nhựa (−) và quả cầu (+) nhiễm điện khác loại ⇒ hút nhau."},"terms":[["electric charge","điện tích"],["electric current","dòng điện"],["battery (power source)","pin (nguồn điện)"],["circuit","mạch điện"],["switch","công tắc"]],"quiz":[{"q":"Cọ xát thước nhựa vào len khô, thước nhựa nhiễm điện âm. Khi đó mảnh len","opts":["nhiễm điện âm","nhiễm điện dương","không nhiễm điện"],"a":1,"why":"Electron chuyển từ len sang thước; len mất electron nên nhiễm điện dương."},{"q":"Treo hai quả cầu nhỏ gần nhau, thấy chúng đẩy nhau. Kết luận nào đúng?","opts":["Hai quả cầu nhiễm điện cùng loại","Hai quả cầu nhiễm điện khác loại","Một quả cầu không nhiễm điện","Cả hai không nhiễm điện"],"a":0,"why":"Chỉ điện tích cùng loại mới đẩy nhau; khác loại, hoặc một vật trung hòa, thì hút nhau."},{"q":"Chiều dòng điện quy ước trong mạch ngoài là","opts":["từ cực âm qua thiết bị về cực dương","cùng chiều chuyển động của electron","từ cực dương qua thiết bị về cực âm"],"a":2,"why":"Quy ước: dòng điện đi từ cực (+) qua mạch ngoài về cực (−), ngược chiều electron."},{"q":"Đóng công tắc nhưng bóng đèn không sáng. Nguyên nhân có thể là gì?","opts":["Pin còn mới","Dây nối làm bằng đồng","Bóng đèn còn tốt","Có chỗ dây nối bị đứt nên mạch hở"],"a":3,"why":"Dòng điện chỉ chạy trong mạch kín; dây đứt làm mạch hở nên đèn không sáng."}]},{"id":"p8-07","subj":"phys","grade":8,"chap":"Điện","title":"Cường độ dòng điện, hiệu điện thế và tác dụng của dòng điện","sum":"Dòng điện có tác dụng nhiệt, phát sáng, từ, hóa học, sinh lí. Cường độ dòng điện (A) đo bằng ampe kế, hiệu điện thế (V) đo bằng vôn kế.","points":["Dòng điện có 5 tác dụng: nhiệt, phát sáng, từ, hóa học và sinh lí.","Cường độ dòng điện I cho biết độ mạnh yếu của dòng điện; đơn vị ampe (A), đo bằng ampe kế.","Hiệu điện thế U giữa hai đầu dụng cụ hay hai cực nguồn có đơn vị vôn (V), đo bằng vôn kế.","Ampe kế mắc nối tiếp, vôn kế mắc song song với dụng cụ cần đo; chốt (+) nối về phía cực dương nguồn.","Với cùng một bóng đèn, hiệu điện thế càng lớn thì cường độ dòng điện càng lớn, đèn càng sáng."],"formulas":["1 A = 1000 mA","1 V = 1000 mV","1 kV = 1000 V"],"viz":{"type":"circuit","mode":"ohm"},"vizNote":"Kéo U: cùng một bóng đèn, U tăng thì số chỉ ampe kế I tăng và đèn sáng hơn; thử đổi R để thấy I thay đổi theo.","memo":"“Ampe nối tiếp, Vôn song song”: ampe kế xếp hàng trong mạch, vôn kế đứng hai bên dụng cụ. 5 tác dụng: “Nhiệt – Sáng – Từ – Hóa – Sinh”.","example":{"q":"a) Đổi: 0,35 A = ? mA; 2500 mV = ? V; 0,22 kV = ? V.\nb) Bóng đèn ghi 6 V mắc vào nguồn 6 V, ampe kế chỉ 500 mA. Cường độ dòng điện qua đèn là bao nhiêu ampe?","a":"a) 0,35 A = 0,35 · 1000 = 350 mA.\n2500 mV = 2500 : 1000 = 2,5 V.\n0,22 kV = 0,22 · 1000 = 220 V.\nb) I = 500 mA = 500 : 1000 = 0,5 A."},"terms":[["electric current (I)","cường độ dòng điện"],["voltage (potential difference)","hiệu điện thế"],["ammeter","ampe kế"],["voltmeter","vôn kế"]],"quiz":[{"q":"Đổi 0,25 A ra miliampe (mA).","opts":["2500 mA","25 mA","250 mA","0,00025 mA"],"a":2,"why":"1 A = 1000 mA nên 0,25 A = 0,25 · 1000 = 250 mA."},{"q":"Muốn đo hiệu điện thế giữa hai đầu bóng đèn, ta mắc vôn kế như thế nào?","opts":["Nối tiếp với bóng đèn","Song song với bóng đèn","Ở chỗ nào trong mạch cũng được"],"a":1,"why":"Vôn kế mắc song song, hai chốt nối vào hai đầu dụng cụ cần đo hiệu điện thế."},{"q":"Mắc cùng một bóng đèn lần lượt vào nguồn 3 V rồi 6 V. Khi mắc vào nguồn 6 V thì","opts":["ampe kế chỉ số lớn hơn, đèn sáng hơn","ampe kế chỉ số nhỏ hơn, đèn tối hơn","đèn sáng như cũ"],"a":0,"why":"Với cùng một đèn, hiệu điện thế lớn hơn thì dòng điện mạnh hơn nên đèn sáng hơn."},{"q":"Mạ vàng cho đồ trang sức là ứng dụng tác dụng nào của dòng điện?","opts":["Tác dụng phát sáng","Tác dụng từ","Tác dụng sinh lí","Tác dụng hóa học"],"a":3,"why":"Dòng điện qua dung dịch muối kim loại làm kim loại bám lên vật: đó là tác dụng hóa học."}]},{"id":"p8-08","subj":"phys","grade":8,"chap":"Nhiệt","title":"Nội năng, truyền nhiệt và sự nở vì nhiệt","sum":"Nhiệt độ càng cao, phân tử chuyển động càng nhanh, nội năng càng lớn. Nhiệt truyền bằng dẫn nhiệt, đối lưu, bức xạ; các chất nở ra khi nóng lên.","points":["Các phân tử chuyển động không ngừng; nhiệt độ càng cao thì chúng chuyển động càng nhanh.","Nội năng là tổng động năng và thế năng của các phân tử tạo nên vật; vật nóng lên thì nội năng tăng.","Năng lượng nhiệt truyền từ vật nóng hơn sang vật lạnh hơn; đơn vị năng lượng là jun (J).","Dẫn nhiệt: chủ yếu ở chất rắn (kim loại dẫn tốt); đối lưu: ở chất lỏng và khí.","Bức xạ nhiệt: truyền nhiệt bằng tia nhiệt đi thẳng, xảy ra cả trong chân không (Mặt Trời → Trái Đất).","Các chất nở ra khi nóng lên, co lại khi lạnh đi; khí nở nhiều nhất, rắn nở ít nhất."],"formulas":["Nhiệt độ ↑ ⇒ phân tử chuyển động nhanh hơn ⇒ nội năng ↑","Nở vì nhiệt: khí > lỏng > rắn"],"viz":{"type":"heat"},"vizNote":"Kéo nhiệt độ: các phân tử chuyển động nhanh hơn (nội năng tăng), thanh kim loại dài ra và cột nhiệt kế dâng lên.","memo":"“Rắn dẫn – Lỏng, khí đối lưu – Chân không bức xạ”. Nở vì nhiệt: “Khí nở nhiều, rắn nở ít” — nên đường ray phải chừa khe hở.","example":{"q":"Một thanh ray thép dài 12 m. Khi nhiệt độ tăng 1 °C, mỗi mét thép dài thêm khoảng 0,012 mm. Nhiệt độ tăng từ 20 °C lên 50 °C thì thanh ray dài thêm bao nhiêu? Vì sao phải chừa khe hở giữa hai thanh ray?","a":"Độ tăng nhiệt độ: 50 − 20 = 30 °C.\nĐộ dài tăng thêm: 12 · 0,012 · 30 = 4,32 mm.\nNếu không chừa khe hở ≥ 4,32 mm, thanh ray nở ra bị cản sẽ gây lực rất lớn làm cong đường ray."},"terms":[["internal energy","nội năng"],["conduction","dẫn nhiệt"],["convection","đối lưu"],["thermal radiation","bức xạ nhiệt"],["thermal expansion","sự nở vì nhiệt"]],"quiz":[{"q":"Đun nước trong nồi, nhiệt truyền đi khắp khối nước chủ yếu bằng hình thức nào?","opts":["Dẫn nhiệt","Đối lưu","Bức xạ nhiệt"],"a":1,"why":"Nước nóng ở đáy nhẹ hơn nổi lên, nước lạnh chìm xuống tạo dòng đối lưu."},{"q":"Năng lượng nhiệt từ Mặt Trời truyền đến Trái Đất bằng hình thức nào?","opts":["Dẫn nhiệt","Đối lưu","Bức xạ nhiệt"],"a":2,"why":"Giữa Mặt Trời và Trái Đất phần lớn là chân không; chỉ bức xạ nhiệt truyền được qua chân không."},{"q":"Khi đun nóng một vật rắn, đại lượng nào của vật tăng lên?","opts":["Khối lượng","Khối lượng riêng","Số phân tử","Nội năng và thể tích"],"a":3,"why":"Phân tử chuyển động nhanh hơn nên nội năng tăng, vật nở ra; m không đổi nên D = m/V giảm."},{"q":"Thanh nhôm dài 2 m; mỗi mét nhôm dài thêm 0,024 mm khi tăng 1 °C. Nung từ 20 °C lên 70 °C thì thanh dài thêm bao nhiêu?","opts":["2,4 mm","1,2 mm","0,048 mm","24 mm"],"a":0,"why":"Tăng 50 °C: 2 · 0,024 · 50 = 2,4 mm."}]},{"id":"p9-01","subj":"phys","grade":9,"chap":"Năng lượng cơ học","title":"Động năng, thế năng, cơ năng","sum":"Vật chuyển động có động năng, vật ở trên cao có thế năng trọng trường; tổng của chúng là cơ năng, được bảo toàn khi bỏ qua ma sát và sức cản.","points":["Động năng là năng lượng vật có do chuyển động: Wđ = ½·m·v².","Tốc độ tăng gấp đôi thì động năng tăng gấp 4 (vì v được bình phương).","Thế năng trọng trường: Wt = P·h = 10·m·h, với h là độ cao so với mốc chọn (thường là mặt đất).","Cơ năng W = Wđ + Wt; cả ba đại lượng đều đo bằng jun (J).","Bỏ qua ma sát, cơ năng bảo toàn: thế năng giảm bao nhiêu thì động năng tăng bấy nhiêu và ngược lại."],"formulas":["Wđ = ½·m·v²  (m: kg, v: m/s, Wđ: J)","Wt = P·h = 10·m·h  (h: m)","W = Wđ + Wt = hằng số (bỏ qua ma sát)"],"viz":{"type":"energy"},"vizNote":"Kéo quả bóng lên xuống trên dốc: khi Wt giảm thì Wđ tăng đúng bấy nhiêu, còn tổng cơ năng W không đổi.","memo":"“Động – chạy, Thế – cao, Cơ – cộng vào.” Nhanh gấp đôi thì động năng gấp bốn.","example":{"q":"Thả rơi quả bóng 0,5 kg từ độ cao 5 m so với mặt đất (bỏ qua sức cản). a) Tính cơ năng của bóng. b) Tốc độ của bóng ngay trước khi chạm đất?","a":"Chọn mốc thế năng tại mặt đất.\na) Lúc thả: v = 0 ⇒ Wđ = 0; Wt = 10·m·h = 10·0,5·5 = 25 J ⇒ W = 25 J.\nb) Chạm đất: h = 0 ⇒ Wt = 0, nên Wđ = W = 25 J.\n½·0,5·v² = 25 ⇒ v² = 100 ⇒ v = 10 m/s."},"terms":[["kinetic energy","động năng"],["potential energy","thế năng"],["mechanical energy","cơ năng"],["conservation of energy","bảo toàn năng lượng"]],"quiz":[{"q":"Ô tô khối lượng 1 000 kg chạy với tốc độ 10 m/s. Động năng của ô tô là","opts":["5 000 J","10 000 J","50 000 J","100 000 J"],"a":2,"why":"Wđ = ½·m·v² = ½·1 000·10² = 50 000 J."},{"q":"Tốc độ của một vật tăng gấp 3 lần (khối lượng không đổi) thì động năng của vật","opts":["Tăng 9 lần","Tăng 3 lần","Tăng 6 lần","Không đổi"],"a":0,"why":"Wđ tỉ lệ với v², nên v gấp 3 thì Wđ gấp 3² = 9 lần."},{"q":"Vật 1 kg rơi từ độ cao 6 m (mốc thế năng ở mặt đất, bỏ qua sức cản). Khi vật ở độ cao 2 m, động năng của vật là","opts":["20 J","60 J","80 J","40 J"],"a":3,"why":"W = 10·1·6 = 60 J. Ở 2 m: Wt = 10·1·2 = 20 J ⇒ Wđ = 60 − 20 = 40 J."},{"q":"Quả lắc dao động, bỏ qua ma sát. Ở vị trí thấp nhất thì","opts":["Thế năng lớn nhất, động năng bằng 0","Động năng lớn nhất, thế năng nhỏ nhất","Cơ năng lớn nhất","Động năng và thế năng đều bằng 0"],"a":1,"why":"Thấp nhất ⇒ h nhỏ nhất nên Wt nhỏ nhất; cơ năng không đổi nên Wđ lớn nhất (quả lắc đi nhanh nhất)."}]},{"id":"p9-02","subj":"phys","grade":9,"chap":"Năng lượng cơ học","title":"Công và công suất","sum":"Lực sinh công khi làm vật dịch chuyển theo phương của lực; công suất cho biết công được thực hiện nhanh hay chậm.","points":["Công cơ học A = F·s khi lực F làm vật dịch chuyển quãng đường s theo phương của lực.","Đơn vị công là jun (J): 1 J = 1 N·m; 1 kJ = 1 000 J.","Vật không dịch chuyển, hoặc lực vuông góc với phương dịch chuyển, thì lực không sinh công.","Nâng vật lên cao h: A = P·h = 10·m·h, đúng bằng phần thế năng vật nhận thêm.","Công suất P = A/t là công thực hiện trong một đơn vị thời gian.","Đơn vị công suất là oát (W): 1 W = 1 J/s; 1 kW = 1 000 W; 1 HP ≈ 746 W."],"formulas":["A = F·s  (F: N, s: m, A: J)","A = 10·m·h  (nâng vật lên cao h)","P = A/t  (P: công suất, W; t: s)"],"viz":{"type":"energy"},"vizNote":"Kéo quả bóng lên cao: công nâng vật bằng phần thế năng tăng thêm 10·m·h; thả xuống, trọng lực sinh công biến Wt thành Wđ.","memo":"“Công = Lực × Đường, Suất = Công ÷ Giờ.” Cùng một việc, ai xong trước thì công suất lớn hơn.","example":{"q":"Cần cẩu nâng thùng hàng 500 kg lên cao 12 m trong 20 s. Tính công và công suất của cần cẩu.","a":"Lực nâng bằng trọng lượng: F = 10·m = 10·500 = 5 000 N.\nCông: A = F·s = 5 000·12 = 60 000 J = 60 kJ.\nCông suất: P = A/t = 60 000 : 20 = 3 000 W = 3 kW."},"terms":[["work","công (cơ học)"],["power","công suất"],["joule","jun"],["watt","oát"]],"quiz":[{"q":"Kéo thùng hàng bằng lực 200 N làm nó dịch chuyển 15 m theo phương của lực. Công của lực kéo là","opts":["215 J","3 000 J","1 500 J","30 000 J"],"a":1,"why":"A = F·s = 200·15 = 3 000 J."},{"q":"Một máy thực hiện công 36 000 J trong 1 phút. Công suất của máy là","opts":["36 000 W","6 000 W","60 W","600 W"],"a":3,"why":"Đổi t = 1 phút = 60 s; P = A/t = 36 000 : 60 = 600 W."},{"q":"Trường hợp nào KHÔNG có công cơ học?","opts":["Lực sĩ đứng yên giữ quả tạ trên cao","Cần cẩu nâng thùng hàng lên cao","Con ngựa kéo xe đi trên đường","Quả táo rơi từ trên cây xuống"],"a":0,"why":"Quả tạ không dịch chuyển (s = 0) nên A = F·s = 0, dù lực sĩ vẫn thấy mỏi."},{"q":"An và Bình cùng đưa bao gạo 50 kg lên cùng một độ cao; An mất 40 s, Bình mất 50 s. Kết luận đúng là","opts":["An thực hiện công lớn hơn","Công như nhau, Bình có công suất lớn hơn","Công như nhau, An có công suất lớn hơn","Công suất hai bạn bằng nhau"],"a":2,"why":"A = 10·m·h như nhau; An làm xong trong thời gian ngắn hơn nên P = A/t của An lớn hơn."}]},{"id":"p9-03","subj":"phys","grade":9,"chap":"Ánh sáng","title":"Khúc xạ ánh sáng và phản xạ toàn phần","sum":"Ánh sáng bị gãy khúc khi đi qua mặt phân cách hai môi trường vì tốc độ truyền thay đổi; chiết suất n = c/v cho biết mức độ lệch. Đi từ môi trường chiết suất lớn sang nhỏ với góc tới đủ lớn thì xảy ra phản xạ toàn phần.","points":["Khúc xạ: tia sáng bị gãy khúc tại mặt phân cách khi truyền từ môi trường trong suốt này sang môi trường khác.","Nguyên nhân: tốc độ ánh sáng trong các môi trường khác nhau.","Tia khúc xạ nằm trong mặt phẳng tới, ở bên kia pháp tuyến; sin i / sin r là hằng số.","Chiết suất tuyệt đối n = c/v (c ≈ 3·10⁸ m/s); nước ≈ 1,33, thủy tinh ≈ 1,5.","Không khí → nước: r < i (lệch gần pháp tuyến); nước → không khí: r > i. Tia vuông góc thì đi thẳng.","Phản xạ toàn phần: đi từ n lớn sang n nhỏ và i ≥ i_th; ứng dụng trong cáp quang."],"formulas":["n = c/v","sin i / sin r = n₂₁ = n₂/n₁","sin i_th = n₂/n₁  (n₁ > n₂)"],"viz":{"type":"refraction"},"vizNote":"Kéo góc tới i: tia khúc xạ trong nước luôn lệch gần pháp tuyến hơn (r < i); i = 0° thì tia sáng đi thẳng.","memo":"“Vào chậm thì khép, ra nhanh thì xòe” (khép về pháp tuyến). Phản xạ toàn phần: từ ĐẶC ra LOÃNG, góc LỚN.","example":{"q":"Tốc độ ánh sáng trong một loại thủy tinh là 2·10⁸ m/s. a) Tính chiết suất của thủy tinh. b) Tính góc tới hạn khi ánh sáng đi từ thủy tinh ra không khí (n = 1).","a":"a) n = c/v = 3·10⁸ : (2·10⁸) = 1,5.\nb) sin i_th = n₂/n₁ = 1 : 1,5 ≈ 0,667 ⇒ i_th ≈ 41,8°.\nVậy nếu góc tới i ≥ 41,8° thì tia sáng bị phản xạ toàn phần, không ló ra không khí."},"terms":[["refraction","khúc xạ"],["refractive index","chiết suất"],["normal","pháp tuyến"],["total internal reflection","phản xạ toàn phần"],["optical fibre","sợi quang"]],"quiz":[{"q":"Tốc độ ánh sáng trong nước khoảng 225 000 km/s, trong chân không là 300 000 km/s. Chiết suất của nước là","opts":["0,75","1,5","2,25","≈ 1,33"],"a":3,"why":"n = c/v = 300 000 : 225 000 ≈ 1,33."},{"q":"Chiếu tia sáng từ không khí vào nước (n = 1,33) với góc tới 45°. Góc khúc xạ gần nhất với","opts":["45°","≈ 32°","≈ 60°","0°"],"a":1,"why":"sin r = sin 45° : 1,33 ≈ 0,53 ⇒ r ≈ 32° < i: tia khúc xạ lệch gần pháp tuyến."},{"q":"Hiện tượng phản xạ toàn phần có thể xảy ra khi ánh sáng truyền","opts":["Từ không khí vào nước với góc tới lớn","Từ không khí vào thủy tinh, góc tới bất kì","Từ thủy tinh ra không khí, góc tới ≥ góc tới hạn","Từ nước ra không khí, góc tới bất kì"],"a":2,"why":"Cần hai điều kiện: đi từ môi trường chiết suất lớn sang nhỏ, và góc tới i ≥ i_th."},{"q":"Chiếc đũa nhúng xiên trong cốc nước trông như bị gãy ở mặt nước vì","opts":["Ánh sáng từ phần đũa trong nước bị khúc xạ khi ra không khí","Nước làm chiếc đũa bị cong","Ánh sáng bị phản xạ trên mặt nước","Nước hấp thụ hết ánh sáng"],"a":0,"why":"Tia sáng từ đũa trong nước bị lệch tại mặt nước, mắt nhìn theo tia ló nên thấy phần đũa trong nước như bị nâng lên."}]},{"id":"p9-04","subj":"phys","grade":9,"chap":"Ánh sáng","title":"Thấu kính hội tụ và kính lúp","sum":"Thấu kính hội tụ (rìa mỏng) cho ảnh thật ngược chiều khi vật ở ngoài tiêu cự, ảnh ảo cùng chiều lớn hơn vật khi vật ở trong tiêu cự — đó là nguyên tắc của kính lúp.","points":["Thấu kính hội tụ có rìa mỏng hơn phần giữa; chùm tia tới song song trục chính hội tụ tại tiêu điểm F'.","Ba tia đặc biệt: qua quang tâm O đi thẳng; song song trục chính → ló qua F'; qua F → ló song song trục chính.","d > f: ảnh thật, ngược chiều; d > 2f ảnh nhỏ hơn vật, d = 2f bằng vật, f < d < 2f lớn hơn vật.","d < f: ảnh ảo, cùng chiều, lớn hơn vật; d = f: không cho ảnh (chùm ló song song).","Kính lúp là thấu kính hội tụ tiêu cự ngắn; đặt vật trong khoảng tiêu cự để thấy ảnh ảo phóng to.","Số bội giác kính lúp G = 25/f (f tính bằng cm); f càng nhỏ, G càng lớn."],"formulas":["OF = OF' = f (tiêu cự)","A'B'/AB = OA'/OA  (tam giác đồng dạng)","G = 25/f  (f: cm)"],"viz":{"type":"lens","kind":"converging"},"vizNote":"Kéo vật từ xa lại gần: d > 2f ảnh thật nhỏ, d = 2f bằng vật, f < d < 2f lớn hơn, d < f thành ảnh ảo cùng chiều (kính lúp).","memo":"“Ngoài F: thật, lộn ngược; trong F: ảo, to, cùng chiều.” Xa hơn 2f – nhỏ, đúng 2f – bằng, giữa f và 2f – to.","example":{"q":"Vật AB cao 2 cm đặt vuông góc với trục chính của thấu kính hội tụ có f = 10 cm, cách thấu kính 30 cm. Dựng ảnh và tính khoảng cách từ ảnh đến thấu kính, chiều cao ảnh.","a":"Dựng ảnh: tia từ B qua O đi thẳng; tia từ B song song trục chính (tới I) ló qua F'. Giao điểm hai tia ló là B'.\nΔOAB ∽ ΔOA'B': A'B'/AB = OA'/OA = OA'/30 (1).\nΔF'OI ∽ ΔF'A'B' (OI = AB): A'B'/AB = F'A'/OF' = (OA' − 10)/10 (2).\nTừ (1), (2): OA'/30 = (OA' − 10)/10 ⇒ OA' = 3·OA' − 30 ⇒ OA' = 15 cm.\nA'B' = 2·15/30 = 1 cm. Ảnh thật, ngược chiều, nhỏ hơn vật (vì d > 2f)."},"terms":[["converging lens","thấu kính hội tụ"],["focal length","tiêu cự"],["principal axis","trục chính"],["real image","ảnh thật"],["magnifying glass","kính lúp"]],"quiz":[{"q":"Một kính lúp có tiêu cự 5 cm. Số bội giác của kính là","opts":["5×","2,5×","20×","125×"],"a":0,"why":"G = 25/f = 25/5 = 5×."},{"q":"Vật đặt trước thấu kính hội tụ f = 10 cm, cách thấu kính 15 cm. Ảnh của vật là","opts":["Ảnh thật, ngược chiều, nhỏ hơn vật","Ảnh ảo, cùng chiều, lớn hơn vật","Ảnh thật, ngược chiều, lớn hơn vật","Không có ảnh"],"a":2,"why":"f < d < 2f (10 cm < 15 cm < 20 cm) ⇒ ảnh thật, ngược chiều, lớn hơn vật."},{"q":"Tia sáng tới đi qua tiêu điểm F của thấu kính hội tụ thì tia ló","opts":["Đi qua quang tâm O","Song song với trục chính","Truyền thẳng, không đổi hướng","Đi qua tiêu điểm F'"],"a":1,"why":"Đây là tia đặc biệt thứ ba: tia qua F cho tia ló song song với trục chính."},{"q":"Vật AB cao 2 cm, cách thấu kính hội tụ (f = 10 cm) 20 cm. Ảnh A'B' cách thấu kính và cao","opts":["10 cm; 1 cm","40 cm; 4 cm","30 cm; 3 cm","20 cm; 2 cm"],"a":3,"why":"d = 2f ⇒ ảnh thật, ngược chiều, bằng vật: cách thấu kính 2f = 20 cm, cao 2 cm."}]},{"id":"p9-05","subj":"phys","grade":9,"chap":"Ánh sáng","title":"Thấu kính phân kì","sum":"Thấu kính phân kì (rìa dày) làm chùm sáng loe rộng ra; vật thật đặt ở mọi vị trí đều cho ảnh ảo, cùng chiều, nhỏ hơn vật, nằm trong khoảng tiêu cự.","points":["Thấu kính phân kì có phần rìa dày hơn phần giữa; chùm tia tới song song cho chùm tia ló loe rộng ra.","Tia qua quang tâm O truyền thẳng; tia song song trục chính cho tia ló có đường kéo dài qua tiêu điểm F.","Vật thật ở mọi vị trí: ảnh ảo, cùng chiều, nhỏ hơn vật, nằm trong khoảng tiêu cự OF.","Vật ở rất xa thì ảnh ở tiêu điểm F; vật càng gần thấu kính thì ảnh càng gần và càng lớn (vẫn nhỏ hơn vật).","Kính cận là thấu kính phân kì; nhìn chữ qua kính thấy nhỏ hơn ⇒ đó là thấu kính phân kì."],"formulas":["A'B'/AB = OA'/OA  (ΔOAB ∽ ΔOA'B')","A'B'/OI = FA'/FO  (ΔFOI ∽ ΔFA'B', OI = AB)","Ảnh ảo: OA' < OF và OA' < OA"],"viz":{"type":"lens","kind":"diverging"},"vizNote":"Kéo vật lại gần thấu kính: ảnh luôn ảo, cùng chiều, nhỏ hơn vật và chỉ nằm trong khoảng OF; vật càng gần, ảnh càng to.","memo":"“Phân kì rìa dày – ảnh ảo, nhỏ, cùng chiều – mãi ở trong F.” Cận thị đeo kính phân kì.","example":{"q":"Vật AB cao 3 cm đặt vuông góc với trục chính của thấu kính phân kì có f = 12 cm, cách thấu kính 24 cm. Tính khoảng cách từ ảnh đến thấu kính và chiều cao ảnh.","a":"Dựng ảnh: tia từ B qua O đi thẳng; tia từ B song song trục chính (tới I) ló ra có đường kéo dài qua F. B' là giao điểm của tia BO và đường kéo dài đó.\nΔOAB ∽ ΔOA'B': A'B'/AB = OA'/24 (1).\nΔFOI ∽ ΔFA'B' (OI = AB): A'B'/AB = FA'/FO = (12 − OA')/12 (2).\nTừ (1), (2): OA'/24 = (12 − OA')/12 ⇒ OA' = 24 − 2·OA' ⇒ OA' = 8 cm.\nA'B' = 3·8/24 = 1 cm. Ảnh ảo, cùng chiều, nhỏ hơn vật."},"terms":[["diverging lens","thấu kính phân kì"],["virtual image","ảnh ảo"],["optical centre","quang tâm"],["focal point","tiêu điểm"],["short-sightedness","cận thị"]],"quiz":[{"q":"Ảnh của một vật thật tạo bởi thấu kính phân kì luôn là","opts":["Ảnh thật, ngược chiều, nhỏ hơn vật","Ảnh ảo, cùng chiều, lớn hơn vật","Ảnh ảo, cùng chiều, nhỏ hơn vật","Ảnh thật, cùng chiều, bằng vật"],"a":2,"why":"Với thấu kính phân kì, vật thật ở mọi vị trí đều cho ảnh ảo, cùng chiều, nhỏ hơn vật."},{"q":"Tia tới song song với trục chính của thấu kính phân kì cho tia ló","opts":["Đi qua tiêu điểm F' phía sau thấu kính","Song song với trục chính","Đi qua quang tâm O","Có đường kéo dài đi qua tiêu điểm F"],"a":3,"why":"Tia ló loe ra xa trục chính; kéo dài ngược lại thì đi qua tiêu điểm F."},{"q":"Vật AB đặt cách thấu kính phân kì 10 cm, tiêu cự của thấu kính là 10 cm. Ảnh A'B' cách thấu kính","opts":["5 cm","Không có ảnh","10 cm","20 cm"],"a":0,"why":"OA'/10 = (10 − OA')/10 ⇒ OA' = 5 cm: ảnh ảo, cao bằng nửa vật (khác thấu kính hội tụ, ở đây vẫn có ảnh)."},{"q":"Cách nhận biết nhanh một thấu kính phân kì là","opts":["Đặt gần trang sách thấy chữ to hơn","Đặt gần trang sách thấy chữ nhỏ hơn","Hứng được ảnh Mặt Trời rõ nét trên tờ giấy","Phần giữa dày hơn phần rìa"],"a":1,"why":"Thấu kính phân kì luôn cho ảnh ảo nhỏ hơn vật; các dấu hiệu còn lại là của thấu kính hội tụ."}]},{"id":"p9-06","subj":"phys","grade":9,"chap":"Điện","title":"Điện trở. Định luật Ohm","sum":"Điện trở cho biết vật dẫn cản trở dòng điện nhiều hay ít; cường độ dòng điện tỉ lệ thuận với hiệu điện thế và tỉ lệ nghịch với điện trở: I = U/R.","points":["Điện trở R đặc trưng cho mức độ cản trở dòng điện của vật dẫn; đơn vị là ôm (Ω); 1 kΩ = 1 000 Ω.","Định luật Ohm: I tỉ lệ thuận với U, tỉ lệ nghịch với R: I = U/R.","Đồ thị I theo U của một điện trở là đường thẳng đi qua gốc tọa độ.","R = ρ·l/S: dây càng dài, tiết diện càng nhỏ thì điện trở càng lớn; ρ (điện trở suất) phụ thuộc vật liệu.","Đo điện trở: ampe kế mắc nối tiếp, vôn kế mắc song song với điện trở, rồi tính R = U/I."],"formulas":["I = U/R  (U: V, R: Ω, I: A)","U = I·R ;  R = U/I","R = ρ·l/S  (ρ: Ω·m, l: m, S: m²)"],"viz":{"type":"circuit","mode":"ohm"},"vizNote":"Tăng U thì I tăng, đèn sáng hơn; tăng R thì I giảm — đọc số chỉ ampe kế để kiểm tra I = U/R.","memo":"Tam giác Ohm: U ở đỉnh, I và R ở đáy — che đại lượng cần tìm, phần còn lại chính là công thức.","example":{"q":"Dây nicrom dài 2 m, tiết diện 0,5 mm², điện trở suất ρ = 1,1·10⁻⁶ Ω·m, được mắc vào hiệu điện thế 11 V. Tính điện trở của dây và cường độ dòng điện qua dây.","a":"Đổi S = 0,5 mm² = 0,5·10⁻⁶ m².\nR = ρ·l/S = 1,1·10⁻⁶·2 : (0,5·10⁻⁶) = 4,4 Ω.\nI = U/R = 11 : 4,4 = 2,5 A."},"terms":[["resistance","điện trở"],["Ohm's law","định luật Ohm"],["current","cường độ dòng điện"],["voltage","hiệu điện thế"],["resistivity","điện trở suất"]],"quiz":[{"q":"Đặt hiệu điện thế 12 V vào hai đầu điện trở 20 Ω. Cường độ dòng điện qua điện trở là","opts":["240 A","0,6 A","1,67 A","32 A"],"a":1,"why":"I = U/R = 12 : 20 = 0,6 A."},{"q":"Khi U = 6 V thì I = 0,3 A. Tăng U lên 9 V (R không đổi) thì I bằng","opts":["0,45 A","0,2 A","0,6 A","0,9 A"],"a":0,"why":"R = 6 : 0,3 = 20 Ω ⇒ I = 9 : 20 = 0,45 A (U tăng 1,5 lần thì I cũng tăng 1,5 lần)."},{"q":"Hai dây đồng cùng tiết diện, dây 1 dài gấp 3 lần dây 2. Điện trở của chúng thỏa mãn","opts":["R₁ = R₂/3","R₁ = R₂","R₁ = 9R₂","R₁ = 3R₂"],"a":3,"why":"Cùng vật liệu, cùng tiết diện: R tỉ lệ thuận với chiều dài l, nên R₁ = 3R₂."},{"q":"Muốn có dòng điện 0,25 A chạy qua điện trở 40 Ω thì hiệu điện thế giữa hai đầu điện trở phải là","opts":["160 V","0,00625 V","10 V","40,25 V"],"a":2,"why":"U = I·R = 0,25·40 = 10 V."}]},{"id":"p9-07","subj":"phys","grade":9,"chap":"Điện","title":"Đoạn mạch nối tiếp và song song","sum":"Mạch nối tiếp có chung cường độ dòng điện, điện trở tương đương bằng tổng các điện trở; mạch song song có chung hiệu điện thế, điện trở tương đương nhỏ hơn mỗi điện trở thành phần.","points":["Nối tiếp: cường độ dòng điện như nhau tại mọi điểm: I = I₁ = I₂.","Nối tiếp: U = U₁ + U₂ và Rtđ = R₁ + R₂ (lớn hơn mỗi điện trở thành phần).","Song song: hiệu điện thế hai đầu mỗi nhánh như nhau: U = U₁ = U₂; I = I₁ + I₂.","Song song: 1/Rtđ = 1/R₁ + 1/R₂ (Rtđ nhỏ hơn mỗi điện trở thành phần).","Đồ dùng điện trong nhà mắc song song để cùng dùng 220 V và bật, tắt riêng từng cái."],"formulas":["Nối tiếp: Rtđ = R₁ + R₂ ;  U₁/U₂ = R₁/R₂","Song song: 1/Rtđ = 1/R₁ + 1/R₂","Song song: Rtđ = R₁·R₂/(R₁ + R₂) ;  I₁/I₂ = R₂/R₁"],"viz":{"type":"circuit","mode":"parallel"},"vizNote":"Kéo R₁, R₂ và U: hai nhánh luôn cùng U, I = I₁ + I₂, và Rtđ luôn nhỏ hơn điện trở nhỏ nhất.","memo":"“Nối tiếp chung dòng, song song chung áp.” Thêm nhánh song song thì Rtđ giảm, dòng mạch chính tăng.","example":{"q":"Cho R₁ = 6 Ω, R₂ = 12 Ω, U = 12 V. Tính Rtđ, cường độ dòng điện và hiệu điện thế/dòng điện từng điện trở khi a) mắc nối tiếp; b) mắc song song.","a":"a) Nối tiếp: Rtđ = 6 + 12 = 18 Ω; I = 12 : 18 = 2/3 A ≈ 0,67 A.\nU₁ = (2/3)·6 = 4 V; U₂ = (2/3)·12 = 8 V (4 + 8 = 12 V ✓).\nb) Song song: Rtđ = 6·12/(6 + 12) = 4 Ω.\nI₁ = 12 : 6 = 2 A; I₂ = 12 : 12 = 1 A; I = 2 + 1 = 3 A (= 12 : 4 ✓)."},"terms":[["series circuit","đoạn mạch nối tiếp"],["parallel circuit","đoạn mạch song song"],["equivalent resistance","điện trở tương đương"]],"quiz":[{"q":"R₁ = 10 Ω mắc nối tiếp với R₂ = 15 Ω. Điện trở tương đương của đoạn mạch là","opts":["6 Ω","5 Ω","150 Ω","25 Ω"],"a":3,"why":"Nối tiếp: Rtđ = R₁ + R₂ = 10 + 15 = 25 Ω (6 Ω là kết quả nếu mắc song song)."},{"q":"Hai điện trở cùng 30 Ω mắc song song. Điện trở tương đương là","opts":["60 Ω","30 Ω","15 Ω","900 Ω"],"a":2,"why":"Rtđ = 30·30/(30 + 30) = 15 Ω; hai điện trở giống nhau song song thì Rtđ bằng một nửa."},{"q":"R₁ = 4 Ω mắc song song với R₂ = 6 Ω, hiệu điện thế 12 V. Cường độ dòng điện mạch chính là","opts":["1,2 A","5 A","2 A","3 A"],"a":1,"why":"I₁ = 12 : 4 = 3 A; I₂ = 12 : 6 = 2 A ⇒ I = 5 A (hoặc Rtđ = 2,4 Ω, I = 12 : 2,4 = 5 A)."},{"q":"R₁ = 2 Ω mắc nối tiếp với R₂ = 8 Ω, hiệu điện thế 20 V. Hiệu điện thế giữa hai đầu R₂ là","opts":["16 V","4 V","10 V","20 V"],"a":0,"why":"Rtđ = 10 Ω ⇒ I = 2 A ⇒ U₂ = 2·8 = 16 V (U₁ = 4 V; 4 + 16 = 20 V)."}]},{"id":"p9-08","subj":"phys","grade":9,"chap":"Điện","title":"Năng lượng điện và công suất điện","sum":"Dòng điện mang năng lượng; công suất điện P = U·I cho biết năng lượng tiêu thụ mỗi giây, còn năng lượng điện W = P·t được công tơ đo bằng kWh.","points":["Dòng điện có năng lượng, chuyển hóa thành nhiệt năng, quang năng, cơ năng… trong các dụng cụ điện.","Công suất điện P = U·I, đơn vị oát (W): năng lượng điện tiêu thụ trong 1 giây.","Số ghi 220 V – 1 000 W là hiệu điện thế định mức và công suất định mức khi dùng đúng 220 V.","Năng lượng điện tiêu thụ W = P·t = U·I·t; đơn vị J, trong thực tế dùng kWh (1 “số điện”).","1 kWh = 1 000 W·3 600 s = 3 600 000 J.","Với điện trở R: P = I²·R = U²/R."],"formulas":["P = U·I","W = P·t = U·I·t","1 kWh = 3,6·10⁶ J","P = I²·R = U²/R"],"viz":{"type":"power"},"vizNote":"Kéo U, I và thời gian t: quan sát P = U·I, năng lượng điện W = P·t (Wh, kWh) và tiền điện thay đổi theo.","memo":"“Suất = Áp × Dòng, Năng = Suất × Giờ.” Tính tiền điện: đổi sang kW và giờ, rồi nhân với giá mỗi số.","example":{"q":"Ấm điện 220 V – 1 000 W dùng đúng định mức, mỗi ngày 30 phút, trong 30 ngày. Giá điện 2 000 đồng/kWh. Tính cường độ dòng điện, năng lượng điện tiêu thụ và tiền điện.","a":"I = P/U = 1 000 : 220 ≈ 4,55 A.\nThời gian dùng: t = 0,5 h·30 = 15 h; P = 1 000 W = 1 kW.\nW = P·t = 1 kW·15 h = 15 kWh.\nTiền điện = 15·2 000 = 30 000 đồng."},"terms":[["electrical power","công suất điện"],["electrical energy","năng lượng điện"],["kilowatt-hour","kilôoát giờ"],["rated power","công suất định mức"]],"quiz":[{"q":"Bóng đèn 220 V – 100 W sáng bình thường. Cường độ dòng điện qua đèn khoảng","opts":["0,45 A","2,2 A","4,5 A","22 000 A"],"a":0,"why":"I = P/U = 100 : 220 ≈ 0,45 A."},{"q":"Quạt điện 50 W chạy đúng định mức trong 8 giờ tiêu thụ năng lượng điện là","opts":["4 kWh","0,4 kWh","6,25 kWh","400 kWh"],"a":1,"why":"W = P·t = 0,05 kW·8 h = 0,4 kWh (= 400 Wh)."},{"q":"1 kWh bằng bao nhiêu jun?","opts":["1 000 J","3 600 J","60 000 J","3 600 000 J"],"a":3,"why":"1 kWh = 1 000 W·3 600 s = 3 600 000 J."},{"q":"Hai bóng 220 V – 40 W và 220 V – 100 W cùng dùng đúng 220 V trong 5 giờ. Nhận xét đúng là","opts":["Hai bóng tiêu thụ điện như nhau vì cùng 220 V","Bóng 40 W tiêu thụ nhiều điện hơn","Bóng 100 W tiêu thụ 0,5 kWh, gấp 2,5 lần bóng 40 W","Bóng 100 W tiêu thụ 500 kWh"],"a":2,"why":"W = P·t: 0,1 kW·5 h = 0,5 kWh và 0,04 kW·5 h = 0,2 kWh; 0,5 : 0,2 = 2,5."}]},{"id":"p9-09","subj":"phys","grade":9,"chap":"Điện từ","title":"Cảm ứng điện từ và dòng điện xoay chiều","sum":"Khi số đường sức từ xuyên qua cuộn dây kín biến thiên, trong cuộn dây xuất hiện dòng điện cảm ứng; cho nam châm hoặc cuộn dây quay liên tục sẽ tạo ra dòng điện xoay chiều.","points":["Dòng điện cảm ứng xuất hiện trong cuộn dây kín khi số đường sức từ xuyên qua tiết diện cuộn dây biến thiên.","Đưa nam châm vào, kéo ra hoặc quay nó trước cuộn dây đều tạo dòng cảm ứng; nam châm đứng yên thì không.","Đưa vào rồi kéo ra thì dòng cảm ứng đổi chiều; chuyển động càng nhanh, dòng càng mạnh.","Dòng điện xoay chiều luân phiên đổi chiều; tạo ra khi quay nam châm trước cuộn dây hoặc quay cuộn dây trong từ trường.","Dòng điện xoay chiều có tác dụng nhiệt, phát sáng, từ, sinh lí — như dòng điện một chiều.","Điện lưới Việt Nam: 220 V – 50 Hz, dòng điện đổi chiều 100 lần mỗi giây."],"formulas":["f = 1/T  (f: Hz, T: s)","Số lần đổi chiều trong 1 s = 2·f"],"viz":{"type":"induction"},"vizNote":"Kéo nam châm vào rồi ra khỏi cuộn dây: kim điện kế chỉ lệch khi nam châm đang chuyển động, và lệch ngược chiều khi đổi hướng.","memo":"“Từ đổi thì điện sinh — từ đứng yên, kim đứng yên.” Vào lệch một bên, ra lệch bên kia: xoay chiều là vào – ra liên tục.","example":{"q":"Máy phát điện xoay chiều có rôto là nam châm một cặp cực, quay 3 000 vòng/phút; mỗi vòng quay dòng điện đổi chiều 2 lần. a) Tần số dòng điện là bao nhiêu? b) Trong 1 s dòng điện đổi chiều mấy lần?","a":"a) 3 000 vòng/phút = 3 000 : 60 = 50 vòng/s. Mỗi vòng là 1 chu kì ⇒ f = 50 Hz (T = 1/50 = 0,02 s).\nb) Số lần đổi chiều = 2·f = 2·50 = 100 lần mỗi giây.\nĐây đúng là dòng điện của lưới điện Việt Nam (50 Hz)."},"terms":[["electromagnetic induction","cảm ứng điện từ"],["induced current","dòng điện cảm ứng"],["alternating current (AC)","dòng điện xoay chiều"],["generator","máy phát điện"],["magnetic field line","đường sức từ"]],"quiz":[{"q":"Trường hợp nào KHÔNG xuất hiện dòng điện cảm ứng trong cuộn dây dẫn kín?","opts":["Đưa nam châm lại gần cuộn dây","Kéo nam châm ra xa cuộn dây","Nam châm nằm yên trong lòng cuộn dây","Quay nam châm trước cuộn dây"],"a":2,"why":"Nam châm đứng yên ⇒ số đường sức từ qua cuộn dây không biến thiên ⇒ không có dòng cảm ứng."},{"q":"Đưa cực N lại gần cuộn dây thì kim điện kế lệch sang phải. Kéo cực N ra xa cuộn dây thì kim điện kế","opts":["Lệch sang trái","Lệch sang phải mạnh hơn","Đứng yên ở vạch 0","Quay tròn liên tục"],"a":0,"why":"Đưa vào thì số đường sức tăng, kéo ra thì giảm ⇒ dòng cảm ứng đổi chiều, kim lệch ngược lại."},{"q":"Điện lưới ở Việt Nam có tần số 50 Hz. Trong 1 giây dòng điện đổi chiều","opts":["25 lần","100 lần","50 lần","220 lần"],"a":1,"why":"Mỗi chu kì dòng điện đổi chiều 2 lần ⇒ 2·50 = 100 lần mỗi giây."},{"q":"Bàn là, ấm siêu tốc dùng điện xoay chiều hoạt động chủ yếu dựa vào tác dụng nào của dòng điện?","opts":["Tác dụng sinh lí","Tác dụng từ","Tác dụng phát sáng","Tác dụng nhiệt"],"a":3,"why":"Dòng điện qua dây đốt làm dây nóng lên, năng lượng điện chuyển hóa thành nhiệt năng."}]}],"grammar":[{"id":"gk-01","lvl":"kids","chap":"Unit 1 · Hobbies","title":"Thì hiện tại đơn (Present simple)","sum":"Dùng để nói về thói quen, sở thích, hoạt động lặp đi lặp lại và những sự thật hiển nhiên.","forms":["(+) S + V(s/es) + O","(−) S + do/does not + V + O","(?) Do/Does + S + V + O?","Với be: S + am/is/are + …"],"points":["Diễn tả thói quen, sở thích, hoạt động lặp lại hằng ngày: I collect stamps.","Diễn tả sự thật hiển nhiên, chân lý: The sun rises in the east.","Dấu hiệu: always, usually, often, sometimes, rarely, never, every day, once a week.","Chủ ngữ ngôi thứ ba số ít (he, she, it, danh từ số ít): động từ thêm -s/-es.","Thêm -es sau o, s, sh, ch, x: goes, watches; phụ âm + y → -ies: study → studies.","Lỗi hay gặp: She doesn't likes ✗ — sau do/does/don't/doesn't, động từ luôn ở dạng nguyên mẫu."],"examples":[["My brother collects stamps.","Anh trai tôi sưu tầm tem."],["I usually go swimming on Sundays.","Tôi thường đi bơi vào Chủ nhật."],["Does Mai like gardening?","Mai có thích làm vườn không?"],["They don't play the guitar.","Họ không chơi đàn ghi-ta."]],"memo":"He, she, it — nhớ thêm 's'; đã có does/doesn't thì động từ trở về nguyên mẫu.","quiz":[{"q":"She ____ to school by bike every day.","opts":["go","goes","going","is go"],"a":1,"why":"Chủ ngữ she là ngôi thứ ba số ít, có every day → hiện tại đơn, go thêm -es thành goes."},{"q":"My parents ____ jogging in the park every morning.","opts":["go","goes","going","is going"],"a":0,"why":"My parents là chủ ngữ số nhiều + every morning (thói quen) → dùng động từ nguyên mẫu go."},{"q":"____ your brother like making models?","opts":["Do","Is","Does","Are"],"a":2,"why":"Câu hỏi với động từ thường like, chủ ngữ your brother số ít → dùng Does."},{"q":"Lan ____ horse riding. She thinks it's dangerous.","opts":["don't like","isn't like","not likes","doesn't like"],"a":3,"why":"Chủ ngữ Lan số ít, phủ định với động từ thường → doesn't + V nguyên mẫu: doesn't like."}]},{"id":"gk-02","lvl":"kids","chap":"Unit 1 · Hobbies","title":"Động từ chỉ sự yêu thích + V-ing (Verbs of liking)","sum":"Dùng like, love, enjoy, hate… + V-ing để nói mình thích hay không thích làm việc gì.","forms":["S + like / love / enjoy + V-ing","S + hate / dislike / don't like + V-ing","S + don't mind + V-ing"],"points":["Dùng like, love, enjoy, hate, dislike, don't mind… để nói về sở thích hoặc điều không thích.","Sau các động từ này thường dùng V-ing (danh động từ): I enjoy reading comics.","enjoy, dislike, don't mind chỉ đi với V-ing; like, love, hate có thể đi với V-ing hoặc to V.","Mức độ: love > like/enjoy > don't mind > don't like/dislike > hate.","Thêm -ing: bỏ e câm (make → making), gấp đôi phụ âm cuối (swim → swimming).","Nhớ chia động từ chính theo chủ ngữ: She loves dancing (không viết She love dance)."],"examples":[["I love painting in my free time.","Tôi rất thích vẽ tranh vào thời gian rảnh."],["My sister enjoys making cakes.","Chị gái tôi thích làm bánh."],["Tom hates getting up early.","Tom ghét dậy sớm."],["Do you like collecting coins?","Bạn có thích sưu tầm tiền xu không?"]],"memo":"Thích hay ghét đều đi với V-ing — riêng enjoy thì chỉ đi với V-ing.","quiz":[{"q":"My father enjoys ____ in his garden.","opts":["work","to work","working","works"],"a":2,"why":"Sau enjoy luôn dùng V-ing → enjoys working."},{"q":"My friends don't mind ____ the dishes after dinner.","opts":["washing","wash","to wash","washed"],"a":0,"why":"Sau don't mind (không ngại) dùng V-ing → washing."},{"q":"She ____ playing badminton with her friends.","opts":["love","loves","loving","to love"],"a":1,"why":"Chủ ngữ she ngôi thứ ba số ít → động từ chính thêm -s: loves (+ V-ing)."},{"q":"Nam dislikes ____ horror films.","opts":["watch","watches","to watching","watching"],"a":3,"why":"Sau dislike dùng V-ing → dislikes watching."}]},{"id":"gk-03","lvl":"kids","chap":"Unit 2 · Healthy living","title":"Câu đơn (Simple sentences)","sum":"Câu đơn chỉ có một mệnh đề độc lập (một cụm chủ ngữ – vị ngữ) và diễn đạt một ý trọn vẹn.","forms":["S + V","S + V + O","S + V + O + trạng ngữ (nơi chốn, thời gian…)","S1 and S2 + V (chủ ngữ ghép)","S + V1 and V2 (vị ngữ ghép)"],"points":["Câu đơn chỉ có một mệnh đề độc lập gồm chủ ngữ và vị ngữ, diễn đạt một ý trọn vẹn.","Câu đơn có thể có chủ ngữ ghép: My mum and I cook dinner together.","Câu đơn có thể có vị ngữ ghép (hai động từ): She eats well and sleeps early.","Có thể thêm tân ngữ, tính từ, trạng ngữ: We exercise in the park every morning.","Câu có hai mệnh đề nối bằng and, but, so, because… không còn là câu đơn.","Lỗi hay gặp: thiếu động từ (He very healthy ✗) → He is very healthy."],"examples":[["I drink a lot of water.","Tôi uống nhiều nước."],["My grandparents walk every morning.","Ông bà tôi đi bộ mỗi sáng."],["Lan and Mai do yoga.","Lan và Mai tập yoga."],["He eats vegetables and avoids junk food.","Anh ấy ăn rau và tránh đồ ăn vặt."]],"memo":"Câu đơn = 1 chủ ngữ (có thể ghép) + 1 vị ngữ (có thể ghép) → chỉ 1 mệnh đề.","quiz":[{"q":"Which is a simple sentence?","opts":["I eat fruit, and my sister drinks milk.","My brother plays sports every day.","I was tired, so I went to bed.","She feels sick because she ate too much."],"a":1,"why":"Chỉ câu My brother plays sports every day. có một mệnh đề; các câu còn lại có hai mệnh đề nối bằng and, so, because."},{"q":"Choose the correct sentence.","opts":["My mum and dad goes to bed early.","My mum and dad going to bed early.","My mum and dad to bed early.","My mum and dad go to bed early."],"a":3,"why":"Chủ ngữ ghép mum and dad là số nhiều → go; câu đơn phải có động từ được chia đúng."},{"q":"Junk food ____ bad for your health.","opts":["are","is","be","being"],"a":1,"why":"Junk food là danh từ không đếm được → động từ số ít is."},{"q":"Which sentence has a compound verb (vị ngữ ghép)?","opts":["Minh and Nam play football.","Minh plays football.","Minh eats breakfast and goes to school.","Minh is healthy."],"a":2,"why":"Câu Minh eats breakfast and goes to school. có một chủ ngữ với hai động từ eats và goes → vị ngữ ghép."}]},{"id":"gk-04","lvl":"kids","chap":"Unit 3 · Community service","title":"Thì quá khứ đơn (Past simple)","sum":"Dùng để kể về hành động đã xảy ra và kết thúc tại một thời điểm xác định trong quá khứ.","forms":["(+) S + V2/V-ed + O","(−) S + did not (didn't) + V + O","(?) Did + S + V + O?","Với be: S + was/were + …"],"points":["Diễn tả hành động đã xảy ra và kết thúc tại thời điểm xác định trong quá khứ.","Dấu hiệu: yesterday, last week/month/year, … ago, in 2020, when I was young.","Động từ có quy tắc thêm -ed: help → helped, donate → donated, plan → planned, carry → carried.","Động từ bất quy tắc dùng cột 2: go → went, give → gave, make → made, teach → taught.","Câu phủ định và nghi vấn dùng did/didn't + động từ nguyên mẫu (không chia quá khứ lần nữa).","was dùng với I/he/she/it và danh từ số ít; were dùng với you/we/they và danh từ số nhiều."],"examples":[["We collected rubbish in the park last Sunday.","Chúng tôi đã nhặt rác ở công viên vào Chủ nhật tuần trước."],["They donated books to the village school.","Họ đã quyên góp sách cho trường làng."],["Did you plant trees last month?","Tháng trước bạn có trồng cây không?"],["I didn't go to the event yesterday.","Hôm qua tôi đã không đi sự kiện đó."]],"memo":"Đã có did/didn't thì động từ về nguyên mẫu: did go, không phải did went.","quiz":[{"q":"Last summer, we ____ English to children in the village.","opts":["teach","taught","teached","teaching"],"a":1,"why":"Last summer → quá khứ đơn; teach là động từ bất quy tắc, cột 2 là taught."},{"q":"____ they recycle the bottles yesterday?","opts":["Do","Were","Did","Does"],"a":2,"why":"Có yesterday và động từ thường recycle → câu hỏi quá khứ đơn dùng Did."},{"q":"My class ____ a lot of old clothes two weeks ago.","opts":["donated","donates","donate","donating"],"a":0,"why":"Two weeks ago → quá khứ đơn, động từ có quy tắc thêm -d: donated."},{"q":"I ____ at home yesterday. I was at the community centre.","opts":["weren't","didn't","don't","wasn't"],"a":3,"why":"Chủ ngữ I, câu với be ở quá khứ → was not (wasn't)."}]},{"id":"gk-05","lvl":"kids","chap":"Unit 4 · Music and arts","title":"So sánh với like, different from, (not) as … as","sum":"Dùng like, different from, (not) as … as để so sánh hai người hoặc hai sự vật giống, khác hay bằng nhau.","forms":["A + be/V + like + B (giống như)","A + be + different from + B (khác với)","A + be + (not) as + adj + as + B","A + V + (not) as + adv + as + B"],"points":["like (giống như) dùng khi hai người/vật giống nhau: Her voice is like her mother's.","different from (khác với) dùng khi hai người/vật khác nhau: Pop is different from folk music.","as + tính từ/trạng từ + as: bằng, như nhau: This song is as popular as that one.","not as + tính từ/trạng từ + as: không … bằng: My drawing isn't as good as yours.","Giữa as … as dùng tính từ/trạng từ dạng nguyên, không dùng so sánh hơn (as better as ✗).","Lỗi hay gặp: different with ✗ → different from ✓."],"examples":[["Mai sings like a professional singer.","Mai hát như một ca sĩ chuyên nghiệp."],["Water puppetry is different from other puppet shows.","Múa rối nước khác với các loại hình múa rối khác."],["This painting is as beautiful as that one.","Bức tranh này đẹp như bức tranh kia."],["Rock music isn't as relaxing as classical music.","Nhạc rock không thư giãn bằng nhạc cổ điển."]],"memo":"Giống = like, khác = different from, bằng = as … as, không bằng = not as … as.","quiz":[{"q":"Her painting is different ____ mine.","opts":["from","as","like","with"],"a":0,"why":"Cấu trúc khác với: be different from."},{"q":"This concert is not as ____ as the last one.","opts":["more exciting","exciting","most exciting","excitinger"],"a":1,"why":"Giữa not as … as dùng tính từ dạng nguyên: exciting."},{"q":"My brother plays the piano ____ a real musician.","opts":["as","from","like","than"],"a":2,"why":"Nói giống như ai đó (chơi đàn như một nhạc sĩ thật) → dùng like + danh từ."},{"q":"The art club is as ____ as the music club.","opts":["more popular","the most popular","popularly","popular"],"a":3,"why":"Sau be, giữa as … as dùng tính từ dạng nguyên: as popular as."}]},{"id":"gk-06","lvl":"kids","chap":"Unit 5 · Food and drink","title":"Some, a lot of, lots of; How much / How many","sum":"Dùng some, a lot of, lots of với danh từ đếm được và không đếm được; hỏi số lượng bằng How many / How much.","forms":["some / a lot of / lots of + N đếm được số nhiều hoặc N không đếm được","How many + N đếm được số nhiều + are there / do you …?","How much + N không đếm được + is there / do you …?","How much + is/are + N? (hỏi giá)"],"points":["Danh từ đếm được có số ít/số nhiều (an egg, two eggs); không đếm được không có số nhiều (rice, milk).","some dùng trong câu khẳng định và lời mời, đề nghị: Would you like some tea?","Trong câu phủ định và câu hỏi thường dùng any: There isn't any bread.","a lot of = lots of (nhiều), dùng được với cả danh từ đếm được số nhiều và không đếm được.","How many + danh từ đếm được số nhiều; How much + danh từ không đếm được.","How much còn dùng để hỏi giá: How much is this pizza?"],"examples":[["We need some eggs and some flour.","Chúng ta cần một ít trứng và một ít bột mì."],["She drinks a lot of water every day.","Cô ấy uống nhiều nước mỗi ngày."],["How many bananas do you want?","Bạn muốn bao nhiêu quả chuối?"],["How much milk is there in the fridge?","Trong tủ lạnh có bao nhiêu sữa?"]],"memo":"Many đi với thứ đếm được (many apples), much đi với thứ không đếm được (much rice).","quiz":[{"q":"How ____ sugar do you need for the cake?","opts":["many","much","lot","some"],"a":1,"why":"Sugar là danh từ không đếm được → How much."},{"q":"How ____ apples are there in the basket?","opts":["much","lots","many","any"],"a":2,"why":"Apples là danh từ đếm được số nhiều → How many."},{"q":"Would you like ____ orange juice?","opts":["some","many","a","an"],"a":0,"why":"Lời mời dùng some; orange juice không đếm được nên không dùng a/an hay many."},{"q":"My mum buys ____ vegetables at the market every week.","opts":["much","a lot","many of","lots of"],"a":3,"why":"Lots of + danh từ số nhiều (vegetables). A lot phải có of; much không đi với danh từ đếm được."}]},{"id":"gk-07","lvl":"kids","chap":"Unit 6 · A visit to a school","title":"Giới từ chỉ thời gian và nơi chốn (Prepositions of time and place)","sum":"Dùng at, on, in để chỉ thời gian và địa điểm; dùng next to, behind, opposite… để chỉ vị trí.","forms":["at + giờ / thời điểm: at 7 o'clock, at noon","on + thứ / ngày: on Monday, on 2nd September","in + tháng / năm / mùa / buổi: in May, in 2024, in the morning","in / on / at + nơi chốn: in the classroom, on the wall, at school","next to / behind / in front of / opposite / between … and …"],"points":["at: giờ, thời điểm cụ thể (at 6:30, at night, at the weekend).","on: thứ, ngày, ngày tháng cụ thể (on Friday, on Monday morning, on 20th November).","in: tháng, năm, mùa, buổi trong ngày (in July, in 2025, in summer, in the afternoon).","Nơi chốn: in (bên trong: in the library), on (trên bề mặt: on the wall), at (tại: at school).","Vị trí: next to (bên cạnh), behind (phía sau), in front of (phía trước), opposite (đối diện).","Lỗi hay gặp: in Monday ✗ → on Monday; on the morning ✗ → in the morning (nhưng on Monday morning ✓)."],"examples":[["Our school year starts in September.","Năm học của chúng tôi bắt đầu vào tháng Chín."],["The library is next to the computer room.","Thư viện ở cạnh phòng máy tính."],["We have English on Tuesday and Thursday.","Chúng tôi học tiếng Anh vào thứ Ba và thứ Năm."],["Classes begin at 7 a.m.","Các tiết học bắt đầu lúc 7 giờ sáng."]],"memo":"Thời gian: AT giờ – ON ngày – IN tháng/năm (từ nhỏ đến lớn).","quiz":[{"q":"My school was founded ____ 1998.","opts":["on","at","in","for"],"a":2,"why":"Trước năm dùng in → in 1998."},{"q":"We have a school festival ____ 20th November.","opts":["in","on","at","to"],"a":1,"why":"Trước ngày tháng cụ thể dùng on → on 20th November."},{"q":"The canteen is ____ the gym and the library.","opts":["between","next","opposite of","among of"],"a":0,"why":"Cấu trúc between A and B (ở giữa A và B)."},{"q":"The first lesson starts ____ 7:15.","opts":["in","on","from","at"],"a":3,"why":"Trước giờ cụ thể dùng at → at 7:15."}]},{"id":"gk-08","lvl":"kids","chap":"Unit 7 · Traffic","title":"It chỉ khoảng cách; should / shouldn't","sum":"Dùng It để nói về khoảng cách giữa hai nơi; dùng should / shouldn't để khuyên nên hoặc không nên làm gì.","forms":["It is (about) + khoảng cách + from A to B.","How far is it from A to B?","S + should / shouldn't + V (nguyên mẫu)","Should + S + V …?"],"points":["Dùng It làm chủ ngữ để nói về khoảng cách: It's about 2 km from my house to school.","Hỏi khoảng cách: How far is it from … to …?","should (nên) dùng để đưa ra lời khuyên; shouldn't (không nên) để khuyên không làm gì.","Sau should/shouldn't luôn là động từ nguyên mẫu không 'to', không thêm s: He should wear a helmet.","Hỏi xin lời khuyên: Should I …? / What should we do?","Lỗi hay gặp: He shoulds go ✗; You should to stop ✗ → You should stop."],"examples":[["It's about 500 metres from my house to the bus stop.","Từ nhà tôi đến bến xe buýt khoảng 500 mét."],["How far is it from Hanoi to Hai Phong?","Từ Hà Nội đến Hải Phòng bao xa?"],["You should wear a helmet on a motorbike.","Bạn nên đội mũ bảo hiểm khi đi xe máy."],["Children shouldn't play on the street.","Trẻ em không nên chơi trên đường phố."]],"memo":"Hỏi bao xa: How far is IT…; khuyên nhủ: should + V nguyên mẫu.","quiz":[{"q":"____ is about 3 kilometres from my house to the market.","opts":["There","This","It","That"],"a":2,"why":"Nói về khoảng cách dùng It làm chủ ngữ: It is about 3 kilometres from … to …"},{"q":"You ____ cross the street when the traffic light is red. It's dangerous.","opts":["should","should to","shouldn't","don't should"],"a":2,"why":"Khuyên không nên làm điều nguy hiểm → shouldn't + V nguyên mẫu."},{"q":"How ____ is it from your school to the park?","opts":["often","far","many","much"],"a":1,"why":"Hỏi khoảng cách dùng How far is it from … to …?"},{"q":"Cyclists should ____ in the bicycle lane.","opts":["ride","rides","to ride","riding"],"a":0,"why":"Sau should dùng động từ nguyên mẫu không to → should ride."}]},{"id":"gk-09","lvl":"kids","chap":"Unit 8 · Films","title":"Although / though; however","sum":"Dùng although / though (mặc dù) và however (tuy nhiên) để nối hai ý trái ngược nhau.","forms":["Although / Though + S + V, S + V.","S + V + although / though + S + V.","S + V. However, S + V.","S + V; however, S + V."],"points":["although / though (mặc dù) nối hai mệnh đề có ý trái ngược trong cùng một câu.","Mệnh đề although/though đứng đầu câu thì dùng dấu phẩy ngăn cách với mệnh đề chính.","however (tuy nhiên) thường đứng đầu câu thứ hai, sau dấu chấm hoặc chấm phẩy, theo sau là dấu phẩy.","Không dùng but cùng although trong một câu: Although it was long, but … ✗.","Sau although/though là một mệnh đề (S + V), không phải chỉ một cụm danh từ."],"examples":[["Although the film was long, we enjoyed it.","Mặc dù bộ phim dài, chúng tôi vẫn thích nó."],["I watched the film though I was tired.","Tôi đã xem bộ phim dù tôi mệt."],["The plot is boring. However, the actors are great.","Cốt truyện nhàm chán. Tuy nhiên, các diễn viên rất tuyệt."],["Though it's a horror film, my sister likes it.","Dù là phim kinh dị, em gái tôi vẫn thích nó."]],"memo":"Although/though nối ngay trong câu và không đi cùng but; However mở đầu câu sau + dấu phẩy.","quiz":[{"q":"____ the film had good reviews, I didn't like it.","opts":["However","Although","Because","But"],"a":1,"why":"Hai ý trái ngược trong cùng một câu, mệnh đề đứng đầu → Although (mặc dù)."},{"q":"The film was scary. ____, I watched it till the end.","opts":["Although","Because","However","So that"],"a":2,"why":"Đứng đầu câu thứ hai, có dấu phẩy theo sau, nối ý trái ngược → However."},{"q":"Which sentence is correct?","opts":["Although he was tired, but he watched the film.","He was tired, although, he watched the film.","However he was tired, he watched the film.","Although he was tired, he watched the film."],"a":3,"why":"Although + mệnh đề, mệnh đề chính — không thêm but; however không dùng như liên từ nối mệnh đề."},{"q":"We went to see the film ____ it rained heavily.","opts":["however","although","despite","so"],"a":1,"why":"Nối hai mệnh đề trái ngược trong một câu → although. Despite không đi với mệnh đề."}]},{"id":"gk-10","lvl":"kids","chap":"Unit 9 · Festivals around the world","title":"Câu hỏi Yes/No và câu hỏi có từ để hỏi (Wh-questions)","sum":"Câu hỏi Yes/No dùng để xác nhận đúng/sai; câu hỏi Wh- dùng để hỏi thông tin cụ thể (cái gì, ở đâu, khi nào…).","forms":["Yes/No: Be / Do / Does / Did / Can … + S + …?","→ Yes, S + trợ động từ. / No, S + trợ động từ + not.","Wh-: Wh-word + trợ động từ + S + V …?","Who / What làm chủ ngữ: Who / What + V …?"],"points":["Câu hỏi Yes/No bắt đầu bằng trợ động từ hoặc be; trả lời bằng Yes/No + trợ động từ.","Từ để hỏi: What (cái gì), Where (ở đâu), When (khi nào), Who (ai), Why (tại sao), How (thế nào).","How còn kết hợp: How often, How long, How many, How much, How far.","Trật tự câu hỏi Wh-: từ để hỏi + trợ động từ (do/does/did, be, can…) + chủ ngữ + động từ.","Khi Who/What làm chủ ngữ thì không dùng do/does/did: Who organises the festival?","Lỗi hay gặp: Where you went? ✗ → Where did you go?"],"examples":[["Do people celebrate Diwali in India?","Người ta có tổ chức lễ hội Diwali ở Ấn Độ không?"],["When is the Mid-Autumn Festival?","Tết Trung thu là khi nào?"],["Where did you watch the fireworks?","Bạn đã xem pháo hoa ở đâu?"],["Why do people decorate their houses?","Tại sao mọi người trang trí nhà cửa?"]],"memo":"Yes/No: đưa trợ động từ lên đầu; Wh-: từ để hỏi + trợ động từ + S + V.","quiz":[{"q":"____ do people celebrate Christmas? – On 25th December.","opts":["Where","When","Why","Who"],"a":1,"why":"Câu trả lời là một ngày (On 25th December) → hỏi thời gian bằng When."},{"q":"____ you go to the flower festival last year? – Yes, I did.","opts":["Do","Were","Did","Are"],"a":2,"why":"Có last year và câu trả lời Yes, I did → câu hỏi quá khứ đơn bắt đầu bằng Did."},{"q":"____ did they hold the festival? – In Da Lat.","opts":["Where","What","How","When"],"a":0,"why":"Câu trả lời là địa điểm (In Da Lat) → hỏi bằng Where."},{"q":"____ often do you have a festival? – Once a year.","opts":["What","When","Who","How"],"a":3,"why":"Hỏi mức độ thường xuyên dùng How often; trả lời Once a year."}]},{"id":"gk-11","lvl":"kids","chap":"Unit 10 · Energy sources","title":"Thì hiện tại tiếp diễn (Present continuous)","sum":"Dùng để diễn tả hành động đang xảy ra lúc nói hoặc đang diễn ra trong khoảng thời gian hiện tại.","forms":["(+) S + am/is/are + V-ing","(−) S + am/is/are + not + V-ing","(?) Am/Is/Are + S + V-ing?"],"points":["Diễn tả hành động đang xảy ra tại thời điểm nói: We are saving energy now.","Diễn tả việc đang diễn ra trong giai đoạn hiện tại: They're building a solar farm this year.","Dấu hiệu: now, right now, at the moment, at present, Look!, Listen!, this week.","Thêm -ing: use → using, run → running, lie → lying.","Không dùng tiếp diễn với động từ chỉ trạng thái: like, love, know, want, need, understand.","Lỗi hay gặp: thiếu am/is/are (She using solar energy ✗ → She is using solar energy)."],"examples":[["We are using more solar energy now.","Hiện nay chúng tôi đang dùng nhiều năng lượng mặt trời hơn."],["Look! The wind turbines are turning.","Nhìn kìa! Các tua-bin gió đang quay."],["My dad isn't driving to work this week.","Tuần này bố tôi không lái xe đi làm."],["Are they building a new power plant?","Họ có đang xây nhà máy điện mới không?"]],"memo":"Đang làm = am/is/are + V-ing; thiếu be là sai ngay.","quiz":[{"q":"Be quiet! The teacher ____ about renewable energy.","opts":["talks","is talking","talk","are talking"],"a":1,"why":"Be quiet! cho thấy hành động đang xảy ra; chủ ngữ the teacher số ít → is talking."},{"q":"At the moment, we ____ off the lights to save electricity.","opts":["turn","turning","are turning","is turning"],"a":2,"why":"At the moment → hiện tại tiếp diễn; chủ ngữ we → are turning."},{"q":"____ your brother using the computer now?","opts":["Is","Does","Are","Do"],"a":0,"why":"Câu hỏi hiện tại tiếp diễn, chủ ngữ your brother số ít → Is + S + V-ing."},{"q":"I ____ how solar panels work.","opts":["am knowing","knowing","am know","know"],"a":3,"why":"Know là động từ chỉ trạng thái, không dùng ở thì tiếp diễn → I know."}]},{"id":"gk-12","lvl":"kids","chap":"Unit 11 · Travelling in the future","title":"Thì tương lai đơn (Future simple: will)","sum":"Dùng will để dự đoán về tương lai, nói quyết định ngay lúc nói, lời hứa hoặc lời đề nghị.","forms":["(+) S + will + V","(−) S + will not (won't) + V","(?) Will + S + V …?"],"points":["Dùng will để dự đoán về tương lai: People will travel by flying car.","Dùng will cho quyết định ngay lúc nói, lời hứa, lời đề nghị: I'll help you.","Dấu hiệu: tomorrow, next week/year, in the future, in 2050, soon, I think, probably.","will dùng cho mọi chủ ngữ; sau will là động từ nguyên mẫu không 'to'.","Viết tắt: I'll, you'll, he'll, we'll; will not = won't.","Lỗi hay gặp: will goes ✗, will to go ✗ → will go."],"examples":[["In the future, we will travel by hyperloop.","Trong tương lai, chúng ta sẽ đi lại bằng tàu siêu tốc hyperloop."],["Driverless cars will be popular soon.","Xe tự lái sẽ sớm trở nên phổ biến."],["Bikes won't disappear in the future.","Xe đạp sẽ không biến mất trong tương lai."],["Will people travel to Mars?","Liệu con người có du lịch lên sao Hỏa không?"]],"memo":"Will + V nguyên mẫu cho mọi ngôi — không thêm s, không có to.","quiz":[{"q":"I think people ____ flying cars in 2050.","opts":["use","will use","used","are use"],"a":1,"why":"I think và in 2050 → dự đoán tương lai: will + V nguyên mẫu."},{"q":"Don't worry. I ____ you to the station tomorrow.","opts":["will to drive","drove","will drive","drives"],"a":2,"why":"Lời hứa, có tomorrow → will drive; sau will không có to."},{"q":"Solar-powered buses ____ pollute the air, so they are eco-friendly.","opts":["won't","will","don't will","aren't"],"a":0,"why":"Xe buýt chạy năng lượng mặt trời thân thiện môi trường → sẽ không gây ô nhiễm: won't + V."},{"q":"____ we travel by bamboo-copter in the future?","opts":["Are","Did","Was","Will"],"a":3,"why":"In the future → câu hỏi tương lai đơn: Will + S + V?"}]},{"id":"gk-13","lvl":"kids","chap":"Unit 11 · Travelling in the future","title":"Đại từ sở hữu (Possessive pronouns)","sum":"Dùng mine, yours, his, hers, ours, theirs để chỉ vật thuộc về ai mà không cần nhắc lại danh từ.","forms":["my → mine, your → yours, his → his, her → hers, our → ours, their → theirs","Đại từ sở hữu = tính từ sở hữu + danh từ: my bike → mine","This / That + N + is + mine / yours / hers …"],"points":["Đại từ sở hữu thay cho tính từ sở hữu + danh từ để tránh lặp: Your car is red; mine is white.","my → mine, your → yours, his → his, her → hers, our → ours, their → theirs.","Sau đại từ sở hữu KHÔNG có danh từ: This is mine (không nói mine bike).","Tính từ sở hữu luôn đi kèm danh từ: my bike, her skateboard, their car.","Đại từ sở hữu không có dấu ': yours, hers, ours ✓ — your's, her's ✗."],"examples":[["This helmet is mine.","Chiếc mũ bảo hiểm này là của tôi."],["Is that electric bike yours?","Chiếc xe đạp điện kia là của bạn à?"],["Their car is old, but ours is new.","Xe của họ cũ, nhưng xe của chúng tôi thì mới."],["My ticket is here. Where's hers?","Vé của tôi ở đây. Vé của cô ấy đâu?"]],"memo":"Có danh từ theo sau → my/your/her; đứng một mình → mine/yours/hers.","quiz":[{"q":"This is not my bag. ____ is blue.","opts":["Me","My","Mine","I"],"a":2,"why":"Đứng một mình thay cho my bag → đại từ sở hữu Mine."},{"q":"Is this skateboard ____, Tom?","opts":["your","yours","you","your's"],"a":1,"why":"Không có danh từ theo sau → yours; đại từ sở hữu không có dấu '."},{"q":"We have our car, and they have ____.","opts":["theirs","their","them","they"],"a":0,"why":"Thay cho their car → theirs."},{"q":"Lan has a pink bike. ____ bike is new, too.","opts":["Hers","She","Herself","Her"],"a":3,"why":"Đứng trước danh từ bike → dùng tính từ sở hữu Her, không dùng Hers."}]},{"id":"gk-14","lvl":"kids","chap":"Unit 12 · English-speaking countries","title":"Mạo từ a / an / the (Articles)","sum":"Dùng a/an với danh từ đếm được số ít chưa xác định; dùng the với người, vật đã xác định hoặc duy nhất.","forms":["a + danh từ số ít bắt đầu bằng âm phụ âm: a castle, a university","an + danh từ số ít bắt đầu bằng âm nguyên âm: an island, an hour","the + danh từ đã xác định / duy nhất: the sun, the Thames, the USA","Không dùng mạo từ: hầu hết tên nước, thành phố, châu lục (Canada, London)"],"points":["a/an dùng với danh từ đếm được số ít, nhắc đến lần đầu hoặc chưa xác định.","an đứng trước âm nguyên âm (không phải chữ cái): an hour, an umbrella; nhưng a university, a uniform.","the dùng khi người nghe đã biết đối tượng hoặc đối tượng đã được nhắc đến trước đó.","the dùng với vật duy nhất (the sun), sông, biển (the Thames), tên nước có States, Kingdom (the USA, the UK).","Không dùng the với tên hầu hết quốc gia, thành phố, châu lục: Canada, Sydney, Australia.","Lỗi hay gặp: a apple ✗ → an apple; the Australia ✗ → Australia."],"examples":[["Sydney has an amazing opera house.","Sydney có một nhà hát opera tuyệt đẹp."],["We visited a castle. The castle was very old.","Chúng tôi đã thăm một lâu đài. Lâu đài ấy rất cổ."],["The Thames flows through London.","Sông Thames chảy qua Luân Đôn."],["He lives in the USA, not in Canada.","Anh ấy sống ở Mỹ, không phải ở Canada."]],"memo":"Nghe âm đầu: nguyên âm → an, phụ âm → a; người nghe đã biết rõ → the.","quiz":[{"q":"New Zealand is ____ island country.","opts":["an","a","some","many"],"a":0,"why":"Island bắt đầu bằng âm nguyên âm /aɪ/, danh từ số ít → an."},{"q":"My uncle is ____ university teacher in Canada.","opts":["an","a","some","any"],"a":1,"why":"University bắt đầu bằng âm /j/ (phụ âm) dù chữ đầu là u → a."},{"q":"____ River Thames is famous for its bridges.","opts":["A","An","The","(không dùng mạo từ)"],"a":2,"why":"Tên sông dùng the: The River Thames."},{"q":"She has visited ____ Australia twice.","opts":["a","an","the","(không dùng mạo từ)"],"a":3,"why":"Tên hầu hết quốc gia (Australia) không dùng mạo từ."}]},{"id":"gt-01","lvl":"toeic","chap":"Từ loại","title":"Từ loại & vị trí trong câu (Parts of speech)","sum":"Nhận diện danh từ, tính từ, trạng từ, động từ qua vị trí và hậu tố — dạng câu chiếm nhiều nhất ở Part 5.","forms":["Tính từ + danh từ: a significant increase","Trạng từ + động từ / tính từ: carefully reviewed, highly qualified","Mạo từ / tính từ sở hữu + (adj) + N: the final decision, our new policy","be / become / remain / seem + tính từ: remain competitive","have/be + adv + V3: has been successfully completed"],"points":["Danh từ đứng sau mạo từ, tính từ sở hữu, giới từ; làm chủ ngữ/tân ngữ: the approval of, for your cooperation.","Tính từ đứng trước danh từ hoặc sau linking verb (be, become, remain, seem, stay).","Trạng từ bổ nghĩa cho động từ, tính từ, cả câu; hay nằm giữa trợ động từ và V3.","Hậu tố danh từ: -tion, -ment, -ance, -ity, -ness, -er/-or; tính từ: -ive, -able, -ful, -ous
