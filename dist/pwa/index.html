<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nhịp Học Tiếng Anh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Học từ mới (Tiếng Anh 7 & TOEIC 750), câu giao tiếp và 44 âm IPA mỗi ngày — chạy offline.">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#15223A"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* Layout concept: a student's notebook — ruled index cards on cool paper, the one bold mark is a yellow highlighter swipe on what to remember. */
:root {
  --paper: #F3F5F9; --card: #FFFFFF; --ink: #15223A; --muted: #59687F; --rule: #DAE1EC; --chip: #E7EDF7;
  --hl: #FFE066; --hl-swipe: #FFE066; --hl-ink: #3A2F00; --action: #2450B8; --action-ink: #FFFFFF;
  --good: #1D8556; --warn: #A86A12; --bad: #BE3B35;
  --f-display: "Lexend", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ipa: "Noto Sans", "Lucida Sans Unicode", "DejaVu Sans", "Segoe UI", sans-serif;
  --r: 14px; --shadow: 0 1px 2px rgba(21,34,58,.06), 0 6px 18px rgba(21,34,58,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0D1421; --card: #142034; --ink: #E4EBF5; --muted: #98A7BD; --rule: #24324B; --chip: #1C2A43;
  --hl: #E3C23C; --hl-swipe: rgba(227, 194, 60, .34); --hl-ink: #211A00; --action: #84A6FF; --action-ink: #0A1430;
  --good: #4BC48B; --warn: #E2A64C; --bad: #F2807A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0D1421; --card: #142034; --ink: #E4EBF5; --muted: #98A7BD; --rule: #24324B; --chip: #1C2A43;
  --hl: #E3C23C; --hl-swipe: rgba(227, 194, 60, .34); --hl-ink: #211A00; --action: #84A6FF; --action-ink: #0A1430;
  --good: #4BC48B; --warn: #E2A64C; --bad: #F2807A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card) }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; border-radius: 6px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2 }
h2 { font-size: 1.35rem } h3 { font-size: 1.05rem }
p { margin: 0 }
.ipa { font-family: var(--f-ipa); letter-spacing: .01em }
.hl { background: linear-gradient(transparent 52%, var(--hl-swipe) 52%, var(--hl-swipe) 90%, transparent 90%); color: inherit; padding: 0 .08em }
.muted { color: var(--muted) }
.small { font-size: .86rem }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.num { font-variant-numeric: tabular-nums }

/* Shell */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid var(--rule) }
.top-in { max-width: 980px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto }
.brand b { font: 700 1.25rem var(--f-display); letter-spacing: -.01em }
.brand b span { background: linear-gradient(transparent 58%, var(--hl-swipe) 58%, var(--hl-swipe) 92%, transparent 92%); padding: 0 .06em }
/* Subject switch: Tiếng Anh (with its level menu), Toán, Vật lí side by side */
.subjects { display: inline-flex; align-items: center; background: var(--chip); border-radius: 999px; padding: 3px; gap: 2px }
.subjects button[data-subject] { border: 0; background: transparent; padding: 6px 13px; border-radius: 999px; font-weight: 600; font-size: .9rem; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px }
.subjects button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow) }
.subjects button[data-subject] small { font-size: .72rem; font-weight: 700; color: var(--action); background: color-mix(in srgb, var(--action) 12%, transparent); border-radius: 999px; padding: 1px 7px }
.subjects .caret { font-size: .7rem; opacity: .7 }
.subj-en { position: relative }
.lvmenu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 40; display: grid; gap: 4px; min-width: 230px; padding: 6px; border-radius: 14px; background: var(--card); border: 1px solid var(--rule); box-shadow: var(--shadow) }
.lvmenu[hidden] { display: none }
.lvmenu button { border: 0; background: transparent; text-align: left; padding: 9px 12px; border-radius: 10px; font-weight: 700; color: var(--ink); display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: center }
.lvmenu button small { grid-column: 2; font-weight: 500; font-size: .76rem; color: var(--muted) }
.lvmenu button:hover { background: var(--chip) }
.lvmenu button[aria-pressed="true"] { background: color-mix(in srgb, var(--action) 14%, transparent); color: var(--action) }
.lvmenu button[aria-pressed="true"]::after { content: "✓"; grid-row: 1; grid-column: 3 }
@media (max-width: 420px) { .subjects button[data-subject] { padding: 6px 9px; font-size: .84rem } .subjects button[data-subject] small { display: none } }
.streak { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .9rem }
.tabs { max-width: 980px; margin: 0 auto; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)) }
.tabs::-webkit-scrollbar { display: none }
.tabs button { border: 0; background: none; padding: 10px 12px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 6px }
.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--hl) }
.tabs svg { width: 18px; height: 18px }
main { max-width: 980px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px }
@media (max-width: 640px) {
  .tabs-wrap { position: fixed; inset: auto 0 0 0; z-index: 25; background: var(--card); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px) }
  .tabs { justify-content: space-between; gap: 0 }
  .tabs button { flex-direction: column; gap: 2px; font-size: .7rem; padding: 8px 4px 6px; border-bottom: 0; border-top: 3px solid transparent; flex: 1 }
  .tabs button[aria-current="page"] { border-top-color: var(--hl) }
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) }
  .streak .xp { display: none }
}

/* Building blocks */
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px; min-width: 0 }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
.grid { display: grid; gap: 14px }
.g3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }
.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)) }
.stack { display: grid; gap: 10px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--rule); background: var(--card); padding: 9px 14px; border-radius: 10px; font-weight: 600; min-height: 40px }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--action); color: var(--action-ink); border-color: var(--action) }
.btn.primary:hover { filter: brightness(1.08) }
.btn.ghost { border-color: transparent; background: transparent }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: .86rem }
.btn:disabled { opacity: .5; cursor: not-allowed }
.icon-btn { width: 40px; height: 40px; padding: 0; border-radius: 50% }
.btn svg, .icon-btn svg { width: 18px; height: 18px; flex: none }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--chip); font-size: .78rem; font-weight: 600; color: var(--muted) }
.chip.good { color: var(--good) } .chip.warn { color: var(--warn) } .chip.new { color: var(--action) }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--chip); padding: 3px; border-radius: 10px }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: .88rem; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow) }
.bar { height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden }
.bar > i { display: block; height: 100%; background: var(--action); border-radius: inherit }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden }
.stepper button { border: 0; background: var(--chip); width: 38px; height: 38px; font-size: 1.1rem; font-weight: 700 }
.stepper output { min-width: 46px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums }
input[type=search], input[type=text], input[type=password], select, textarea { border: 1px solid var(--rule); background: var(--card); border-radius: 10px; padding: 9px 12px; min-height: 40px; min-width: 0 }
textarea { font: inherit; color: inherit; resize: vertical; width: 100%; line-height: 1.45 }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .55 }
.chip.cls { color: #7A3FC4; background: color-mix(in srgb, #7A3FC4 12%, var(--chip)) }
.cls-tag { color: #7A3FC4; font-weight: 700 }
.btn.danger { color: var(--bad); border-color: var(--bad) }

/* Lớp học → Học liệu */
.sheet.wide { width: min(780px, 100%) }
.edform .fld { gap: 4px; min-width: 0 }
.edform .fld input, .edform .fld select { width: 100% }
.edform .grid { gap: 12px }
.qb { border: 1px dashed var(--rule); border-radius: 14px; padding: 12px; margin: 0; min-width: 0 }
.qb legend { padding: 0 6px }
.qblock { padding: 10px; border-radius: 12px; background: var(--chip); gap: 8px }
.qopts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 6px }
.qopt { display: grid; grid-template-columns: auto auto 1fr; gap: 6px; align-items: center }
.qopt input[type=radio] { accent-color: var(--good); width: 18px; height: 18px; margin: 0 }
.qopt span { font-weight: 700; color: var(--muted); width: 1.1em }
.qblock input[type=text] { width: 100% }
.list .emo { font-size: 1.5rem; width: 1.6em; text-align: center }
.pk-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)) }
@media (max-width: 640px) { .pk-grid { grid-template-columns: minmax(0, 1fr) } }
.pk-card h3 { margin: 0 }
input[type=range] { accent-color: var(--action); width: 100% }

/* Today */
.hello { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px }
.hello h1 { font-size: clamp(1.5rem, 4vw, 2rem) }
.goal { display: grid; gap: 10px; align-content: start }
.goal .big { font: 700 2rem var(--f-display); font-variant-numeric: tabular-nums }
.goal .big small { font-size: 1rem; color: var(--muted); font-weight: 600 }
.goal.done { border-color: var(--good) }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 84px }
.week div { display: grid; gap: 4px; justify-items: center; align-content: end; height: 100% }
.week i { width: 100%; max-width: 30px; border-radius: 6px 6px 3px 3px; background: var(--chip); min-height: 4px }
.week i.on { background: var(--action) }
.week i.today { outline: 2px solid var(--hl); outline-offset: 1px }
.week span { font-size: .72rem; color: var(--muted) }

/* Flashcard */
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-columns: minmax(0, 240px) 1fr }
.card .pic-wrap { position: relative; padding: 18px; border-right: 1px solid var(--rule); display: grid; place-items: center }
.card .body { padding: 20px 22px 20px 26px; display: grid; gap: 10px; align-content: start; min-width: 0;
  box-shadow: inset 3px 0 0 color-mix(in srgb, var(--bad) 35%, transparent) }
.word { font: 700 clamp(1.8rem, 6vw, 2.6rem) var(--f-display); letter-spacing: -.015em; overflow-wrap: anywhere }
.pos { font-style: italic; color: var(--muted); font-weight: 600 }
.meaning { font-size: 1.15rem; font-weight: 600 }
.example { padding: 4px 0; border-top: 1px dashed var(--rule); padding-top: 10px }
.example em { font-style: normal }
@media (max-width: 640px) { .card { grid-template-columns: 1fr } .card .pic-wrap { border-right: 0; border-bottom: 1px solid var(--rule) } }
.pic { width: 100%; max-width: 200px; aspect-ratio: 1; border-radius: 16px; display: grid; place-items: center; background: var(--chip); overflow: hidden; font-size: clamp(64px, 18vw, 110px); line-height: 1; user-select: none }
.pic img { width: 100%; height: 100%; object-fit: cover }
.pic.sm { width: 44px; height: 44px; max-width: 44px; font-size: 26px; border-radius: 10px }
.pic.md { max-width: 120px; font-size: 64px }
.edit-pic { position: absolute; right: 12px; bottom: 12px }
.dots { display: flex; gap: 6px; flex-wrap: wrap }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--chip) }
.dots i.on { background: var(--action) } .dots i.cur { background: var(--hl); outline: 2px solid var(--ink) }

/* Quiz */
.choices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) }
.choice { text-align: left; border: 2px solid var(--rule); background: var(--card); border-radius: 12px; padding: 12px 14px; font-weight: 600; min-height: 52px }
.choice:hover:not(:disabled) { border-color: var(--action) }
.choice.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--card)) }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--card)) }
.feedback { font-weight: 600 } .feedback.ok { color: var(--good) } .feedback.no { color: var(--bad) }

/* Lists */
.list { display: grid }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--rule); min-width: 0 }
.item:last-child { border-bottom: 0 }
.item .t { min-width: 0 }
.item .t b { font-family: var(--f-display) }
.item button.linkish { all: unset; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; min-width: 0 }
.item button.linkish:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; border-radius: 6px }
.topic { display: grid; gap: 6px }
.topic-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline }

/* Sentences */
.sent { display: grid; gap: 10px }
.sent .en { font: 600 clamp(1.15rem, 3.2vw, 1.4rem)/1.4 var(--f-display) }
.sent .vi { color: var(--muted) }
.note { font-size: .86rem; border-left: 3px solid var(--hl); padding-left: 10px }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; min-height: 44px; padding: 6px; border: 1px dashed var(--rule); border-radius: 10px }
.tile { border: 1px solid var(--rule); background: var(--chip); padding: 4px 10px; border-radius: 8px; font-weight: 600 }
.score { font: 700 1.6rem var(--f-display) }

/* IPA */
.ipa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px }
.snd { position: relative; border: 1px solid var(--rule); background: var(--card); border-radius: 12px; padding: 10px 4px 8px; display: grid; justify-items: center; gap: 2px }
.snd b { font: 600 1.6rem var(--f-ipa) }
.snd span { font-size: .7rem; color: var(--muted); text-align: center; line-height: 1.2 }
.snd.learned { border-color: var(--good) }
.snd.learned::after { content: ""; position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--good) }
.snd[aria-pressed="true"] { border-color: var(--action); box-shadow: 0 0 0 2px var(--action) inset }
.snd-detail { display: grid; gap: 14px }
.snd-sym { font: 600 3.4rem/1 var(--f-ipa) }
.ex-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px }
.ex { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--rule); border-radius: 10px; padding: 6px 6px 6px 12px; min-width: 0 }
.ex div { min-width: 0 }
.path { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px }
.path button { text-align: left; border: 1px solid var(--rule); background: var(--card); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px }
details { border-top: 1px solid var(--rule); padding: 10px 0 }
details summary { cursor: pointer; font-weight: 600; font-family: var(--f-display) }
details[open] summary { margin-bottom: 8px }

/* Progress */
.boxes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 110px }
.boxes div { display: grid; justify-items: center; gap: 4px; align-content: end; height: 100% }
.boxes i { width: 100%; max-width: 34px; background: var(--action); border-radius: 6px 6px 2px 2px; min-height: 2px }
.boxes span { font-size: .72rem; color: var(--muted) }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px }
.badge { border: 1px solid var(--rule); border-radius: 12px; padding: 10px; display: grid; gap: 4px; justify-items: center; text-align: center; font-size: .82rem; font-weight: 600 }
.badge .m { font-size: 1.7rem; filter: grayscale(1); opacity: .45 }
.badge.on { border-color: var(--hl) } .badge.on .m { filter: none; opacity: 1 }
.setting { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule) }
.setting:last-child { border-bottom: 0 }
@media (max-width: 520px) { .setting { grid-template-columns: 1fr } }

/* Farm — a bright game skin that stays sunny in dark mode too */
.farm-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; color: #fff; font-weight: 700; font-size: .9rem; min-height: 38px; padding: 6px 14px; border-radius: 999px;
  background: linear-gradient(#6CCB5F, #3FA34D); box-shadow: 0 3px 0 #2E7D32; text-shadow: 0 1px 0 rgba(0,0,0,.25) }
.farm-btn b { font-family: var(--f-display); background: rgba(255,255,255,.22); border-radius: 999px; padding: 1px 8px }
.farm-btn[aria-pressed="true"] { box-shadow: 0 3px 0 #2E7D32, 0 0 0 3px #FFD84D }
.farmv { --ink: #3B2A14; --muted: #7A5C3A; --rule: #EBD3A0; --chip: #FFE7A8; --card: #FFF8E6; --action: #3FA34D;
  color: var(--ink); display: grid; gap: 16px }
.farmv .panel { background: #FFF6DC; border: 3px solid #E7BF79; border-radius: 20px; box-shadow: 0 5px 0 #D29F55 }
.farmv h2 { color: #7A4514 }
.farmv .btn { border: 0; background: #fff; color: #5A3A12; box-shadow: 0 3px 0 #D9B57A; border-radius: 12px }
.farmv .btn.primary { background: linear-gradient(#6CCB5F, #3FA34D); color: #fff; box-shadow: 0 3px 0 #2E7D32; text-shadow: 0 1px 0 rgba(0,0,0,.2) }
.farmv .btn.ghost { background: transparent; box-shadow: none }
.farmv .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #D9B57A }
.farmv .chip { background: #FFE7A8; color: #7A4514 } .farmv .chip.good { background: #D8F5C8; color: #2E7D32 }
.farmv .bar { background: #F1DDB0; height: 10px } .farmv .bar > i { background: linear-gradient(90deg, #9BE36D, #3FA34D) }
.farmv .pic { background: #FFE9B8 }
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 18px; border-radius: 22px;
  background: linear-gradient(#FFF3C4, #FFE08A); border: 3px solid #E7BF79; box-shadow: 0 5px 0 #D29F55 }
.hud .lvl { width: 58px; height: 58px; flex: none; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: radial-gradient(circle at 35% 30%, #FFE98A, #F5A623); border: 3px solid #fff; box-shadow: 0 3px 0 #C77D12 }
.hud .lvl span { font-size: 2rem; line-height: 1 } .hud .lvl b { position: absolute; font: 700 1.05rem var(--f-display); color: #7A3E00 }
.hud .main { flex: 1 1 200px; display: grid; gap: 4px; min-width: 0 } .hud h1 { color: #6B3410; font-size: clamp(1.35rem, 4vw, 1.8rem) }
.pills { display: flex; flex-wrap: wrap; gap: 8px }
.pill { display: inline-flex; align-items: center; gap: 6px; background: #fff; border-radius: 999px; padding: 5px 12px 5px 8px; font-weight: 700; color: #5A3A12; box-shadow: 0 3px 0 #D9B57A }
.pill b { font-family: var(--f-display); font-variant-numeric: tabular-nums }
.pill.time { background: #E3F6FF; box-shadow: 0 3px 0 #8CC8E6; color: #0E5A7D }
.scene-wrap { position: relative; border-radius: 22px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 5px 0 #8CC8E6, 0 10px 24px rgba(30,80,120,.18); background: #8FD8FF }
svg.scene { display: block; width: 100%; height: clamp(200px, 33vw, 300px) }
svg.scene.wide { height: auto; aspect-ratio: 1300 / 300 }
.bubble { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); background: #fff; color: #3B2A14;
  border-radius: 16px; padding: 8px 14px; font-weight: 600; font-size: .92rem; text-align: center; box-shadow: 0 3px 0 rgba(0,0,0,.12) }
@media (max-width: 640px) { .bubble { font-size: .78rem; padding: 6px 10px; top: 8px } }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; border: 8px solid transparent; border-bottom: 0; border-top-color: #fff; transform: translateX(-50%) }
.field { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; padding: 12px; border-radius: 16px; background: #7CC85A; border: 3px solid #5DAA3E;
  background-image: radial-gradient(#8FD66B 2px, transparent 2.5px); background-size: 18px 18px }
.plot { position: relative; aspect-ratio: 1; border: 0; border-radius: 14px; color: #fff; display: grid; place-items: center; align-content: center; gap: 4px; padding: 6px; min-width: 0;
  background: repeating-linear-gradient(180deg, #A8723F 0 9px, #8E5D30 9px 12px); box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), 0 3px 0 #6E4423 }
.plot .e { font-size: 2.3rem; line-height: 1; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)) }
.plot .e.s1 { font-size: 1.3rem } .plot .e.s2 { font-size: 1.8rem } .plot .e.s3 { font-size: 2rem; opacity: .8 }
.plot.empty .e { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.9); color: #3FA34D; font: 700 1.5rem/34px var(--f-display); text-align: center; filter: none }
.plot .lbl, .plot .t { background: rgba(255,255,255,.9); color: #5A3A12; border-radius: 999px; padding: 1px 8px; font-size: .72rem; font-weight: 700 }
.plot .bar { width: 78%; height: 6px; background: rgba(255,255,255,.45) }
.plot.ready { box-shadow: 0 0 0 3px #FFD84D, inset 0 -5px 0 rgba(0,0,0,.18), 0 3px 0 #6E4423 }
.plot.ready::after { content: "✨"; position: absolute; top: 4px; right: 6px; font-size: .9rem }
.orders { display: grid; gap: 10px }
.order { background: #fff; border-radius: 14px; padding: 12px; display: grid; gap: 10px; box-shadow: 0 3px 0 #EBD3A0; border-left: 6px solid #F5A623 }
.need { display: flex; flex-wrap: wrap; gap: 6px }
.need.learn span.no { background: #EEF2FF; color: #3730A3 } .need.learn span.ok { font-weight: 700 }
.need span { padding: 3px 10px; border-radius: 999px; background: #FFF1CC; font-weight: 700; font-size: .9rem }
.need .ok { color: #2E7D32; background: #DDF6CF } .need .no { color: #B23A2E }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px }
.shop .it { background: #fff; border-radius: 14px; padding: 10px; display: grid; gap: 4px; align-content: start; min-width: 0; box-shadow: 0 3px 0 #EBD3A0 }
.shop .it .e { font-size: 2rem; line-height: 1.1 }
.shop .it.owned { box-shadow: 0 0 0 2px #6CCB5F, 0 3px 0 #EBD3A0 }
.farmv .item { border-bottom-color: #EBD3A0 }
.earn { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px }
.lockcard { text-align: center; justify-items: center }
.lockcard .big { font: 700 2.4rem var(--f-display); color: #6B3410 }
.lockcard .bar { width: min(420px, 100%) }
.lockcard .earn { text-align: left }
@media (prefers-reduced-motion: no-preference) {
  .plot.ready .e, .animal .pic { animation: bob 1.6s ease-in-out infinite }
  .plot.ready::after { animation: twinkle 1.2s ease-in-out infinite }
  @keyframes bob { 50% { transform: translateY(-4px) } }
  @keyframes twinkle { 50% { opacity: .3; transform: scale(.7) } }
  .scene .cloud { animation: drift linear infinite }
  .scene .bird { animation: fly 26s linear infinite }
  .scene .blades { animation: spin 7s linear infinite }
  .scene .rays { animation: spin 30s linear infinite }
  .scene .walk { animation: walk 22s linear infinite }
  .scene .flip { animation: flip 22s steps(1) infinite }
  .scene .leg { animation: swing .45s ease-in-out infinite alternate }
  .scene .leg.b { animation-delay: -.45s }
  .scene .wave { animation: wave 1.1s ease-in-out infinite alternate }
  .scene .peck { animation: peck 1.8s ease-in-out infinite }
  .scene .tail { animation: tail 1.4s ease-in-out infinite alternate }
  .scene .chew { animation: chew 2.4s ease-in-out infinite }
  .scene .hop { animation: hop 1.6s ease-in-out infinite }
  .scene .orbit { animation: spin 3s linear infinite }
  .scene .sway { animation: sway 3s ease-in-out infinite alternate }
  @keyframes drift { from { transform: translateX(-200px) } to { transform: translateX(1000px) } }
  @keyframes fly { from { transform: translate(-60px, 0) } 50% { transform: translate(420px, -14px) } to { transform: translate(900px, 6px) } }
  @keyframes spin { to { transform: rotate(360deg) } }
  @keyframes walk { 0%, 4% { transform: translate(240px, 236px) } 46%, 54% { transform: translate(560px, 236px) } 96%, 100% { transform: translate(240px, 236px) } }
  @keyframes flip { 0% { transform: scaleX(1) } 50% { transform: scaleX(-1) } }
  @keyframes swing { from { transform: rotate(-18deg) } to { transform: rotate(18deg) } }
  @keyframes wave { from { transform: rotate(-150deg) } to { transform: rotate(-100deg) } }
  @keyframes peck { 0%, 55%, 100% { transform: rotate(0) } 65%, 85% { transform: rotate(48deg) } 75% { transform: rotate(38deg) } }
  @keyframes tail { from { transform: rotate(-12deg) } to { transform: rotate(16deg) } }
  @keyframes chew { 0%, 60%, 100% { transform: rotate(0) } 70%, 90% { transform: rotate(10deg) } }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0) } 75% { transform: translateY(-8px) } }
  @keyframes sway { from { transform: rotate(-3deg) } to { transform: rotate(3deg) } }
}
.scene .walk { transform: translate(240px, 236px) }

/* Spirit beasts */
.beasts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px }
.beast { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 3px 0 #EBD3A0; display: grid; grid-template-rows: auto 1fr; min-width: 0 }
.art { position: relative; overflow: hidden; aspect-ratio: 230 / 178; background: #F6D98B }
.art img, .art .noimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block }
.art img { transform-origin: 50% 100% } /* grow upwards so the name label at the bottom stays visible */
.art .noimg { display: grid; place-items: center; color: #fff; font: 700 2rem var(--f-display) }
.art.big { border-radius: 14px }
.art .aura { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(60% 55% at 50% 62%, var(--aura), transparent 70%); mix-blend-mode: screen; opacity: .15 }
.art .spark { position: absolute; bottom: -8px; left: var(--x); width: 6px; height: 6px; border-radius: 50%; background: var(--aura); box-shadow: 0 0 6px 2px var(--aura); opacity: 0; pointer-events: none }
.art .shine { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.28) 50%, transparent 65%); transform: translateX(-130%) }
.art .flash { position: absolute; inset: 0; pointer-events: none; background: rgba(220,240,255,.9); opacity: 0; mix-blend-mode: overlay }
.beast { transition: transform .25s }
.beast.locked img { filter: grayscale(1) brightness(.55) }
.beast:not(.owned):not(.locked) img { filter: saturate(.75) brightness(.88) }
.beast.owned { box-shadow: 0 0 0 3px #FFC83D, 0 3px 0 #EBD3A0 }
@media (prefers-reduced-motion: no-preference) {
  .beast:not(.locked) .art img, .art.big img { animation: breathe 5.5s ease-in-out infinite }
  .beast.owned .art img, .art.big img { animation-duration: 4s }
  .beast:not(.locked) .aura, .art.big .aura { animation: aura 3.2s ease-in-out infinite }
  .beast.owned .spark, .art.big .spark { animation: rise var(--s) linear infinite; animation-delay: var(--d) }
  .beast:not(.locked) .shine, .art.big .shine { animation: shine 5s ease-in-out infinite }
  .beast:not(.locked) .storm .flash, .art.big.storm .flash { animation: flash 4.2s linear infinite }
  .beast:not(.locked):hover { transform: translateY(-4px) rotate(-.4deg) }
  .beast.owned { animation: glowcard 2.6s ease-in-out infinite }
  @keyframes breathe { 0%, 100% { transform: scale(1.04) rotate(0) } 20% { transform: scale(1.08) rotate(-.8deg) } 40% { transform: scale(1.04) rotate(0) }
    60% { transform: scale(1.08) rotate(.8deg) } 80% { transform: scale(1.05) rotate(0) } }
  @keyframes aura { 0%, 100% { opacity: .12 } 50% { opacity: .45 } }
  @keyframes rise { 0% { transform: translateY(0) scale(1); opacity: 0 } 12% { opacity: 1 } 100% { transform: translate(12px, -260px) scale(.3); opacity: 0 } }
  @keyframes shine { 0%, 60% { transform: translateX(-130%) } 85%, 100% { transform: translateX(130%) } }
  @keyframes flash { 0%, 89%, 92%, 95%, 100% { opacity: 0 } 90% { opacity: .9 } 93% { opacity: .55 } }
  @keyframes glowcard { 0%, 100% { box-shadow: 0 0 0 3px #FFC83D, 0 3px 0 #EBD3A0 } 50% { box-shadow: 0 0 0 3px #FFC83D, 0 0 24px 5px var(--aura) } }
}
.beast .bd { padding: 10px 12px 12px; display: grid; gap: 6px; align-content: start; min-width: 0 }
.stars { color: #F5A623; letter-spacing: 1px; font-size: .9rem }
.stamina { height: 10px; border-radius: 999px; background: #DDEBFA; overflow: hidden }
.stamina > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #7CC8FF, #3B82F6) }
.plot .pbadge { position: absolute; left: 4px; top: 4px; background: #FFD84D; color: #6B3410; font-size: .6rem; font-weight: 800; border-radius: 999px; padding: 1px 5px }
.plot .bbadge { position: absolute; right: 4px; bottom: 4px; background: #6C5CE7; color: #fff; font-size: .6rem; font-weight: 800; border-radius: 999px; padding: 1px 5px }

/* Toán & Vật lí */
.stem-list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) }
.stem-item { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 12px; border-radius: 14px; border: 1px solid var(--rule); background: var(--card); color: inherit; font: inherit; cursor: pointer }
.stem-item:hover { border-color: var(--action) } .stem-item.done { background: color-mix(in srgb, #3FB66B 9%, var(--card)) }
.stem-item .si-ic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--chip); font-weight: 800 }
.stem-item.done .si-ic { background: #3FB66B; color: #fff }
.viz-box { border-radius: 16px; background: #F8FBFF; border: 1px solid #DCE6F2; overflow: hidden }
.viz-svg { display: block; width: 100%; height: auto; max-height: 420px; font-family: var(--f-body, system-ui), sans-serif }
.viz-info { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--chip); line-height: 1.55 }
.viz-ctrls { display: grid; gap: 10px 18px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }
.viz-ctl { display: grid; gap: 4px; font-size: .92rem } .viz-ctl input { width: 100%; accent-color: var(--action) }
.stem-points { margin: 0; padding-left: 20px; display: grid; gap: 6px }
.formulas { display: grid; gap: 6px } .formulas div { padding: 8px 12px; border-radius: 10px; background: #FFF6DC; color: #6B3410; font-weight: 700; border-left: 4px solid #F2C14E }
.memo { margin: 0; padding: 10px 12px; border-radius: 12px; background: #EEF2FF; color: #3730A3 }
.stem-sol { white-space: pre-line; margin: 8px 0 0 }
.stem-q { display: grid; gap: 8px; padding-bottom: 10px; border-bottom: 1px dashed var(--rule) } .stem-q p { margin: 0 }
@media (prefers-reduced-motion: no-preference) {
  .viz-svg .jig { animation: jig 1s ease-in-out infinite alternate }
  .viz-svg .flow { stroke-dasharray: 10 6; animation: flowdash 1.2s linear infinite }
  @keyframes jig { from { transform: translate(calc(var(--j) * -1), 0) } 50% { transform: translate(0, var(--j)) } to { transform: translate(var(--j), calc(var(--j) * -.6)) } }
  @keyframes flowdash { to { stroke-dashoffset: -32 } }
}

/* Farm layout, field, farmer, pens and effects */
body.farm-wide main { max-width: min(2400px, 100%) }
body.farm-full .top, body.farm-full::before { display: none }
body.farm-full main { padding-top: 12px; padding-bottom: 24px }
.fullbtn { border: 0; cursor: pointer; font: inherit; font-weight: 700 }
.plot.buy { background: rgba(255,255,255,.35); border: 3px dashed #fff; box-shadow: none; color: #2E7D32 }
.plot.buy .e { font-size: 1.6rem; filter: none }
.plot.buy:disabled { opacity: .7 }
.plot.locked { background: repeating-linear-gradient(180deg, #8DBF6F 0 9px, #7FB262 9px 12px); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); opacity: .78 }
.plot.locked .e { font-size: 1.4rem; filter: none }
.plot.blessed::before { content: ""; position: absolute; inset: -4px; border-radius: 16px; pointer-events: none; box-shadow: 0 0 0 3px #fff, 0 0 18px 6px #FFE66D; animation: fadeout 1.8s ease-out forwards }
@keyframes fadeout { from { opacity: 1 } to { opacity: 0 } }
.floater { position: absolute; left: 50%; top: 10%; transform: translateX(-50%); z-index: 3; pointer-events: none; white-space: nowrap;
  font: 800 1rem var(--f-display); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.4); animation: floatup 1.3s ease-out forwards }
@keyframes floatup { from { transform: translate(-50%, 0); opacity: 1 } to { transform: translate(-50%, -60px); opacity: 0 } }
.farmer-bot { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; transition: transform 1.3s ease-in-out; will-change: transform }
.farmer-bot.left .fb-flip { transform: scaleX(-1) }
.farmer-bot svg { display: block; overflow: visible }
.farmer-bot .drops { opacity: 0 }
/* Farm map: a 1600×1000 world drawn in SVG; the HTML layers on top size themselves in --u (one world unit) so all of it scales together */
.map-scroll { overflow-x: auto; overflow-y: hidden; border-radius: 22px; border: 4px solid #fff; box-shadow: 0 5px 0 #8CC8E6, 0 10px 24px rgba(30,80,120,.18); overscroll-behavior-x: contain }
.land.map { --u: calc(100cqw / 1600); position: relative; width: 100%; min-width: 1040px; aspect-ratio: 16 / 10; container-type: inline-size; overflow: hidden; background: #86C95A }
.map-hint { display: none; text-align: center }
@media (max-width: 1100px) { .map-hint { display: block } }
.map-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
.map .field { position: absolute; display: grid; grid-template-columns: repeat(8, 1fr); gap: calc(8 * var(--u)); padding: 0; border: 0; background: none }
.map .ranch { position: absolute; display: grid; grid-template-columns: 1fr 1fr; gap: calc(9 * var(--u)) calc(15 * var(--u)) }
.map .zone-head { position: absolute; margin: 0; font-size: max(9px, calc(15 * var(--u))); padding: calc(2 * var(--u)) calc(10 * var(--u)); border-radius: calc(8 * var(--u)) }
.map .plot { border-radius: calc(10 * var(--u)); padding: calc(3 * var(--u)); gap: calc(2 * var(--u)) }
.map .plot .e { font-size: calc(30 * var(--u)) } .map .plot .e.s1 { font-size: calc(18 * var(--u)) } .map .plot .e.s2 { font-size: calc(24 * var(--u)) } .map .plot .e.s3 { font-size: calc(26 * var(--u)) }
.map .plot.empty .e { width: calc(26 * var(--u)); height: calc(26 * var(--u)); font-size: calc(20 * var(--u)); line-height: calc(26 * var(--u)) }
.map .plot .lbl, .map .plot .t { font-size: max(7px, calc(11 * var(--u))); padding: 0 calc(5 * var(--u)); white-space: nowrap }
.map .plot .bar { height: calc(5 * var(--u)) }
.map .plot.ready::after { font-size: calc(13 * var(--u)); top: calc(2 * var(--u)); right: calc(4 * var(--u)) }
.map .plot.buy { border-width: calc(3 * var(--u)) } .map .plot.buy .e { font-size: calc(22 * var(--u)) } .map .plot.locked .e { font-size: calc(16 * var(--u)) }
.map .plot .pbadge, .map .plot .bbadge { font-size: max(7px, calc(9 * var(--u))) }
.map .pgroup { padding: calc(6 * var(--u)); border-width: calc(4 * var(--u)); border-radius: calc(12 * var(--u)) }
.map .pg-head { font-size: max(8px, calc(13.5 * var(--u))); margin-bottom: calc(4 * var(--u)); gap: calc(5 * var(--u)) }
.map .pg-tiles { gap: calc(6 * var(--u)) }
.map .atile { aspect-ratio: 6 / 5; border-radius: calc(10 * var(--u)); padding: calc(2 * var(--u)); gap: 0 }
.map .atile .anim { width: 70% }
.map .atile .t, .map .atile .lbl { font-size: max(8px, calc(11 * var(--u))); padding: 0 calc(6 * var(--u)) }
.map .atile .bar { height: calc(4 * var(--u)) } .map .atile .prod { font-size: calc(20 * var(--u)) }
.map .atile.slot { border-width: calc(3 * var(--u)) } .map .atile.slot .e { font-size: calc(20 * var(--u)) }
.map .floater { font-size: max(11px, calc(18 * var(--u))) }
.map .bubble { top: 1.2%; font-size: max(10px, calc(15 * var(--u))) }
.map .farmer-bot svg { width: calc(48 * var(--u)); height: auto }
/* Buildings: clickable footprints with a wooden name sign */
.bld { position: absolute; border: 0; background: none; padding: 0; cursor: pointer; border-radius: calc(14 * var(--u)) }
.bld:hover, .bld:focus-visible { background: rgba(255,255,255,.16); outline: 3px solid #FFD84D }
.bld .sign { position: absolute; left: 50%; bottom: calc(-4 * var(--u)); transform: translateX(-50%); white-space: nowrap; padding: calc(2 * var(--u)) calc(10 * var(--u));
  border-radius: calc(8 * var(--u)); background: #C98A4B; color: #fff; font: 700 max(8px, calc(13.5 * var(--u))) var(--f-display); box-shadow: 0 calc(3 * var(--u)) 0 #8B5A2B }
.bld.locked .sign { background: #8C8C8C; box-shadow: 0 calc(3 * var(--u)) 0 #666 }
.mveh.empty .cargo { display: none }
.map-svg .sglow { opacity: .45 }
.flashp { animation: flashp 1.4s ease-out }
@keyframes flashp { 0%, 40% { box-shadow: 0 0 0 5px #FFD84D } 100% { box-shadow: 0 0 0 0 transparent } }
/* Feeding: the farmer carries a different tool per animal; the animal's food pops up in its pen while it eats */
.farmer-bot .tool { display: none }
.farmer-bot[data-tool=can] .t-can, .farmer-bot[data-tool=grain] .t-grain, .farmer-bot[data-tool=hay] .t-hay, .farmer-bot[data-tool=bucket] .t-bucket, .farmer-bot[data-tool=flower] .t-flower { display: inline }
.farmer-bot .grains, .farmer-bot .bits, .farmer-bot .pollen { opacity: 0 }
.atile[data-food]::after { content: attr(data-food); position: absolute; left: 6%; bottom: 4%; font-size: calc(18 * var(--u)); opacity: 0; pointer-events: none }
.atile.fed::after { animation: foodpop 2.6s ease-out forwards }
@keyframes foodpop { 0% { opacity: 0; transform: translateY(-10px) scale(.4) } 15%, 75% { opacity: 1; transform: none } 100% { opacity: 0; transform: scale(.6) } }
.zone-head { width: max-content; margin-bottom: 8px; z-index: 1; padding: 3px 12px; border-radius: 10px; background: #C98A4B; color: #fff; font: 700 .9rem var(--f-display); box-shadow: 0 3px 0 #8B5A2B }
.ranch { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 215px), 1fr)) }
.pgroup { padding: 8px; border: 5px solid #C98A4B; border-radius: 14px; background: rgba(255,255,255,.16); box-shadow: inset 0 0 0 2px #E2B07A, 0 3px 0 #8B5A2B }
.pgroup.locked { filter: grayscale(.8); opacity: .75 }
.pgroup.new { animation: popin .9s ease-out }
.pg-head { display: flex; gap: 6px; align-items: baseline; margin-bottom: 6px; color: #fff; font-weight: 700; text-shadow: 0 1px 0 rgba(0,0,0,.35) }
.pg-head i { font-weight: 500; opacity: .9 } .pg-head .num { margin-left: auto }
.pg-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.atile { position: relative; aspect-ratio: 1; border: 0; border-radius: 12px; display: grid; place-items: center; align-content: center; gap: 2px; padding: 4px; min-width: 0; color: #5A3A12;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.15), 0 3px 0 rgba(0,0,0,.18) }
.atile .anim { width: 84%; height: auto; display: block; overflow: visible }
.atile .t, .atile .lbl { background: rgba(255,255,255,.9); border-radius: 999px; padding: 1px 7px; font-size: .7rem; font-weight: 700 }
.atile .bar { width: 78%; height: 5px; background: rgba(255,255,255,.5) } .atile .bar > i { background: #7ED957 }
.atile.ready { box-shadow: 0 0 0 3px #FFD84D, inset 0 -4px 0 rgba(0,0,0,.15), 0 3px 0 rgba(0,0,0,.18) }
.atile .prod { position: absolute; top: 3px; right: 5px; font-size: 1.35rem; filter: drop-shadow(0 2px 0 rgba(0,0,0,.2)) }
.atile.slot { border: 3px dashed rgba(255,255,255,.75); background: rgba(255,255,255,.18); box-shadow: none; color: #fff }
.atile.slot .e { font-size: 1.5rem; opacity: .65 } .atile.slot .lbl { color: #5A3A12 }
.straw .atile:not(.slot) { background: repeating-linear-gradient(45deg, #EBC86C 0 6px, #DDB65A 6px 9px) }
.meadow .atile:not(.slot) { background: #8FD165 radial-gradient(#A6E07A 2px, transparent 2.5px) 0 0 / 12px 12px }

loyees' concentration.","🔊"],["elaborate","v","ɪˈlæbəreɪt","nói rõ thêm, trình bày chi tiết (elaborate on)","Could you elaborate on your marketing plan?","🗣️"],["capitalize","v","ˈkæpətəˌlaɪz","tận dụng, khai thác (capitalize on)","The company plans to capitalize on the growing demand for electric cars.","💡"],["devote","v","dɪˈvoʊt","dành hết, cống hiến (devote sth to + V-ing)","She devoted much of her career to improving customer service.","🙌"],["compete","v","kəmˈpiːt","cạnh tranh (compete with sb, compete for sth)","Small shops find it hard to compete with large chains.","🏁"],["insist","v","ɪnˈsɪst","khăng khăng, nhất quyết (insist on + V-ing)","The client insisted on meeting the director in person.","☝️"],["familiarize","v","fəˈmɪljɚˌaɪz","làm quen với (familiarize oneself with)","New hires should familiarize themselves with company policies.","📘"],["solicit","v","səˈlɪsɪt","kêu gọi, xin (ý kiến, đề xuất, tài trợ)","The city is soliciting proposals from local architects.","📣"],["incur","v","ɪnˈkɝː","chịu, phải gánh (chi phí, phí phạt)","Customers who cancel late will incur a fee.","💸"],["enforce","v","enˈfɔːrs","thi hành, thực thi (quy định, luật)","Security guards strictly enforce the no-parking rule.","👮"],["deem","v","diːm","cho là, xem là (deem + adj / be deemed + adj)","The proposal was deemed too expensive by the board.","🤔"],["commence","v","kəˈmens","bắt đầu, khởi công (trang trọng)","Construction will commence on May 1.","🚦"],["consolidate","v","kənˈsɑːlɪˌdeɪt","hợp nhất, củng cố","The firm will consolidate its two offices into one location.","🧱"],["defer","v","dɪˈfɝː","hoãn lại; (defer to) nghe theo ý kiến của ai","Payment can be deferred until the end of the month.","⏸️"],["mitigate","v","ˈmɪtəˌɡeɪt","giảm nhẹ, giảm thiểu (rủi ro, tác động)","The new software will help mitigate security risks.","🛡️"],["attain","v","əˈteɪn","đạt được (mục tiêu, chỉ tiêu)","The team attained its sales target ahead of schedule.","🎯"]]},{"en":"Part 5 adjectives at 750 lev  hành","Remote work has become prevalent in the tech industry.","🌐"],["voluntary","adj","ˈvɑːlənteri","tự nguyện, không bắt buộc","Attendance at the workshop is voluntary.","🙋"],["ample","adj","ˈæmpəl","dồi dào, rộng rãi, nhiều","The hotel offers ample parking for guests.","🅿️"],["preceding","adj","priˈsiːdɪŋ","trước đó, ngay trước","Sales rose sharply in the preceding quarter.","⏮️"],["rigorous","adj","ˈrɪɡɚəs","nghiêm ngặt, kỹ lưỡng, chặt chẽ","All candidates go through a rigorous selection process.","🧪"],["exempt","adj","ɪɡˈzempt","được miễn (exempt from)","Nonprofit groups are exempt from the registration fee.","🆓"],["seasoned","adj","ˈsiːzənd","dày dạn kinh nghiệm, lão luyện","We are looking for a seasoned sales manager.","🧑‍💼"],["distinguished","adj","dɪˈstɪŋɡwɪʃt","xuất sắc, lỗi lạc, đáng kính","Dr. Allen had a distinguished career in medicine.","🎖️"],["imminent","adj","ˈɪmənənt","sắp xảy ra, cận kề","An announcement about the merger is imminent.","⏰"],["forthcoming","adj","ˈfɔːrθˈkʌmɪŋ","sắp tới, sắp được công bố","Details will be posted in the forthcoming newsletter.","🔜"],["mutual","adj","ˈmjuːtʃuəl","chung, lẫn nhau, đôi bên cùng","The agreement is to our mutual benefit.","🤝"],["evident","adj","ˈevədənt","rõ ràng, hiển nhiên","It was evident that the team had worked hard.","👀"],["equivalent","adj","ɪˈkwɪvələnt","tương đương (equivalent to)","The bonus is equivalent to one month's salary.","🟰"],["mindful","adj","ˈmaɪndfəl","lưu tâm, chú ý đến (mindful of)","Please be mindful of other guests in the lobby.","🧘"],["unforeseen","adj","ˌʌnfɔːrˈsiːn","không lường trước được","The event was canceled due to unforeseen circumstances.","🌪️"],["payable","adj","ˈpeɪəbəl","phải trả, có thể trả (payable to: trả cho ai)","Checks should be made payable to Greenway Inc.","🧾"],["perishable","adj","ˈperɪʃəbəl","dễ hỏng (thực phẩm)","Perishable goods must be stored in a refrigerator.","🥬"],["sluggish","adj","ˈslʌɡɪʃ","chậm chạp, ì ạch (kinh tế, doanh số)","Sales were sluggish during the winter months.","🐌"]]},{"en":"Part 5–6 adverbs and transitions","vi":"Trạng từ & từ nối Part 5–6","words":[["tentatively","adv","ˈtentətɪvli","tạm thời, dự kiến (chưa chốt)","The meeting is tentatively scheduled for Thursday.","🗓️"],["considerably","adv","kənˈsɪdɚəbli","đáng kể, nhiều","Costs have risen considerably since last year.","📈"],["readily","adv","ˈredəli","sẵn sàng, dễ dàng (readily available)","Spare parts are readily available from our suppliers.","📦"],["subsequently","adv","ˈsʌbsəkwəntli","sau đó, rồi sau đó","The product was tested and subsequently approved.","➡️"],["inadvertently","adv","ˌɪnədˈvɝːtəntli","vô tình, sơ ý","An employee inadvertently deleted the file.","😬"],["regrettably","adv","rɪˈɡretəbli","đáng tiếc là","Regrettably, the concert has been canceled.","😔"],["conveniently","adv","kənˈviːnjəntli","thuận tiện (conveniently located)","The hotel is conveniently located near the airport.","📍"],["markedly","adv","ˈmɑːrkədli","rõ rệt, đáng chú ý","Customer satisfaction has improved markedly.","✔️"],["primarily","adv","praɪˈmerəli","chủ yếu, trước hết","The course is primarily designed for new managers.","🥇"],["jointly","adv","ˈdʒɔɪntli","cùng nhau, chung (cùng sở hữu, cùng tài trợ)","The project is jointly funded by two companies.","👫"],["sharply","adv","ˈʃɑːrpli","mạnh, đột ngột (tăng/giảm)","Fuel prices rose sharply last month.","⛽"],["dramatically","adv","drəˈmætɪkli","mạnh mẽ, đáng kể","Online orders have increased dramatically.","🚀"],["closely","adv","ˈkloʊsli","chặt chẽ, sát sao (work closely with)","Our designers work closely with the marketing team.","🧑‍🤝‍🧑"],["highly","adv","ˈhaɪli","rất, hết sức (highly recommended)","Ms. Tran is highly recommended by her former employer.","👍"],["widely","adv","ˈwaɪdli","rộng rãi (widely regarded, widely used)","The software is widely used in hospitals.","🌍"],["routinely","adv","ruˈtiːnli","thường xuyên, theo thông lệ","Equipment is routinely inspected for safety.","🔁"],["virtually","adv","ˈvɝːtʃuəli","hầu như, gần như","The new system is virtually error-free.","💯"],["merely","adv","ˈmɪrli","chỉ, đơn thuần","The price increase is merely temporary.","🤏"],["largely","adv","ˈlɑːrdʒli","phần lớn, chủ yếu","The project's success was largely due to careful planning.","📐"],["precisely","adv","prɪˈsaɪsli","chính xác, đúng","The train departed at precisely 9 A.M.","🕘"],["voluntarily","adv","ˌvɑːlənˈterəli","một cách tự nguyện","Several staff members voluntarily worked overtime.","🦸"],["unanimously","adv","juˈnænəməsli","nhất trí, đồng lòng","The board unanimously approved the budget.","🗳️"],["consequently","adv","ˈkɑːnsəkwəntli","do đó, vì vậy (từ nối Part 6)","The shipment was delayed. Consequently, we extended the deadline.","⛓️"],["nonetheless","adv","ˌnʌnðəˈles","tuy nhiên, dù vậy","The weather was poor; nonetheless, the event was a success.","🌧️"],["meanwhile","adv","ˈmiːnˌwaɪl","trong khi đó, trong lúc chờ đợi","The lobby is being repainted. Meanwhile, please use the side entrance.","🚪"],["likewise","adv","ˈlaɪˌkwaɪz","tương tự, cũng vậy","Sales grew in May. Likewise, profits increased.","🪞"],["alternatively","adv","ɔːlˈtɝːnətɪvli","hoặc là, cách khác là","You can pay online. Alternatively, you may pay at the front desk.","🔄"],["additionally","adv","əˈdɪʃəˌnʌli","thêm vào đó, ngoài ra","Additionally, all guests will receive a free gift.","➕"],["thereby","adv","ˈðerˈbaɪ","nhờ đó, bằng cách đó","We automated billing, thereby reducing errors.","⚙️"],["conversely","adv","ˈkɑːnvɚsli","ngược lại","Sales rose in Europe. Conversely, they fell in Asia.","↔️"]]},{"en":"Collocations Part 5 loves","vi":"Cụm từ cố định Part 5 hay ra","words":[["be eligible for","phr","biː ˈelədʒəbəl fɔːr","đủ điều kiện để nhận / tham gia","Full-time employees are eligible for paid vacation.","🏖️"],["in compliance with","phr","ɪn kəmˈplaɪəns wɪð","tuân thủ theo (quy định, tiêu chuẩn)","All products are made in compliance with safety standards.","🦺"],["in accordance with","phr","ɪn əˈkɔːrdəns wɪð","theo, phù hợp với (chính sách, hợp đồng)","Refunds are issued in accordance with our return policy.","📑"],["take effect","phr","teɪk ɪˈfekt","có hiệu lực","The new pricing will take effect on July 1.","⚡"],["be subject to","phr","biː səbˈdʒekt tuː","có thể bị, phải chịu (thay đổi, phê duyệt, phí)","All prices are subject to change without notice.","🏷️"],["in light of","phr","ɪn laɪt ʌv","xét đến, do (tình hình mới)","In light of recent complaints, we have revised our policy.","🔦"],["regardless of","phr","rəˈɡɑːrdləs ʌv","bất kể, bất chấp","The fee applies regardless of the length of stay.","🤷"],["in response to","phr","ɪn rɪˈspɑːns tuː","để đáp lại, phản hồi","In response to customer requests, we extended our hours.","💬"],["with regard to","phr","wɪð rɪˈɡɑːrd tuː","về việc, liên quan đến","I am writing with regard to your recent order.","✍️"],["in conjunction with","phr","ɪn kənˈdʒʌŋkʃən wɪð","kết hợp với, phối hợp cùng","The festival is organized in conjunction with the city council.","🎪"],["in the event of","phr","ɪn ðə ɪˈvent ʌv","trong trường hợp (có sự cố)","In the event of a fire, use the stairs.","🔥"],["as of","phr","æz ʌv","kể từ (ngày, thời điểm)","As of next Monday, the office will open at 8 A.M.","📆"],["in excess of","phr","ɪn ˈekˌses ʌv","vượt quá","Orders in excess of $500 qualify for free shipping.","🚚"],["until further notice","phr","ənˈtɪl ˈfɝːðɚ ˈnoʊtəs","cho đến khi có thông báo mới","The pool is closed until further notice.","🚫"],["in a timely manner","phr","ɪn ə ˈtaɪmli ˈmænɚ","kịp thời, đúng hạn","Please respond to all inquiries in a timely manner.","⏱️"],["at the discretion of","phr","æt ðə dɪˈskreʃən ʌv","tùy theo quyết định của","Bonuses are awarded at the discretion of the manager.","🧑‍⚖️"],["in recognition of","phr","ɪn ˌrekəɡˈnɪʃən ʌv","để ghi nhận, để tuyên dương (công lao)","She received an award in recognition of her service.","🏅"],["in an effort to","phr","ɪn æn ˈefɚt tuː","nhằm, trong nỗ lực để","In an effort to cut costs, the firm moved to a smaller office.","✂️"],["with the exception of","phr","wɪð ðə ɪkˈsepʃən ʌv","ngoại trừ","All stores, with the exception of the airport branch, close at 9 P.M.","🏪"],["on short notice","phr","ɑːn ʃɔːrt ˈnoʊtəs","gấp, chỉ được báo trước rất ít thời gian","Thank you for attending the meeting on short notice.","⚠️"],["effective immediately","phr","ɪˈfektɪv ɪˈmiːˌdiːətli","có hiệu lực ngay lập tức","Effective immediately, all visitors must sign in at the front desk.","🔔"],["be scheduled to","phr","biː ˈskedʒʊld tuː","được lên lịch để (làm gì)","The CEO is scheduled to speak at 10 A.M.","🗓️"],["be committed to","phr","biː kəˈmɪtɪd tuː","cam kết (+ V-ing / danh từ)","We are committed to providing excellent service.","💪"],["be accustomed to","phr","biː əˈkʌstəmd tuː","quen với (+ V-ing / danh từ)","Our staff are accustomed to working under pressure.","🔂"],["reach an agreement","phr","riːtʃ æn əˈɡriːmənt","đạt được thỏa thuận","The two companies reached an agreement after months of talks.","🤜"],["file a complaint","phr","faɪl ə kəmˈpleɪnt","nộp đơn khiếu nại","The customer filed a complaint about the late delivery.","🗂️"],["issue a refund","phr","ˈɪʃu ə rɪˈfʌnd","hoàn tiền (cho khách)","We will issue a full refund within five business days.","💵"],["take precautions","phr","teɪk priˈkɔːʃənz","có biện pháp phòng ngừa","Workers must take precautions when handling chemicals.","🧤"],["on a first-come first-served basis","phr","ɑːn ə fɝːst kʌm fɝːst sɝːvd ˈbeɪsəs","theo nguyên tắc ai đến trước được phục vụ trước","Seats are available on a first-come first-served basis.","🎫"]]},{"en":"Easily confused words","vi":"Từ dễ nhầm lẫn","words":[["effect","n","ˈiːfekt","tác động, kết quả (danh từ) — khác affect (v): ảnh hưởng đến","The new policy had a positive effect on sales.","💥"],["rise","v","raɪz","tăng lên (nội động từ, không có tân ngữ: rise, rose, risen) — khác raise: nâng, tăng cái gì","Prices rose by five percent last quarter.","🌅"],["lie","v","laɪ","nằm, nằm à nhược điểm","There are pros and cons to working from home.","⚖️"],["outweigh","v","ˈaʊˌtweɪ","lớn hơn, vượt trội hơn (về tầm quan trọng)","The benefits outweigh the costs.","🏋️"],["flexibility","n","ˌfleksəˈbɪləti","sự linh hoạt","Flexibility is important to young workers.","🤸"],["work-life balance","phr","wɝːk laɪf ˈbæləns","cân bằng công việc và cuộc sống","A four-day week can improve work-life balance.","🧘"],["efficient workplace","phr","ɪˈfɪʃənt ˈwɝːkˌpleɪs","nơi làm việc hiệu quả","Clear rules create an efficient workplace.","🏢"]]}]},"sentences":{"daily":[{"stage":"Basic","en":"Greetings & introductions","vi":"Chào hỏi & giới thiệu","items":[["Hi, I'm Minh. Nice to meet you.","Chào bạn, mình là Minh. Rất vui được gặp bạn.","Dùng khi gặp lần đầu"],["Nice to meet you too.","Mình cũng rất vui được gặp bạn.",""],["How are you doing?","Bạn dạo này thế nào?","Thân mật hơn \"How are you?\""],["I'm doing well, thanks. And you?","Mình ổn, cảm ơn. Còn bạn?",""],["Not bad, thanks for asking.","Cũng không tệ, cảm ơn đã hỏi.",""],["Where are you from?","Bạn đến từ đâu?",""],["I'm from Vietnam. I live in Hanoi.","Mình đến từ Việt Nam. Mình sống ở Hà Nội.",""],["What do you do?","Bạn làm nghề gì?","Hỏi về công việc một cách tự nhiên"],["I'm a student. / I work as an engineer.","Mình là sinh viên. / Mình làm kỹ sư.",""],["What brings you to Vietnam?","Điều gì đưa bạn đến Việt Nam?",""],["How long have you been here?","Bạn ở đây được bao lâu rồi?",""],["It was great talking to you.","Nói chuyện với bạn rất vui.",""],["See you later!","Hẹn gặp lại nhé!",""],["Take care!","Bảo trọng nhé!",""],["Have a nice day!","Chúc một ngày tốt lành!",""]]},{"stage":"Basic","en":"Polite expressions","vi":"Cảm ơn, xin lỗi & lịch sự","items":[["Thank you so much.","Cảm ơn bạn rất nhiều.",""],["You're welcome.","Không có gì.",""],["No problem at all.","Không sao cả.",""],["I really appreciate it.","Mình thực sự cảm kích.",""],["Sorry, I didn't catch that.","Xin lỗi, mình nghe chưa rõ.","Lịch sự hơn \"What?\""],["Could you say that again, please?","Bạn nói lại được không?",""],["Could you speak a little more slowly?","Bạn nói chậm hơn một chút được không?",""],["Excuse me, may I ask you something?","Xin lỗi, cho mình hỏi chút được không?",""],["Sorry I'm late.","Xin lỗi mình đến muộn.",""],["That's very kind of you.","Bạn thật tốt bụng.",""],["Don't worry about it.","Đừng lo về chuyện đó.",""],["After you.","Mời bạn đi trước.","Nhường đường/nhường lượt"]]},{"stage":"Basic","en":"Small talk","vi":"Nói chuyện phiếm","items":[["Lovely weather today, isn't it?","Hôm nay trời đẹp nhỉ?",""],["It's really hot today.","Hôm nay nóng thật.",""],["What do you do in your free time?","Lúc rảnh bạn làm gì?",""],["I like reading and playing badminton.","Mình thích đọc sách và chơi cầu lông.",""],["Have you tried Vietnamese food yet?","Bạn đã thử đồ ăn Việt chưa?",""],["What kind of music do you like?","Bạn thích thể loại nhạc nào?",""],["Did you have a good weekend?","Cuối tuần của bạn vui chứ?",""],["Yes, I went to the beach with my family.","Có, mình đi biển với gia đình.",""],["That sounds fun!","Nghe vui đấy!",""],["Me too! / Me neither.","Mình cũng vậy! / Mình cũng không.",""],["What a coincidence!","Trùng hợp thật!",""],["I know what you mean.","Mình hiểu ý bạn.",""]]},{"stage":"Basic","en":"Asking for help & directions","vi":"Hỏi đường & nhờ giúp đỡ","items":[["Excuse me, how do I get to the station?","Xin lỗi, đường đến nhà ga đi thế nào ạ?",""],["Is it far from here?","Có xa đây không?",""],["It's about a ten-minute walk.","Đi bộ khoảng mười phút.",""],["Go straight and turn left at the lights.","Đi thẳng rồi rẽ trái ở đèn giao thông.",""],["It's on your right, next to the bank.","Nó ở bên phải bạn, cạnh ngân hàng.",""],["Could you show me on the map?","Bạn chỉ giúp mình trên bản đồ được không?",""],["Is there a pharmacy near here?","Gần đây có hiệu thuốc không?",""],["Where is the restroom?","Nhà vệ sinh ở đâu?",""],["Can you help me, please?","Bạn giúp mình được không?",""],["I'm lost.","Mình bị lạc rồi.",""],["Which bus goes to the Old Quarter?","Xe buýt nào đi đến Phố Cổ?",""],["Can I walk there?","Mình đi bộ đến đó được không?",""],["You can't miss it.","Bạn không thể không thấy đâu.","Ý nói rất dễ tìm"],["Let me take you there.","Để mình dẫn bạn đến đó.",""]]},{"stage":"Basic","en":"Shopping","vi":"Mua sắm","items":[["How much is this?","Cái này bao nhiêu tiền?",""],["Can I try it on?","Mình mặc thử được không?",""],["Do you have this in a bigger size?","Có cỡ lớn hơn không?",""],["Do you have it in another color?","Có màu khác không?",""],["It's a bit expensive. Can you lower the price?","Hơi đắt. Bớt cho mình được không?",""],["I'll take it.","Mình lấy cái này.",""],["I'm just looking, thanks.","Mình chỉ xem thôi, cảm ơn.",""],["Can I pay by card?","Mình trả bằng thẻ được không?",""],["Could I have a bag, please?","Cho mình xin cái túi.",""],["Could I get a receipt?","Cho mình xin hoá đơn.",""],["Where can I find the milk?","Sữa để ở đâu vậy?",""],["Is this on sale?","Món này có giảm giá không?",""]]},{"stage":"Basic","en":"Eating out","vi":"Ăn uống ngoài hàng","items":[["A table for two, please.","Cho mình bàn hai người.",""],["Can I see the menu, please?","Cho mình xem thực đơn.",""],["What do you recommend?","Bạn gợi ý món gì?",""],["I'd like the chicken noodle soup.","Mình muốn gọi phở gà.",""],["Not too spicy, please.","Đừng cay quá nhé.",""],["I'm allergic to peanuts.","Mình bị dị ứng đậu phộng.",""],["Could I have some water, please?","Cho mình xin chút nước.",""],["This is delicious!","Món này ngon quá!",""],["Excuse me, we're ready to order.","Xin lỗi, bọn mình sẵn sàng gọi món rồi.",""],["Can we have the bill, please?","Cho mình xin hoá đơn thanh toán.",""],["Can we split the bill?","Mình chia hoá đơn được không?",""],["It's my treat.","Để mình mời.",""],["Is service included?","Đã bao gồm phí phục vụ chưa?",""],["Can I take this away?","Mình mang phần này về được không?",""],["Enjoy your meal!","Chúc ngon miệng!",""]]},{"stage":"Basic","en":"Time, dates & numbers","vi":"Thời gian, ngày tháng, con số","items":[["What time is it?","Mấy giờ rồi?",""],["It's half past seven.","Bảy giờ rưỡi.",""],["What's the date today?","Hôm nay ngày bao nhiêu?",""],["It's the fifteenth of May.","Hôm nay là ngày 15 tháng 5.",""],["When is your birthday?","Sinh nhật bạn khi nào?",""],["What time does it open?","Mấy giờ mở cửa?",""],["It's open from nine to five.","Mở cửa từ 9 giờ đến 5 giờ.",""],["How old are you? (to a child)","Cháu bao nhiêu tuổi?","Tránh hỏi tuổi người lớn khi mới quen"],["What's your phone number?","Số điện thoại của bạn là gì?",""],["Could you spell that, please?","Bạn đánh vần giúp mình được không?",""]]},{"stage":"Intermediate","en":"Travel & hotels","vi":"Du lịch & khách sạn","items":[["I have a reservation under the name Nguyen.","Tôi có đặt phòng tên Nguyễn.",""],["What time is check-out?","Mấy giờ trả phòng?",""],["Is breakfast included?","Có bao gồm bữa sáng không?",""],["Could I have a late check-out?","Tôi trả phòng muộn được không?",""],["The air conditioner in my room isn't working.","Máy lạnh phòng tôi không hoạt động.",""],["Could you call a taxi for me?","Bạn gọi giúp tôi một chiếc taxi được không?",""],["What's the Wi-Fi password?","Mật khẩu Wi-Fi là gì?",""],["Can I leave my luggage here?","Tôi gửi hành lý ở đây được không?",""],["I'd like to book a tour for tomorrow.","Tôi muốn đặt một tour cho ngày mai.",""],["What are the must-see places around here?","Quanh đây có chỗ nào nhất định phải đi không?",""],["How long does it take to get there?","Đi đến đó mất bao lâu?",""],["Is it safe to walk around at night?","Đi dạo buổi tối có an toàn không?",""],["Could you take a photo of us?","Bạn chụp giúp bọn mình một tấm ảnh được không?",""],["I'm here on holiday.","Tôi đến đây để đi nghỉ.",""],["My flight has been delayed.","Chuyến bay của tôi bị hoãn.",""]]},{"stage":"Intermediate","en":"Getting around","vi":"Di chuyển","items":[["Where can I buy a ticket?","Tôi mua vé ở đâu?",""],["A one-way ticket to Da Nang, please.","Cho tôi một vé một chiều đi Đà Nẵng.",""],["Does this bus stop at the museum?","Xe buýt này có dừng ở bảo tàng không?",""],["Please let me know when we get there.","Đến nơi thì báo tôi nhé.",""],["Could you drop me off here?","Cho tôi xuống ở đây được không?",""],["How much is the fare?","Giá vé là bao nhiêu?",""],["Please take me to this address.","Làm ơn chở tôi đến địa chỉ này.",""],["Is there a quicker way?","Có đường nào nhanh hơn không?",""],["I think we're going the wrong way.","Tôi nghĩ chúng ta đi sai đường rồi.",""],["Keep the change.","Không cần trả lại tiền thừa.",""]]},{"stage":"Intermediate","en":"Phone calls","vi":"Gọi điện thoại","items":[["Hello, this is Lan speaking.","Alô, tôi là Lan đây.",""],["Could I speak to Mr. Brown, please?","Cho tôi gặp ông Brown được không?",""],["Who's calling, please?","Xin hỏi ai đang gọi ạ?",""],["Hold on a moment, please.","Vui lòng chờ một chút.",""],["He's not available right now.","Anh ấy hiện không thể nghe máy.",""],["Can I take a message?","Tôi có thể nhận lời nhắn không?",""],["Could you ask him to call me back?","Nhờ bạn bảo anh ấy gọi lại cho tôi.",""],["Sorry, you're breaking up.","Xin lỗi, tín hiệu chập chờn quá.",""],["I think you have the wrong number.","Tôi nghĩ bạn gọi nhầm số rồi.",""],["Thanks for calling.","Cảm ơn đã gọi.",""]]},{"stage":"Intermediate","en":"Making plans & invitations","vi":"Lên kế hoạch & mời","items":[["Are you free this Saturday?","Thứ Bảy này bạn rảnh không?",""],["Would you like to grab a coffee?","Bạn có muốn đi uống cà phê không?",""],["How about seven o'clock?","Bảy giờ thì sao?",""],["That works for me.","Giờ đó mình được.",""],["Sorry, I can't make it. Maybe next time?","Tiếc quá, mình không đi được. Hẹn lần sau nhé?",""],["Let's meet in front of the cinema.","Gặp nhau trước rạp chiếu phim nhé.",""],["I'll text you the address.","Mình sẽ nhắn địa chỉ cho bạn.",""],["Shall we invite Nam too?","Mình mời cả Nam nhé?",""],["I'm running a bit late.","Mình đến muộn một chút.",""],["Count me in!","Tính cả mình nhé!",""],["Let me check and get back to you.","Để mình xem lại rồi báo bạn sau.",""],["Thanks for inviting me.","Cảm ơn bạn đã mời.",""]]},{"stage":"Intermediate","en":"Health","vi":"Sức khoẻ","items":[["I don't feel very well.","Mình thấy không khoẻ lắm.",""],["I have a headache and a sore throat.","Mình bị đau đầu và đau họng.",""],["I need to see a doctor.","Mình cần gặp bác sĩ.",""],["How long have you had these symptoms?","Bạn bị các triệu chứng này bao lâu rồi?",""],["Do I need a prescription for this?","Thuốc này có cần đơn không?",""],["How often should I take it?","Tôi nên uống mấy lần?",""],["Take one tablet twice a day after meals.","Uống một viên, ngày hai lần sau ăn.",""],["I hope you feel better soon.","Mong bạn sớm khoẻ.",""],["Get some rest.","Nghỉ ngơi đi nhé.",""],["Where is the nearest hospital?","Bệnh viện gần nhất ở đâu?",""]]},{"stage":"Intermediate","en":"Opinions & preferences","vi":"Ý kiến & sở thích","items":[["What do you think about it?","Bạn nghĩ sao về điều đó?",""],["In my opinion, it's a great idea.","Theo mình, đó là ý hay.",""],["I prefer tea to coffee.","Mình thích trà hơn cà phê.",""],["I'd rather stay home tonight.","Tối nay mình muốn ở nhà hơn.",""],["I'm not a big fan of horror films.","Mình không mê phim kinh dị lắm.",""],["It's not my cup of tea.","Đó không phải gu của mình.","Thành ngữ phổ biến"],["I can't stand loud music.","Mình không chịu nổi nhạc ồn.",""],["I'm really into photography.","Mình rất mê nhiếp ảnh.",""],["It depends.","Cái đó còn tuỳ.",""],["To be honest, I'm not sure.","Thật lòng thì mình không chắc.",""],["That makes sense.","Nghe hợp lý đấy.",""],["Fair enough.","Cũng phải.",""]]},{"stage":"Intermediate","en":"Showing visitors around","vi":"Dẫn khách nước ngoài tham quan","items":[["Welcome to Hanoi!","Chào mừng đến Hà Nội!",""],["This is one of the oldest streets in the city.","Đây là một trong những con phố lâu đời nhất thành phố.",""],["You should try egg coffee—it's a local specialty.","Bạn nên thử cà phê trứng—đặc sản ở đây.",""],["Be careful when crossing the street.","Cẩn thận khi sang đường nhé.",""],["Just walk slowly and steadily.","Cứ đi chậm và đều.","Mẹo sang đường ở VN"],["This temple was built in the 11th century.","Ngôi đền này được xây vào thế kỷ 11.",""],["You need to take off your shoes here.","Bạn cần cởi giày ở đây.",""],["Let me help you order.","Để mình giúp bạn gọi món.",""],["It's usually cheaper at the local market.","Ở chợ địa phương thường rẻ hơn.",""],["Have you been to Ha Long Bay?","Bạn đến Vịnh Hạ Long chưa?",""],["The best time to visit is in autumn.","Thời điểm đẹp nhất để đến là mùa thu.",""],["I hope you enjoy your stay.","Mong bạn có kỳ lưu trú vui vẻ.",""]]},{"stage":"Advanced","en":"Agreeing & disagreeing politely","vi":"Đồng ý & phản đối lịch sự","items":[["I couldn't agree more.","Mình hoàn toàn đồng ý.",""],["That's a good point.","Ý đó hay đấy.",""],["I see what you mean, but…","Mình hiểu ý bạn, nhưng…",""],["I'm afraid I don't quite agree.","E là mình không đồng ý lắm.",""],["I see it a bit differently.","Mình nhìn nhận hơi khác một chút.",""],["You might be right, but have you considered…?","Có thể bạn đúng, nhưng bạn đã nghĩ đến… chưa?",""],["Let's agree to disagree.","Mình cứ giữ quan điểm riêng nhé.",""],["That's not entirely true.","Điều đó không hoàn toàn đúng.",""],["Fair point, I hadn't thought of that.","Ý hay, mình chưa nghĩ đến điều đó.",""],["I'm with you on that.","Mình đứng về phía bạn ở điểm này.",""],["I'd have to disagree there.","Ở điểm này mình phải không đồng ý.",""],["Absolutely!","Chắc chắn rồi!",""]]},{"stage":"Advanced","en":"Complaints & solving problems","vi":"Phàn nàn & giải quyết vấn đề","items":[["I'm afraid there's a problem with my order.","E là đơn hàng của tôi có vấn đề.",""],["This isn't what I ordered.","Đây không phải món tôi gọi.",""],["I'd like to speak to the manager, please.","Tôi muốn gặp quản lý.",""],["I was charged twice for the same item.","Tôi bị tính tiền hai lần cho cùng một món.",""],["Could you look into this for me?","Bạn kiểm tra giúp tôi được không?",""],["I'd appreciate it if you could fix this today.","Tôi sẽ rất cảm kích nếu bạn xử lý trong hôm nay.",""],["What can you do to make it right?","Bạn có thể làm gì để khắc phục?",""],["I'd like a refund, please.","Tôi muốn được hoàn tiền.",""],["It's been more than a week and I still haven't heard back.","Đã hơn một tuần mà tôi vẫn chưa nhận phản hồi.",""],["Thank you for sorting this out so quickly.","Cảm ơn bạn đã giải quyết nhanh như vậy.",""],["I understand it's not your fault.","Tôi hiểu đây không phải lỗi của bạn.",""],["Let's see what we can do.","Để xem chúng ta có thể làm gì.",""]]},{"stage":"Advanced","en":"Telling stories & experiences","vi":"Kể chuyện & trải nghiệm","items":[["You won't believe what happened to me yesterday.","Bạn sẽ không tin chuyện xảy ra với mình hôm qua đâu.",""],["It all started when I missed my bus.","Mọi chuyện bắt đầu khi mình lỡ chuyến xe buýt.",""],["To make a long story short, we got there late.","Nói ngắn gọn là bọn mình đến muộn.",""],["The funny thing is…","Điều buồn cười là…",""],["Luckily, someone helped us.","May mắn là có người đã giúp.",""],["I'll never forget that day.","Mình sẽ không bao giờ quên ngày đó.",""],["Have you ever been in a situation like that?","Bạn đã bao giờ gặp tình huống như vậy chưa?",""],["It was the best trip of my life.","Đó là chuyến đi tuyệt nhất đời mình.",""],["Looking back, it was a great lesson.","Nhìn lại thì đó là bài học quý.",""],["Anyway, that's what happened.","Dù sao thì chuyện là vậy.",""]]},{"stage":"Advanced","en":"Culture & deeper conversations","vi":"Văn hoá & trò chuyện sâu","items":[["What's the biggest culture shock you've had here?","Cú sốc văn hoá lớn nhất của bạn ở đây là gì?",""],["In Vietnam, we usually greet older people first.","Ở Việt Nam, chúng tôi thường chào người lớn tuổi trước.",""],["How do people celebrate New Year in your country?","Ở nước bạn người ta đón năm mới thế nào?",""],["Family is very important in our culture.","Gia đình rất quan trọng trong văn hoá chúng tôi.",""],["That's really interesting. Tell me more.","Thú vị thật. Kể thêm đi.",""],["I've always wondered about that.","Mình luôn thắc mắc về điều đó.",""],["It's considered rude to point at people.","Chỉ tay vào người khác bị coi là bất lịch sự.",""],["I hope I'm not being too personal.","Mong là mình không hỏi quá riêng tư.",""],["What do you miss most about home?","Bạn nhớ điều gì nhất ở quê nhà?",""],["Every culture has its own way of doing things.","Mỗi nền văn hoá có cách làm riêng.",""],["I'd love to visit your country someday.","Mình rất muốn đến nước bạn một ngày nào đó.",""],["Thanks for sharing that with me.","Cảm ơn bạn đã chia sẻ.",""]]},{"stage":"Advanced","en":"Emergencies","vi":"Tình huống khẩn cấp","items":[["Help! Somebody call an ambulance!","Cứu với! Ai đó gọi xe cấp cứu đi!",""],["I've lost my passport.","Tôi bị mất hộ chiếu.",""],["My wallet has been stolen.","Ví của tôi bị lấy cắp.",""],["Where is the nearest police station?","Đồn cảnh sát gần nhất ở đâu?",""],["I need to contact my embassy.","Tôi cần liên hệ đại sứ quán.",""],["There's been an accident.","Có tai nạn xảy ra.",""],["Is anyone hurt?","Có ai bị thương không?",""],["Please stay calm.","Xin hãy bình tĩnh.",""],["Can I use your phone? It's an emergency.","Cho tôi mượn điện thoại được không? Việc khẩn cấp.",""],["Fire! Get out of the building!","Cháy! Ra khỏi toà nhà ngay!",""]]},{"stage":"Advanced","en":"Keeping a conversation going","vi":"Duy trì cuộc trò chuyện","items":[["By the way, …","Nhân tiện thì…",""],["Speaking of travel, have you been to Hue?","Nói về du lịch, bạn đã đến Huế chưa?",""],["What do you mean by that?","Ý bạn là sao?",""],["So what happened next?","Rồi sao nữa?",""],["That reminds me of…","Điều đó làm mình nhớ đến…",""],["Where was I?","Mình đang nói đến đâu rồi nhỉ?",""],["Sorry, go on.","Xin lỗi, bạn nói tiếp đi.",""],["Let me put it another way.","Để mình nói theo cách khác.",""],["How did you get into that?","Bạn bắt đầu với việc đó thế nào?",""],["I'd better get going. It was lovely chatting!","Mình phải đi rồi. Nói chuyện vui lắm!",""],["Let's keep in touch.","Giữ liên lạc nhé.",""],["Feel free to message me anytime.","Cứ nhắn mình bất cứ lúc nào.",""]]}],"work":[{"stage":"Basic","en":"Introducing yourself at work","vi":"Giới thiệu bản thân ở công ty","items":[["Hi everyone, I'm Hoa. I just joined the marketing team.","Chào mọi người, tôi là Hoa. Tôi vừa vào nhóm marketing.",""],["I'll be working on the new product launch.","Tôi sẽ phụ trách đợt ra mắt sản phẩm mới.",""],["I'm responsible for customer accounts in the south.","Tôi phụ trách các tài khoản khách hàng khu vực phía Nam.",""],["I report directly to Ms. Smith.","Tôi báo cáo trực tiếp cho chị Smith.",""],["I've been with the company for three years.","Tôi đã làm ở công ty được ba năm.",""],["Before this, I worked in finance.","Trước đây tôi làm trong ngành tài chính.",""],["Let me know if there's anything I can help with.","Có gì tôi giúp được thì cứ báo tôi nhé.",""],["Which team are you on?","Bạn thuộc nhóm nào?",""],["How long have you been working here?","Bạn làm ở đây bao lâu rồi?",""],["Welcome aboard!","Chào mừng bạn gia nhập!","Câu chào đồng nghiệp mới"],["I'm looking forward to working with you.","Tôi mong được làm việc cùng bạn.",""],["Could you show me how this works?","Bạn chỉ tôi cách dùng cái này được không?",""],["Who should I ask about access to the system?","Tôi nên hỏi ai về quyền truy cập hệ thống?",""],["Where can I find the onboarding documents?","Tôi tìm tài liệu hướng dẫn nhân viên mới ở đâu?",""],["Thanks for making me feel welcome.","Cảm ơn mọi người đã đón tiếp tôi.",""]]},{"stage":"Basic","en":"Office small talk","vi":"Trò chuyện ở văn phòng","items":[["How was your weekend?","Cuối tuần của bạn thế nào?",""],["Are you heading to lunch?","Bạn đi ăn trưa à?",""],["Do you want to join us for lunch?","Bạn muốn đi ăn trưa cùng bọn mình không?",""],["It's been a busy week.","Tuần này bận thật.",""],["Are you working on anything interesting?","Bạn có đang làm gì thú vị không?",""],["Any plans for the holiday?","Kỳ nghỉ có kế hoạch gì không?",""],["Congratulations on your promotion!","Chúc mừng bạn được thăng chức!",""],["I heard you did a great job on the presentation.","Nghe nói bạn thuyết trình rất tốt.",""],["Long time no see!","Lâu rồi không gặp!",""],["How's the project going?","Dự án tiến triển thế nào rồi?",""],["Have a good evening. See you tomorrow.","Chúc buổi tối vui vẻ. Mai gặp nhé.",""],["Happy Friday!","Thứ Sáu vui vẻ!",""]]},{"stage":"Basic","en":"Asking colleagues for help","vi":"Nhờ đồng nghiệp giúp","items":[["Do you have a minute?","Bạn có rảnh một phút không?",""],["Could you give me a hand with this?","Bạn giúp tôi việc này một tay được không?",""],["Would you mind checking this for me?","Bạn có phiền kiểm tra giúp tôi không?",""],["Sorry to bother you, but…","Xin lỗi làm phiền bạn, nhưng…",""],["I'm not sure how to do this. Could you help?","Tôi không chắc làm việc này thế nào. Bạn giúp được không?",""],["Who's the best person to ask about this?","Ai là người phù hợp nhất để hỏi việc này?",""],["Could you send me that file?","Bạn gửi tôi file đó được không?",""],["Thanks, that's really helpful.","Cảm ơn, thật sự rất hữu ích.",""],["I owe you one.","Tôi nợ bạn một lần nhé.","Cách cảm ơn thân mật"],["Let me know if you need anything from me.","Bạn cần gì từ tôi thì cứ báo nhé.",""],["No rush.","Không gấp đâu.",""],["Whenever you have time.","Khi nào bạn rảnh cũng được.",""]]},{"stage":"Basic","en":"Phone basics at work","vi":"Điện thoại công việc","items":[["Good morning, ABC Company. How may I help you?","Chào buổi sáng, công ty ABC xin nghe. Tôi có thể giúp gì?",""],["May I ask who's calling?","Cho tôi hỏi ai đang gọi ạ?",""],["I'm calling about the order we placed last week.","Tôi gọi về đơn hàng chúng tôi đặt tuần trước.",""],["I'll put you through.","Tôi sẽ chuyển máy cho bạn.",""],["She's in a meeting at the moment.","Hiện chị ấy đang họp.",""],["Would you like to leave a message?","Bạn có muốn để lại lời nhắn không?",""],["Could you spell your name, please?","Bạn đánh vần tên giúp tôi được không?",""],["Let me read that back to you.","Để tôi đọc lại cho bạn kiểm tra.",""],["I'll make sure he gets your message.","Tôi sẽ đảm bảo anh ấy nhận được lời nhắn.",""],["What's the best number to reach you?","Số nào liên lạc với bạn tốt nhất?",""],["Thank you for holding.","Cảm ơn bạn đã chờ máy.",""],["Is there anything else I can help you with?","Bạn còn cần tôi giúp gì nữa không?",""]]},{"stage":"Basic","en":"Email openings & closings","vi":"Mở đầu & kết thúc email","items":[["Dear Mr. Tanaka,","Kính gửi ông Tanaka,",""],["I hope this email finds you well.","Hy vọng anh/chị vẫn khoẻ.",""],["I'm writing to ask about…","Tôi viết thư này để hỏi về…",""],["Thank you for your email.","Cảm ơn email của anh/chị.",""],["As requested, I've attached the report.","Theo yêu cầu, tôi đã đính kèm báo cáo.",""],["Please find the details below.","Vui lòng xem chi tiết bên dưới.",""],["Just a quick reminder that…","Xin nhắc nhanh rằng…",""],["Please let me know if you have any questions.","Nếu có câu hỏi gì, xin vui lòng cho tôi biết.",""],["I look forward to hearing from you.","Tôi mong nhận được phản hồi của anh/chị.",""],["Thanks in advance for your help.","Cảm ơn trước sự giúp đỡ của anh/chị.",""],["Best regards,","Trân trọng,",""],["Sorry for the late reply.","Xin lỗi vì phản hồi muộn.",""]]},{"stage":"Basic","en":"Scheduling","vi":"Sắp xếp lịch","items":[["When are you available this week?","Tuần này khi nào anh/chị rảnh?",""],["Does Tuesday at 10 work for you?","Thứ Ba lúc 10 giờ có tiện không?",""],["I'm afraid I'm busy then. How about Wednesday?","E là lúc đó tôi bận. Thứ Tư thì sao?",""],["Let's set up a meeting to discuss it.","Hãy sắp xếp một cuộc họp để b
