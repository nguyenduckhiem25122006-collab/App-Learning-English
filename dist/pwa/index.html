àn việc này.",""],["I'll send you a calendar invite.","Tôi sẽ gửi lời mời trên lịch.",""],["Can we move the meeting to the afternoon?","Chúng ta dời cuộc họp sang buổi chiều được không?",""],["I need to reschedule our call.","Tôi cần dời lịch cuộc gọi của chúng ta.",""],["Let's keep it to 30 minutes.","Hãy giữ trong 30 phút thôi.",""],["What time zone are you in?","Anh/chị đang ở múi giờ nào?",""],["I'll be out of the office next Monday.","Thứ Hai tới tôi không có mặt ở văn phòng.",""],["Could we push the deadline back a few days?","Chúng ta lùi hạn chót vài ngày được không?",""],["Let's touch base on Friday.","Thứ Sáu chúng ta trao đổi lại nhé.",""]]},{"stage":"Intermediate","en":"Meetings","vi":"Họp","items":[["Shall we get started?","Chúng ta bắt đầu nhé?",""],["Thanks, everyone, for coming.","Cảm ơn mọi người đã đến.",""],["The purpose of today's meeting is to…","Mục đích cuộc họp hôm nay là…",""],["Let's go over the agenda.","Hãy cùng xem qua chương trình họp.",""],["Could you give us an update on the project?","Anh/chị cập nhật cho chúng tôi về dự án được không?",""],["Can I add something here?","Tôi bổ sung một ý được không?",""],["Sorry to interrupt, but…","Xin lỗi đã ngắt lời, nhưng…",""],["Let's get back to the main point.","Hãy quay lại vấn đề chính.",""],["I think we're running out of time.","Tôi nghĩ chúng ta sắp hết thời gian.",""],["Let's take this offline.","Việc này mình bàn riêng sau nhé.","Không bàn tiếp trong cuộc họp"],["Who will take the lead on this?","Ai sẽ phụ trách việc này?",""],["What are the next steps?","Các bước tiếp theo là gì?",""],["Let's recap what we've agreed.","Hãy tóm tắt lại những gì đã thống nhất.",""],["I'll send out the minutes after the meeting.","Tôi sẽ gửi biên bản sau cuộc họp.",""],["Does anyone have any questions?","Có ai có câu hỏi không?",""],["Let's schedule a follow-up meeting.","Hãy lên lịch một cuộc họp tiếp theo.",""],["I'd like to hear everyone's thoughts.","Tôi muốn nghe ý kiến của mọi người.",""],["That's all for today. Thanks, everyone.","Hôm nay đến đây thôi. Cảm ơn mọi người.",""]]},{"stage":"Intermediate","en":"Giving updates","vi":"Báo cáo tiến độ","items":[["We're on track to finish by Friday.","Chúng tôi đang đúng tiến độ để xong trước thứ Sáu.",""],["We're slightly behind schedule.","Chúng tôi hơi chậm tiến độ.",""],["The first phase is complete.","Giai đoạn đầu đã hoàn thành.",""],["We've run into a few issues with the supplier.","Chúng tôi gặp vài vấn đề với nhà cung cấp.",""],["I'm still waiting for approval from finance.","Tôi vẫn đang chờ phòng tài chính phê duyệt.",""],["The main challenge right now is…","Thách thức chính hiện nay là…",""],["We expect to have results by next week.","Chúng tôi dự kiến có kết quả vào tuần sau.",""],["Sales are up 12% compared to last quarter.","Doanh số tăng 12% so với quý trước.",""],["Here's a quick summary of where we are.","Đây là tóm tắt nhanh tình hình hiện tại.",""],["I'll keep you posted.","Tôi sẽ cập nhật thường xuyên cho anh/chị.",""],["Everything is going according to plan.","Mọi thứ đang diễn ra theo kế hoạch.",""],["We need more resources to meet the deadline.","Chúng tôi cần thêm nguồn lực để kịp hạn chót.",""]]},{"stage":"Intermediate","en":"Asking for clarification","vi":"Hỏi lại cho rõ","items":[["Could you clarify what you mean by…?","Anh/chị làm rõ ý … được không?",""],["Just to make sure I understand, you want…?","Để chắc là tôi hiểu đúng, anh/chị muốn…?",""],["Could you give me an example?","Anh/chị cho tôi một ví dụ được không?",""],["What's the deadline for this?","Hạn chót cho việc này là khi nào?",""],["Sorry, could you repeat the last part?","Xin lỗi, anh/chị nhắc lại phần cuối được không?",""],["Do you mean we should cancel it?","Ý anh/chị là chúng ta nên huỷ nó?",""],["Could you walk me through it?","Anh/chị hướng dẫn tôi từng bước được không?",""],["So, if I understand correctly, …","Vậy nếu tôi hiểu đúng thì…",""],["Is that a priority?","Việc đó có phải ưu tiên không?",""],["What exactly do you need from me?","Chính xác anh/chị cần gì từ tôi?",""]]},{"stage":"Intermediate","en":"Requests & offers","vi":"Đề nghị & đề xuất giúp đỡ","items":[["Would it be possible to get the report by noon?","Có thể có báo cáo trước buổi trưa không?",""],["I was wondering if you could help me with this.","Không biết anh/chị có thể giúp tôi việc này không.",""],["Could you please send me the latest figures?","Anh/chị gửi tôi số liệu mới nhất được không?",""],["Would you mind reviewing my draft?","Anh/chị có phiền xem bản nháp của tôi không?",""],["I'd be happy to help.","Tôi rất sẵn lòng giúp.",""],["Let me take care of that.","Để tôi lo việc đó.",""],["Would you like me to prepare the slides?","Anh/chị có muốn tôi chuẩn bị slide không?",""],["I can cover for you tomorrow.","Mai tôi có thể làm thay anh/chị.",""],["Is there anything I can do to help?","Tôi có thể giúp gì không?",""],["I'm afraid I can't take on any more work this week.","E là tuần này tôi không nhận thêm việc được nữa.",""],["Could we discuss this after lunch?","Chúng ta bàn việc này sau bữa trưa được không?",""],["That would be a great help.","Điều đó sẽ giúp ích rất nhiều.",""]]},{"stage":"Intermediate","en":"Presentations","vi":"Thuyết trình","items":[["Good morning, everyone. Thank you for being here.","Chào buổi sáng mọi người. Cảm ơn mọi người đã có mặt.",""],["Today, I'm going to talk about our new strategy.","Hôm nay tôi sẽ nói về chiến lược mới của chúng ta.",""],["My presentation is divided into three parts.","Bài thuyết trình của tôi chia làm ba phần.",""],["Let's start with some background.","Hãy bắt đầu với một chút bối cảnh.",""],["As you can see on this slide, …","Như các bạn thấy trên slide này…",""],["This chart shows our sales over the past year.","Biểu đồ này cho thấy doanh số trong năm qua.",""],["Let me draw your attention to this figure.","Tôi xin lưu ý các bạn đến con số này.",""],["Moving on to the next point, …","Chuyển sang ý tiếp theo…",""],["This brings me to my next point.","Điều này dẫn tôi đến ý tiếp theo.",""],["To sum up, …","Tóm lại…",""],["The key takeaway is…","Điểm mấu chốt cần nhớ là…",""],["I'll be happy to take any questions.","Tôi sẵn lòng trả lời câu hỏi.",""],["That's a great question.","Đó là một câu hỏi hay.",""],["I don't have that information right now, but I'll get back to you.","Hiện tôi chưa có thông tin đó, nhưng tôi sẽ phản hồi sau.",""],["Thank you for your attention.","Cảm ơn mọi người đã lắng nghe.",""]]},{"stage":"Intermediate","en":"Customer service","vi":"Chăm sóc khách hàng","items":[["Thank you for contacting us.","Cảm ơn quý khách đã liên hệ.",""],["How can I assist you today?","Hôm nay tôi có thể hỗ trợ gì cho quý khách?",""],["I'm sorry to hear about that.","Tôi rất tiếc khi nghe điều đó.",""],["Could you give me your order number?","Quý khách cho tôi xin mã đơn hàng được không?",""],["Let me check that for you.","Để tôi kiểm tra cho quý khách.",""],["I completely understand your frustration.","Tôi hoàn toàn hiểu sự bực bội của quý khách.",""],["We'll send you a replacement free of charge.","Chúng tôi sẽ gửi sản phẩm thay thế miễn phí.",""],["I've escalated your case to our technical team.","Tôi đã chuyển trường hợp của quý khách lên đội kỹ thuật.",""],["You should receive it within three business days.","Quý khách sẽ nhận được trong vòng ba ngày làm việc.",""],["Is there anything else I can do for you?","Tôi còn có thể giúp gì nữa không?",""],["We appreciate your patience.","Chúng tôi trân trọng sự kiên nhẫn của quý khách.",""],["Thank you for your business.","Cảm ơn quý khách đã tin dùng.",""]]},{"stage":"Intermediate","en":"Video calls","vi":"Họp trực tuyến","items":[["Can everyone hear me?","Mọi người có nghe tôi nói không?",""],["I think you're on mute.","Tôi nghĩ bạn đang tắt mic.",""],["Your screen is frozen.","Màn hình của bạn bị đứng.",""],["Let me share my screen.","Để tôi chia sẻ màn hình.",""],["Can you see my screen?","Mọi người thấy màn hình của tôi không?",""],["Sorry, my connection is a bit unstable.","Xin lỗi, kết nối của tôi hơi chập chờn.",""],["Could you turn on your camera?","Bạn bật camera lên được không?",""],["I'll drop the link in the chat.","Tôi sẽ gửi đường link vào khung chat.",""],["You cut out for a second.","Tiếng của bạn bị mất một lúc.",""],["Let's wait a couple of minutes for others to join.","Hãy đợi vài phút để mọi người vào.",""]]},{"stage":"Advanced","en":"Negotiation","vi":"Đàm phán","items":[["What would you need to see in order to move forward?","Anh/chị cần thấy điều gì để có thể tiến tới?",""],["We're looking for a long-term partnership.","Chúng tôi đang tìm kiếm quan hệ đối tác lâu dài.",""],["Is there any flexibility on the price?","Giá có thể linh hoạt không?",""],["That's a bit higher than our budget.","Mức đó hơi cao so với ngân sách của chúng tôi.",""],["If you can lower the price, we can increase the order.","Nếu anh/chị giảm giá, chúng tôi có thể tăng số lượng đặt hàng.",""],["We could offer a 5% discount for bulk orders.","Chúng tôi có thể giảm 5% cho đơn hàng số lượng lớn.",""],["I'm afraid that's our final offer.","E rằng đó là đề nghị cuối cùng của chúng tôi.",""],["Let's find a solution that works for both sides.","Hãy tìm giải pháp có lợi cho cả hai bên.",""],["I need to run this by my manager.","Tôi cần trao đổi việc này với quản lý.",""],["Can we put that in writing?","Chúng ta ghi việc đó thành văn bản được không?",""],["I think we have a deal.","Tôi nghĩ chúng ta đã thoả thuận xong.",""],["Let's meet halfway.","Mỗi bên nhượng bộ một chút nhé.",""]]},{"stage":"Advanced","en":"Disagreeing diplomatically","vi":"Phản đối khéo léo","items":[["I understand your point, but I have some concerns.","Tôi hiểu quan điểm của anh/chị, nhưng tôi có vài băn khoăn.",""],["I'm not sure that's the best approach.","Tôi không chắc đó là cách tiếp cận tốt nhất.",""],["Have we considered the risks?","Chúng ta đã cân nhắc rủi ro chưa?",""],["I see where you're coming from, however…","Tôi hiểu lý do của anh/chị, tuy nhiên…",""],["With respect, I'd like to suggest an alternative.","Với sự tôn trọng, tôi muốn đề xuất một phương án khác.",""],["Could we look at this from a different angle?","Chúng ta nhìn vấn đề từ góc khác được không?",""],["The data suggest otherwise.","Số liệu lại cho thấy điều ngược lại.",""],["I'm not fully convinced yet.","Tôi chưa hoàn toàn bị thuyết phục.",""],["Let's weigh the pros and cons.","Hãy cân nhắc ưu và nhược điểm.",""],["I'd be cautious about committing to that.","Tôi sẽ thận trọng khi cam kết việc đó.",""],["That might work, but let's test it first.","Có thể ổn, nhưng hãy thử nghiệm trước.",""],["I'm happy to go with the team's decision.","Tôi sẵn sàng theo quyết định của nhóm.",""]]},{"stage":"Advanced","en":"Giving & receiving feedback","vi":"Góp ý & nhận góp ý","items":[["You did a great job on the report.","Bạn làm báo cáo rất tốt.",""],["One thing you could improve is…","Một điểm bạn có thể cải thiện là…",""],["Have you thought about trying…?","Bạn đã nghĩ đến việc thử… chưa?",""],["I really appreciate your attention to detail.","Tôi rất trân trọng sự tỉ mỉ của bạn.",""],["It might be clearer if you…","Có lẽ sẽ rõ hơn nếu bạn…",""],["Thanks for the feedback. That's really useful.","Cảm ơn góp ý. Rất hữu ích.",""],["Could you be more specific?","Anh/chị nói cụ thể hơn được không?",""],["I'll take that on board.","Tôi sẽ tiếp thu điều đó.",""],["How do you think I could do better next time?","Anh/chị nghĩ lần sau tôi có thể làm tốt hơn thế nào?",""],["I take full responsibility for the mistake.","Tôi chịu hoàn toàn trách nhiệm về lỗi đó.",""],["Let's discuss how to avoid this in the future.","Hãy bàn cách tránh việc này trong tương lai.",""],["Keep up the good work!","Cứ tiếp tục phát huy nhé!",""]]},{"stage":"Advanced","en":"Job interviews","vi":"Phỏng vấn xin việc","items":[["Thank you for inviting me to this interview.","Cảm ơn anh/chị đã mời tôi phỏng vấn.",""],["Could you tell me a little about yourself?","Bạn giới thiệu đôi chút về bản thân được không?",""],["I have three years of experience in sales.","Tôi có ba năm kinh nghiệm bán hàng.",""],["My greatest strength is my ability to learn quickly.","Điểm mạnh lớn nhất của tôi là khả năng học nhanh.",""],["One area I'm working on is public speaking.","Một mảng tôi đang cải thiện là nói trước đám đông.",""],["I'm interested in this role because…","Tôi quan tâm vị trí này vì…",""],["In my previous role, I led a team of five.","Ở vị trí trước, tôi dẫn dắt một nhóm năm người.",""],["I handled the situation by…","Tôi đã xử lý tình huống đó bằng cách…",""],["As a result, we increased sales by 20%.","Kết quả là chúng tôi tăng doanh số 20%.",""],["I see myself growing into a leadership role.","Tôi thấy mình phát triển lên vị trí lãnh đạo.",""],["What does a typical day look like in this position?","Một ngày làm việc điển hình ở vị trí này thế nào?",""],["What are the next steps in the hiring process?","Các bước tiếp theo của quy trình tuyển dụng là gì?",""],["I'm a quick learner and a strong team player.","Tôi học nhanh và làm việc nhóm tốt.",""],["Thank you for your time. I look forward to hearing from you.","Cảm ơn anh/chị đã dành thời gian. Tôi mong nhận được phản hồi.",""]]},{"stage":"Advanced","en":"Leading teams","vi":"Điều hành nhóm","items":[["Let's set clear goals for this quarter.","Hãy đặt mục tiêu rõ ràng cho quý này.",""],["I'd like each of you to own one part of the project.","Tôi muốn mỗi người phụ trách một phần của dự án.",""],["What do you need from me to get this done?","Mọi người cần tôi hỗ trợ gì để hoàn thành?",""],["Let's prioritize the most urgent tasks.","Hãy ưu tiên các việc gấp nhất.",""],["I trust you to make the call.","Tôi tin bạn sẽ quyết định đúng.",""],["Please flag any risks early.","Hãy báo sớm mọi rủi ro.",""],["Great teamwork, everyone!","Mọi người làm việc nhóm tuyệt lắm!",""],["Let's learn from this and move on.","Hãy rút kinh nghiệm và tiếp tục.",""],["My door is always open.","Cứ đến gặp tôi bất cứ lúc nào.",""],["Let's align on the timeline.","Hãy thống nhất về tiến độ.",""]]},{"stage":"Advanced","en":"Handling problems & escalation","vi":"Xử lý sự cố & báo cáo cấp trên","items":[["We have an urgent issue that needs your attention.","Chúng ta có một vấn đề khẩn cần anh/chị lưu ý.",""],["Here's what happened and what we've done so far.","Đây là những gì đã xảy ra và những gì chúng tôi đã làm.",""],["The root cause seems to be…","Nguyên nhân gốc rễ có vẻ là…",""],["I suggest we take the following steps.","Tôi đề xuất chúng ta làm các bước sau.",""],["I'll keep you updated every two hours.","Tôi sẽ cập nhật cho anh/chị mỗi hai giờ.",""],["We need a decision by the end of the day.","Chúng ta cần quyết định trước cuối ngày.",""],["I apologize for the inconvenience this has caused.","Tôi xin lỗi vì sự bất tiện đã gây ra.",""],["We've put measures in place to prevent this from happening again.","Chúng tôi đã có biện pháp để tránh việc này lặp lại.",""]]},{"stage":"Advanced","en":"Networking","vi":"Mở rộng quan hệ","items":[["What line of work are you in?","Anh/chị làm trong lĩnh vực nào?",""],["I really enjoyed your talk this morning.","Tôi rất thích bài nói sáng nay của anh/chị.",""],["How did you get started in this field?","Anh/chị bắt đầu trong lĩnh vực này thế nào?",""],["We should definitely stay in touch.","Chúng ta chắc chắn nên giữ liên lạc.",""],["Here's my card.","Đây là danh thiếp của tôi.",""],["Would you be open to a quick call next week?","Tuần sau anh/chị có sẵn lòng gọi nhanh một cuộc không?",""],["I'd love to hear more about your company.","Tôi rất muốn nghe thêm về công ty anh/chị.",""],["Let me introduce you to my colleague, Tom.","Để tôi giới thiệu anh/chị với đồng nghiệp của tôi, Tom.",""],["It was a pleasure meeting you.","Rất hân hạnh được gặp anh/chị.",""],["Let's connect on LinkedIn.","Hãy kết nối trên LinkedIn nhé.",""]]}],"toeic":[{"stage":"Basic","en":"Part 1: people in action","vi":"Part 1: Người đang hành động","items":[["A woman is reaching for a file.","Một người phụ nữ đang với tay lấy tập hồ sơ.","reach for + N: với tay lấy; động từ chỉ cử chỉ tay hay gặp"],["They're facing each other.","Họ đang đối mặt nhau.","face each other: đối diện nhau; mô tả tư thế"],["A man is typing on a keyboard.","Một người đàn ông đang gõ bàn phím.","is + V-ing: hành động đang diễn ra trong ảnh"],["Some people are seated around a table.","Vài người đang ngồi quanh một chiếc bàn.","be seated = đang ngồi (trạng thái), hay dùng thay cho sitting"],["A worker is wearing a safety helmet.","Một công nhân đang đội mũ bảo hộ.","wearing = đang mặc/đội (trạng thái); bẫy: putting on"],["A woman is putting on her jacket.","Một người phụ nữ đang mặc áo khoác vào.","putting on: hành động đang mặc vào, khác wearing"],["Two men are carrying a box together.","Hai người đàn ông đang cùng khiêng một chiếc hộp.","carry: mang/khiêng; chủ ngữ số nhiều + are + V-ing"],["A customer is paying for some items at the counter.","Một khách hàng đang thanh toán vài món hàng ở quầy.","pay for + N: trả tiền cho"],["The man is leaning against a railing.","Người đàn ông đang dựa vào lan can.","lean against/on: dựa vào"],["She's examining a document closely.","Cô ấy đang xem xét kỹ một tài liệu.","examine/review/look at: các động từ \"xem\" hay gặp"],["Some people are walking along the shore.","Vài người đang đi dạo dọc bờ biển.","walk along + N: đi dọc theo"],["A man is addressing an audience.","Một người đàn ông đang phát biểu trước khán giả.","address an audience: nói trước đám đông"],["A woman is pouring water into a glass.","Một người phụ nữ đang rót nước vào ly.","pour A into B: rót A vào B"],["They're shaking hands in a lobby.","Họ đang bắt tay nhau ở sảnh.","shake hands: bắt tay; chú ý cả địa điểm ở cuối câu"]]},{"stage":"Basic","en":"Part 1: things and places","vi":"Part 1: Đồ vật và địa điểm","items":[["Some chairs have been stacked against the wall.","Vài chiếc ghế đã được xếp chồng dựa vào tường.","has/have been + V3: trạng thái kết quả, ảnh không cần có người"],["A car is being repaired in a garage.","Một chiếc xe đang được sửa trong ga-ra.","is being + V3: hành động đang diễn ra, phải có người đang làm"],["The shelves are stocked with merchandise.","Các kệ được chất đầy hàng hóa.","be + V3: trạng thái hiện tại; be stocked with: chất đầy"],["There are some boats docked in the harbor.","Có vài chiếc thuyền đang neo đậu ở bến cảng.","There are + N + V3: có ... (rút gọn bị động)"],["A ladder is leaning against the building.","Một cái thang đang dựa vào tòa nhà.","Vật + is leaning: mô tả vị trí, không phải hành động người"],["The floor is being swept.","Sàn nhà đang được quét.","Bẫy being/been: chỉ đúng khi ảnh có người đang quét"],["Some documents have been left on the desk.","Vài tài liệu đã được để lại trên bàn.","have been left: trạng thái; ảnh không người hay dùng cấu trúc này"],["A lamp has been placed next to the sofa.","Một chiếc đèn đã được đặt cạnh ghế sofa.","next to = beside: bên cạnh"],["There is a potted plant in the corner of the room.","Có một chậu cây ở góc phòng.","There is + N + giới từ nơi chốn; in the corner of: ở góc"],["Some cups are arranged in a row.","Vài chiếc cốc được xếp thành một hàng.","be arranged in a row: được xếp thành hàng"],["A bicycle is parked beside the entrance.","Một chiếc xe đạp đang đỗ cạnh lối vào.","be parked: trạng thái đỗ; beside: bên cạnh"],["The road is lined with trees.","Con đường có hàng cây chạy dọc hai bên.","be lined with: có hàng ... dọc theo"],["A painting is hanging above the fireplace.","Một bức tranh đang treo phía trên lò sưởi.","above: phía trên (không chạm); vật + is hanging: trạng thái"],["Boxes are being loaded onto a truck.","Các thùng hàng đang được chất lên xe tải.","are being loaded: ảnh phải có người đang chất hàng"]]},{"stage":"Basic","en":"Part 2: answering WH- questions","vi":"Part 2: Trả lời câu hỏi WH-","items":[["When is the report due? — Didn't Mr. Lee extend the deadline?","Khi nào phải nộp báo cáo? — Không phải anh Lee đã gia hạn rồi sao?","Đáp gián tiếp bằng câu hỏi ngược, vẫn đúng ý"],["Where did you put the client files? — Ms. Chen has them now.","Bạn để hồ sơ khách hàng ở đâu? — Chị Chen đang giữ chúng.","Hỏi nơi chốn nhưng đáp bằng người đang giữ: vẫn hợp lý"],["Who's in charge of the new project? — It hasn't been decided yet.","Ai phụ trách dự án mới? — Vẫn chưa quyết định.","\"Chưa biết/chưa quyết\" là đáp án an toàn cho mọi câu WH-"],["Why was the meeting postponed? — The manager is out sick today.","Sao cuộc họp bị hoãn? — Quản lý bị ốm nên nghỉ hôm nay.","Why: đáp lý do, không cần có \"Because\""],["How did the presentation go? — Better than I expected.","Buổi thuyết trình thế nào? — Tốt hơn tôi nghĩ.","How did ... go: hỏi kết quả; đáp bằng đánh giá"],["What time does the store open? — Let me check the website.","Mấy giờ cửa hàng mở cửa? — Để tôi xem trên trang web.","\"Để tôi kiểm tra\" là đáp án hợp lý; bẫy: lặp lại từ \"store\""],["Which hotel are you staying at? — The one near the convention center.","Bạn ở khách sạn nào? — Cái gần trung tâm hội nghị.","Which: hay đáp bằng \"the one ...\""],["How long will the renovation take? — About three weeks.","Việc cải tạo mất bao lâu? — Khoảng ba tuần.","How long: thời lượng; bẫy: đáp mốc thời gian \"Last week\""],["Whose turn is it to order supplies? — I did it last time.","Đến lượt ai đặt văn phòng phẩm? — Lần trước tôi đặt rồi.","Đáp gián tiếp: \"lần trước tôi làm rồi\" = không phải tôi"],["Where can I find the copy paper? — In the supply cabinet.","Tôi lấy giấy photo ở đâu? — Trong tủ đồ dùng văn phòng.","Bẫy âm giống: copy vs coffee"],["How often do you visit the factory? — Twice a month.","Bạn đến nhà máy bao lâu một lần? — Hai lần một tháng.","How often: tần suất; bẫy: đáp \"For two hours\""],["Who should I send the invoice to? — The accounting department.","Tôi nên gửi hóa đơn cho ai? — Phòng kế toán.","Who: đáp bằng phòng ban cũng đúng, không nhất thiết là tên người"],["When will the shipment arrive? — It's already here.","Khi nào lô hàng đến? — Nó đến rồi.","Đáp gián tiếp, bác bỏ giả định của câu hỏi"],["What did you think of the new software? — It's much easier to use.","Bạn thấy phần mềm mới thế nào? — Dễ dùng hơn nhiều.","What did you think of: hỏi ý kiến, đáp bằng nhận xét"]]},{"stage":"Basic","en":"Part 2: yes/no, choice and suggestion questions","vi":"Part 2: Câu hỏi Yes/No, lựa chọn và đề nghị","items":[["Why don't we take a taxi? — That's a good idea.","Sao chúng ta không đi taxi nhỉ? — Ý hay đấy.","Why don't we = đề nghị, không hỏi lý do; đừng chọn \"Because\""],["Would you rather meet today or tomorrow? — Either works for me.","Bạn muốn gặp hôm nay hay ngày mai? — Ngày nào cũng được.","Câu lựa chọn: Either/Neither/Whichever thường là đáp án"],["You've met our new director, haven't you? — Yes, at the conference last week.","Bạn đã gặp giám đốc mới rồi, phải không? — Rồi, ở hội nghị tuần trước.","Câu hỏi đuôi: trả lời như câu hỏi Yes/No bình thường"],["Isn't the office closed on Friday? — No, only on Saturday.","Văn phòng không đóng cửa thứ Sáu à? — Không, chỉ thứ Bảy thôi.","Câu hỏi phủ định: Yes/No theo sự thật, bỏ qua chữ \"not\""],["Could you help me move these boxes? — Sure, where do you want them?","Bạn giúp tôi chuyển mấy thùng này được không? — Được, bạn muốn để đâu?","Lời nhờ: Sure/Of course + câu hỏi tiếp"],["Would you like me to print the handouts? — Thanks, that would be great.","Bạn có muốn tôi in tài liệu phát tay không? — Cảm ơn, vậy thì tốt quá.","Would you like me to: đề nghị giúp đỡ"],["Should we order lunch or go out to eat? — Let's go to the café downstairs.","Chúng ta nên đặt đồ ăn hay ra ngoài ăn? — Mình xuống quán cà phê dưới lầu đi.","Câu lựa chọn: chọn một vế bằng cách diễn đạt khác"],["Do you know if the train is on time? — It's running ten minutes late.","Bạn có biết tàu có đúng giờ không? — Tàu đang trễ mười phút.","Do you know if: câu hỏi gián tiếp; đáp thẳng nội dung"],["Haven't you finished the budget proposal yet? — I'm working on it now.","Bạn vẫn chưa xong đề xuất ngân sách à? — Tôi đang làm đây.","Đáp ngầm, không cần nói Yes/No"],["Let's review the contract before the meeting. — I'll bring a copy.","Hãy xem lại hợp đồng trước cuộc họp. — Tôi sẽ mang theo một bản.","Câu đề nghị Let's: đồng ý ngầm bằng hành động"],["The printer is out of paper again, isn't it? — I'll get some more.","Máy in lại hết giấy rồi, phải không? — Để tôi đi lấy thêm.","Câu hỏi đuôi, đáp bằng giải pháp"],["Is the conference room available this afternoon? — It's been booked by the sales team.","Phòng họp chiều nay có trống không? — Nhóm bán hàng đã đặt rồi.","Đáp gián tiếp thay cho \"No\""],["Would you mind closing the window? — Not at all.","Bạn có phiền đóng cửa sổ giúp không? — Không phiền gì.","Would you mind: đồng ý = Not at all/No problem"],["Do you want the blue folder or the red one? — Neither, actually.","Bạn muốn bìa màu xanh hay màu đỏ? — Thật ra cái nào cũng không.","Neither: không chọn cả hai, vẫn là đáp án hợp lý"]]},{"stage":"Basic","en":"Speaking Q1–2: read aloud","vi":"Nói câu 1–2: đọc to đoạn văn","items":[["Thank you for calling Green Valley Bank.","Cảm ơn quý khách đã gọi đến Ngân hàng Green Valley.","Câu mở đầu; nhấn vào tên ngân hàng, xuống giọng cuối câu"],["Our office hours are Monday through Friday, from 9 a.m. to 6 p.m.","Giờ làm việc của chúng tôi là từ thứ Hai đến thứ Sáu, từ 9 giờ sáng đến 6 giờ chiều.","Ngắt nhẹ sau \"Friday\"; đọc rõ \"nine a.m.\" và \"six p.m.\""],["If you know your party's extension, please dial it now.","Nếu quý khách biết số máy lẻ của người cần gặp, vui lòng bấm số ngay bây giờ.","Ngắt ở dấu phẩy sau mệnh đề \"If\", rồi đọc tiếp lời hướng dẫn"],["For account information, press one; to report a lost card, press two.","Để biết thông tin tài khoản, bấm phím 1; để báo mất thẻ, bấm phím 2.","Ngắt ở dấu chấm phẩy; nhấn vào \"one\" và \"two\""],["Our new store offers furniture, kitchenware, and home decorations.","Cửa hàng mới của chúng tôi cung cấp đồ nội thất, đồ dùng nhà bếp và đồ trang trí nhà cửa.","Liệt kê: lên giọng ở \"furniture\", \"kitchenware\", xuống giọng ở mục cuối"],["Attention, shoppers: all winter coats are now 30 percent off.","Xin quý khách chú ý: tất cả áo khoác mùa đông hiện đang giảm giá 30%.","Ngắt sau \"shoppers\"; nhấn mạnh \"thirty percent off\""],["Welcome to tonight's edition of Business Today, where we cover the latest economic news.","Chào mừng quý vị đến với chương trình Business Today tối nay, nơi chúng tôi cập nhật tin tức kinh tế mới nhất.","Mở đầu bản tin; nhấn tên chương trình, ngắt trước \"where\""],["In today's session, you will learn how to plan, organize, and lead effective meetings.","Trong buổi học hôm nay, bạn sẽ học cách lên kế hoạch, tổ chức và điều hành các cuộc họp hiệu quả.","Liệt kê động từ: lên giọng ở \"plan\", \"organize\", xuống giọng ở \"lead\""],["Flight 207 to Singapore has been delayed due to severe weather conditions.","Chuyến bay 207 đi Singapore đã bị hoãn do điều kiện thời tiết xấu.","Đọc số \"two-oh-seven\"; nhấn mạnh \"delayed\""],["Passengers are asked to remain in the waiting area until further notice.","Hành khách được yêu cầu ở lại khu vực chờ cho đến khi có thông báo mới.","Câu bị động; ngắt nhẹ trước \"until\""],["Tickets are available online, at the box office, or by phone at 555-0142.","Vé được bán trực tuyến, tại quầy bán vé hoặc qua điện thoại theo số 555-0142.","Liệt kê 3 mục lên-lên-xuống; đọc từng chữ số, ngắt sau \"555\""],["Don't miss this limited-time offer, which ends on Sunday, March 15th.","Đừng bỏ lỡ ưu đãi có thời hạn này, kết thúc vào Chủ nhật, ngày 15 tháng 3.","Câu kết quảng cáo; đọc \"March fifteenth\", xuống giọng cuối câu"],["For more information, please visit our website at www.greenvalley.com.","Để biết thêm thông tin, vui lòng truy cập trang web của chúng tôi tại www.greenvalley.com.","Câu kết; đọc \"w-w-w dot green valley dot com\""]]},{"stage":"Basic","en":"Speaking Q3–4: describe a picture","vi":"Nói câu 3–4: mô tả tranh","items":[["This picture was taken at an outdoor market.","Bức tranh này được chụp ở một khu chợ ngoài trời.","Câu mở đầu: nêu địa điểm"],["This appears to be a meeting room in an office building.","Đây có vẻ là một phòng họp trong một tòa nhà văn phòng.","Mở đầu khi chưa chắc chắn về địa điểm"],["The first thing I notice is a group of people sitting around a large table.","Điều đầu tiên tôi chú ý là một nhóm người đang ngồi quanh một chiếc bàn lớn.","Giới thiệu chủ thể chính của bức tranh"],["In the foreground, a woman is choosing some fruit from a stall.","Ở tiền cảnh, một người phụ nữ đang chọn trái cây ở một quầy hàng.","Vị trí + hành động (hiện tại tiếp diễn)"],["On the right side of the picture, a man is talking on the phone.","Ở bên phải bức tranh, một người đàn ông đang nói chuyện điện thoại.","Vị trí bên phải + hành động"],["In the background, I can see several buildings and some trees.","Ở hậu cảnh, tôi có thể thấy vài tòa nhà và một số cây xanh.","Mô tả hậu cảnh"],["Next to him, there is a young woman holding a cup of coffee.","Bên cạnh anh ấy là một phụ nữ trẻ đang cầm một tách cà phê.","There is + người + V-ing"],["She has long dark hair and is wearing a white blouse and glasses.","Cô ấy có mái tóc dài sẫm màu, mặc áo sơ mi trắng và đeo kính.","Mô tả ngoại hình và trang phục"],["The man behind the counter is handing a bag to a customer.","Người đàn ông đứng sau quầy đang đưa một chiếc túi cho khách hàng.","Mô tả hành động chi tiết"],["Some boxes of vegetables are stacked on the ground.","Vài thùng rau được xếp chồng lên nhau trên mặt đất.","Mô tả đồ vật bằng câu bị động"],["It seems like the weather is warm and sunny.","Có vẻ như thời tiết ấm áp và nắng đẹp.","Phỏng đoán thời tiết, không khí"],["It looks like they are discussing an important project.","Trông như họ đang thảo luận về một dự án quan trọng.","Phỏng đoán hoạt động của mọi người"],["Overall, it looks like a busy day at the market.","Nhìn chung, có vẻ đây là một ngày đông đúc ở chợ.","Câu kết: nhận xét tổng thể"]]},{"stage":"Basic","en":"Writing Q1–5: sentences from a picture","vi":"Viết câu 1–5: viết câu theo tranh","items":[["The woman is wearing a jacket because it is cold outside.","Người phụ nữ mặc áo khoác vì bên ngoài trời lạnh.","Từ cho sẵn: woman / because"],["The man is standing on a ladder so that he can reach the top shelf.","Người đàn ông đứng trên thang để có thể với tới kệ trên cùng.","Từ cho sẵn: ladder / so that (so that + S + can + V)"],["One man is typing on his laptop while his colleague is reading a report.","Một người đàn ông đang gõ máy tính trong khi đồng nghiệp của anh ấy đang đọc báo cáo.","Từ cho sẵn: laptop / while"],["A bicycle is parked next to the entrance of the building.","Một chiếc xe đạp được đỗ cạnh lối vào tòa nhà.","Từ cho sẵn: bicycle / next to"],["The customers are waiting in line in order to pay for their groceries.","Khách hàng đang xếp hàng để thanh toán tiền hàng tạp hóa.","Từ cho sẵn: line / in order to (in order to + V nguyên mẫu)"],["Although the restaurant is crowded, the waiter looks calm.","Mặc dù nhà hàng đông khách, người phục vụ trông vẫn bình tĩnh.","Từ cho sẵn: restaurant / although"],["The workers will take a break after they finish loading the truck.","Các công nhân sẽ nghỉ giải lao sau khi chất hàng xong lên xe tải.","Từ cho sẵn: truck / after"],["The woman is smiling as she shakes hands with the client.","Người phụ nữ mỉm cười khi bắt tay khách hàng.","Từ cho sẵn: shake / as (as = trong lúc); được đổi dạng từ"],["The man is holding a folder which contains some documents.","Người đàn ông đang cầm một tập hồ sơ chứa một số tài liệu.","Từ cho sẵn: folder / which (mệnh đề quan hệ)"],["The woman will buy the dress if it fits her well.","Người phụ nữ sẽ mua chiếc váy nếu nó vừa với cô ấy.","Từ cho sẵn: dress / if (điều kiện loại 1)"],["Two cars are parked in front of the hotel.","Hai chiếc ô tô đang đỗ trước khách sạn.","Từ cho sẵn: car / in front of (được đổi sang số nhiều)"],["Before the meeting begins, the man is setting up the projector.","Trước khi cuộc họp bắt đầu, người đàn ông đang lắp đặt máy chiếu.","Từ cho sẵn: projector / before"]]},{"stage":"Intermediate","en":"Part 3: conversation phrases","vi":"Part 3: Mẫu câu hội thoại","items":[["I'm calling about the job opening I saw on your website.","Tôi gọi về vị trí tuyển dụng tôi thấy trên trang web của quý công ty.","I'm calling about: mục đích cuộc gọi, hay bị hỏi"],["I was wondering if you could cover my shift on Friday.","Không biết bạn có thể làm thay ca cho tôi vào thứ Sáu không.","I was wondering if: nhờ vả lịch sự"],["Could you send me the updated price list?","Bạn gửi cho tôi bảng giá mới được không?","Could you + V: lời yêu cầu; câu hỏi \"What does the man request?\""],["Let me check the schedule and get back to you.","Để tôi xem lịch rồi báo lại cho bạn.","get back to sb: liên lạc lại; hỏi \"What will the woman do next?\""],["I'm afraid we're out of stock on that model.","E rằng mẫu đó chúng tôi đã hết hàng.","I'm afraid: báo tin xấu lịch sự, thường chứa vấn đề"],["Thursday afternoon works for me.","Chiều thứ Năm thì tôi được.","... works for me: đồng ý với thời gian đề xuất"],["What seems to be the problem?","Có vấn đề gì vậy ạ?","Hỏi sự cố; câu đáp ngay sau thường là đáp án \"What is the problem?\""],["Would it be possible to change my reservation?","Liệu tôi có thể đổi đặt chỗ được không?","Would it be possible to: yêu cầu lịch sự"],["Unfortunately, the shipment has been delayed.","Thật không may, lô hàng đã bị chậm trễ.","Unfortunately/Actually: tín hiệu sắp nói vấn đề"],["Why don't I email you the details after the meeting?","Hay là tôi gửi email chi tiết cho bạn sau cuộc họp nhé?","Why don't I: đề nghị làm gì; câu hỏi \"What does the man offer?\""],["Have you had a chance to look at the proposal?","Bạn đã có dịp xem đề xuất chưa?","Have you had a chance to: hỏi đã làm chưa (lịch sự)"],["I'll put you through to the billing department.","Tôi sẽ nối máy cho bạn tới phòng thanh toán.","put sb through to: nối máy"],["That sounds great, but I have a prior commitment.","Nghe hay đấy, nhưng tôi có hẹn trước rồi.","but + lý do: từ chối khéo"],["By the way, did you hear that Ms. Park is retiring?","Nhân tiện, bạn có nghe chị Park sắp nghỉ hưu không?","By the way: chuyển chủ đề, hay chứa thông tin cho câu hỏi"]]},{"stage":"Intermediate","en":"Part 4: announcements, voicemails and ads","vi":"Part 4: Thông báo, tin nhắn thoại và quảng cáo","items":[["Attention, passengers: Flight 207 to Denver has been moved to Gate 12.","Hành khách chú ý: Chuyến bay 207 đi Denver đã chuyển sang cổng 12.","Attention, ...: mở đầu thông báo; cho biết người nghe là ai"],["Thank you for calling Westfield Dental Clinic.","Cảm ơn quý khách đã gọi đến Phòng khám Nha khoa Westfield.","Thank you for calling + tên: tin nhắn tự động, đoán loại doanh nghiệp"],["This is a reminder that your appointment is scheduled for Monday at ten.","Xin nhắc rằng lịch hẹn của bạn là vào thứ Hai lúc mười giờ.","This is a reminder that: nêu mục đích tin nhắn"],["Please be advised that the east parking lot will be closed for repairs.","Xin lưu ý rằng bãi đỗ xe phía đông sẽ đóng cửa để sửa chữa.","Please be advised that: mở đầu thông báo chính thức"],["For more information, visit our website at www.greenleaf.com.","Để biết thêm thông tin, hãy truy cập trang web www.greenleaf.com.","For more information: cuối bài; hỏi cách người nghe lấy thêm thông tin"],["Before we begin, I'd like to thank our sponsors.","Trước khi bắt đầu, tôi xin cảm ơn các nhà tài trợ.","Before we begin: mở đầu bài nói hoặc hội thảo"],["Hi, this is Karen from the marketing department.","Chào, tôi là Karen từ phòng marketing.","This is + tên: tự giới thiệu trong tin nhắn thoại"],["I'm calling to let you know that your order is ready for pickup.","Tôi gọi để báo rằng đơn hàng của bạn đã sẵn sàng để nhận.","I'm calling to let you know: mục đích cuộc gọi"],["Please call me back at your earliest convenience.","Vui lòng gọi lại cho tôi sớm nhất khi bạn tiện.","at your earliest convenience: sớm nhất có thể; yêu cầu người nghe"],["For this week only, all outdoor furniture is twenty percent off.","Chỉ trong tuần này, tất cả đồ nội thất ngoài trời giảm hai mươi phần trăm.","Quảng cáo: chú ý thời hạn và mức ưu đãi"],["We apologize for any inconvenience this may cause.","Chúng tôi xin lỗi vì mọi bất tiện có thể gây ra.","Câu xin lỗi chuẩn sau khi thông báo sự cố"],["Next on the agenda is a presentation by our head of research.","Tiếp theo trong chương trình là phần trình bày của trưởng bộ phận nghiên cứu.","Next on the agenda: hỏi \"What will listeners hear next?\""],["Stay tuned for the weather report after this short break.","Hãy tiếp tục theo dõi bản tin thời tiết sau giờ nghỉ ngắn này.","Stay tuned: bản tin radio; hỏi điều gì diễn ra tiếp theo"],["Don't miss this opportunity to save on our best-selling products.","Đừng bỏ lỡ cơ hội tiết kiệm khi mua các sản phẩm bán chạy nhất của chúng tôi.","Don't miss: kêu gọi hành động trong quảng cáo"]]},{"stage":"Intermediate","en":"Part 5: grammar structures","vi":"Part 5: Cấu trúc ngữ pháp","items":[["The new software is not only faster but also easier to use.","Phần mềm mới không chỉ nhanh hơn mà còn dễ dùng hơn.","not only A but also B: A và B cùng loại từ"],["You can pay either by credit card or by bank transfer.","Bạn có thể thanh toán bằng thẻ tín dụng hoặc chuyển khoản.","either A or B: hoặc A hoặc B"],["Both the manager and her assistant attended the workshop.","Cả quản lý và trợ lý của cô ấy đều dự buổi hội thảo.","both A and B + động từ số nhiều"],["Please call me as soon as the samples arrive.","Hãy gọi cho tôi ngay khi mẫu hàng đến.","as soon as + hiện tại đơn (mang nghĩa tương lai)"],["Despite the heavy rain, the outdoor event was a success.","Bất chấp mưa lớn, sự kiện ngoài trời vẫn thành công.","despite/in spite of + N/V-ing, không đi với mệnh đề"],["Although sales were slow in January, they recovered in March.","Dù doanh số chậm trong tháng Một, chúng đã phục hồi vào tháng Ba.","although + mệnh đề (S + V); bẫy: chọn despite"],["Staff must arrive early in order to set up the booth.","Nhân viên phải đến sớm để dựng gian hàng.","in order to + V nguyên mẫu: để"],["We extended our hours so that customers could shop after work.","Chúng tôi kéo dài giờ mở cửa để khách có thể mua sắm sau giờ làm.","so that + S + can/could: để mà"],["The demand was so high that the item sold out in a day.","Nhu cầu cao đến mức món hàng bán hết trong một ngày.","so + adj/adv + that: quá ... đến nỗi"],["It was such a popular seminar that we added a second session.","Buổi hội thảo được ưa chuộng đến mức chúng tôi mở thêm một buổi nữa.","such + a/an + adj + N + that: quá ... đến nỗi"],["Please let us know whether you will attend in person or online.","Vui lòng cho chúng tôi biết bạn sẽ tham dự trực tiếp hay trực tuyến.","whether A or B: liệu A hay B"],["Refunds will not be issued unless you present a receipt.","Sẽ không hoàn tiền trừ khi bạn xuất trình hóa đơn.","unless = if ... not: trừ khi"],["You may work from home provided that your tasks are completed on time.","Bạn có thể làm việc ở nhà với điều kiện công việc hoàn thành đúng hạn.","provided that: với điều kiện là"],["The equipment will last for years as long as it is cleaned regularly.","Thiết bị sẽ dùng được nhiều năm miễn là được vệ sinh thường xuyên.","as long as + mệnh đề: miễn là"]]},{"stage":"Intermediate","en":"Part 5–6: connectors and transitions","vi":"Part 5–6: Từ nối và chuyển ý","items":[["The product launch went well. However, online sales were lower than expected.","Buổi ra mắt sản phẩm diễn ra tốt. Tuy nhiên, doanh số trực tuyến thấp hơn dự kiến.","However: tuy nhiên (tương phản); đầu câu, sau có dấu phẩy"],["The supplier raised its prices. Therefore, we are looking for a new vendor.","Nhà cung cấp đã tăng giá. Vì vậy, chúng tôi đang tìm nhà cung cấp mới.","Therefore: vì vậy (chỉ kết quả)"],["The hotel is close to the airport. Moreover, it offers a free shuttle service.","Khách sạn gần sân bay. Hơn nữa, khách sạn có xe đưa đón miễn phí.","Moreover = Furthermore: hơn nữa (bổ sung)"],["Please submit your forms by Friday. Otherwise, your payment may be delayed.","Vui lòng nộp mẫu đơn trước thứ Sáu. Nếu không, khoản thanh toán có thể bị chậm.","Otherwise: nếu không thì (hậu quả)"],["The package includes a two-night stay. In addition, guests receive a free breakfast.","Gói dịch vụ gồm hai đêm lưu trú. Ngoài ra, khách được ăn sáng miễn phí.","In addition: ngoài ra (bổ sung)"],["The factory upgraded its machinery. As a result, production increased by thirty percent.","Nhà máy đã nâng cấp máy móc. Kết quả là sản lượng tăng ba mươi phần trăm.","As a result: kết quả là"],["We offer many employee benefits. For example, staff can use the gym for free.","Chúng tôi có nhiều phúc lợi cho nhân viên. Ví dụ, nhân viên được dùng phòng gym miễn phí.","For example = For instance: ví dụ"],["The keynote speaker canceled at the last minute. Instead, the CEO gave the opening address.","Diễn giả chính hủy vào phút chót. Thay vào đó, CEO đã phát biểu khai mạc.","Instead: thay vào đó"],["The lobby is being renovated. Meanwhile, visitors should use the side entrance.","Sảnh đang được cải tạo. Trong lúc đó, khách nên dùng lối vào bên hông.","Meanwhile: trong khi đó (cùng thời điểm)"],["Several flights were canceled due to the storm. Consequently, many passengers missed their connections.","Nhiều chuyến bay bị hủy do bão. Do đó, nhiều hành khách lỡ chuyến bay nối tiếp.","Consequently = As a result: do đó"],["Renting office space downtown is expensive. On the other hand, it gives us a central location.","Thuê văn phòng ở trung tâm thì đắt. Mặt khác, nó cho chúng ta vị trí thuận lợi.","On the other hand: mặt khác (nêu mặt còn lại)"],["The training session is optional. Nevertheless, all new hires are encouraged to attend.","Buổi đào tạo không bắt buộc. Tuy vậy, nhân viên mới được khuyến khích tham dự.","Nevertheless: tuy vậy (gần nghĩa However)"],["Your membership has expired. Accordingly, your access to the online library has been suspended.","Thẻ thành viên của bạn đã hết hạn. Theo đó, quyền truy cập thư viện trực tuyến bị tạm ngừng.","Accordingly: theo đó, vì thế"],["The new policy has been popular. In fact, over ninety percent of staff support it.","Chính sách mới được ưa chuộng. Thực tế, hơn chín mươi phần trăm nhân viên ủng hộ.","In fact: thực tế là (nhấn mạnh, đưa bằng chứng)"]]},{"stage":"Intermediate","en":"Speaking Q5–7: answering personal questions","vi":"Nói câu 5–7: trả lời câu hỏi cá nhân","items":[["That's an interesting question.","Đó là một câu hỏi thú vị.","Câu mở đầu giúp câu giờ tự nhiên"],["Let me think about that for a second.","Để tôi nghĩ một chút.","Câu giờ khi cần sắp xếp ý"],["I usually go to the supermarket near my house, mainly because it's convenient.","Tôi thường đi siêu thị gần nhà, chủ yếu vì nó tiện lợi.","Trả lời trực tiếp + lý do"],["I go shopping about twice a week, usually on weekends.","Tôi đi mua sắm khoảng hai lần một tuần, thường là vào cuối tuần.","Trả lời câu hỏi tần suất (How often...?)"],["The last time I attended a training session was about two months ago.","Lần gần nhất tôi tham dự một buổi đào tạo là khoảng hai tháng trước.","Trả lời câu hỏi \"When was the last time...?\""],["I prefer reading the news on my phone because I can do it anywhere.","Tôi thích đọc tin tức trên điện thoại hơn vì có thể đọc ở bất cứ đâu.","Nêu sở thích + lý do"],["To be more specific, I check the headlines every morning on my way to work.","Cụ thể hơn, tôi xem các tin chính mỗi sáng trên đường đi làm.","Thêm chi tiết minh họa cho câu trả lời"],["Another reason is that the prices there are quite reasonable.","Một lý do khác là giá cả ở đó khá hợp lý.","Thêm lý do thứ hai cho câu 7 (30 giây)"],["It usually takes me about twenty minutes to get there by bus.","Tôi thường mất khoảng hai mươi phút để đến đó bằng xe buýt.","Trả lời câu hỏi về thời gian, phương tiện"],["If I had to choose, I'd say online shopping is better for me.","Nếu phải chọn, tôi sẽ nói mua sắm trực tuyến phù hợp với tôi hơn.","Trả lời câu hỏi lựa chọn A hay B"],["I would definitely recommend it, especially to people who have a busy schedule.","Tôi chắc chắn sẽ giới thiệu nó, đặc biệt cho những người có lịch trình bận rộn.","Trả lời câu hỏi \"Would you recommend...?\""],["Honestly, I don't do that very often, but when I do, I really enjoy it.","Thật lòng mà nói, tôi không làm việc đó thường xuyên, nhưng khi làm thì tôi rất thích.","Khi câu hỏi không đúng với bạn: vẫn trả lời trọn vẹn"],["So overall, that's the main reason I keep going back there.","Vì vậy nhìn chung, đó là lý do chính khiến tôi tiếp tục quay lại đó.","Câu kết ngắn gọn cho câu 7"]]},{"stage":"Intermediate","en":"Speaking Q8–10: using the information","vi":"Nói câu 8–10: trả lời dựa trên thông tin cho sẵn","items":[["Sure, I'd be happy to help you with that.","Vâng, tôi rất sẵn lòng giúp anh/chị việc đó.","Câu mở đầu lịch sự trước khi trả lời"],["Let me check the agenda for you.","Để tôi kiểm tra chương trình giúp anh/chị.","Câu giờ tự nhiên trong 15 giây trả lời"],["According to the schedule, the workshop starts at 9 a.m. in Room 201.","Theo lịch trình, buổi hội thảo bắt đầu lúc 9 giờ sáng tại phòng 201.","Trả lời câu hỏi về thời gian, địa điểm"],["The conference will be held at the Riverside Hotel on May 12th.","Hội nghị sẽ được tổ chức tại khách sạn Riverside vào ngày 12 tháng 5.","Bị động \"will be held\" cho sự kiện"],["Your flight departs at 7:45 a.m., and you'll arrive in Tokyo at around noon.","Chuyến bay của anh/chị khởi hành lúc 7 giờ 45 sáng, và anh/chị sẽ đến Tokyo vào khoảng trưa.","Trả lời về lịch trình công tác"],["Actually, I'm afraid that's not correct. The session was moved to Thursday.","Thật ra, tôi e là thông tin đó chưa đúng. Buổi họp đã được dời sang thứ Năm.","Sửa thông tin sai một cách lịch sự"],["You don't need to worry about that because lunch is included in the registration fee.","Anh/chị không cần lo về việc đó vì bữa trưa đã bao gồm trong phí đăng ký.","Sửa hiểu lầm + giải thích"],["The registration fee is 50 dollars, but it's only 35 dollars if you register before June 1st.","Phí đăng ký là 50 đô la, nhưng chỉ còn 35 đô la nếu đăng ký trước ngày 1 tháng 6.","Trả lời về giá kèm điều kiện"],["Please note that the interview with Mr. Lee has been canceled.","Xin lưu ý rằng buổi phỏng vấn với ông Lee đã bị hủy.","Thông báo thay đổi hoặc hủy bỏ"],["There are two sessions related to marketing.","Có hai phiên liên quan đến tiếp thị.","Mở đầu câu 10: nêu số lượng mục"],["First, at 10:30, Ms. Kim will give a presentation on social media advertising.","Thứ nhất, lúc 10 giờ 30, bà Kim sẽ thuyết trình về quảng cáo trên mạng xã hội.","Mục 1: thời gian + người trình bày + nội dung"],["Second, after lunch, there will be a panel discussion on customer research, starting at 1:30.","Thứ hai, sau bữa trưa, sẽ có một buổi thảo luận nhóm về nghiên cứu khách hàng, bắt đầu lúc 1 giờ 30.","Mục 2: dùng \"there will be\" + thời gian"],["Is there anything else I can help you with?","Anh/chị còn cần tôi giúp gì nữa không?","Câu kết khi còn thời gian"]]},{"stage":"Intermediate","en":"Writing Q6–7: email openings and purposes","vi":"Viết câu 6–7: mở đầu email và nêu mục đích","items":[["Dear Mr. Thompson,","Kính gửi ông Thompson,","Lời chào trang trọng khi biết tên người nhận"],["Thank you for your e-mail regarding the upcoming product launch.","Cảm ơn anh/chị đã gửi email về buổi ra mắt sản phẩm sắp tới.","Mở đầu khi trả lời một email"],["I'm writing to inquire about the conference rooms available at your hotel.","Tôi viết thư này để hỏi về các phòng hội nghị còn trống ở khách sạn của anh/chị.","Nêu mục đích: hỏi thông tin"],["I'd like to request some additional information about your delivery service.","Tôi muốn đề nghị được cung cấp thêm thông tin về dịch vụ giao hàng của anh/chị.","Nêu mục đích: đưa ra yêu cầu"],["I'm writing in response to your advertisement for an office manager.","Tôi viết thư này để phản hồi thông tin tuyển quản lý văn phòng của quý công ty.","Mở đầu khi phản hồi quảng cáo, thông báo"],["I'm writing to let you know that our team meeting has been rescheduled.","Tôi viết thư này để thông báo rằng cuộc họp nhóm của chúng ta đã được dời lịch.","Nêu mục đích: thông báo"],["I'm glad to hear that you are interested in joining our volunteer program.","Tôi rất vui khi biết anh/chị quan tâm đến việc tham gia chương trình tình nguyện của chúng tôi.","Mở đầu thân thiện khi trả lời"],["I received your message about the problem with your recent order.","Tôi đã nhận được tin nhắn của anh/chị về vấn đề với đơn hàng gần đây.","Mở đầu khi xử lý khiếu nại"],["I'm sorry to hear that you were not satisfied with our service.","Tôi rất tiếc khi biết anh/chị chưa hài lòng với dịch vụ của chúng tôi.","Bày tỏ sự cảm thông"],["As a new employee, I have a few questions about the training schedule.","Là nhân viên mới, tôi có một vài câu hỏi về lịch đào tạo.","Giới thiệu vai trò + mục đích"],["I'm writing on behalf of the marketing department.","Tôi viết thư này thay mặt phòng tiếp thị.","Giới thiệu khi viết thay cho một tập thể"],["In this e-mail, I'd like to ask two questions and make one suggestion.","Trong email này, tôi muốn hỏi hai câu hỏi và đưa ra một đề xuất.","Báo trước nội dung, bám sát yêu cầu đề bài"]]},{"stage":"Intermediate","en":"Writing Q6–7: requests, explanations and closings","vi":"Viết câu 6–7: yêu cầu, giải thích và kết thư","items":[["Could you let me know whether parking is available near the venue?","Anh/chị có thể cho tôi biết có chỗ đỗ xe gần địa điểm tổ chức không?","Câu hỏi gián tiếp lịch sự (whether)"],["In addition, I would like to know if your company offers group discounts.","Ngoài ra, tôi muốn biết công ty anh/chị có giảm giá cho nhóm không.","Nối sang câu hỏi thứ hai"],["I'd appreciate it if you could send me a copy of the price list.","Tôi sẽ rất cảm kích nếu anh/chị có thể gửi cho tôi một bản bảng giá.","Đưa ra yêu cầu trang trọng"],["I was wondering if it would be possible to change the delivery date.","Tôi muốn hỏi liệu có thể thay đổi ngày giao hàng được không.","Yêu cầu rất lịch sự"],["Would it be possible for you to arrive 30 minutes early?","Anh/chị có thể đến sớm 30 phút được không?","Đề nghị người nhận làm một việc"],["Unfortunately, the room you requested is not available on that date.","Rất tiếc, phòng anh/chị yêu cầu không còn trống vào ngày đó.","Báo tin không tốt"],["This is because several of our staff members will be attending a training session.","Điều này là do một số nhân viên của chúng tôi sẽ tham dự một buổi đào tạo.","Giải thích nguyên nhân"],["To make up for this, we would like to offer you a 15 percent discount on your next order.","Để bù đắp cho điều này, chúng tôi xin gửi anh/chị mức giảm giá 15% cho đơn hàng tiếp theo.","Đề xuất giải pháp, bồi thường"],["Instead, I suggest that we hold the meeting in the main conference room.","Thay vào đó, tôi đề xuất chúng ta tổ chức cuộc họp ở phòng hội nghị chính.","Đưa ra gợi ý: suggest that + S + V nguyên mẫu"],["I have attached the updated schedule for your reference.","Tôi đã đính kèm lịch trình cập nhật để anh/chị tham khảo.","Nhắc đến tài liệu đính kèm"],["Please feel free to contact me if you have any further questions.","Vui lòng liên hệ với tôi nếu anh/chị có thêm câu hỏi nào.","Câu kết mời liên hệ"],["Thank you in advance for your help.","Cảm ơn anh/chị trước vì sự giúp đỡ.","Cảm ơn trước khi đã đưa ra yêu cầu"],["I look forward to hearing from you.","Tôi mong sớm nhận được phản hồi của anh/chị.","Câu kết chuẩn trước lời chào cuối"],["Best regards,","Trân trọng,","Lời chào cuối thư, xuống dòng rồi ký tên"]]},{"stage":"Advanced","en":"Part 5: advanced grammar at 750","vi":"Part 5: Ngữ pháp nâng cao mức 750","items":[["Should you have any questions, please contact our customer service team.","Nếu bạn có bất kỳ thắc mắc nào, vui lòng liên hệ bộ phận chăm sóc khách hàng.","Đảo ngữ: Should + S + V = If + S + V: nếu"],["Only after the contract was signed did the work begin.","Chỉ sau khi hợp đồng được ký thì công việc mới bắt đầu.","Only after ... + trợ động từ + S + V: đảo ngữ"],["It is essential that every employee submit the form by Friday.","Điều thiết yếu là mọi nhân viên phải nộp mẫu đơn trước thứ Sáu.","Giả định: It is essential that + S + V nguyên mẫu (không thêm -s)"],["The manager requested that the report be revised before Monday.","Quản lý yêu cầu báo cáo phải được sửa lại trước thứ Hai.","request/recommend that + S + (be) V nguyên mẫu"],["Having reviewed the proposal, the board approved the budget.","Sau khi xem xét đề xuất, hội đồng đã phê duyệt ngân sách.","Having + V3: hành động xảy ra trước, cùng chủ ngữ"],["Once approved, the new policy will take effect immediately.","Một khi được phê duyệt, chính sách mới sẽ có hiệu lực ngay.","Once/When/If + V3: rút gọn mệnh đề bị động"],["We hired a consultant whose experience in logistics proved invaluable.","Chúng tôi thuê một chuyên gia tư vấn có kinh nghiệm về hậu cần vô cùng quý giá.","whose + N: chỉ sở hữu, thay cho his/her/its"],["The two firms signed an agreement whereby they will share research costs.","Hai công ty ký thỏa thuận, theo đó họ sẽ chia sẻ chi phí nghiên cứu.","whereby = by which: theo đó, nhờ đó"],["The earlier you register, the lower the fee will be.","Bạn đăng ký càng sớm thì phí càng thấp.","The + so sánh hơn ..., the + so sánh hơn: càng ... càng"],["Had it not been for your support, the project would have failed.","Nếu không nhờ sự hỗ trợ của bạn, dự án đã thất bại.","Had it not been for + N = If it had not been for: đảo ngữ loại 3"],["No sooner had the meeting started than the power went out.","Cuộc họp vừa bắt đầu thì mất điện.","No sooner had + S + V3 + than: vừa ... thì"],["Please review the documents attached to this e-mail.","Vui lòng xem các tài liệu đính kèm theo e-mail này.","Rút gọn mệnh đề quan hệ: documents (which are) attached"],["Applicants interested in the position should submit a résumé by May 1.","Ứng viên quan tâm đến vị trí này nên nộp sơ yếu lý lịch trước ngày 1 tháng 5.","Rút gọn: applicants (who are) interested"],["Rarely does the company receive so many complaints in one week.","Hiếm khi công ty nhận nhiều khiếu nại như vậy trong một tuần.","Rarely/Seldom/Never đầu câu + trợ động từ + S + V"]]},{"stage":"Advanced","en":"Part 7: question stems and paraphrases","vi":"Part 7: Dạng câu hỏi và cách diễn đạt lại","items":[["What is the purpose of the e-mail?","Mục đích của e-mail là gì?","Đọc đoạn đầu; đáp án thường diễn đạt lại câu \"I am writing to ...\""],["What is suggested about Ms. Tanaka?","Điều gì được ngụ ý về chị Tanaka?","suggested/implied: phải suy luận, đáp án không có nguyên văn trong bài"],["What is NOT mentioned as a benefit of the membership?","Điều gì KHÔNG được nhắc đến như một quyền lợi của thẻ thành viên?","Câu NOT: dò từng phương án, loại những gì có trong bài"],["In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?","Câu sau đây phù hợp nhất ở vị trí nào trong các vị trí [1], [2], [3], [4]?","Chèn câu: dựa vào từ nối và đại từ (this, these, also) trong câu cho sẵn"],["The word \"address\" in paragraph 2, line 3, is closest in meaning to","Từ \"address\" ở đoạn 2, dòng 3 gần nghĩa nhất với","Từ đồng nghĩa: đọc ngữ cảnh, đừng chọn nghĩa phổ biến nhất"],["According to the article, what will happen next month?","Theo bài báo, điều gì sẽ xảy ra vào tháng tới?","According to: tìm chi tiết; quét từ khóa thời gian trong bài"],["For whom is the notice most likely intended?","Thông báo này có lẽ dành cho ai?","most likely: suy luận đối tượng từ ngữ cảnh và từ vựng chuyên ngành"],["What is indicated about the conference?","Điều gì được nêu về hội nghị?","indicated/stated: thông tin có trong bài nhưng được diễn đạt lại"],["What does Mr. Ross ask Ms. Kim to do?","Anh Ross yêu cầu chị Kim làm gì?","Tìm câu yêu cầu: Please..., Could you..., I'd appreciate it if..."],["At 10:15 A.M., what does Mr. Diaz most likely mean when he writes, \"I'm on it\"?","Lúc 10:15 sáng, khi anh Diaz viết \"I'm on it\", có lẽ ý anh ấy là gì?","Hiểu ý câu chat: đọc tin nhắn ngay trước và sau"],["What is a requirement for the position?","Yêu cầu bắt buộc của vị trí này là gì?","Tìm required/must/necessary; đáp án thường dùng từ đồng nghĩa"],["Why was the event rescheduled?","Tại sao sự kiện bị dời lịch?","Tìm lý do: due to, because of, as a result of"],["What will Ms. Lopez probably do next?","Chị Lopez có lẽ sẽ làm gì tiếp theo?","Hỏi hành động tiếp theo: tìm thông tin ở cuối bài"],["What is enclosed with the letter?","Cái gì được gửi kèm theo thư?","Tìm enclosed/attached/included; thường ở cuối thư"]]},{"stage":"Advanced","en":"Speaking Q11: giving an opinion","vi":"Nói câu 11: trình bày quan điểm","items":[["Personally, I believe that working from home is more productive than working in an office.","Cá nhân tôi tin rằng làm việc tại nhà hiệu quả hơn làm việc ở văn phòng.","Nêu quan điểm ngay câu đầu"],["I strongly agree with the idea that companies should offer flexible working hours.","Tôi hoàn toàn đồng ý với ý kiến rằng các công ty nên cho phép giờ làm việc linh hoạt.","Nêu lập trường đồng ý"],["If I had to choose, I would rather work for a large company than a small one.","Nếu phải chọn, tôi thích làm việc cho một công ty lớn hơn là một công ty nhỏ.","Nêu lập trường cho câu hỏi lựa chọn"],["I have two reasons for this.","Tôi có hai lý do cho điều này.","Báo trước dàn ý câu trả lời"],["The main reason is that employees can save a lot of time by not commuting.","Lý do chính là nhân viên có thể tiết kiệm nhiều thời gian vì không phải đi lại.","Lý do 1"],["On top of that, a quiet environment helps people concentrate better.","Hơn nữa, một môi trường yên tĩnh giúp mọi người tập trung tốt hơn.","Lý do 2"],["For example, when I worked at a marketing agency, I finished my reports much faster at home.","Ví dụ, khi tôi làm việc ở một công ty quảng cáo, tôi hoàn thành báo cáo ở nhà nhanh hơn nhiều.","Ví dụ từ trải nghiệm cá nhân"],["As a result, I had more time to focus on creative tasks.","Nhờ vậy, tôi có nhiều thời gian hơn để tập trung vào các công việc sáng tạo.","Nêu kết quả của ví dụ"],["Of course, some people might argue that face-to-face communication is important.","Tất nhiên, một số người có thể cho rằng giao tiếp trực tiếp là quan trọng.","Nhượng bộ ngắn (nếu còn thời gian)"],["However, with tools like video calls, teams can still communicate effectively.","Tuy nhiên, với các công cụ như gọi video, các nhóm vẫn có thể giao tiếp hiệu quả.","Phản bác ý kiến trái chiều"],["That's why I think working from home is the better option for most office workers.","Đó là lý do tôi nghĩ làm việc tại nhà là lựa chọn tốt hơn cho hầu hết nhân viên văn phòng.","Câu kết: nhắc lại quan điểm"],["For these reasons, I believe that the advantages clearly outweigh the disadvantages.","Vì những lý do này, tôi tin rằng ưu điểm rõ ràng nhiều hơn nhược điểm.","Câu kết thay thế"]]},{"stage":"Advanced","en":"Writing Q8: opinion essay structure","vi":"Viết câu 8: cấu trúc bài luận nêu quan điểm","items":[["These days, many companies allow their employees to work from home.","Ngày nay, nhiều công ty cho phép nhân viên làm việc tại nhà.","Mở bài: câu dẫn về bối cảnh"],["Some people believe that teamwork is more important than individual skills, while others disagree.","Một số người tin rằng làm việc nhóm quan trọng hơn kỹ năng cá nhân, trong khi những người khác không đồng ý.","Mở bài: diễn đạt lại đề bài (paraphrase)"],["In my opinion, teamwork plays a more important role in the workplace for two main reasons.","Theo tôi, làm việc nhóm đóng vai trò quan trọng hơn ở nơi làm việc vì hai lý do chính.","Mở bài: câu luận điểm (thesis)"],["First of all, working in a team allows employees to share ideas and learn from one another.","Trước hết, làm việc nhóm cho phép nhân viên chia sẻ ý tưởng và học hỏi lẫn nhau.","Thân bài 1: câu chủ đề"],["For instance, at my previous company, our sales team held weekly brainstorming sessions.","Ví dụ, ở công ty cũ của tôi, nhóm bán hàng tổ chức các buổi họp động não hằng tuần.","Thân bài: ví dụ cụ thể"],["Thanks to these meetings, we came up with several new strategies that increased sales by 20 percent.","Nhờ những buổi họp này, chúng tôi đã nghĩ ra một số chiến lược mới giúp tăng doanh số 20%.","Thân bài: kết quả của ví dụ"],["Secondly, most projects today are too complex for one person to complete alone.","Thứ hai, hầu hết các dự án ngày nay quá phức tạp để một người có thể hoàn thành một mình.","Thân bài 2: câu chủ đề (too... for... to...)"],["This means that even the most talented employee needs support from colleagues.","Điều này có nghĩa là ngay cả nhân viên tài năng nhất cũng cần sự hỗ trợ của đồng nghiệp.","Thân bài: câu giải thích, phát triển ý"],["Admittedly, individual skills are necessary; however, they are most valuable when combined with those of others.","Phải thừa nhận rằng kỹ năng cá nhân là cần thiết; tuy nhiên, chúng có giá trị nhất khi được kết hợp với kỹ năng của người khác.","Nhượng bộ rồi phản bác"],["It is true that working alone can be faster in some cases, but the results are often less creative.","Đúng là làm việc một mình đôi khi nhanh hơn, nhưng kết quả thường kém sáng tạo hơn.","Nhượng bộ thay thế: It is true that..., but..."],["In conclusion, I firmly believe that teamwork is more important than individual skills.","Tóm lại, tôi tin chắc rằng làm việc nhóm quan trọng hơn kỹ năng cá nhân.","Kết bài: nhắc lại quan điểm"],["Companies that encourage collaboration are more likely to succeed in the long run.","Những công ty khuyến khích sự hợp tác có nhiều khả năng thành công hơn về lâu dài.","Kết bài: câu khép lại, mở rộng ý"]]},{"stage":"Advanced","en":"Level-7 upgrades: linking and complex sentences","vi":"Nâng cấp cấp độ 7: liên kết và câu phức","items":[["The manager who organized the training session received positive feedback from everyone.","Người quản lý tổ chức buổi đào tạo đã nhận được phản hồi tích cực từ mọi người.","Mệnh đề quan hệ xác định (who)"],["Our new office, which is located downtown, is easy to reach by subway.","Văn phòng mới của chúng tôi, nằm ở trung tâm thành phố, rất dễ đến bằng tàu điện ngầm.","Mệnh đề quan hệ không xác định (, which ,)"],["Not only does working from home save time, but it also reduces stress.","Làm việc tại nhà không chỉ tiết kiệm thời gian mà còn giảm căng thẳng.","Not only + đảo ngữ..., but... also..."],["What I like most about my job is the chance to meet people from different countries.","Điều tôi thích nhất ở công việc của mình là cơ hội gặp gỡ mọi người từ nhiều quốc gia.","Câu chẻ: What I like most about... is..."],["If I were the manager, I would introduce a more flexible schedule.","Nếu tôi là quản lý, tôi sẽ áp dụng lịch làm việc linh hoạt hơn.","Câu điều kiện loại 2 (If I were..., I would...)"],["The more experience employees gain, the more confident they become.","Nhân viên càng có nhiều kinh nghiệm thì họ càng tự tin hơn.","So sánh kép: The more..., the more..."],["The final report must be submitted by Friday afternoon.","Báo cáo cuối cùng phải được nộp trước chiều thứ Sáu.","Câu bị động với động từ khuyết thiếu"],["Having finished the presentation, she answered questions from the audience.","Sau khi hoàn thành bài thuyết trình, cô ấy trả lời câu hỏi của khán giả.","Cụm phân từ hoàn thành (Having + V3)"],["Located near the airport, the hotel is popular with business travelers.","Nằm gần sân bay, khách sạn này được khách đi công tác ưa chuộng.","Cụm phân từ quá khứ đứng đầu câu"],["It is worth noting that most customers now prefer to shop online.","Điều đáng lưu ý là hiện nay hầu hết khách hàng thích mua sắm trực tuyến hơn.","It is worth noting that... (nhấn mạnh ý quan trọng)"],["Even though the deadline was tight, the team managed to finish the project on time.","Mặc dù thời hạn gấp, nhóm vẫn hoàn thành dự án đúng hạn.","Even though + manage to V"],["Unless we reduce our costs, we will not be able to stay competitive.","Nếu không cắt giảm chi phí, chúng ta sẽ không thể duy trì khả năng cạnh tranh.","Unless = if... not"],["Rather than hiring new staff, the company decided to train its current employees.","Thay vì tuyển nhân viên mới, công ty quyết định đào tạo nhân viên hiện có.","Rather than + V-ing"],["As long as employees meet their goals, they should be allowed to choose their own hours.","Miễn là nhân viên đạt mục tiêu, họ nên được phép tự chọn giờ làm việc.","As long as + bị động \"should be allowed to\""]]}]},"ipa":{"groups":[{"id":"vowel","en":"Monophthongs","vi":"Nguyên âm đơn"},{"id":"diphthong","en":"Diphthongs","vi":"Nguyên âm đôi"},{"id":"consonant","en":"Consonants","vi":"Phụ âm"}],"path":[{"vi":"Nguyên âm dài – ngắn","sounds":["iː","ɪ","uː","ʊ","ɑː","ʌ","ɔː","ɒ","ɜː","ə"]},{"vi":"Cặp e – æ","sounds":["e","æ"]},{"vi":"Nguyên âm đôi","sounds":["eɪ","aɪ","ɔɪ","aʊ","əʊ","ɪə","eə","ʊə"]},{"vi":"Phụ âm vô thanh – hữu thanh","sounds":["p","b","t","d","k","ɡ","f","v","s","z","ʃ","ʒ","tʃ","dʒ"]},{"vi":"Âm “th” khó","sounds":["θ","ð"]},{"vi":"Âm mũi & âm lướt","sounds":["m","n","ŋ","l","r","w","j","h"]}],"sounds":[{"s":"iː","type":"vowel","vi":"i dài","tip":"Kéo dài âm “i”, môi dàn sang hai bên như đang cười.","ex":[["see","siː"],["green","ɡriːn"],["teacher","ˈtiːtʃə"],["meet","miːt"]],"pairs":[["sheep","ship","ɪ"],["leave","live","ɪ"],["seat","sit","ɪ"],["feel","fill","ɪ"],["eat","it","ɪ"]]},{"s":"ɪ","type":"vowel","vi":"i ngắn","tip":"Âm “i” ngắn và gọn, lưỡi thả lỏng hơn /iː/. Không kéo dài.","ex":[["sit","sɪt"],["ship","ʃɪp"],["big","bɪɡ"],["English","ˈɪŋɡlɪʃ"]],"pairs":[["ship","sheep","iː"],["live","leave","iː"],["sit","seat","iː"],["fill","feel","iː"]]},{"s":"ʊ","type":"vowel","vi":"u ngắn","tip":"Âm “u” ngắn, môi tròn nhẹ, không kéo dài.","ex":[["book","bʊk"],["good","ɡʊd"],["put","pʊt"],["foot","fʊt"]],"pairs":[["full","fool","uː"],["pull","pool","uː"],["look","Luke","uː"]]},{"s":"uː","type":"vowel","vi":"u dài","tip":"Kéo dài âm “u”, môi tròn và chu ra phía trước.","ex":[["food","fuːd"],["blue","bluː"],["school","skuːl"],["two","tuː"]],"pairs":[["fool","full","ʊ"],["pool","pull","ʊ"],["Luke","look","ʊ"]]},{"s":"e","type":"vowel","vi":"e","tip":"Giống “e” tiếng Việt, miệng mở vừa phải.","ex":[["bed","bed"],["red","red"],["pen","pen"],["friend","frend"]],"pairs":[["bed","bad","æ"],["pen","pan","æ"],["men","man","æ"],["said","sad","æ"]]},{"s":"ə","type":"vowel","vi":"ơ nhẹ","tip":"Âm “ơ” rất nhẹ, không bao giờ được nhấn. Đây là âm xuất hiện nhiều nhất trong tiếng Anh.","ex":[["about","əˈbaʊt"],["banana","bəˈnɑːnə"],["today","təˈdeɪ"],["teacher","ˈtiːtʃə"]],"pairs":[]},{"s":"ɜː","type":"vowel","vi":"ơ dài","tip":"Kéo dài âm “ơ”, lưỡi đặt ở giữa miệng, môi không tròn.","ex":[["bird","bɜːd"],["work","wɜːk"],["learn","lɜːn"],["nurse","nɜːs"]],"pairs":[["bird","board","ɔː"],["work","walk","ɔː"],["firm","form","ɔː"],["shirt","short","ɔː"]]},{"s":"ɔː","type":"vowel","vi":"o dài","tip":"Kéo dài âm “o”, môi tròn.","ex":[["door","dɔː"],["ball","bɔːl"],["walk","wɔːk"],["four","fɔː"]],"pairs":[["port","pot","ɒ"],["caught","cot","ɒ"],["short","shot","ɒ"],["walk","work","ɜː"]]},{"s":"æ","type":"vowel","vi":"e bẹt","tip":"Nằm giữa “a” và “e”: mở miệng rộng, hạ hàm dưới, kéo môi sang hai bên.","ex":[["cat","kæt"],["apple","ˈæpl"],["black","blæk"],["man","mæn"]],"pairs":[["bad","bed","e"],["man","men","e"],["cat","cut","ʌ"],["cap","cup","ʌ"]]},{"s":"ʌ","type":"vowel","vi":"ă","tip":"Giống “ă” tiếng Việt: ngắn, dứt khoát, miệng mở vừa.","ex":[["cup","kʌp"],["sun","sʌn"],["love","lʌv"],["mother","ˈmʌðə"]],"pairs":[["cut","cat","æ"],["cup","cap","æ"],["hut","hat","æ"],["much","March","ɑː"]]},{"s":"ɑː","type":"vowel","vi":"a dài","tip":"Kéo dài âm “a”, miệng mở rộng, lưỡi hạ thấp.","ex":[["car","kɑː"],["father","ˈfɑːðə"],["start","stɑːt"],["heart","hɑːt"]],"pairs":[["heart","hut","ʌ"],["cart","cut","ʌ"],["calm","come","ʌ"],["March","much","ʌ"]]},{"s":"ɒ","type":"vowel","vi":"o ngắn","tip":"Âm “o” ngắn, miệng mở tròn (giọng Anh). Giọng Mỹ thường đọc gần /ɑː/.","ex":[["hot","hɒt"],["dog","dɒɡ"],["box","bɒks"],["watch","wɒtʃ"]],"pairs":[["pot","port","ɔː"],["cot","caught","ɔː"],["shot","short","ɔː"],["spot","sport","ɔː"]]},{"s":"ɪə","type":"diphthong","vi":"ia","tip":"Trượt từ /ɪ/ sang /ə/, giống “ia” trong “bia”.","ex":[["ear","ɪə"],["here","hɪə"],["near","nɪə"],["idea","aɪˈdɪə"]],"pairs":[["ear","air","eə"],["here","hair","eə"],["beer","bear","eə"],["fear","fair","eə"]]},{"s":"eə","type":"diphthong","vi":"e-ơ","tip":"Trượt từ /e/ sang /ə/, giống “e-ơ” đọc liền.","ex":[["hair","heə"],["where","weə"],["care","keə"],["chair","tʃeə"]],"pairs":[["air","ear","ɪə"],["hair","here","ɪə"],["bear","beer","ɪə"],["fair","fear","ɪə"]]},{"s":"ʊə","type":"diphthong","vi":"u-ơ","tip":"Trượt từ /ʊ/ sang /ə/, giống “u-ơ”. Nhiều người bản xứ đọc gần /ɔː/.","ex":[["tour","tʊə"],["pure","pjʊə"],["cure","kjʊə"],["sure","ʃʊə"]],"pairs":[]},{"s":"eɪ","type":"diphthong","vi":"ây","tip":"Trượt từ /e/ sang /ɪ/, giống “ây” trong “đây”.","ex":[["day","deɪ"],["name","neɪm"],["rain","reɪn"],["great","ɡreɪt"]],"pairs":[["late","let","e"],["wait","wet","e"],["sale","sell","e"],["lake","like","aɪ"]]},{"s":"aɪ","type":"diphthong","vi":"ai","tip":"Giống “ai” tiếng Việt, mở miệng rộng rồi khép dần.","ex":[["my","maɪ"],["time","taɪm"],["bike","baɪk"],["light","laɪt"]],"pairs":[["like","lake","eɪ"],["time","tame","eɪ"],["white","wait","eɪ"],["buy","boy","ɔɪ"]]},{"s":"ɔɪ","type":"diphthong","vi":"oi","tip":"Giống “oi” tiếng Việt, môi tròn rồi dàn ra.","ex":[["boy","bɔɪ"],["toy","tɔɪ"],["coin","kɔɪn"],["noise","nɔɪz"]],"pairs":[["boy","buy","aɪ"],["toy","tie","aɪ"],["foil","file","aɪ"],["boil","bile","aɪ"]]},{"s":"əʊ","type":"diphthong","vi":"âu","tip":"Trượt từ /ə/ sang /ʊ/, giống “âu” (giọng Anh); giọng Mỹ đọc /oʊ/ như “ôu”.","ex":[["go","ɡəʊ"],["home","həʊm"],["phone","fəʊn"],["know","nəʊ"]],"pairs":[["coat","caught","ɔː"],["boat","bought","ɔː"],["low","law","ɔː"],["tone","town","aʊ"]]},{"s":"aʊ","type":"diphthong","vi":"ao","tip":"Giống “ao” tiếng Việt, mở rộng rồi tròn môi.","ex":[["now","naʊ"],["house","haʊs"],["cow","kaʊ"],["mouth","maʊθ"]],"pairs":[["town","tone","əʊ"],["now","know","əʊ"],["loud","load","əʊ"],["found","phoned","əʊ"]]},{"s":"p","type":"consonant","vi":"p bật hơi","tip":"Mím môi rồi bật hơi mạnh. Đặt tờ giấy trước miệng sẽ thấy giấy rung. Âm vô thanh.","ex":[["pen","pen"],["apple","ˈæpl"],["cup","kʌp"],["happy","ˈhæpi"]],"pairs":[["pig","big","b"],["pat","bat","b"],["pear","bear","b"],["cap","cab","b"]]},{"s":"b","type":"consonant","vi":"b","tip":"Mím môi rồi mở, rung dây thanh (đặt tay lên cổ sẽ thấy rung). Âm hữu thanh.","ex":[["bag","bæɡ"],["baby","ˈbeɪbi"],["job","dʒɒb"],["number","ˈnʌmbə"]],"pairs":[["big","pig","p"],["bat","pat","p"],["bear","pear","p"],["cab","cap","p"]]},{"s":"t","type":"consonant","vi":"t bật hơi","tip":"Đầu lưỡi chạm lợi trên rồi bật hơi mạnh – mạnh hơn “t” tiếng Việt. Đừng bỏ /t/ ở cuối từ.","ex":[["tea","tiː"],["time","taɪm"],["water","ˈwɔːtə"],["cat","kæt"]],"pairs":[["ten","den","d"],["try","dry","d"],["time","dime","d"],["bet","bed","d"]]},{"s":"d","type":"consonant","vi":"đ","tip":"Như /t/ nhưng rung dây thanh. Đầu lưỡi chạm lợi trên, không chạm răng.","ex":[["dog","dɒɡ"],["day","deɪ"],["window","ˈwɪndəʊ"],["bed","bed"]],"pairs":[["den","ten","t"],["dry","try","t"],["dime","time","t"],["bed","bet","t"]]},{"s":"k","type":"consonant","vi":"k bật hơi","tip":"Cuống lưỡi chạm vòm mềm rồi bật hơi. Đừng nuốt /k/ ở cuối từ.","ex":[["cat","kæt"],["key","kiː"],["school","skuːl"],["book","bʊk"]],"pairs":[["coat","goat","ɡ"],["cold","gold","ɡ"],["back","bag","ɡ"],["card","guard","ɡ"]]},{"s":"ɡ","type":"consonant","vi":"g","tip":"Như /k/ nhưng rung dây thanh.","ex":[["go","ɡəʊ"],["green","ɡriːn"],["bag","bæɡ"],["egg","eɡ"]],"pairs":[["goat","coat","k"],["gold","cold","k"],["bag","back","k"],["guard","card","k"]]},{"s":"f","type":"consonant","vi":"ph","tip":"Răng trên chạm nhẹ môi dưới rồi thổi hơi. Âm vô thanh.","ex":[["fish","fɪʃ"],["coffee","ˈkɒfi"],["phone","fəʊn"],["laugh","lɑːf"]],"pairs":[["fan","van","v"],["fine","vine","v"],["few","view","v"],["safe","save","v"]]},{"s":"v","type":"consonant","vi":"v","tip":"Như /f/ nhưng rung dây thanh. Răng trên phải chạm môi dưới – đừng đọc thành “b”.","ex":[["van","væn"],["very","ˈveri"],["love","lʌv"],["five","faɪv"]],"pairs":[["van","fan","f"],["view","few","f"],["save","safe","f"],["vest","best","b"]]},{"s":"θ","type":"consonant","vi":"th không rung","tip":"Đặt đầu lưỡi giữa hai hàm răng rồi thổi hơi nhẹ, không rung dây thanh. Đừng đọc thành “t” hay “s”.","ex":[["think","θɪŋk"],["three","θriː"],["mouth","maʊθ"],["birthday","ˈbɜːθdeɪ"]],"pairs":[["think","sink","s"],["three","tree","t"],["mouth","mouse","s"],["thank","tank","t"],["thin","tin","t"],["path","pass","s"]]},{"s":"ð","type":"consonant","vi":"th có rung","tip":"Đầu lưỡi giữa hai hàm răng, rung dây thanh. Đừng đọc thành “d” hay “z”.","ex":[["this","ðɪs"],["mother","ˈmʌðə"],["they","ðeɪ"],["with","wɪð"]],"pairs":[["they","day","d"],["then","den","d"],["those","doze","d"],["breathe","breeze","z"]]},{"s":"s","type":"consonant","vi":"x","tip":"Giống “x” tiếng Việt: hơi thoát qua kẽ răng. Nhớ đọc /s/ ở cuối từ số nhiều.","ex":[["see","siː"],["bus","bʌs"],["city","ˈsɪti"],["glass","ɡlɑːs"]],"pairs":[["sink","think","θ"],["sip","zip","z"],["see","she","ʃ"],["bus","buzz","z"]]},{"s":"z","type":"consonant","vi":"z rung","tip":"Như /s/ nhưng rung dây thanh – giống tiếng ong “zzz”.","ex":[["zoo","zuː"],["zero","ˈzɪərəʊ"],["nose","nəʊz"],["easy","ˈiːzi"]],"pairs":[["zoo","Sue","s"],["zip","sip","s"],["buzz","bus","s"],["rise","rice","s"]]},{"s":"ʃ","type":"consonant","vi":"s nặng","tip":"Môi chu ra, lưỡi lùi về sau, thổi hơi như khi nói “suỵt”.","ex":[["she","ʃiː"],["shop","ʃɒp"],["fish","fɪʃ"],["nation","ˈneɪʃn"]],"pairs":[["she","see","s"],["ship","sip","s"],["shoe","chew","tʃ"],["sheep","cheap","tʃ"]]},{"s":"ʒ","type":"consonant","vi":"giơ","tip":"Như /ʃ/ nhưng rung dây thanh. Thường gặp ở giữa từ: vision, measure.","ex":[["vision","ˈvɪʒn"],["measure","ˈmeʒə"],["usually","ˈjuːʒuəli"],["television","ˈtelɪvɪʒn"]],"pairs":[]},{"s":"h","type":"consonant","vi":"h","tip":"Thở hơi nhẹ từ cổ họng như khi hà hơi lên kính.","ex":[["hat","hæt"],["hello","həˈləʊ"],["house","haʊs"],["behind","bɪˈhaɪnd"]],"pairs":[["hat","at",""],["heat","eat",""],["hair","air",""],["hold","old",""]]},{"s":"tʃ","type":"consonant","vi":"ch","tip":"Bắt đầu như /t/ rồi bật sang /ʃ/, môi chu ra.","ex":[["chair","tʃeə"],["cheese","tʃiːz"],["watch","wɒtʃ"],["teacher","ˈtiːtʃə"]],"pairs":[["chair","share","ʃ"],["cheap","sheep","ʃ"],["chew","shoe","ʃ"],["watch","wash","ʃ"]]},{"s":"dʒ","type":"consonant","vi":"dʒ","tip":"Như /tʃ/ nhưng rung dây thanh.","ex":[["job","dʒɒb"],["juice","dʒuːs"],["orange","ˈɒrɪndʒ"],["page","peɪdʒ"]],"pairs":[["jeep","cheap","tʃ"],["joke","choke","tʃ"],["gin","chin","tʃ"],["ridge","rich","tʃ"]]},{"s":"m","type":"consonant","vi":"m","tip":"Mím môi, để hơi đi qua mũi.","ex":[["man","mæn"],["mother","ˈmʌðə"],["summer","ˈsʌmə"],["time","taɪm"]],"pairs":[["mail","nail","n"],["map","nap","n"],["some","sun","n"]]},{"s":"n","type":"consonant","vi":"n","tip":"Đầu lưỡi chạm lợi trên, hơi đi qua mũi.","ex":[["no","nəʊ"],["name","neɪm"],["dinner","ˈdɪnə"],["sun","sʌn"]],"pairs":[["nap","map","m"],["thin","thing","ŋ"],["win","wing","ŋ"],["ran","rang","ŋ"]]},{"s":"ŋ","type":"consonant","vi":"ng","tip":"Giống “ng” cuối tiếng Việt. Không bật thêm âm “g” ở cuối từ.","ex":[["sing","sɪŋ"],["long","lɒŋ"],["English","ˈɪŋɡlɪʃ"],["thank","θæŋk"]],"pairs":[["sing","sin","n"],["thing","thin","n"],["wing","win","n"],["rang","ran","n"]]},{"s":"l","type":"consonant","vi":"l","tip":"Đầu lưỡi chạm lợi trên. /l/ ở cuối từ (ball, milk) cần nói rõ, đừng bỏ.","ex":[["leg","leɡ"],["hello","həˈləʊ"],["ball","bɔːl"],["milk","mɪlk"]],"pairs":[["light","right","r"],["long","wrong","r"],["lead","read","r"],["fly","fry","r"]]},{"s":"r","type":"consonant","vi":"r","tip":"Cong lưỡi về sau, không chạm vòm miệng, môi hơi tròn. Không rung lưỡi như “r” tiếng Việt.","ex":[["red","red"],["right","raɪt"],["sorry","ˈsɒri"],["very","ˈveri"]],"pairs":[["right","light","l"],["wrong","long","l"],["read","lead","l"],["fry","fly","l"]]},{"s":"w","type":"consonant","vi":"qu/oa","tip":"Môi tròn chu ra rồi mở nhanh, giống đầu vần “oa”. Răng không chạm môi (khác /v/).","ex":[["we","wiː"],["water","ˈwɔːtə"],["window","ˈwɪndəʊ"],["sweet","swiːt"]],"pairs":[["west","vest","v"],["wine","vine","v"],["wet","vet","v"]]},{"s":"j","type":"consonant","vi":"d (i)","tip":"Giống “d” giọng miền Nam hay “i” đầu vần: yes đọc gần “dét”.","ex":[["yes","jes"],["you","juː"],["yellow","ˈjeləʊ"],["music","ˈmjuːzɪk"]],"pairs":[["yes","Jess","dʒ"],["year","ear",""],["yet","jet","dʒ"],["yolk","joke","dʒ"]]}]},"stem":[{"id":"m7-01","subj":"math","grade":7,"chap":"Số hữu tỉ","title":"Số hữu tỉ, trục số và so sánh","sum":"Số hữu tỉ là số viết được dưới dạng phân số a/b. Mỗi số hữu tỉ là một điểm trên trục số; điểm càng bên trái thì số càng nhỏ.","points":["Số hữu tỉ là số viết được dưới dạng a/b với a, b ∈ ℤ, b ≠ 0; tập hợp số hữu tỉ kí hiệu là ℚ.","Các phân số bằng nhau cùng biểu diễn một số hữu tỉ: −0,5 = −1/2 = −2/4.","Mỗi số hữu tỉ được biểu diễn bởi đúng một điểm trên trục số.","Hai số đối nhau (a và −a) nằm cách đều gốc O, ở hai phía của O.","So sánh: đưa về cùng mẫu dương (hoặc cùng dạng số thập phân) rồi so sánh.","Số hữu tỉ âm < 0 < số hữu tỉ dương; số 0 không dương cũng không âm."],"formulas":["x = a/b (a, b ∈ ℤ, b ≠ 0)","a < b ⇔ điểm a nằm bên trái điểm b","−(−x) = x"],"viz":{"type":"numberline"},"vizNote":"Kéo thanh trượt để di chuyển điểm x: xem x dưới dạng phân số và số thập phân, cùng số đối −x đối xứng với x qua gốc O.","memo":"“Trái nhỏ, phải lớn.” Với số âm: càng xa 0 về bên trái thì càng nhỏ, nên −3/4 < −1/2.","example":{"q":"So sánh hai số hữu tỉ −3/4 và −5/7.","a":"Quy đồng mẫu dương 28: −3/4 = −21/28; −5/7 = −20/28.\nVì −21 < −20 nên −21/28 < −20/28.\nVậy −3/4 < −5/7 (kiểm tra: −0,75 < −0,714…)."},"terms":[["rational number","số hữu tỉ"],["number line","trục số"],["opposite (additive inverse)","số đối"],["origin","gốc O"]],"quiz":[{"q":"Phân số nào biểu diễn cùng số hữu tỉ với −0,6?","opts":["6/10","−3/5","−5/3","−6/100"],"a":1,"why":"−0,6 = −6/10 = −3/5 (rút gọn cho 2)."},{"q":"Trên trục số, điểm biểu diễn số −2/3 nằm ở đâu?","opts":["Giữa 0 và 1","Giữa −2 và −1","Giữa −1 và 0","Bên phải điểm 1"],"a":2,"why":"−2/3 ≈ −0,67: là số âm nhưng lớn hơn −1, nên nằm giữa −1 và 0."},{"q":"Sắp xếp theo thứ tự tăng dần các số: 0,5; −1/2; −0,7; 1/3.","opts":["−1/2 < −0,7 < 1/3 < 0,5","−0,7 < −1/2 < 0,5 < 1/3","1/3 < 0,5 < −1/2 < −0,7","−0,7 < −1/2 < 1/3 < 0,5"],"a":3,"why":"Đổi ra thập phân: −0,7 < −0,5 < 0,333… < 0,5."},{"q":"Số đối của −(−5/8) là số nào?","opts":["−5/8","5/8","8/5","0"],"a":0,"why":"−(−5/8) = 5/8, nên số đối của nó là −5/8."}]},{"id":"m7-02","subj":"math","grade":7,"chap":"Số hữu tỉ","title":"Các phép tính và lũy thừa của số hữu tỉ","sum":"Cộng, trừ, nhân, chia số hữu tỉ như với phân số; lũy thừa là phép nhân lặp lại. Nắm thứ tự thực hiện phép tính và quy tắc chuyển vế.","points":["Cộng, trừ: viết các số về phân số cùng mẫu dương rồi cộng, trừ tử số.","Chia cho một số khác 0 là nhân với số nghịch đảo của nó.","xⁿ = x·x·…·x (n thừa số x); quy ước x⁰ = 1 (x ≠ 0).","Lũy thừa bậc chẵn của số âm là số dương; bậc lẻ là số âm: (−2)³ = −8.","Thứ tự: ngoặc → lũy thừa → nhân, chia → cộng, trừ.","Chuyển vế một số hạng thì phải đổi dấu số hạng đó: x + a = b ⇒ x = b − a."],"formulas":["a/b · c/d = (a·c)/(b·d) ; a/b : c/d = a/b · d/c (c/d ≠ 0)","xᵐ · xⁿ = xᵐ⁺ⁿ","xᵐ : xⁿ = xᵐ⁻ⁿ (x ≠ 0, m ≥ n)","(xᵐ)ⁿ = xᵐ·ⁿ"],"viz":{"type":"numberline"},"vizNote":"Kéo điểm x trên trục số: cộng một số dương là dịch sang phải, cộng một số âm là dịch sang trái.","memo":"“Chia là nhân đảo ngược.” Nhân cùng cơ số thì CỘNG mũ, chia thì TRỪ mũ, lũy thừa của lũy thừa thì NHÂN mũ. Chuyển vế: qua cầu phải đổi dấu.","example":{"q":"Tính (−2/3)² + 5/6 : (−5/4).","a":"Lũy thừa trước: (−2/3)² = 4/9.\nChia → nhân nghịch đảo: 5/6 : (−5/4) = 5/6 · (−
