n.",""],["How are you doing?","Bạn dạo này thế nào?","Thân mật hơn \"How are you?\""],["I'm doing well, thanks. And you?","Mình ổn, cảm ơn. Còn bạn?",""],["Not bad, thanks for asking.","Cũng không tệ, cảm ơn đã hỏi.",""],["Where are you from?","Bạn đến từ đâu?",""],["I'm from Vietnam. I live in Hanoi.","Mình đến từ Việt Nam. Mình sống ở Hà Nội.",""],["What do you do?","Bạn làm nghề gì?","Hỏi về công việc một cách tự nhiên"],["I'm a student. / I work as an engineer.","Mình là sinh viên. / Mình làm kỹ sư.",""],["What brings you to Vietnam?","Điều gì đưa bạn đến Việt Nam?",""],["How long have you been here?","Bạn ở đây được bao lâu rồi?",""],["It was great talking to you.","Nói chuyện với bạn rất vui.",""],["See you later!","Hẹn gặp lại nhé!",""],["Take care!","Bảo trọng nhé!",""],["Have a nice day!","Chúc một ngày tốt lành!",""]]},{"stage":"Basic","en":"Polite expressions","vi":"Cảm ơn, xin lỗi & lịch sự","items":[["Thank you so much.","Cảm ơn bạn rất nhiều.",""],["You're welcome.","Không có gì.",""],["No problem at all.","Không sao cả.",""],["I really appreciate it.","Mình thực sự cảm kích.",""],["Sorry, I didn't catch that.","Xin lỗi, mình nghe chưa rõ.","Lịch sự hơn \"What?\""],["Could you say that again, please?","Bạn nói lại được không?",""],["Could you speak a little more slowly?","Bạn nói chậm hơn một chút được không?",""],["Excuse me, may I ask you something?","Xin lỗi, cho mình hỏi chút được không?",""],["Sorry I'm late.","Xin lỗi mình đến muộn.",""],["That's very kind of you.","Bạn thật tốt bụng.",""],["Don't worry about it.","Đừng lo về chuyện đó.",""],["After you.","Mời bạn đi trước.","Nhường đường/nhường lượt"]]},{"stage":"Basic","en":"Small talk","vi":"Nói chuyện phiếm","items":[["Lovely weather today, isn't it?","Hôm nay trời đẹp nhỉ?",""],["It's really hot today.","Hôm nay nóng thật.",""],["What do you do in your free time?","Lúc rảnh bạn làm gì?",""],["I like reading and playing badminton.","Mình thích đọc sách và chơi cầu lông.",""],["Have you tried Vietnamese food yet?","Bạn đã thử đồ ăn Việt chưa?",""],["What kind of music do you like?","Bạn thích thể loại nhạc nào?",""],["Did you have a good weekend?","Cuối tuần của bạn vui chứ?",""],["Yes, I went to the beach with my family.","Có, mình đi biển với gia đình.",""],["That sounds fun!","Nghe vui đấy!",""],["Me too! / Me neither.","Mình cũng vậy! / Mình cũng không.",""],["What a coincidence!","Trùng hợp thật!",""],["I know what you mean.","Mình hiểu ý bạn.",""]]},{"stage":"Basic","en":"Asking for help & directions","vi":"Hỏi đường & nhờ giúp đỡ","items":[["Excuse me, how do I get to the station?","Xin lỗi, đường đến nhà ga đi thế nào ạ?",""],["Is it far from here?","Có xa đây không?",""],["It's about a ten-minute walk.","Đi bộ khoảng mười phút.",""],["Go straight and turn left at the lights.","Đi thẳng rồi rẽ trái ở đèn giao thông.",""],["It's on your right, next to the bank.","Nó ở bên phải bạn, cạnh ngân hàng.",""],["Could you show me on the map?","Bạn chỉ giúp mình trên bản đồ được không?",""],["Is there a pharmacy near here?","Gần đây có hiệu thuốc không?",""],["Where is the restroom?","Nhà vệ sinh ở đâu?",""],["Can you help me, please?","Bạn giúp mình được không?",""],["I'm lost.","Mình bị lạc rồi.",""],["Which bus goes to the Old Quarter?","Xe buýt nào đi đến Phố Cổ?",""],["Can I walk there?","Mình đi bộ đến đó được không?",""],["You can't miss it.","Bạn không thể không thấy đâu.","Ý nói rất dễ tìm"],["Let me take you there.","Để mình dẫn bạn đến đó.",""]]},{"stage":"Basic","en":"Shopping","vi":"Mua sắm","items":[["How much is this?","Cái này bao nhiêu tiền?",""],["Can I try it on?","Mình mặc thử được không?",""],["Do you have this in a bigger size?","Có cỡ lớn hơn không?",""],["Do you have it in another color?","Có màu khác không?",""],["It's a bit expensive. Can you lower the price?","Hơi đắt. Bớt cho mình được không?",""],["I'll take it.","Mình lấy cái này.",""],["I'm just looking, thanks.","Mình chỉ xem thôi, cảm ơn.",""],["Can I pay by card?","Mình trả bằng thẻ được không?",""],["Could I have a bag, please?","Cho mình xin cái túi.",""],["Could I get a receipt?","Cho mình xin hoá đơn.",""],["Where can I find the milk?","Sữa để ở đâu vậy?",""],["Is this on sale?","Món này có giảm giá không?",""]]},{"stage":"Basic","en":"Eating out","vi":"Ăn uống ngoài hàng","items":[["A table for two, please.","Cho mình bàn hai người.",""],["Can I see the menu, please?","Cho mình xem thực đơn.",""],["What do you recommend?","Bạn gợi ý món gì?",""],["I'd like the chicken noodle soup.","Mình muốn gọi phở gà.",""],["Not too spicy, please.","Đừng cay quá nhé.",""],["I'm allergic to peanuts.","Mình bị dị ứng đậu phộng.",""],["Could I have some water, please?","Cho mình xin chút nước.",""],["This is delicious!","Món này ngon quá!",""],["Excuse me, we're ready to order.","Xin lỗi, bọn mình sẵn sàng gọi món rồi.",""],["Can we have the bill, please?","Cho mình xin hoá đơn thanh toán.",""],["Can we split the bill?","Mình chia hoá đơn được không?",""],["It's my treat.","Để mình mời.",""],["Is service included?","Đã bao gồm phí phục vụ chưa?",""],["Can I take this away?","Mình mang phần này về được không?",""],["Enjoy your meal!","Chúc ngon miệng!",""]]},{"stage":"Basic","en":"Time, dates & numbers","vi":"Thời gian, ngày tháng, con số","items":[["What time is it?","Mấy giờ rồi?",""],["It's half past seven.","Bảy giờ rưỡi.",""],["What's the date today?","Hôm nay ngày bao nhiêu?",""],["It's the fifteenth of May.","Hôm nay là ngày 15 tháng 5.",""],["When is your birthday?","Sinh nhật bạn khi nào?",""],["What time does it open?","Mấy giờ mở cửa?",""],["It's open from nine to five.","Mở cửa từ 9 giờ đến 5 giờ.",""],["How old are you? (to a child)","Cháu bao nhiêu tuổi?","Tránh hỏi tuổi người lớn khi mới quen"],["What's your phone number?","Số điện thoại của bạn là gì?",""],["Could you spell that, please?","Bạn đánh vần giúp mình được không?",""]]},{"stage":"Intermediate","en":"Travel & hotels","vi":"Du lịch & khách sạn","items":[["I have a reservation under the name Nguyen.","Tôi có đặt phòng tên Nguyễn.",""],["What time is check-out?","Mấy giờ trả phòng?",""],["Is breakfast included?","Có bao gồm bữa sáng không?",""],["Could I have a late check-out?","Tôi trả phòng muộn được không?",""],["The air conditioner in my room isn't working.","Máy lạnh phòng tôi không hoạt động.",""],["Could you call a taxi for me?","Bạn gọi giúp tôi một chiếc taxi được không?",""],["What's the Wi-Fi password?","Mật khẩu Wi-Fi là gì?",""],["Can I leave my luggage here?","Tôi gửi hành lý ở đây được không?",""],["I'd like to book a tour for tomorrow.","Tôi muốn đặt một tour cho ngày mai.",""],["What are the must-see places around here?","Quanh đây có chỗ nào nhất định phải đi không?",""],["How long does it take to get there?","Đi đến đó mất bao lâu?",""],["Is it safe to walk around at night?","Đi dạo buổi tối có an toàn không?",""],["Could you take a photo of us?","Bạn chụp giúp bọn mình một tấm ảnh được không?",""],["I'm here on holiday.","Tôi đến đây để đi nghỉ.",""],["My flight has been delayed.","Chuyến bay của tôi bị hoãn.",""]]},{"stage":"Intermediate","en":"Getting around","vi":"Di chuyển","items":[["Where can I buy a ticket?","Tôi mua vé ở đâu?",""],["A one-way ticket to Da Nang, please.","Cho tôi một vé một chiều đi Đà Nẵng.",""],["Does this bus stop at the museum?","Xe buýt này có dừng ở bảo tàng không?",""],["Please let me know when we get there.","Đến nơi thì báo tôi nhé.",""],["Could you drop me off here?","Cho tôi xuống ở đây được không?",""],["How much is the fare?","Giá vé là bao nhiêu?",""],["Please take me to this address.","Làm ơn chở tôi đến địa chỉ này.",""],["Is there a quicker way?","Có đường nào nhanh hơn không?",""],["I think we're going the wrong way.","Tôi nghĩ chúng ta đi sai đường rồi.",""],["Keep the change.","Không cần trả lại tiền thừa.",""]]},{"stage":"Intermediate","en":"Phone calls","vi":"Gọi điện thoại","items":[["Hello, this is Lan speaking.","Alô, tôi là Lan đây.",""],["Could I speak to Mr. Brown, please?","Cho tôi gặp ông Brown được không?",""],["Who's calling, please?","Xin hỏi ai đang gọi ạ?",""],["Hold on a moment, please.","Vui lòng chờ một chút.",""],["He's not available right now.","Anh ấy hiện không thể nghe máy.",""],["Can I take a message?","Tôi có thể nhận lời nhắn không?",""],["Could you ask him to call me back?","Nhờ bạn bảo anh ấy gọi lại cho tôi.",""],["Sorry, you're breaking up.","Xin lỗi, tín hiệu chập chờn quá.",""],["I think you have the wrong number.","Tôi nghĩ bạn gọi nhầm số rồi.",""],["Thanks for calling.","Cảm ơn đã gọi.",""]]},{"stage":"Intermediate","en":"Making plans & invitations","vi":"Lên kế hoạch & mời","items":[["Are you free this Saturday?","Thứ Bảy này bạn rảnh không?",""],["Would you like to grab a coffee?","Bạn có muốn đi uống cà phê không?",""],["How about seven o'clock?","Bảy giờ thì sao?",""],["That works for me.","Giờ đó mình được.",""],["Sorry, I can't make it. Maybe next time?","Tiếc quá, mình không đi được. Hẹn lần sau nhé?",""],["Let's meet in front of the cinema.","Gặp nhau trước rạp chiếu phim nhé.",""],["I'll text you the address.","Mình sẽ nhắn địa chỉ cho bạn.",""],["Shall we invite Nam too?","Mình mời cả Nam nhé?",""],["I'm running a bit late.","Mình đến muộn một chút.",""],["Count me in!","Tính cả mình nhé!",""],["Let me check and get back to you.","Để mình xem lại rồi báo bạn sau.",""],["Thanks for inviting me.","Cảm ơn bạn đã mời.",""]]},{"stage":"Intermediate","en":"Health","vi":"Sức khoẻ","items":[["I don't feel very well.","Mình thấy không khoẻ lắm.",""],["I have a headache and a sore throat.","Mình bị đau đầu và đau họng.",""],["I need to see a doctor.","Mình cần gặp bác sĩ.",""],["How long have you had these symptoms?","Bạn bị các triệu chứng này bao lâu rồi?",""],["Do I need a prescription for this?","Thuốc này có cần đơn không?",""],["How often should I take it?","Tôi nên uống mấy lần?",""],["Take one tablet twice a day after meals.","Uống một viên, ngày hai lần sau ăn.",""],["I hope you feel better soon.","Mong bạn sớm khoẻ.",""],["Get some rest.","Nghỉ ngơi đi nhé.",""],["Where is the nearest hospital?","Bệnh viện gần nhất ở đâu?",""]]},{"stage":"Intermediate","en":"Opinions & preferences","vi":"Ý kiến & sở thích","items":[["What do you think about it?","Bạn nghĩ sao về điều đó?",""],["In my opinion, it's a great idea.","Theo mình, đó là ý hay.",""],["I prefer tea to coffee.","Mình thích trà hơn cà phê.",""],["I'd rather stay home tonight.","Tối nay mình muốn ở nhà hơn.",""],["I'm not a big fan of horror films.","Mình không mê phim kinh dị lắm.",""],["It's not my cup of tea.","Đó không phải gu của mình.","Thành ngữ phổ biến"],["I can't stand loud music.","Mình không chịu nổi nhạc ồn.",""],["I'm really into photography.","Mình rất mê nhiếp ảnh.",""],["It depends.","Cái đó còn tuỳ.",""],["To be honest, I'm not sure.","Thật lòng thì mình không chắc.",""],["That makes sense.","Nghe hợp lý đấy.",""],["Fair enough.","Cũng phải.",""]]},{"stage":"Intermediate","en":"Showing visitors around","vi":"Dẫn khách nước ngoài tham quan","items":[["Welcome to Hanoi!","Chào mừng đến Hà Nội!",""],["This is one of the oldest streets in the city.","Đây là một trong những con phố lâu đời nhất thành phố.",""],["You should try egg coffee—it's a local specialty.","Bạn nên thử cà phê trứng—đặc sản ở đây.",""],["Be careful when crossing the street.","Cẩn thận khi sang đường nhé.",""],["Just walk slowly and steadily.","Cứ đi chậm và đều.","Mẹo sang đường ở VN"],["This temple was built in the 11th century.","Ngôi đền này được xây vào thế kỷ 11.",""],["You need to take off your shoes here.","Bạn cần cởi giày ở đây.",""],["Let me help you order.","Để mình giúp bạn gọi món.",""],["It's usually cheaper at the local market.","Ở chợ địa phương thường rẻ hơn.",""],["Have you been to Ha Long Bay?","Bạn đến Vịnh Hạ Long chưa?",""],["The best time to visit is in autumn.","Thời điểm đẹp nhất để đến là mùa thu.",""],["I hope you enjoy your stay.","Mong bạn có kỳ lưu trú vui vẻ.",""]]},{"stage":"Advanced","en":"Agreeing & disagreeing politely","vi":"Đồng ý & phản đối lịch sự","items":[["I couldn't agree more.","Mình hoàn toàn đồng ý.",""],["That's a good point.","Ý đó hay đấy.",""],["I see what you mean, but…","Mình hiểu ý bạn, nhưng…",""],["I'm afraid I don't quite agree.","E là mình không đồng ý lắm.",""],["I see it a bit differently.","Mình nhìn nhận hơi khác một chút.",""],["You might be right, but have you considered…?","Có thể bạn đúng, nhưng bạn đã nghĩ đến… chưa?",""],["Let's agree to disagree.","Mình cứ giữ quan điểm riêng nhé.",""],["That's not entirely true.","Điều đó không hoàn toàn đúng.",""],["Fair point, I hadn't thought of that.","Ý hay, mình chưa nghĩ đến điều đó.",""],["I'm with you on that.","Mình đứng về phía bạn ở điểm này.",""],["I'd have to disagree there.","Ở điểm này mình phải không đồng ý.",""],["Absolutely!","Chắc chắn rồi!",""]]},{"stage":"Advanced","en":"Complaints & solving problems","vi":"Phàn nàn & giải quyết vấn đề","items":[["I'm afraid there's a problem with my order.","E là đơn hàng của tôi có vấn đề.",""],["This isn't what I ordered.","Đây không phải món tôi gọi.",""],["I'd like to speak to the manager, please.","Tôi muốn gặp quản lý.",""],["I was charged twice for the same item.","Tôi bị tính tiền hai lần cho cùng một món.",""],["Could you look into this for me?","Bạn kiểm tra giúp tôi được không?",""],["I'd appreciate it if you could fix this today.","Tôi sẽ rất cảm kích nếu bạn xử lý trong hôm nay.",""],["What can you do to make it right?","Bạn có thể làm gì để khắc phục?",""],["I'd like a refund, please.","Tôi muốn được hoàn tiền.",""],["It's been more than a week and I still haven't heard back.","Đã hơn một tuần mà tôi vẫn chưa nhận phản hồi.",""],["Thank you for sorting this out so quickly.","Cảm ơn bạn đã giải quyết nhanh như vậy.",""],["I understand it's not your fault.","Tôi hiểu đây không phải lỗi của bạn.",""],["Let's see what we can do.","Để xem chúng ta có thể làm gì.",""]]},{"stage":"Advanced","en":"Telling stories & experiences","vi":"Kể chuyện & trải nghiệm","items":[["You won't believe what happened to me yesterday.","Bạn sẽ không tin chuyện xảy ra với mình hôm qua đâu.",""],["It all started when I missed my bus.","Mọi chuyện bắt đầu khi mình lỡ chuyến xe buýt.",""],["To make a long story short, we got there late.","Nói ngắn gọn là bọn mình đến muộn.",""],["The funny thing is…","Điều buồn cười là…",""],["Luckily, someone helped us.","May mắn là có người đã giúp.",""],["I'll never forget that day.","Mình sẽ không bao giờ quên ngày đó.",""],["Have you ever been in a situation like that?","Bạn đã bao giờ gặp tình huống như vậy chưa?",""],["It was the best trip of my life.","Đó là chuyến đi tuyệt nhất đời mình.",""],["Looking back, it was a great lesson.","Nhìn lại thì đó là bài học quý.",""],["Anyway, that's what happened.","Dù sao thì chuyện là vậy.",""]]},{"stage":"Advanced","en":"Culture & deeper conversations","vi":"Văn hoá & trò chuyện sâu","items":[["What's the biggest culture shock you've had here?","Cú sốc văn hoá lớn nhất của bạn ở đây là gì?",""],["In Vietnam, we usually greet older people first.","Ở Việt Nam, chúng tôi thường chào người lớn tuổi trước.",""],["How do people celebrate New Year in your country?","Ở nước bạn người ta đón năm mới thế nào?",""],["Family is very important in our culture.","Gia đình rất quan trọng trong văn hoá chúng tôi.",""],["That's really interesting. Tell me more.","Thú vị thật. Kể thêm đi.",""],["I've always wondered about that.","Mình luôn thắc mắc về điều đó.",""],["It's considered rude to point at people.","Chỉ tay vào người khác bị coi là bất lịch sự.",""],["I hope I'm not being too personal.","Mong là mình không hỏi quá riêng tư.",""],["What do you miss most about home?","Bạn nhớ điều gì nhất ở quê nhà?",""],["Every culture has its own way of doing things.","Mỗi nền văn hoá có cách làm riêng.",""],["I'd love to visit your country someday.","Mình rất muốn đến nước bạn một ngày nào đó.",""],["Thanks for sharing that with me.","Cảm ơn bạn đã chia sẻ.",""]]},{"stage":"Advanced","en":"Emergencies","vi":"Tình huống khẩn cấp","items":[["Help! Somebody call an ambulance!","Cứu với! Ai đó gọi xe cấp cứu đi!",""],["I've lost my passport.","Tôi bị mất hộ chiếu.",""],["My wallet has been stolen.","Ví của tôi bị lấy cắp.",""],["Where is the nearest police station?","Đồn cảnh sát gần nhất ở đâu?",""],["I need to contact my embassy.","Tôi cần liên hệ đại sứ quán.",""],["There's been an accident.","Có tai nạn xảy ra.",""],["Is anyone hurt?","Có ai bị thương không?",""],["Please stay calm.","Xin hãy bình tĩnh.",""],["Can I use your phone? It's an emergency.","Cho tôi mượn điện thoại được không? Việc khẩn cấp.",""],["Fire! Get out of the building!","Cháy! Ra khỏi toà nhà ngay!",""]]},{"stage":"Advanced","en":"Keeping a conversation going","vi":"Duy trì cuộc trò chuyện","items":[["By the way, …","Nhân tiện thì…",""],["Speaking of travel, have you been to Hue?","Nói về du lịch, bạn đã đến Huế chưa?",""],["What do you mean by that?","Ý bạn là sao?",""],["So what happened next?","Rồi sao nữa?",""],["That reminds me of…","Điều đó làm mình nhớ đến…",""],["Where was I?","Mình đang nói đến đâu rồi nhỉ?",""],["Sorry, go on.","Xin lỗi, bạn nói tiếp đi.",""],["Let me put it another way.","Để mình nói theo cách khác.",""],["How did you get into that?","Bạn bắt đầu với việc đó thế nào?",""],["I'd better get going. It was lovely chatting!","Mình phải đi rồi. Nói chuyện vui lắm!",""],["Let's keep in touch.","Giữ liên lạc nhé.",""],["Feel free to message me anytime.","Cứ nhắn mình bất cứ lúc nào.",""]]}],"work":[{"stage":"Basic","en":"Introducing yourself at work","vi":"Giới thiệu bản thân ở công ty","items":[["Hi everyone, I'm Hoa. I just joined the marketing team.","Chào mọi người, tôi là Hoa. Tôi vừa vào nhóm marketing.",""],["I'll be working on the new product launch.","Tôi sẽ phụ trách đợt ra mắt sản phẩm mới.",""],["I'm responsible for customer accounts in the south.","Tôi phụ trách các tài khoản khách hàng khu vực phía Nam.",""],["I report directly to Ms. Smith.","Tôi báo cáo trực tiếp cho chị Smith.",""],["I've been with the company for three years.","Tôi đã làm ở công ty được ba năm.",""],["Before this, I worked in finance.","Trước đây tôi làm trong ngành tài chính.",""],["Let me know if there's anything I can help with.","Có gì tôi giúp được thì cứ báo tôi nhé.",""],["Which team are you on?","Bạn thuộc nhóm nào?",""],["How long have you been working here?","Bạn làm ở đây bao lâu rồi?",""],["Welcome aboard!","Chào mừng bạn gia nhập!","Câu chào đồng nghiệp mới"],["I'm looking forward to working with you.","Tôi mong được làm việc cùng bạn.",""],["Could you show me how this works?","Bạn chỉ tôi cách dùng cái này được không?",""],["Who should I ask about access to the system?","Tôi nên hỏi ai về quyền truy cập hệ thống?",""],["Where can I find the onboarding documents?","Tôi tìm tài liệu hướng dẫn nhân viên mới ở đâu?",""],["Thanks for making me feel welcome.","Cảm ơn mọi người đã đón tiếp tôi.",""]]},{"stage":"Basic","en":"Office small talk","vi":"Trò chuyện ở văn phòng","items":[["How was your weekend?","Cuối tuần của bạn thế nào?",""],["Are you heading to lunch?","Bạn đi ăn trưa à?",""],["Do you want to join us for lunch?","Bạn muốn đi ăn trưa cùng bọn mình không?",""],["It's been a busy week.","Tuần này bận thật.",""],["Are you working on anything interesting?","Bạn có đang làm gì thú vị không?",""],["Any plans for the holiday?","Kỳ nghỉ có kế hoạch gì không?",""],["Congratulations on your promotion!","Chúc mừng bạn được thăng chức!",""],["I heard you did a great job on the presentation.","Nghe nói bạn thuyết trình rất tốt.",""],["Long time no see!","Lâu rồi không gặp!",""],["How's the project going?","Dự án tiến triển thế nào rồi?",""],["Have a good evening. See you tomorrow.","Chúc buổi tối vui vẻ. Mai gặp nhé.",""],["Happy Friday!","Thứ Sáu vui vẻ!",""]]},{"stage":"Basic","en":"Asking colleagues for help","vi":"Nhờ đồng nghiệp giúp","items":[["Do you have a minute?","Bạn có rảnh một phút không?",""],["Could you give me a hand with this?","Bạn giúp tôi việc này một tay được không?",""],["Would you mind checking this for me?","Bạn có phiền kiểm tra giúp tôi không?",""],["Sorry to bother you, but…","Xin lỗi làm phiền bạn, nhưng…",""],["I'm not sure how to do this. Could you help?","Tôi không chắc làm việc này thế nào. Bạn giúp được không?",""],["Who's the best person to ask about this?","Ai là người phù hợp nhất để hỏi việc này?",""],["Could you send me that file?","Bạn gửi tôi file đó được không?",""],["Thanks, that's really helpful.","Cảm ơn, thật sự rất hữu ích.",""],["I owe you one.","Tôi nợ bạn một lần nhé.","Cách cảm ơn thân mật"],["Let me know if you need anything from me.","Bạn cần gì từ tôi thì cứ báo nhé.",""],["No rush.","Không gấp đâu.",""],["Whenever you have time.","Khi nào bạn rảnh cũng được.",""]]},{"stage":"Basic","en":"Phone basics at work","vi":"Điện thoại công việc","items":[["Good morning, ABC Company. How may I help you?","Chào buổi sáng, công ty ABC xin nghe. Tôi có thể giúp gì?",""],["May I ask who's calling?","Cho tôi hỏi ai đang gọi ạ?",""],["I'm calling about the order we placed last week.","Tôi gọi về đơn hàng chúng tôi đặt tuần trước.",""],["I'll put you through.","Tôi sẽ chuyển máy cho bạn.",""],["She's in a meeting at the moment.","Hiện chị ấy đang họp.",""],["Would you like to leave a message?","Bạn có muốn để lại lời nhắn không?",""],["Could you spell your name, please?","Bạn đánh vần tên giúp tôi được không?",""],["Let me read that back to you.","Để tôi đọc lại cho bạn kiểm tra.",""],["I'll make sure he gets your message.","Tôi sẽ đảm bảo anh ấy nhận được lời nhắn.",""],["What's the best number to reach you?","Số nào liên lạc với bạn tốt nhất?",""],["Thank you for holding.","Cảm ơn bạn đã chờ máy.",""],["Is there anything else I can help you with?","Bạn còn cần tôi giúp gì nữa không?",""]]},{"stage":"Basic","en":"Email openings & closings","vi":"Mở đầu & kết thúc email","items":[["Dear Mr. Tanaka,","Kính gửi ông Tanaka,",""],["I hope this email finds you well.","Hy vọng anh/chị vẫn khoẻ.",""],["I'm writing to ask about…","Tôi viết thư này để hỏi về…",""],["Thank you for your email.","Cảm ơn email của anh/chị.",""],["As requested, I've attached the report.","Theo yêu cầu, tôi đã đính kèm báo cáo.",""],["Please find the details below.","Vui lòng xem chi tiết bên dưới.",""],["Just a quick reminder that…","Xin nhắc nhanh rằng…",""],["Please let me know if you have any questions.","Nếu có câu hỏi gì, xin vui lòng cho tôi biết.",""],["I look forward to hearing from you.","Tôi mong nhận được phản hồi của anh/chị.",""],["Thanks in advance for your help.","Cảm ơn trước sự giúp đỡ của anh/chị.",""],["Best regards,","Trân trọng,",""],["Sorry for the late reply.","Xin lỗi vì phản hồi muộn.",""]]},{"stage":"Basic","en":"Scheduling","vi":"Sắp xếp lịch","items":[["When are you available this week?","Tuần này khi nào anh/chị rảnh?",""],["Does Tuesday at 10 work for you?","Thứ Ba lúc 10 giờ có tiện không?",""],["I'm afraid I'm busy then. How about Wednesday?","E là lúc đó tôi bận. Thứ Tư thì sao?",""],["Let's set up a meeting to discuss it.","Hãy sắp xếp một cuộc họp để bàn việc này.",""],["I'll send you a calendar invite.","Tôi sẽ gửi lời mời trên lịch.",""],["Can we move the meeting to the afternoon?","Chúng ta dời cuộc họp sang buổi chiều được không?",""],["I need to reschedule our call.","Tôi cần dời lịch cuộc gọi của chúng ta.",""],["Let's keep it to 30 minutes.","Hãy giữ trong 30 phút thôi.",""],["What time zone are you in?","Anh/chị đang ở múi giờ nào?",""],["I'll be out of the office next Monday.","Thứ Hai tới tôi không có mặt ở văn phòng.",""],["Could we push the deadline back a few days?","Chúng ta lùi hạn chót vài ngày được không?",""],["Let's touch base on Friday.","Thứ Sáu chúng ta trao đổi lại nhé.",""]]},{"stage":"Intermediate","en":"Meetings","vi":"Họp","items":[["Shall we get started?","Chúng ta bắt đầu nhé?",""],["Thanks, everyone, for coming.","Cảm ơn mọi người đã đến.",""],["The purpose of today's meeting is to…","Mục đích cuộc họp hôm nay là…",""],["Let's go over the agenda.","Hãy cùng xem qua chương trình họp.",""],["Could you give us an update on the project?","Anh/chị cập nhật cho chúng tôi về dự án được không?",""],["Can I add something here?","Tôi bổ sung một ý được không?",""],["Sorry to interrupt, but…","Xin lỗi đã ngắt lời, nhưng…",""],["Let's get back to the main point.","Hãy quay lại vấn đề chính.",""],["I think we're running out of time.","Tôi nghĩ chúng ta sắp hết thời gian.",""],["Let's take this offline.","Việc này mình bàn riêng sau nhé.","Không bàn tiếp trong cuộc họp"],["Who will take the lead on this?","Ai sẽ phụ trách việc này?",""],["What are the next steps?","Các bước tiếp theo là gì?",""],["Let's recap what we've agreed.","Hãy tóm tắt lại những gì đã thống nhất.",""],["I'll send out the minutes after the meeting.","Tôi sẽ gửi biên bản sau cuộc họp.",""],["Does anyone have any questions?","Có ai có câu hỏi không?",""],["Let's schedule a follow-up meeting.","Hãy lên lịch một cuộc họp tiếp theo.",""],["I'd like to hear everyone's thoughts.","Tôi muốn nghe ý kiến của mọi người.",""],["That's all for today. Thanks, everyone.","Hôm nay đến đây thôi. Cảm ơn mọi người.",""]]},{"stage":"Intermediate","en":"Giving updates","vi":"Báo cáo tiến độ","items":[["We're on track to finish by Friday.","Chúng tôi đang đúng tiến độ để xong trước thứ Sáu.",""],["We're slightly behind schedule.","Chúng tôi hơi chậm tiến độ.",""],["The first phase is complete.","Giai đoạn đầu đã hoàn thành.",""],["We've run into a few issues with the supplier.","Chúng tôi gặp vài vấn đề với nhà cung cấp.",""],["I'm still waiting for approval from finance.","Tôi vẫn đang chờ phòng tài chính phê duyệt.",""],["The main challenge right now is…","Thách thức chính hiện nay là…",""],["We expect to have results by next week.","Chúng tôi dự kiến có kết quả vào tuần sau.",""],["Sales are up 12% compared to last quarter.","Doanh số tăng 12% so với quý trước.",""],["Here's a quick summary of where we are.","Đây là tóm tắt nhanh tình hình hiện tại.",""],["I'll keep you posted.","Tôi sẽ cập nhật thường xuyên cho anh/chị.",""],["Everything is going according to plan.","Mọi thứ đang diễn ra theo kế hoạch.",""],["We need more resources to meet the deadline.","Chúng tôi cần thêm nguồn lực để kịp hạn chót.",""]]},{"stage":"Intermediate","en":"Asking for clarification","vi":"Hỏi lại cho rõ","items":[["Could you clarify what you mean by…?","Anh/chị làm rõ ý … được không?",""],["Just to make sure I understand, you want…?","Để chắc là tôi hiểu đúng, anh/chị muốn…?",""],["Could you give me an example?","Anh/chị cho tôi một ví dụ được không?",""],["What's the deadline for this?","Hạn chót cho việc này là khi nào?",""],["Sorry, could you repeat the last part?","Xin lỗi, anh/chị nhắc lại phần cuối được không?",""],["Do you mean we should cancel it?","Ý anh/chị là chúng ta nên huỷ nó?",""],["Could you walk me through it?","Anh/chị hướng dẫn tôi từng bước được không?",""],["So, if I understand correctly, …","Vậy nếu tôi hiểu đúng thì…",""],["Is that a priority?","Việc đó có phải ưu tiên không?",""],["What exactly do you need from me?","Chính xác anh/chị cần gì từ tôi?",""]]},{"stage":"Intermediate","en":"Requests & offers","vi":"Đề nghị & đề xuất giúp đỡ","items":[["Would it be possible to get the report by noon?","Có thể có báo cáo trước buổi trưa không?",""],["I was wondering if you could help me with this.","Không biết anh/chị có thể giúp tôi việc này không.",""],["Could you please send me the latest figures?","Anh/chị gửi tôi số liệu mới nhất được không?",""],["Would you mind reviewing my draft?","Anh/chị có phiền xem bản nháp của tôi không?",""],["I'd be happy to help.","Tôi rất sẵn lòng giúp.",""],["Let me take care of that.","Để tôi lo việc đó.",""],["Would you like me to prepare the slides?","Anh/chị có muốn tôi chuẩn bị slide không?",""],["I can cover for you tomorrow.","Mai tôi có thể làm thay anh/chị.",""],["Is there anything I can do to help?","Tôi có thể giúp gì không?",""],["I'm afraid I can't take on any more work this week.","E là tuần này tôi không nhận thêm việc được nữa.",""],["Could we discuss this after lunch?","Chúng ta bàn việc này sau bữa trưa được không?",""],["That would be a great help.","Điều đó sẽ giúp ích rất nhiều.",""]]},{"stage":"Intermediate","en":"Presentations","vi":"Thuyết trình","items":[["Good morning, everyone. Thank you for being here.","Chào buổi sáng mọi người. Cảm ơn mọi người đã có mặt.",""],["Today, I'm going to talk about our new strategy.","Hôm nay tôi sẽ nói về chiến lược mới của chúng ta.",""],["My presentation is divided into three parts.","Bài thuyết trình của tôi chia làm ba phần.",""],["Let's start with some background.","Hãy bắt đầu với một chút bối cảnh.",""],["As you can see on this slide, …","Như các bạn thấy trên slide này…",""],["This chart shows our sales over the past year.","Biểu đồ này cho thấy doanh số trong năm qua.",""],["Let me draw your attention to this figure.","Tôi xin lưu ý các bạn đến con số này.",""],["Moving on to the next point, …","Chuyển sang ý tiếp theo…",""],["This brings me to my next point.","Điều này dẫn tôi đến ý tiếp theo.",""],["To sum up, …","Tóm lại…",""],["The key takeaway is…","Điểm mấu chốt cần nhớ là…",""],["I'll be happy to take any questions.","Tôi sẵn lòng trả lời câu hỏi.",""],["That's a great question.","Đó là một câu hỏi hay.",""],["I don't have that information right now, but I'll get back to you.","Hiện tôi chưa có thông tin đó, nhưng tôi sẽ phản hồi sau.",""],["Thank you for your attention.","Cảm ơn mọi người đã lắng nghe.",""]]},{"stage":"Intermediate","en":"Customer service","vi":"Chăm sóc khách hàng","items":[["Thank you for contacting us.","Cảm ơn quý khách đã liên hệ.",""],["How can I assist you today?","Hôm nay tôi có thể hỗ trợ gì cho quý khách?",""],["I'm sorry to hear about that.","Tôi rất tiếc khi nghe điều đó.",""],["Could you give me your order number?","Quý khách cho tôi xin mã đơn hàng được không?",""],["Let me check that for you.","Để tôi kiểm tra cho quý khách.",""],["I completely understand your frustration.","Tôi hoàn toàn hiểu sự bực bội của quý khách.",""],["We'll send you a replacement free of charge.","Chúng tôi sẽ gửi sản phẩm thay thế miễn phí.",""],["I've escalated your case to our technical team.","Tôi đã chuyển trường hợp của quý khách lên đội kỹ thuật.",""],["You should receive it within three business days.","Quý khách sẽ nhận được trong vòng ba ngày làm việc.",""],["Is there anything else I can do for you?","Tôi còn có thể giúp gì nữa không?",""],["We appreciate your patience.","Chúng tôi trân trọng sự kiên nhẫn của quý khách.",""],["Thank you for your business.","Cảm ơn quý khách đã tin dùng.",""]]},{"stage":"Intermediate","en":"Video calls","vi":"Họp trực tuyến","items":[["Can everyone hear me?","Mọi người có nghe tôi nói không?",""],["I think you're on mute.","Tôi nghĩ bạn đang tắt mic.",""],["Your screen is frozen.","Màn hình của bạn bị đứng.",""],["Let me share my screen.","Để tôi chia sẻ màn hình.",""],["Can you see my screen?","Mọi người thấy màn hình của tôi không?",""],["Sorry, my connection is a bit unstable.","Xin lỗi, kết nối của tôi hơi chập chờn.",""],["Could you turn on your camera?","Bạn bật camera lên được không?",""],["I'll drop the link in the chat.","Tôi sẽ gửi đường link vào khung chat.",""],["You cut out for a second.","Tiếng của bạn bị mất một lúc.",""],["Let's wait a couple of minutes for others to join.","Hãy đợi vài phút để mọi người vào.",""]]},{"stage":"Advanced","en":"Negotiation","vi":"Đàm phán","items":[["What would you need to see in order to move forward?","Anh/chị cần thấy điều gì để có thể tiến tới?",""],["We're looking for a long-term partnership.","Chúng tôi đang tìm kiếm quan hệ đối tác lâu dài.",""],["Is there any flexibility on the price?","Giá có thể linh hoạt không?",""],["That's a bit higher than our budget.","Mức đó hơi cao so với ngân sách của chúng tôi.",""],["If you can lower the price, we can increase the order.","Nếu anh/chị giảm giá, chúng tôi có thể tăng số lượng đặt hàng.",""],["We could offer a 5% discount for bulk orders.","Chúng tôi có thể giảm 5% cho đơn hàng số lượng lớn.",""],["I'm afraid that's our final offer.","E rằng đó là đề nghị cuối cùng của chúng tôi.",""],["Let's find a solution that works for both sides.","Hãy tìm giải pháp có lợi cho cả hai bên.",""],["I need to run this by my manager.","Tôi cần trao đổi việc này với quản lý.",""],["Can we put that in writing?","Chúng ta ghi việc đó thành văn bản được không?",""],["I think we have a deal.","Tôi nghĩ chúng ta đã thoả thuận xong.",""],["Let's meet halfway.","Mỗi bên nhượng bộ một chút nhé.",""]]},{"stage":"Advanced","en":"Disagreeing diplomatically","vi":"Phản đối khéo léo","items":[["I understand your point, but I have some concerns.","Tôi hiểu quan điểm của anh/chị, nhưng tôi có vài băn khoăn.",""],["I'm not sure that's the best approach.","Tôi không chắc đó là cách tiếp cận tốt nhất.",""],["Have we considered the risks?","Chúng ta đã cân nhắc rủi ro chưa?",""],["I see where you're coming from, however…","Tôi hiểu lý do của anh/chị, tuy nhiên…",""],["With respect, I'd like to suggest an alternative.","Với sự tôn trọng, tôi muốn đề xuất một phương án khác.",""],["Could we look at this from a different angle?","Chúng ta nhìn vấn đề từ góc khác được không?",""],["The data suggest otherwise.","Số liệu lại cho thấy điều ngược lại.",""],["I'm not fully convinced yet.","Tôi chưa hoàn toàn bị thuyết phục.",""],["Let's weigh the pros and cons.","Hãy cân nhắc ưu và nhược điểm.",""],["I'd be cautious about committing to that.","Tôi sẽ thận trọng khi cam kết việc đó.",""],["That might work, but let's test it first.","Có thể ổn, nhưng hãy thử nghiệm trước.",""],["I'm happy to go with the team's decision.","Tôi sẵn sàng theo quyết định của nhóm.",""]]},{"stage":"Advanced","en":"Giving & receiving feedback","vi":"Góp ý & nhận góp ý","items":[["You did a great job on the report.","Bạn làm báo cáo rất tốt.",""],["One thing you could improve is…","Một điểm bạn có thể cải thiện là…",""],["Have you thought about trying…?","Bạn đã nghĩ đến việc thử… chưa?",""],["I really appreciate your attention to detail.","Tôi rất trân trọng sự tỉ mỉ của bạn.",""],["It might be clearer if you…","Có lẽ sẽ rõ hơn nếu bạn…",""],["Thanks for the feedback. That's really useful.","Cảm ơn góp ý. Rất hữu ích.",""],["Could you be more specific?","Anh/chị nói cụ thể hơn được không?",""],["I'll take that on board.","Tôi sẽ tiếp thu điều đó.",""],["How do you think I could do better next time?","Anh/chị nghĩ lần sau tôi có thể làm tốt hơn thế nào?",""],["I take full responsibility for the mistake.","Tôi chịu hoàn toàn trách nhiệm về lỗi đó.",""],["Let's discuss how to avoid this in the future.","Hãy bàn cách tránh việc này trong tương lai.",""],["Keep up the good work!","Cứ tiếp tục phát huy nhé!",""]]},{"stage":"Advanced","en":"Job interviews","vi":"Phỏng vấn xin việc","items":[["Thank you for inviting me to this interview.","Cảm ơn anh/chị đã mời tôi phỏng vấn.",""],["Could you tell me a little about yourself?","Bạn giới thiệu đôi chút về bản thân được không?",""],["I have three years of experience in sales.","Tôi có ba năm kinh nghiệm bán hàng.",""],["My greatest strength is my ability to learn quickly.","Điểm mạnh lớn nhất của tôi là khả năng học nhanh.",""],["One area I'm working on is public speaking.","Một mảng tôi đang cải thiện là nói trước đám đông.",""],["I'm interested in this role because…","Tôi quan tâm vị trí này vì…",""],["In my previous role, I led a team of five.","Ở vị trí trước, tôi dẫn dắt một nhóm năm người.",""],["I handled the situation by…","Tôi đã xử lý tình huống đó bằng cách…",""],["As a result, we increased sales by 20%.","Kết quả là chúng tôi tăng doanh số 20%.",""],["I see myself growing into a leadership role.","Tôi thấy mình phát triển lên vị trí lãnh đạo.",""],["What does a typical day look like in this position?","Một ngày làm việc điển hình ở vị trí này thế nào?",""],["What are the next steps in the hiring process?","Các bước tiếp theo của quy trình tuyển dụng là gì?",""],["I'm a quick learner and a strong team player.","Tôi học nhanh và làm việc nhóm tốt.",""],["Thank you for your time. I look forward to hearing from you.","Cảm ơn anh/chị đã dành thời gian. Tôi mong nhận được phản hồi.",""]]},{"stage":"Advanced","en":"Leading teams","vi":"Điều hành nhóm","items":[["Let's set clear goals for this quarter.","Hãy đặt mục tiêu rõ ràng cho quý này.",""],["I'd like each of you to own one part of the project.","Tôi muốn mỗi người phụ trách một phần của dự án.",""],["What do you need from me to get this done?","Mọi người cần tôi hỗ trợ gì để hoàn thành?",""],["Let's prioritize the most urgent tasks.","Hãy ưu tiên các việc gấp nhất.",""],["I trust you to make the call.","Tôi tin bạn sẽ quyết định đúng.",""],["Please flag any risks early.","Hãy báo sớm mọi rủi ro.",""],["Great teamwork, everyone!","Mọi người làm việc nhóm tuyệt lắm!",""],["Let's learn from this and move on.","Hãy rút kinh nghiệm và tiếp tục.",""],["My door is always open.","Cứ đến gặp tôi bất cứ lúc nào.",""],["Let's align on the timeline.","Hãy thống nhất về tiến độ.",""]]},{"stage":"Advanced","en":"Handling problems & escalation","vi":"Xử lý sự cố & báo cáo cấp trên","items":[["We have an urgent issue that needs your attention.","Chúng ta có một vấn đề khẩn cần anh/chị lưu ý.",""],["Here's what happened and what we've done so far.","Đây là những gì đã xảy ra và những gì chúng tôi đã làm.",""],["The root cause seems to be…","Nguyên nhân gốc rễ có vẻ là…",""],["I suggest we take the following steps.","Tôi đề xuất chúng ta làm các bước sau.",""],["I'll keep you updated every two hours.","Tôi sẽ cập nhật cho anh/chị mỗi hai giờ.",""],["We need a decision by the end of the day.","Chúng ta cần quyết định trước cuối ngày.",""],["I apologize for the inconvenience this has caused.","Tôi xin lỗi vì sự bất tiện đã gây ra.",""],["We've put measures in place to prevent this from happening again.","Chúng tôi đã có biện pháp để tránh việc này lặp lại.",""]]},{"stage":"Advanced","en":"Networking","vi":"Mở rộng quan hệ","items":[["What line of work are you in?","Anh/chị làm trong lĩnh vực nào?",""],["I really enjoyed your talk this morning.","Tôi rất thích bài nói sáng nay của anh/chị.",""],["How did you get started in this field?","Anh/chị bắt đầu trong lĩnh vực này thế nào?",""],["We should definitely stay in touch.","Chúng ta chắc chắn nên giữ liên lạc.",""],["Here's my card.","Đây là danh thiếp của tôi.",""],["Would you be open to a quick call next week?","Tuần sau anh/chị có sẵn lòng gọi nhanh một cuộc không?",""],["I'd love to hear more about your company.","Tôi rất muốn nghe thêm về công ty anh/chị.",""],["Let me introduce you to my colleague, Tom.","Để tôi giới thiệu anh/chị với đồng nghiệp của tôi, Tom.",""],["It was a pleasure meeting you.","Rất hân hạnh được gặp anh/chị.",""],["Let's connect on LinkedIn.","Hãy kết nối trên LinkedIn nhé.",""]]}]},"ipa":{"groups":[{"id":"vowel","en":"Monophthongs","vi":"Nguyên âm đơn"},{"id":"diphthong","en":"Diphthongs","vi":"Nguyên âm đôi"},{"id":"consonant","en":"Consonants","vi":"Phụ âm"}],"path":[{"vi":"Nguyên âm dài – ngắn","sounds":["iː","ɪ","uː","ʊ","ɑː","ʌ","ɔː","ɒ","ɜː","ə"]},{"vi":"Cặp e – æ","sounds":["e","æ"]},{"vi":"Nguyên âm đôi","sounds":["eɪ","aɪ","ɔɪ","aʊ","əʊ","ɪə","eə","ʊə"]},{"vi":"Phụ âm vô thanh – hữu thanh","sounds":["p","b","t","d","k","ɡ","f","v","s","z","ʃ","ʒ","tʃ","dʒ"]},{"vi":"Âm “th” khó","sounds":["θ","ð"]},{"vi":"Âm mũi & âm lướt","sounds":["m","n","ŋ","l","r","w","j","h"]}],"sounds":[{"s":"iː","type":"vowel","vi":"i dài","tip":"Kéo dài âm “i”, môi dàn sang hai bên như đang cười.","ex":[["see","siː"],["green","ɡriːn"],["teacher","ˈtiːtʃə"],["meet","miːt"]],"pairs":[["sheep","ship","ɪ"],["leave","live","ɪ"],["seat","sit","ɪ"],["feel","fill","ɪ"],["eat","it","ɪ"]]},{"s":"ɪ","type":"vowel","vi":"i ngắn","tip":"Âm “i” ngắn và gọn, lưỡi t .","ex":[["cup","kʌp"],["sun","sʌn"],["love","lʌv"],["mother","ˈmʌðə"]],"pairs":[["cut","cat","æ"],["cup","cap","æ"],["hut","hat","æ"],["much","March","ɑː"]]},{"s":"ɑː","type":"vowel","vi":"a dài","tip":"Kéo dài âm “a”, miệng mở rộng, lưỡi hạ thấp.","ex":[["car","kɑː"],["father","ˈfɑːðə"],["start","stɑːt"],["heart","hɑːt"]],"pairs":[["heart","hut","ʌ"],["cart","cut","ʌ"],["calm","come","ʌ"],["March","much","ʌ"]]},{"s":"ɒ","type":"vowel","vi":"o ngắn","tip":"Âm “o” ngắn, miệng mở tròn (giọng Anh). Giọng Mỹ thường đọc gần /ɑː/.","ex":[["hot","hɒt"],["dog","dɒɡ"],["box","bɒks"],["watch","wɒtʃ"]],"pairs":[["pot","port","ɔː"],["cot","caught","ɔː"],["shot","short","ɔː"],["spot","sport","ɔː"]]},{"s":"ɪə","type":"diphthong","vi":"ia","tip":"Trượt từ /ɪ/ sang /ə/, giống “ia” trong “bia”.","ex":[["ear","ɪə"],["here","hɪə"],["near","nɪə"],["idea","aɪˈdɪə"]],"pairs":[["ear","air","eə"],["here","hair","eə"],["beer","bear","eə"],["fear","fair","eə"]]},{"s":"eə","type":"diphthong","vi":"e-ơ","tip":"Trượt từ /e/ sang /ə/, giống “e-ơ” đọc liền.","ex":[["hair","heə"],["where","weə"],["care","keə"],["chair","tʃeə"]],"pairs":[["air","ear","ɪə"],["hair","here","ɪə"],["bear","beer","ɪə"],["fair","fear","ɪə"]]},{"s":"ʊə","type":"diphthong","vi":"u-ơ","tip":"Trượt từ /ʊ/ sang /ə/, giống “u-ơ”. Nhiều người bản xứ đọc gần /ɔː/.","ex":[["tour","tʊə"],["pure","pjʊə"],["cure","kjʊə"],["sure","ʃʊə"]],"pairs":[]},{"s":"eɪ","type":"diphthong","vi":"ây","tip":"Trượt từ /e/ sang /ɪ/, giống “ây” trong “đây”.","ex":[["day","deɪ"],["name","neɪm"],["rain","reɪn"],["great","ɡreɪt"]],"pairs":[["late","let","e"],["wait","wet","e"],["sale","sell","e"],["lake","like","aɪ"]]},{"s":"aɪ","type":"diphthong","vi":"ai","tip":"Giống “ai” tiếng Việt, mở miệng rộng rồi khép dần.","ex":[["my","maɪ"],["time","taɪm"],["bike","baɪk"],["light","laɪt"]],"pairs":[["like","lake","eɪ"],["time","tame","eɪ"],["white","wait","eɪ"],["buy","boy","ɔɪ"]]},{"s":"ɔɪ","type":"diphthong","vi":"oi","tip":"Giống “oi” tiếng Việt, môi tròn <script>/* Pure logic shared by the app and the Node tests: dates, Leitner review schedule, streaks, quizzes, scoring. */
(function (root) {
  "use strict";

  // ===== CONFIG =====
  const INTERVALS = [1, 2, 4, 7, 15, 30, 60]; // days until next review, by box
  const MASTER_BOX = 5;                        // box at which a word counts as "thuộc"
  const BATCH = 5;                             // new words per learn session
  // ==================

  const pad = (n) => String(n).padStart(2, "0");
  const dstr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return dstr(d); };
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  /** ISO-8601 week of a local date, e.g. "2026-W43" (weeks start on Monday). */
  function isoWeek(s) {
    const d = parse(s);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); // Thursday of this week decides the year
    const jan4 = new Date(d.getFullYear(), 0, 4, 12);
    const wk = 1 + Math.round((daysBetween(dstr(jan4), dstr(d)) - 3 + ((jan4.getDay() + 6) % 7)) / 7);
    return `${d.getFullYear()}-W${pad(wk)}`;
  }

  /** Word id "word|pos", from a raw data row [word, pos, …] or a word object { w, pos }. */
  const wkey = (w) => (Array.isArray(w) ? `${w[0]}|${w[1]}` : w.key || `${w.w}|${w.pos}`);

  // ---- Leitner schedule ----
  const newCard = (today) => ({ box: 0, due: addDays(today, INTERVALS[0]), added: today, reps: 0, lapses: 0 });

  /** g: 0 = quên, 1 = khó, 2 = nhớ, 3 = dễ */
  function grade(card, g, today) {
    const c = { ...card, reps: (card.reps || 0) + 1, last: today };
    if (g <= 0) { c.box = 0; c.lapses = (card.lapses || 0) + 1; }
    else if (g === 1) c.box = Math.max(0, card.box);
    else c.box = Math.min(INTERVALS.length - 1, card.box + (g >= 3 ? 2 : 1));
    const days = g === 1 ? Math.max(1, Math.floor(INTERVALS[c.box] / 2)) : INTERVALS[c.box];
    c.due = addDays(today, days);
    return c;
  }

  const isDue = (card, today) => !!card && card.due <= today;
  const dueKeys = (progress, today) => Object.keys(progress || {})
    .filter((k) => isDue(progress[k], today))
    .sort((a, b) => progress[a].due.localeCompare(progress[b].due) || progress[a].box - progress[b].box);

  function boxCounts(progress) {
    const out = INTERVALS.map(() => 0);
    for (const c of Object.values(progress || {})) out[Math.min(c.box, out.length - 1)]++;
    return out;
  }

  // ---- Streak ----
  function touchStreak(streak, today) {
    const s = { count: 0, last: null, best: 0, ...(streak || {}) };
    if (s.last === today) return s;
    s.count = s.last && daysBetween(s.last, today) === 1 ? s.count + 1 : 1;
    s.last = today;
    s.best = Math.max(s.best || 0, s.count);
    return s;
  }
  /** Streak as displayed: still alive if the last active day is today or yesterday. */
  const liveStreak = (streak, today) => (streak && streak.last && daysBetween(streak.last, today) <= 1 ? streak.count : 0);

  // ---- Planning ----
  const planDays = (remaining, perday) => (remaining <= 0 ? 0 : Math.ceil(remaining / Math.max(1, perday)));

  function nextNew(words, progress, n, topic) {
    const out = [];
    const pick = (w) => { if (out.length < n && !progress[wkey(w)] && !out.includes(w)) out.push(w); };
    if (topic != null) words.filter((w) => w.topic === topic).forEach(pick);
    words.forEach(pick);
    return out;
  }

  // ---- Randomness ----
  function rng(seed) { // mulberry32
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.codePointAt(0), 16777619); return h >>> 0; }
  function shuffle(arr, r = Math.random) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  // ---- Quiz ----
  /** Word objects: { w, pos, ipa, vi, ex, emo }. Returns one question per word, mixing three types. */
  function makeQuiz(batch, pool, r = Math.random) {
    const types = shuffle(["meaning", "word", "spell", "meaning", "word"], r);
    return batch.map((word, i) => {
      const type = types[i % types.length];
      if (type === "spell") return { type, word, answer: word.w };
      const field = type === "meaning" ? "vi" : "w";

  ];

<script>/* Online leaderboard client: Supabase RPC calls with a timeout, one request per function at a time, and exponential
   backoff after failures. The app is local-first and never waits on this; when the server is down it just shows cached data. */
(function (root) {
  "use strict";

  // ===== CONFIG =====
  const TIMEOUT = 8000;               // abort a request after this
  const SYNC_EVERY = 60 * 1000;       // push my numbers at most this often
  const BOARD_TTL = 60 * 1000;        // reuse the fetched leaderboard this long
  const BACKOFF_MIN = 15 * 1000, BACKOFF_MAX = 15 * 60 * 1000;
  const ERRORS = {
    no_room: "Không tìm thấy mã lớp này", bad_name: "Tên cần 2–20 ký tự, không dùng ký hiệu đặc biệt", bad_pin: "PIN gồm 4–6 chữ số",
    wrong_pin: "Sai PIN. Tên này đã có trong lớp — nếu là bạn, hãy nhập đúng PIN", locked: "Nhập sai PIN quá nhiều lần, thử lại sau 15 phút",
    room_full: "Lớp đã đủ chỗ", name_taken: "Tên này vừa có người dùng, hãy chọn tên khác", no_player: "Tài khoản lớp không còn — hãy tham gia lại",
    offline: "Chưa kết nối được máy chủ, thử lại sau nhé", server: "Máy chủ đang bận, thử lại sau nhé", bad_response: "Máy chủ trả lời lạ — báo người quản lý lớp",
    not_configured: "Chế độ trực tuyến chưa được thiết lập",
  };
  // ==================

  const fail = (code) => Object.assign(new Error(code), { code });

  /** cfg: { url, key }; deps (for tests): { fetch, now, random } */
  function create(cfg, deps = {}) {
    const doFetch = deps.fetch || ((...a) => root.fetch(...a)), now = deps.now || Date.now, random = deps.random || Math.random;
    const configured = !!(cfg && /^https?:\/\//.test(String(cfg.url || "").trim()) && String(cfg.key || "").trim());
    const st = { fails: 0, until: 0, inflight: {} };
    // Accept the Project URL with or without the "/rest/v1/" suffix Supabase shows on its API page.
    const base = configured ? cfg.url.trim().replace(/\/+$/, "").replace(/\/rest\/v1$/, "") : "";
    const jwt = configured && cfg.key.startsWith("eyJ"); // legacy "anon" key; new "sb_publishable_" keys go in apikey only

    function call(fn, args) {
      if (!configured) return Promise.reject(fail("not_configured"));
      if (now() < st.until) return Promise.reject(fail("offline"));
      if (st.inflight[fn]) return st.inflight[fn];
      const p = (async () => {
        const ctl = typeof AbortController === "function" ? new AbortController() : null;
        const timer = setTimeout(() => ctl && ctl.abort(), TIMEOUT);
        try {
          let res;
          try {
            res = await doFetch(`${base}/rest/v1/rpc/${fn}`, {
              method: "POST", body: JSON.stringify(args), signal: ctl ? ctl.signal : undefined,
              headers: { "Content-Type": "application/json", apikey: cfg.key, ...(jwt ? { Authorization: `Bearer ${cfg.key}` } : {}) },
            });
          } catch (e) { throw fail("offline"); }
          if (res.status === 429 || res.status >= 500) throw fail("server");
          const data = await res.json().catch(() => null);
          if (!res.ok || !data || typeof data !== "object") throw fail("bad_response");
          st.fails = 0; st.until = 0;
          return data;
        } catch (e) {
          st.fails++;
          st.until = now() + Math.min(BACKOFF_MAX, BACKOFF_MIN * 2 ** (st.fails - 1)) * (0.8 + 0.4 * random());
          throw e;
        } finally {
          clearTimeout(timer);
          delete st.inflight[fn];
        }
      })();
      st.inflight[fn] = p;
      return p;
    }

    return {
      configured, state: st,
      offline: () => now() < st.until,
      join: (room, name, pin) => call("nhip_join", { p_room: room, p_name: name, p_pin: pin }),
      sync: (token, stats) => call("nhip_sync", { p_token: token, p_stats: stats }),
      board: (token, week) => call("nhip_board", { p_token: token, p_week: week }),
      leave: (token) => call("nhip_leave", { p_token: token }),
    };
  }

  const METRICS = {
    week: { label: "Tuần này", unit: "XP", get: (p) => p.week_xp },
    xp: { label: "Tổng XP", unit: "XP", get: (p) => p.xp },
    streak: { label: "Chuỗi ngày", unit: "ngày", get: (p) => p.streak },
    words: { label: "Từ đã học", unit: "từ", get: (p) => p.words },
    farm: { label: "Nông trại", unit: "cấp", get: (p) => p.farm_lv * 100 + p.beasts },
  };
  /** Sort players by a metric; ties share a rank (1, 2, 2, 4). */
  function rank(players, by) {
    const get = METRICS[by].get;
    const list = players.slice().sort((a, b) => get(b) - get(a) || String(a.name).localeCompare(String(b.name)));
    let prev = null, pos = 0;
    return list.map((p, i) => { if (get(p) !== prev) { pos = i + 1; prev = get(p); } return { ...p, rank: pos, value: get(p) }; });
  }
  const message = (code) => ERRORS[code] || ERRORS.offline;

  const Online = { create, rank, message, METRICS, TIMEOUT, SYNC_EVERY, BOARD_TTL, BACKOFF_MIN, BACKOFF_MAX };
  if (typeof module === "object" && module.exports) module.exports = Online;
  else root.Online = Online;
})(typeof window !== "undefined" ? window : globalThis);
</script>

    };

    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { toast("Không mở được micro"); return; }
    const label = btn.innerHTML, chunks = [], mr = new MediaRecorder(stream);
    mr.ondataavailable = (e) => chunks.push(e.data);

      stream.getTracks().forEach((t) => t.stop());
      rec = null; btn.innerHTML = label; btn.classList.remove("primary");
      const audio = new Audio(URL.createObjectURL(new Blob(chunks, { type: mr.mimeType })));
      audio.play().catch(() => {});
      toast("Đang phát lại giọng của bạn");
    };

          r.onsuccess = () => res((this.db = r.result));
          r.onerror = () => res(null);
        } catch (e) { res(null); }
      });
    },
    tx(mode, fn) {
      return new Promise((res) => {
        if (!this.db) { res(null); return; }
        try {
          const t = this.db.transaction("pics", mode), st = t.objectStore("pics"), out = fn(st);
          t.oncomplete = () => res(out && out.result); t.onerror = () => res(null);
        } catch (e) { res(null); }
      });
    },

      await this.open();
      const [keys, vals] = await Promise.all([this.tx("readonly", (s) => s.getAllKeys()), this.tx("readonly", (s) => s.getAll())]);
      const out = {};
      (keys || []).forEach((k, i) => { const p = cleanPic(vals[i]); if (p) out[k] = p; });
      return out;

    if (v.i >= v.queue.length) {

        <p class="muted">Bạn vừa ôn ${v.done} lượt từ. Hẹn gặp lại ở lượt ôn tiếp theo.</p>
        <div class="row"><button class="btn primary" data-vocab="home">Về Từ vựng</button><button class="btn" data-go="today">Hôm nay</button></div></section>`;
    }
    const w = v.queue[v.i], c = prog()[w.key];
    const nxt = (g) => { const n = C.grade(c, g, today()); return C.daysBetween(today(), n.due); };
    return `<div class="row" style="justify-content:space-between">${back('data-vocab="home"', "Từ vựng")}<span class="chip num">${v.i + 1}/${v.queue.length}</span></div>
      <h1>Ôn tập</h1>
      ${card(w, v.reveal)}
      ${v.reveal ? `<div class="grid g3" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
        ${[["0", "Quên"], ["1", "Khó"], ["2", "Nhớ"], ["3", "Dễ"]].map(([g, l]) =>
          `<button class="btn${g === "2" ? " primary" : ""}" data-grade="${g}">${l} <span class="small" style="opacity:.75">· ${nxt(+g)} ngày</span></button>`).join("")}</div>`
        : `<div><button class="btn primary" data-reveal>Hiện nghĩa</button> <span class="small muted">Hãy nhớ nghĩa trước khi lật thẻ.</span></div>`}`;
  }
  function gradeReview(g) {
    const v = U.vocab, w = v.queue[v.i], p = prog();
    p[w.key] = C.grade(p[w.key], g, today());
    bump("r"); v.done++;
    addXP(XP.review);
    if (g === 0 && !v.again[w.key]) { v.again[w.key] = 1; v.queue.push(w); }
    v.i++; v.reveal = false;
    render();
    if (v.i >= v.queue.length && !v.rewarded) { v.rewarded = true; farmReward("review", "Ôn tập xong"); }
  }
  function vBrowse() {
    const topics = D.levels[S.level];
    return `<div class="row">${back('data-vocab="home"', "Từ vựng")}</div><h1>Tra cứu từ</h1>
      <section class="panel stack">
        <div class="row"><input type="search" id="bq" placeholder="Tìm từ hoặc nghĩa…" value="${esc(U.bq)}" style="flex:1 1 200px" aria-label="Tìm từ">

      </section>`;
  }
  function browseList() {
    const q = C.norm(U.bq), p = prog();
    const all = WORDS[S.level].filter((w) => (U.btopic === "" || String(w.topic) === U.btopic) &&
      (!q || C.norm(w.w).includes(q) || C.norm(w.vi).includes(q)));
    if (!all.length) return `<p class="muted">Không tìm thấy từ nào.</p>`;
    const LIMIT = 80;
    return all.slice(0, LIMIT).map((w) => {
      const c = p[w.key];
      const chip = !c ? `<span class="chip new">Mới</span>` : c.box >= C.MASTER_BOX ? `<span class="chip good">Thuộc</span>` : `<span class="chip warn">Hộp ${c.box}</span>`;
      return `<div class="item"><button class="linkish" data-open="${esc(w.key)}" style="grid-column:span 2">${pic(w, "sm")}<span class="t"><b>${esc(w.w)}</b> <span class="ipa small muted">/${esc(w.ipa)}/</span><br><span class="small muted">${esc(w.vi)}</span></span></button>
        <span style="display:flex;gap:6px;align-items:center">${chip}<button class="btn icon-btn ghost" data-say="${esc(w.w)}" aria-label="Nghe ${esc(w.w)}">${I.speak}</button></span></div>`;
    }).join("") + (all.length > LIMIT ? `<p class="small muted" style="padding-top:10px">Hiện ${LIMIT}/${all.length} từ — gõ để tìm nhanh hơn.</p>` : "");
  }

  // ---------- Modal: word detail + picture editor ----------
  let lastFocus = null;
  function sheet(html, label) {
    const m = $("#modal"), s = $("#sheet");
    if (m.hidden) lastFocus = document.activeElement;
    s.innerHTML = html; s.setAttribute("aria-label", label || "");
    m.hidden = false;
    const f = s.querySelector("button"); if (f) f.focus({ preventScroll: true });
  }
  function closeModal() {
    $("#modal").hidden = true; $("#sheet").innerHTML = ""; draft = null;
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }
  function openWord(key) {
    const w = BYKEY[key]; if (!w) return;
    const c = S.progress[w.lvl][w.key];
    sheet(`<div class="row" style="justify-content:space-between"><h2>${esc(w.w)} <span class="pos">${POS[w.pos] || ""}</span></h2>
        <button class="btn icon-btn ghost" data-close aria-label="Đóng">${I.x}</button></div>
      <div class="row" style="align-items:flex-start;gap:16px">${pic(w, "md")}
        <div class="stack" style="flex:1;min-width:0"><div class="row"><span class="ipa muted">/${esc(w.ipa)}/</span>${sayBtns(w.w)}</div>
          <p class="meaning">${esc(w.vi)}</p>
          <div class="row"><span class="chip">${esc(D.levels[w.lvl][w.topic].vi)}</span>${c ? `<span class="chip warn">Hộp ${c.box} · ôn ${ddmm(c.due)}</span>` : `<span class="chip new">Chưa học</span>`}</div></div></div>
      <p class="example">${hlEx(w)} <button class="btn sm ghost" data-say="${esc(w.ex)}" aria-label="Nghe câu ví dụ">${I.speak}</button></p>

      <div class="row"><button class="btn primary" data-editpic="${esc(w.key)}">${I.edit} Đổi hình</button><button class="btn ghost" data-close>Đóng</button></div>`, w.w);
  }
  let draft = null;
  function openPicEditor(key) {
    const w = BYKEY[key]; if (!w) return;
    const cur = PICS[key] || {};
    draft = { key, emo: cur.emo || w.emo, bg: cur.bg || "", img: cur.img || "", mode: "emoji", pen: PENS[0] };
    renderEditor();
  }
  function renderEditor() {
    const w = BYKEY[draft.key], m = draft.mode;
    const emos = [w.emo, ...EMOJIS.filter((e) => e !== w.emo)];
    const body = m === "emoji"
      ? `<div class="emoji-grid">${emos.map((e) => `<button type="button" data-emo="${e}" aria-label="${e}">${e}</button>`).join("")}</div>
         <p class="label">Màu nền</p><div class="swatches">${SWATCHES.map((c) =>
           `<button type="button" data-bg="${c}" aria-pressed="${draft.bg === c}" style="background:${c || "var(--chip)"}" aria-label="${c || "Mặc định"}"></button>`).join("")}</div>`
      : m === "draw"
      ? `<canvas class="draw" width="320" height="320" aria-label="Khung vẽ"></canvas>
         <div class="row"><div class="swatches">${PENS.map((c) => `<button type="button" data-pen="${c}" aria-pressed="${draft.pen === c}" style="background:${c}" aria-label="Bút ${c}"></button>`).join("")}</div>
         <button type="button" class="btn sm" data-clearcanvas>Xoá hết</button></div>`
      : `<label class="btn" style="justify-self:start">Chọn ảnh từ máy…<input type="file" accept="image/*" id="photo-in" hidden></label>
         <p class="small muted">Ảnh được cắt vuông và thu nhỏ, chỉ lưu trên thiết bị này.</p>`;
    sheet(`<div class="row" style="justify-content:space-between"><h2>Hình cho “${esc(w.w)}”</h2>
        <button class="btn icon-btn ghost" data-close aria-label="Đóng">${I.x}</button></div>
      <div class="row" style="align-items:flex-start"><div id="pv">${picHTML(draft, w.emo, "md")}</div>
        <p class="small muted" style="flex:1 1 160px">Hình tự chọn giúp bạn nhớ từ lâu hơn. Chọn emoji và màu nền, tự vẽ, hoặc dùng ảnh của bạn.</p></div>
      <div class="seg" role="group" aria-label="Kiểu hình">${[["emoji", "Emoji"], ["draw", "Vẽ tay"], ["photo", "Ảnh"]].map(([id, l]) =>
        `<button type="button" data-mode="${id}" aria-pressed="${m === id}">${l}</button>`).join("")}</div>
      ${body}
      <div class="row"><button class="btn primary" data-savepic>Lưu hình</button><button class="btn" data-resetpic>Về hình gốc</button><button class="btn ghost" data-close>Huỷ</button></div>`, `Hình cho ${w.w}`);
    if (m === "draw") setupCanvas();
    const fi = $("#photo-in"); if (fi) fi.addEventListener("change", () => fi.files[0] && loadPhoto(fi.files[0]));
  }
  const updatePv = () => { const pv = $("#pv"); if (pv && draft) pv.innerHTML = picHTML(draft, BYKEY[draft.key].emo, "md"); };
  function setupCanvas() {
    const cv = $("#sheet canvas.draw"), ctx = cv.getContext("2d"), N = cv.width;
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, N, N);
    if (draft.img) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, N, N); im.src = draft.img; }
    ctx.lineWidth = 9; ctx.lineCap = "round"; ctx.lineJoin = "round";
    let last = null;
    const pt = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * N / r.width, (e.clientY - r.top) * N / r.height]; };
    const line = (a, b) => { ctx.strokeStyle = draft.pen; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); };
    cv.addEventListener("pointerdown", (e) => { e.preventDefault(); cv.setPointerCapture(e.pointerId); last = pt(e); line(last, [last[0] + 0.1, last[1]]); });
    cv.addEventListener("pointermove", (e) => { if (!last) return; const p = pt(e); line(last, p); last = p; });
    const end = () => { if (!last) return; last = null; draft.img = cv.toDataURL("image/png"); updatePv(); };
    cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  }
  function loadPhoto(file) {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const N = 320, cv = document.createElement("canvas"); cv.width = cv.height = N;
      const s = Math.min(im.width, im.height);
      cv.getContext("2d").drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, N, N);
      URL.revokeObjectURL(url);
      if (!draft) return;
      draft.img = cv.toDataURL("image/jpeg", 0.85); updatePv();
    };
    im.onerror = () => toast("Không đọc được ảnh này");
    im.src = url;
  }
  async function savePic(reset) {
    const { key } = draft, w = BYKEY[key];
    const p = cleanPic(draft);
    if (reset || (!p.img && !p.bg && p.emo === w.emo)) { delete PICS[key]; await DB.del(key); }
    else { PICS[key] = p; await DB.put(key, p); }
    closeModal(); render();
    toast(reset ? "Đã trả về hình gốc" : "Đã lưu hình" + (DB.db ? "" : " (chỉ trong phiên này)"));
  }

  // ---------- Câu giao tiếp ----------
  function todaySents(track) {
    const t = today();
    if (!S.sentDay || S.sentDay.date !== t) S.sentDay = { date: t };
    if (!S.sentDay[track]) {
      S.sentDay[track] = C.pickSentences(SENTS[track].map((s) => s.key), S.sent, S.sentPerDay);
      save();
    }
    return S.sentDay[track].map((k) => SENTS[track].find((s) => s.key === k)).filter(Boolean);
  }
  function vSent() {
    const track = S.track;
    const head = `<section class="hello"><div><p class="label">${TRACKS[track]} · ${Object.keys(S.sent).filter((k) => k.startsWith(track + ":")).length}/${SENTS[track].length} câu</p><h1>Câu giao tiếp</h1></div>
      <div class="row"><div class="seg" role="group" aria-label="Chủ đề câu">${Object.entries(TRACKS).map(([id, l]) => `<button type="button" data-track="${id}" aria-pressed="${track === id}">${l}</button>`).join("")}</div>
      <div class="seg" role="group" aria-label="Chế độ">${[["today", "Hôm nay"], ["all", "Thư viện"]].map(([id, l]) => `<button type="button" data-sentview="${id}" aria-pressed="${U.sentView === id}">${l}</button>`).join("")}</div></div></section>`;
    if (U.sentView === "all") return head + library(track);
    const list = todaySents(track);
    return head + list.map(sentCard).join("") +
      `<section class="panel row" style="justify-content:space-between"><p class="muted">Muốn luyện thêm? Mỗi lần thêm ${S.sentPerDay} câu mới.</p><button class="btn" data-moresent>Thêm câu</button></section>`;
  }
  function sentCard(s) {
    const learned = !!S.sent[s.key], sc = U.scr[s.key];
    let scr = "";
    if (sc) {
      const full = sc.ans.length === sc.n, ok = full && sc.ans.map((x) => x.t).join(" ") === s.en;
      scr = `<div class="tiles" aria-label="Câu của bạn">${sc.ans.map((x, j) => `<button type="button" class="tile" data-unpick="${j}" data-k="${esc(s.key)}">${esc(x.t)}</button>`).join("")}</div>
        <div class="tiles" aria-label="Các từ">${sc.pool.map((x, j) => `<button type="button" class="tile" data-pick="${j}" data-k="${esc(s.key)}">${esc(x.t)}</button>`).join("")}</div>
        ${full ? (ok ? `<p class="feedback ok">Đúng rồi! 🎉</p>` : `<p class="feedback no">Chưa đúng — bấm vào từ ở trên để gỡ ra và xếp lại.</p>`) : ""}`;
    }
    return `<article class="panel sent">
      <div class="row" style="justify-content:space-between"><span class="chip">${TRACKS[s.track]} · ${esc(s.group)}</span><span class="chip${learned ? " good" : ""}">${learned ? "✓ Đã thuộc" : STAGES[s.stage]}</span></div>
      ${sc && !sc.solved ? "" : `<p class="en">${esc(s.en)}</p>`}
      <p class="vi">${esc(s.vi)}</p>
      ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
      ${scr}
      <div class="row">${sayBtns(s.en)}${speechBtns(s.en)}
        <button type="button" class="btn sm" data-scr="${esc(s.key)}">${sc ? "Xếp lại" : "Xếp câu"}</button>
        ${learned ? "" : `<button type="button" class="btn sm primary" data-learnsent="${esc(s.key)}">Đã thuộc +${XP.sent} XP</button>`}</div>
    </article>`;
  }
  const sentByKey = (k) => { const track = k.slice(0, k.indexOf(":")); return (SENTS[track] || []).find((s) => s.key === k); };
  function library(track) {
    const groups = D.sentences[track].map((g, gi) => ({ g, gi })).filter(({ g }) => g.stage === U.stage);
    return `<section class="panel stack"><div class="seg" role="group" aria-label="Trình độ">${Object.entries(STAGES).map(([id, l]) =>
      `<button type="button" data-stage="${id}" aria-pressed="${U.stage === id}">${l}</button>`).join("")}</div>
      <div>${groups.map(({ g, gi }) => {
        const items = SENTS[track].filter((s) => s.gi === gi), n = items.filter((s) => S.sent[s.key]).length;
        return `<details><summary>${esc(g.vi)} <span class="small muted">· ${esc(g.en)} · ${n}/${items.length}</span></summary><div class="list">${items.map((s) =>
          `<div class="item"><span class="chip${S.sent[s.key] ? " good" : ""}">${S.sent[s.key] ? "✓" : "·"}</span><span class="t"><b>${esc(s.en)}</b><br><span class="small muted">${esc(s.vi)}</span></span>
            <button class="btn icon-btn ghost" data-say="${esc(s.en)}" aria-label="Nghe">${I.speak}</button></div>`).join("")}</div></details>`;
      }).join("")}</div></section>`;
  }
  function startScramble(key) {
    const s = sentByKey(key); if (!s) return;
    const toks = C.tokens(s.en).map((t, i) => ({ t, i }));
    U.scr[key] = { n: toks.length, ans: [], pool: C.scramble(toks), solved: false };
    render();
  }
  function moveTile(key, from, j) {
    const sc = U.scr[key]; if (!sc || sc.solved) return;
    const [x] = sc[from].splice(j, 1);
    (from === "pool" ? sc.ans : sc.pool).push(x);
    if (sc.ans.length === sc.n && sc.ans.map((y) => y.t).join(" ") === sentByKey(key).en) {
      sc.solved = true; addXP(XP.scramble); say(sentByKey(key).en);
    }
    render();
  }

  // ---------- IPA ----------
  function vIpa() {
    const learned = new Set(S.ipa);
    return `<section class="hello"><div><p class="label">44 âm · ${learned.size}/44 đã học</p><h1>Bảng phiên âm IPA</h1></div>
        <p class="small muted">Ví dụ đọc bằng giọng Anh (UK). Từ vựng dùng giọng bạn chọn ở phần Tiến độ.</p></section>
      <section class="panel stack"><h2>Lộ trình gợi ý</h2><div class="path">${D.ipa.path.map((p, i) => {
        const n = p.sounds.filter((s) => learned.has(s)).length;
        return `<button type="button" data-ipastep="${i}"><b>${i + 1}. ${esc(p.vi)}</b><span class="small muted">${n}/${p.sounds.length} âm</span>${bar(n / p.sounds.length)}</button>`;
      }).join("")}</div></section>
      <div class="grid g2" style="align-items:start">
        <section class="panel stack">${D.ipa.groups.map((g) => `<h3>${esc(g.vi)} <span class="small muted">${esc(g.en)}</span></h3>
          <div class="ipa-grid">${SOUNDS.filter((s) => s.type === g.id).map((s) =>
            `<button type="button" class="snd${learned.has(s.s) ? " learned" : ""}" data-sound="${esc(s.s)}" aria-pressed="${U.sound === s.s}"><b class="ipa">${esc(s.s)}</b><span>${esc(s.vi)}</span></button>`).join("")}</div>`).join("")}</section>
        <section class="panel snd-detail" id="snd-detail" style="position:sticky;top:130px">${soundDetail()}</section>
      </div>`;
  }
  function soundDetail() {
    if (!U.sound) return `<p class="label">Chi tiết âm</p><p class="muted">Chọn một âm để xem cách đặt lưỡi – môi, nghe ví dụ và luyện cặp âm tối thiểu.</p>`;
    const s = SOUND[U.sound], learned = S.ipa.includes(s.s), g = D.ipa.groups.find((x) => x.id === s.type);
    return `<div class="row" style="justify-content:space-between"><span class="snd-sym">/${esc(s.s)}/</span><span class="chip">${esc(g.vi)}</span></div>
      <p><b>${esc(s.vi)}</b> — ${esc(s.tip)}</p>
      <p class="label">Ví dụ</p>
      <div class="ex-grid">${s.ex.map(([w, ipa]) => `<div class="ex"><div><b>${esc(w)}</b><br><span class="ipa small muted">/${esc(ipa)}/</span></div>
        <button type="button" class="btn icon-btn ghost" data-sayuk="${esc(w)}" aria-label="Nghe ${esc(w)}">${I.speak}</button></div>`).join("")}</div>
      <div class="row"><button type="button" class="btn" data-sayuk="${esc(s.ex.map((e) => e[0]).join(", "))}">${I.speak} Nghe cả ${s.ex.length} từ</button>
        <button type="button" class="btn${learned ? "" : " primary"}" data-ipalearn="${esc(s.s)}">${learned ? "✓ Đã học" : `Đánh dấu đã học +${XP.ipa} XP`}</button>
        ${s.pairs.length ? `<button type="button" class="btn" data-pairquiz="${esc(s.s)}">Luyện cặp âm</button>` : ""}</div>
      ${U.pair && U.pair.sym === s.s ? pairUI(s) : ""}`;
  }
  function startPair(sym) {
    const s = SOUND[sym], pr = s.pairs[Math.floor(Math.random() * s.pairs.length)];
    const prev = U.pair && U.pair.sym === sym ? U.pair : { right: 0, n: 0 };
    U.pair = { sym, pr, said: Math.random() < 0.5 ? 0 : 1, order: C.shuffle([0, 1]), picked: null, right: prev.right, n: prev.n };
    renderDetail();
    say(pr[U.pair.said], { lang: "en-GB" });
  }
  function pairUI(s) {
    const P = U.pair, done = P.picked != null, ok = done && P.picked === P.said;
    return `<div class="stack" style="border-top:1px dashed var(--rule);padding-top:12px">
      <div class="row" style="justify-content:space-between"><p class="label">Cặp âm tối thiểu</p><span class="chip num">${P.right}/${P.n} đúng</span></div>
      <div class="row"><span>Nghe và chọn từ bạn nghe được:</span><button type="button" class="btn sm" data-pairreplay>${I.speak} Nghe lại</button></div>
      <div class="choices">${P.order.map((j) => {
        const cls = done ? (j === P.said ? " right" : j === P.picked ? " wrong" : "") : "";
        const sym = j === 0 ? s.s : P.pr[2];
        return `<button type="button" class="choice${cls}" data-pairpick="${j}"${done ? " disabled" : ""}><b>${esc(P.pr[j])}</b>${sym ? ` <span class="ipa small muted">/${esc(sym)}/</span>` : ""}</button>`;
      }).join("")}</div>
      ${done ? `<p class="feedback ${ok ? "ok" : "no"}">${ok ? "Chính xác!" : `Chưa đúng — từ vừa đọc là “${esc(P.pr[P.said])}”.`}</p>
        <div><button type="button" class="btn primary" data-pairquiz="${esc(s.s)}">Cặp khác →</button></div>` : ""}</div>`;
  }
  function renderDetail() {
    const d = $("#snd-detail");
    if (!d) { render(); return; }
    d.innerHTML = soundDetail();
    document.querySelectorAll(".snd").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.sound === U.sound)));
  }
  function pickSound(sym) {
    U.sound = sym; U.pair = null; renderDetail();
    if (matchMedia("(max-width: 900px)").matches) $("#snd-detail").scrollIntoView({ block: "start", behavior: "smooth" });
  }

  // ---------- Nông trại ----------
  const pad2 = (n) => String(n).padStart(2, "0");

  // ---- Field: 30 slots (owned plots, the next plot to buy, plots locked until a farm level) + the farmer who tends them ----

  const farmerBot = () => `<div class="farmer-bot" aria-hidden="true"><div class="fb-flip"><svg viewBox="-30 -54 64 104" width="54" height="88">

        <g class="drops" fill="#4FA8E8"><circle cx="24" cy="2" r="1.8"/><circle cx="26" cy="7" r="1.6"/><circle cx="23" cy="11" r="1.5"/></g></g></g></g>
  </svg></div></div>`;
  let farmerTimer = null, farmerPos = null;
  /** The farmer runs from crop to crop and waters it; positions survive re-renders so he never teleports. */
  function startFarmer() {
    clearInterval(farmerTimer);
    const bot = $(".farmer-bot"), land = $(".land");
    if (!bot || !land) return;
    const place = (x, y, animate) => {
      if (!animate) bot.style.transition = "none";
      bot.style.transform = `translate(${x}px, ${y}px)`;
      if (!animate) { void bot.offsetWidth; bot.style.transition = ""; }

    };
    place(farmerPos ? farmerPos.x : 8, farmerPos ? farmerPos.y : 8, false);
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const step = () => {
      if (!document.contains(bot)) { clearInterval(farmerTimer); return; }
      const tiles = [...land.querySelectorAll(".plot[data-plotidx], .atile[data-animalidx]")], busy = tiles.filter((t) => !t.classList.contains("empty"));
      const pool = busy.length ? busy : tiles;
      if (!pool.length) return;
      const t = pool[Math.floor(Math.random() * pool.length)];
      const x = t.offsetLeft + t.offsetWidth / 2 - 27, y = t.offsetTop + t.offsetHeight - 70;
      bot.classList.toggle("left", farmerPos && x < farmerPos.x);
      bot.classList.remove("work"); bot.classList.add("run");
      place(x, y, true);
      clearTimeout(bot._t);
      bot._t = setTimeout(() => { bot.classList.remove("run"); bot.classList.add("work"); }, 1300);
    };
    setTimeout(step, 300);
    farmerTimer = setInterval(step, 3600);
  }

  // ---- Traffic: vehicles drive laps on the dirt road around the farm (top-down drawings facing +x, centred on 0,0) ----
  const VEHICLE_SVG = {
    truck: `<svg width="34" height="19" viewBox="-17 -9.5 34 19"><rect class="wheel" x="-13" y="-9.5" width="6" height="3" rx="1"/><rect class="wheel" x="-13" y="6.5" width="6" height="3" rx="1"/>
      <rect class="wheel" x="7" y="-9.5" width="6" height="3" rx="1"/><rect class="wheel" x="7" y="6.5" width="6" height="3" rx="1"/>
      <rect x="-16" y="-7.5" width="21" height="15" rx="2" fill="#C98A4B"/><rect x="-14" y="-5.5" width="7.5" height="5" rx="1" fill="#F2C14E"/><rect x="-14" y=".5" width="7.5" height="5" rx="1" fill="#7ED957"/>
      <rect x="-5.5" y="-5.5" width="8" height="11" rx="1" fill="#E5533D"/><rect x="6" y="-7.5" width="10" height="15" rx="3.5" fill="#E5533D"/><rect x="11" y="-6" width="3" height="12" rx="1" fill="#BFE6FF"/></svg>`,
    tractor: `<svg width="30" height="21" viewBox="-15 -10.5 30 21"><rect class="wheel" x="-13" y="-10.5" width="10" height="4.5" rx="1.5"/><rect class="wheel" x="-13" y="6" width="10" height="4.5" rx="1.5"/>
      <rect class="wheel" x="6" y="-8.5" width="6" height="3" rx="1"/><rect class="wheel" x="6" y="5.5" width="6" height="3" rx="1"/>
      <rect x="-12" y="-6.5" width="25" height="13" rx="3" fill="#3FA34D"/><rect x="2" y="-4.5" width="11" height="9" rx="2.5" fill="#2E7D32"/><circle cx="9" cy="-2.5" r="1.3" fill="#FFE66D"/><circle cx="9" cy="2.5" r="1.3" fill="#FFE66D"/>
      <rect x="-10" y="-5" width="9" height="10" rx="2" fill="#FFD84D"/><rect x="-8.5" y="-3.5" width="6" height="7" rx="1" fill="#BFE6FF"/></svg>`,
    van: `<svg width="30" height="17" viewBox="-15 -8.5 30 17"><rect class="wheel" x="-11" y="-8.5" width="5" height="2.6" rx="1"/><rect class="wheel" x="-11" y="5.9" width="5" height="2.6" rx="1"/>
      <rect class="wheel" x="5" y="-8.5" width="5" height="2.6" rx="1"/><rect class="wheel" x="5" y="5.9" width="5" height="2.6" rx="1"/>
      <rect x="-14" y="-6.8" width="28" height="13.6" rx="4" fill="#4FA8E8"/><rect x="-12" y="-4.8" width="16" height="9.6" rx="2" fill="#fff"/><circle cx="-4" cy="0" r="2.6" fill="#4FA8E8"/>
      <rect x="7" y="-5.5" width="3.5" height="11" rx="1" fill="#BFE6FF"/></svg>`,
  };
  // lane: distance in from the land edge; dir 1 = clockwise (outer lane), -1 = counter-clockwise (inner lane); speed in px/s
  const TRAFFIC = [{ kind: "truck", lane: "out", dir: 1, speed: 70, d: 0 }, { kind: "tractor", lane: "in", dir: -1, speed: 42, d: 0.45 }, { kind: "van", lane: "out", dir: 1, speed: 70, d: 0.55 }];
  /** Point and heading (degrees) at distance d clockwise along a rounded rectangle; starts where the top edge leaves the top-left corner. */
  function ringPoint(w, h, inset, r, d) {
    const a = Math.max(0, w - 2 * inset - 2 * r), b = Math.max(0, h - 2 * inset - 2 * r), arc = (Math.PI * r) / 2;
    const L = inset, T = inset, R = w - inset, B = h - inset;
    const segs = [[a, (t) => [L + r + t, T, 0]], [arc, (t) => corner(R - r, T + r, -90, t)], [b, (t) => [R, T + r + t, 90]], [arc, (t) => corner(R - r, B - r, 0, t)],
      [a, (t) => [R - r - t, B, 180]], [arc, (t) => corner(L + r, B - r, 90, t)], [b, (t) => [L, B - r - t, 270]], [arc, (t) => corner(L + r, T + r, 180, t)]];
    function corner(cx, cy, from, t) { const th = from + (t / arc) * 90, rad = (th * Math.PI) / 180; return [cx + r * Math.cos(rad), cy + r * Math.sin(rad), th + 90]; }
    const P = 2 * a + 2 * b + 4 * arc;
    let x = ((d % P) + P) % P;
    for (const [len, at] of segs) { if (x <= len) return at(x); x -= len; }
    return segs[0][1](0);
  }
  let trafficRaf = 0;
  /** Vehicles keep their lap position (a fraction of the lap) across re-renders, so they never jump. */
  function startTraffic() {
    cancelAnimationFrame(trafficRaf);
    const land = $(".land"), ring = $(".road-ring");
    if (!land || !ring) return;
    const cars = TRAFFIC.map((v, k) => ({ v, el: land.querySelector(`[data-veh="${k}"]`) })).filter((c) => c.el);
    let w = 0, h = 0, last = 0;
    const measure = () => {
      const cs = getComputedStyle(land), rw = parseFloat(cs.getPropertyValue("--rw")) || 30, ri = parseFloat(cs.getPropertyValue("--ri")) || 8;
      const rad = parseFloat(getComputedStyle(ring).borderTopLeftRadius) || 30;
      w = land.clientWidth; h = land.clientHeight;
      for (const c of cars) {
        c.inset = ri + rw * (c.v.lane === "out" ? 0.27 : 0.73);
        c.r = Math.max(4, rad - (c.inset - ri));
        c.len = 2 * Math.max(0, w - 2 * c.inset - 2 * c.r) + 2 * Math.max(0, h - 2 * c.inset - 2 * c.r) + 2 * Math.PI * c.r;
        c.hw = c.el.offsetWidth / 2; c.hh = c.el.offsetHeight / 2;
      }
    };
    const draw = () => {
      for (const c of cars) {
        let [x, y, hd] = ringPoint(w, h, c.inset, c.r, c.v.d * c.len * c.v.dir);
        if (c.v.dir < 0) hd += 180;
        c.el.style.transform = `translate(${(x - c.hw).toFixed(1)}px, ${(y - c.hh).toFixed(1)}px) rotate(${hd.toFixed(1)}deg)`;
      }
    };
    measure(); draw();
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
