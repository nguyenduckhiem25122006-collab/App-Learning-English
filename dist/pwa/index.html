, -al, -ic.","Một số từ đuôi -ly là tính từ: costly, timely, friendly, likely; daily, weekly vừa là adj vừa là adv.","Mẹo Part 5: xác định vị trí chỗ trống trước khi dịch nghĩa — nhiều câu giải được trong vài giây."],"examples":[["The proposal received strong support from management.","Đề xuất nhận được sự ủng hộ mạnh mẽ từ ban quản lý."],["Please read the instructions carefully.","Vui lòng đọc kỹ hướng dẫn."],["Sales remained stable during the third quarter.","Doanh số vẫn ổn định trong quý ba."],["The new software is extremely reliable.","Phần mềm mới cực kỳ đáng tin cậy."]],"memo":"Trước N là adj, trước adj là adv, sau the là N — nhìn vị trí trước khi dịch.","quiz":[{"q":"Ms. Tanaka gave a very ____ presentation on the new marketing strategy.","opts":["inform","information","informative","informatively"],"a":2,"why":"Sau trạng từ very và trước danh từ presentation cần tính từ → informative."},{"q":"All employees must complete the safety training ____ before using the equipment.","opts":["success","successful","succeed","successfully"],"a":3,"why":"Câu đã đủ thành phần (complete + tân ngữ), chỗ trống bổ nghĩa cho động từ → trạng từ successfully."},{"q":"The ____ of the new branch office is scheduled for next spring.","opts":["open","opening","opened","opens"],"a":1,"why":"Sau the và trước of cần danh từ → opening (lễ khai trương)."},{"q":"Our customer service team responds ____ to all inquiries.","opts":["promptly","prompt","promptness","prompted"],"a":0,"why":"Bổ nghĩa cho động từ responds → trạng từ promptly."}]},{"id":"gt-02","lvl":"toeic","chap":"Thì & thể","title":"Thì động từ & dấu hiệu thời gian (Tenses)","sum":"Chọn thì đúng dựa vào trạng từ, mốc thời gian và mệnh đề đi kèm trong câu.","forms":["Hiện tại hoàn thành: has/have + V3 (since, for, so far, recently, over the past …)","Quá khứ đơn: V2 (yesterday, last …, … ago, in 2023)","Tương lai đơn: will + V (next …, tomorrow, soon)","Quá khứ hoàn thành: had + V3 (by the time + quá khứ đơn)","Tương lai hoàn thành: will have + V3 (by + mốc tương lai)"],"points":["Câu hỏi thì trong TOEIC thường có trạng từ thời gian: tìm dấu hiệu trước khi chọn đáp án.","since + mốc, for + khoảng thời gian, so far, over the past … → hiện tại hoàn thành.","last …, … ago, yesterday, in + năm đã qua → quá khứ đơn; không dùng hiện tại hoàn thành.","By the time + quá khứ đơn → mệnh đề chính dùng quá khứ hoàn thành; by + mốc tương lai → will have V3.","Mệnh đề thời gian/điều kiện (when, after, before, as soon as, once, if) dùng hiện tại thay cho will.","Hiện tại đơn diễn tả lịch trình cố định: The train departs at 9 A.M."],"examples":[["Revenue has increased steadily since January.","Doanh thu đã tăng đều kể từ tháng Một."],["The board approved the budget last week.","Hội đồng quản trị đã duyệt ngân sách vào tuần trước."],["By next June, we will have opened three stores.","Đến tháng Sáu năm sau, chúng tôi sẽ mở xong ba cửa hàng."],["Please call me as soon as the shipment arrives.","Vui lòng gọi cho tôi ngay khi lô hàng đến."]],"memo":"Since/for → have V3; ago/last → V2; sau when/if/as soon as → không dùng will.","quiz":[{"q":"Mr. Lee ____ for the company for over ten years.","opts":["works","has worked","will work","is working"],"a":1,"why":"For over ten years (kéo dài từ quá khứ đến nay) → hiện tại hoàn thành has worked."},{"q":"The quarterly report ____ to all shareholders two days ago.","opts":["sends","has been sent","was sent","will be sent"],"a":2,"why":"Two days ago → quá khứ đơn; báo cáo được gửi → bị động was sent."},{"q":"Once the contract ____ signed, the project will begin.","opts":["is","will be","was","has"],"a":0,"why":"Mệnh đề thời gian với once nói về tương lai dùng hiện tại, không dùng will → is signed."},{"q":"By the time the manager arrived, the meeting ____.","opts":["already ends","will end","is ending","had already ended"],"a":3,"why":"By the time + quá khứ đơn (arrived) → hành động xảy ra trước dùng quá khứ hoàn thành."}]},{"id":"gt-03","lvl":"toeic","chap":"Động từ","title":"Hòa hợp chủ ngữ – động từ (Subject–verb agreement)","sum":"Động từ phải chia theo chủ ngữ chính về số ít/số nhiều, bỏ qua các cụm từ chen giữa.","forms":["N số ít / N không đếm được + V(s/es) / is / was / has","N số nhiều + V nguyên mẫu / are / were / have","The number of + N số nhiều + V số ít","A number of + N số nhiều + V số nhiều","Each / Every + N số ít + V số ít"],"points":["Xác định chủ ngữ thật, bỏ qua cụm giới từ chen giữa: The list of applicants is …","Each, every, either, neither, everyone, someone + động từ số ít.","The number of + N → V số ít; a number of + N (= nhiều) → V số nhiều.","Danh từ không đếm được (information, equipment, furniture, luggage) dùng V số ít.","Trong mệnh đề quan hệ, động từ chia theo danh từ được bổ nghĩa: employees who are …","Đề TOEIC hay đặt danh từ gây nhiễu sát chỗ trống; luôn tìm chủ ngữ chính."],"examples":[["The cost of the repairs is higher than expected.","Chi phí sửa chữa cao hơn dự kiến."],["Each employee receives a parking permit.","Mỗi nhân viên nhận một thẻ đỗ xe."],["A number of clients have requested refunds.","Một số khách hàng đã yêu cầu hoàn tiền."],["The office equipment needs to be replaced.","Thiết bị văn phòng cần được thay thế."]],"memo":"Gạch bỏ cụm 'of …' và phần chen giữa — chủ ngữ thật quyết định động từ.","quiz":[{"q":"The results of the customer survey ____ posted on the company website.","opts":["has been","was","is","have been"],"a":3,"why":"Chủ ngữ chính là The results (số nhiều), không phải survey → have been posted."},{"q":"Every applicant ____ required to submit two letters of reference.","opts":["are","is","were","have"],"a":1,"why":"Every + danh từ số ít → động từ số ít is."},{"q":"The number of online orders ____ grown significantly this year.","opts":["has","have","are","were"],"a":0,"why":"The number of + N → chủ ngữ số ít; this year + grown → has grown."},{"q":"The new office furniture ____ expected to arrive on Monday.","opts":["are","have","is","being"],"a":2,"why":"Furniture là danh từ không đếm được → động từ số ít is."}]},{"id":"gt-04","lvl":"toeic","chap":"Thì & thể","title":"Câu bị động (Passive voice)","sum":"Dùng khi muốn nhấn mạnh đối tượng chịu tác động của hành động hơn là người thực hiện.","forms":["S + be (chia thì) + V3/V-ed (+ by O)","Hiện tại hoàn thành: has/have been + V3","Động từ khuyết thiếu: can/must/should/will + be + V3","Tiếp diễn: am/is/are/was/were being + V3"],"points":["Dùng bị động khi đối tượng chịu tác động quan trọng hơn người làm: The order was shipped.","Dấu hiệu: sau chỗ trống không có tân ngữ, hoặc có by + tác nhân → thường là bị động.","Nội động từ (arrive, occur, rise, happen, remain) không có dạng bị động.","Cụm hay gặp: be required to, be expected to, be scheduled for, be located in, be pleased to.","Động từ có hai tân ngữ có thể bị động mà vẫn còn tân ngữ: Staff were given new badges.","Bẫy: be + V-ing (chủ động tiếp diễn) và be + V3 (bị động) — xét xem ai làm hành động."],"examples":[["The conference will be held in Singapore.","Hội nghị sẽ được tổ chức tại Singapore."],["All invoices must be approved by the manager.","Mọi hóa đơn phải được quản lý phê duyệt."],["The building is being renovated this month.","Tòa nhà đang được cải tạo trong tháng này."],["Our products have been sold in 30 countries.","Sản phẩm của chúng tôi đã được bán ở 30 quốc gia."]],"memo":"Sau chỗ trống là giới từ hoặc dấu chấm, không có tân ngữ → nghĩ ngay đến be + V3.","quiz":[{"q":"The new employee handbook ____ to all staff next week.","opts":["distributes","will distribute","is distributing","will be distributed"],"a":3,"why":"Sổ tay được phát (không tự phát), không có tân ngữ, next week → bị động tương lai will be distributed."},{"q":"The annual sales meeting has ____ until further notice.","opts":["been postponed","postponed","been postponing","postpone"],"a":0,"why":"Cuộc họp bị hoãn, sau chỗ trống không có tân ngữ → has been postponed."},{"q":"The shipment ____ by the supplier yesterday afternoon.","opts":["delivered","was delivered","was delivering","has been delivered"],"a":1,"why":"Có by the supplier → bị động; yesterday → quá khứ đơn was delivered."},{"q":"Visitors are ____ to sign in at the front desk.","opts":["requiring","require","required","requirement"],"a":2,"why":"Cấu trúc bị động be required to V (được yêu cầu làm gì)."}]},{"id":"gt-05","lvl":"toeic","chap":"Động từ","title":"Danh động từ & động từ nguyên mẫu (Gerund vs to-infinitive)","sum":"Chọn V-ing hay to V tùy vào động từ, giới từ hoặc danh từ đứng trước chỗ trống.","forms":["V + V-ing: avoid, consider, delay, finish, mind, postpone, recommend, suggest","V + to V: agree, decide, plan, hope, offer, refuse, expect, fail","V + O + to V: ask, allow, encourage, require, advise, remind","Giới từ + V-ing: interested in applying, before signing","'to' là giới từ: look forward to, be committed to, be dedicated to + V-ing"],"points":["Sau giới từ (in, on, for, by, without, before, after) luôn dùng V-ing: before signing the contract.","Một số cụm có 'to' là giới từ nên theo sau là V-ing: look forward to hearing from you.","To V chỉ mục đích (để): We hired a consultant to improve efficiency; in order to = so as to.","Danh từ + to V: the decision to expand, an opportunity to work, the ability to manage.","stop/remember/forget + V-ing (việc đã làm) khác + to V (việc cần/sẽ làm).","Bẫy: allow/permit + O + to V, nhưng allow + V-ing khi không có tân ngữ."],"examples":[["We are considering opening a branch in Osaka.","Chúng tôi đang cân nhắc mở chi nhánh ở Osaka."],["The company plans to hire 50 new staff.","Công ty dự định tuyển 50 nhân viên mới."],["I look forward to working with you.","Tôi mong được làm việc cùng anh/chị."],["Managers encourage employees to share ideas.","Các quản lý khuyến khích nhân viên chia sẻ ý tưởng."]],"memo":"Sau giới từ → V-ing; nhớ: look forward to / be committed to cũng là giới từ.","quiz":[{"q":"The marketing director suggested ____ the product launch until May.","opts":["delay","to delay","delaying","delayed"],"a":2,"why":"Suggest + V-ing → suggested delaying."},{"q":"Ms. Kim has agreed ____ the training session on Friday.","opts":["lead","to lead","leading","led"],"a":1,"why":"Agree + to V → agreed to lead."},{"q":"We look forward to ____ your order.","opts":["receive","received","receipt","receiving"],"a":3,"why":"Look forward to: to là giới từ → theo sau là V-ing receiving (có tân ngữ your order)."},{"q":"Employees are encouraged ____ public transportation to reduce costs.","opts":["to use","using","use","used"],"a":0,"why":"Encourage sb to V → bị động: be encouraged to V → to use."}]},{"id":"gt-06","lvl":"toeic","chap":"Mệnh đề","title":"Phân từ: tính từ V-ing / V-ed & mệnh đề rút gọn (Participles)","sum":"Dùng V-ing (chủ động) và V3/V-ed (bị động) làm tính từ hoặc để rút gọn mệnh đề quan hệ, mệnh đề trạng ngữ.","forms":["V-ing (tính từ): mang nghĩa chủ động / gây cảm xúc — an exciting offer","V-ed (tính từ): mang nghĩa bị động / chịu cảm xúc — a revised schedule, satisfied clients","N + V-ing … (= N + who/which + V chủ động)","N + V3 … (= N + who/which + be + V3)","Before / After / When / While + V-ing; as requested, once approved, unless otherwise stated"],"points":["V-ing mang nghĩa chủ động/gây cảm xúc; V-ed mang nghĩa bị động/cảm nhận: a confusing memo, confused clients.","Rút gọn mệnh đề quan hệ chủ động bằng V-ing: Employees wishing to attend should register.","Rút gọn mệnh đề quan hệ bị động bằng V3: The documents attached to this e-mail are confidential.","Cụm hay gặp: as requested, as discussed, as mentioned, unless otherwise noted, when completed.","Xét danh từ có tự thực hiện hành động không: có → V-ing; bị tác động → V3.","Cụm cố định: existing customers, remaining items, experienced staff, detailed report, limited budget."],"examples":[["Customers placing orders online receive a discount.","Khách hàng đặt hàng trực tuyến được giảm giá."],["The report submitted yesterday contained errors.","Bản báo cáo nộp hôm qua có lỗi."],["As requested, I have attached the invoice.","Theo yêu cầu, tôi đã đính kèm hóa đơn."],["The sales results were disappointing.","Kết quả bán hàng thật đáng thất vọng."],["Before leaving, please turn off the lights.","Trước khi rời đi, vui lòng tắt đèn."]],"memo":"Danh từ tự làm → V-ing; danh từ bị làm → V3. Người cảm thấy → -ed, vật gây cảm xúc → -ing.","quiz":[{"q":"Passengers ____ to Tokyo should proceed to Gate 12.","opts":["travel","traveling","traveled","travels"],"a":1,"why":"Câu đã có động từ chính should proceed; hành khách tự đi → rút gọn chủ động traveling."},{"q":"Please review the ____ contract and sign it by Friday.","opts":["revise","revising","revised","revision"],"a":2,"why":"Hợp đồng được chỉnh sửa (bị động) → tính từ phân từ revised."},{"q":"The board members were ____ with the quarterly results.","opts":["satisfied","satisfying","satisfaction","satisfy"],"a":0,"why":"Người cảm thấy hài lòng → be satisfied with."},{"q":"Unless otherwise ____, all prices include tax.","opts":["stating","state","states","stated"],"a":3,"why":"Cụm cố định unless otherwise stated (trừ khi có ghi chú khác) — giá bị nêu → V3."}]},{"id":"gt-07","lvl":"toeic","chap":"Mệnh đề","title":"Mệnh đề quan hệ (Relative clauses: who, which, that, whose, whom)","sum":"Dùng đại từ quan hệ để bổ sung thông tin cho danh từ đứng trước, nối hai câu thành một.","forms":["N (người) + who + V / whom + S + V","N (vật) + which + V / which + S + V","N + that + … (không dùng sau dấu phẩy và sau giới từ)","N + whose + N + V (sở hữu)","Giới từ + whom / which: to whom, in which"],"points":["who thay cho người làm chủ ngữ; whom làm tân ngữ (thường sau giới từ: to whom, with whom).","which thay cho vật; that thay cho cả người và vật trong mệnh đề xác định.","whose + danh từ chỉ sở hữu (của người/vật đó): a client whose contract expired.","Sau dấu phẩy và sau giới từ không dùng that: , which … / in which … ✓; , that … ✗.","Nếu sau chỗ trống là danh từ không có mạo từ rồi đến động từ → thường chọn whose.","Phân biệt với what (= the thing that): trước what không có danh từ."],"examples":[["The candidate who was interviewed today has strong skills.","Ứng viên được phỏng vấn hôm nay có kỹ năng tốt."],["The printer which we bought last year is broken.","Chiếc máy in chúng tôi mua năm ngoái đã hỏng."],["We met a supplier whose prices are very competitive.","Chúng tôi đã gặp một nhà cung cấp có giá rất cạnh tranh."],["The person to whom you sent the file is on leave.","Người mà bạn gửi tập tin đang nghỉ phép."]],"memo":"Người → who/whom, vật → which, sở hữu → whose; sau dấu phẩy hoặc giới từ không dùng that.","quiz":[{"q":"Employees ____ want to join the fitness program should contact Ms. Ruiz.","opts":["which","who","whose","whom"],"a":1,"why":"Thay cho người (Employees), làm chủ ngữ của want → who."},{"q":"Galaxy Corp., ____ headquarters are in Seoul, has opened an office in Hanoi.","opts":["which","who","whose","that"],"a":2,"why":"Sau chỗ trống là danh từ headquarters (trụ sở của công ty) → sở hữu whose."},{"q":"The new software, ____ was installed last week, has improved productivity.","opts":["which","that","what","who"],"a":0,"why":"Thay cho vật, đứng sau dấu phẩy (không dùng that) → which."},{"q":"Mr. Patel is the consultant with ____ we worked on the merger.","opts":["who","that","which","whom"],"a":3,"why":"Sau giới từ with, thay cho người → whom."}]},{"id":"gt-08","lvl":"toeic","chap":"Mệnh đề","title":"Câu điều kiện (Conditionals; unless, provided that)","sum":"Diễn tả điều kiện và kết quả: có thật, có thể xảy ra, hoặc không có thật ở hiện tại/quá khứ.","forms":["Loại 0: If + hiện tại đơn, hiện tại đơn","Loại 1: If + hiện tại đơn, will/can/may + V","Loại 2: If + quá khứ đơn (were), would/could + V","Loại 3: If + had + V3, would/could have + V3","Đảo ngữ: Should + S + V, … / Were + S + to V, … / Had + S + V3, …"],"points":["Loại 0: sự thật, quy định chung; loại 1: điều có thể xảy ra ở hiện tại/tương lai.","Loại 2: điều không có thật ở hiện tại; loại 3: điều không có thật trong quá khứ.","unless = if … not: Unless you register, you cannot attend (không thêm not sau unless).","provided (that), providing, as long as, on condition that = miễn là, với điều kiện là.","Đảo ngữ trang trọng hay gặp trong thư: Should you have any questions, please contact us.","Mệnh đề if loại 1 không dùng will: If the price rises, … (không nói If the price will rise)."],"examples":[["If you order today, you will receive free shipping.","Nếu đặt hàng hôm nay, bạn sẽ được miễn phí vận chuyển."],["If we had more staff, we would finish sooner.","Nếu có thêm nhân viên, chúng tôi sẽ xong sớm hơn."],["Should you need assistance, please call extension 205.","Nếu cần hỗ trợ, vui lòng gọi số máy lẻ 205."],["You can work from home provided that you meet deadlines.","Bạn có thể làm việc tại nhà miễn là đúng hạn."]],"memo":"Should đầu câu = If; unless = if not; had V3 → would have V3.","quiz":[{"q":"If the shipment ____ late, we will notify you immediately.","opts":["arrives","will arrive","arrived","arriving"],"a":0,"why":"Câu điều kiện loại 1: mệnh đề if dùng hiện tại đơn → arrives."},{"q":"____ you have any questions about your bill, please contact our support team.","opts":["Unless","Should","Had","Would"],"a":1,"why":"Đảo ngữ điều kiện loại 1: Should + S + V = If + S + V."},{"q":"If Ms. Ito had checked the figures, she ____ the error.","opts":["would notice","will notice","would have noticed","had noticed"],"a":2,"why":"Loại 3 (If + had V3) → mệnh đề chính would have + V3."},{"q":"Visitors may use the lounge ____ they show a valid pass.","opts":["unless","despite","otherwise","provided that"],"a":3,"why":"Nghĩa: miễn là xuất trình thẻ hợp lệ → provided that + mệnh đề."}]},{"id":"gt-09","lvl":"toeic","chap":"So sánh","title":"So sánh hơn & so sánh nhất (Comparatives & superlatives)","sum":"So sánh hai đối tượng (hơn, bằng) hoặc từ ba đối tượng trở lên (nhất) bằng tính từ và trạng từ.","forms":["So sánh hơn: adj-er / more + adj/adv + than","So sánh nhất: the + adj-est / the most + adj (+ in/of …)","So sánh bằng: as + adj/adv + as","Nhấn mạnh: much / far / even / significantly + so sánh hơn","The + so sánh hơn …, the + so sánh hơn …"],"points":["Dấu hiệu than → so sánh hơn; the … in/of/ever, one of the → so sánh nhất.","Nhấn mạnh so sánh hơn dùng much, far, even, a lot, considerably (không dùng very).","Bất quy tắc: good/well → better → best; bad → worse → worst; little → less → least.","Trạng từ cũng có so sánh: more efficiently than, the most carefully.","one of the + so sánh nhất + danh từ số nhiều: one of the largest firms.","Bẫy: more + -er (more cheaper ✗); giữa as … as dùng dạng nguyên."],"examples":[["This model is lighter than the previous one.","Mẫu này nhẹ hơn mẫu trước."],["Our new plan is far more affordable.","Gói dịch vụ mới của chúng tôi có giá phải chăng hơn nhiều."],["It was the most successful campaign in our history.","Đó là chiến dịch thành công nhất trong lịch sử công ty."],["The sooner we finish, the better.","Càng xong sớm càng tốt."]],"memo":"Có than → hơn; có the … of/in → nhất; trước so sánh hơn dùng much/far, không dùng very.","quiz":[{"q":"The new assembly line is ____ more efficient than the old one.","opts":["very","much","most","so"],"a":1,"why":"Nhấn mạnh so sánh hơn (more efficient than) dùng much, không dùng very."},{"q":"Westfield Hotel offers the ____ rates in the downtown area.","opts":["lower","low","lowest","more low"],"a":2,"why":"The … in the downtown area → so sánh nhất the lowest."},{"q":"This quarter's profits were ____ than we had expected.","opts":["higher","highest","high","the highest"],"a":0,"why":"Có than → so sánh hơn higher."},{"q":"Ms. Chen is one of the most ____ managers in the company.","opts":["experience","experiencing","experiences","experienced"],"a":3,"why":"The most + tính từ trước danh từ managers → experienced (có kinh nghiệm)."}]},{"id":"gt-10","lvl":"toeic","chap":"Liên từ & giới từ","title":"Liên từ vs giới từ (although/despite, because/because of, while/during)","sum":"Liên từ đi với mệnh đề (S + V), giới từ đi với danh từ hoặc V-ing — dạng bẫy kinh điển của Part 5.","forms":["Liên từ + S + V: although, even though, because, since, while, when","Giới từ + N / V-ing: despite, in spite of, because of, due to, during","Trạng từ liên kết: however, therefore, moreover + dấu phẩy (đầu câu)"],"points":["although/even though/though + mệnh đề; despite/in spite of + danh từ/V-ing (nhượng bộ).","because/since/as + mệnh đề; because of/due to/owing to + danh từ (nguyên nhân).","while + mệnh đề (hoặc V-ing); during + danh từ chỉ khoảng thời gian: during the meeting.","however, therefore, moreover là trạng từ liên kết, không dùng để nối hai mệnh đề bằng dấu phẩy.","Mẹo: sau chỗ trống có động từ chia → liên từ; chỉ có cụm danh từ → giới từ.","despite the fact that + mệnh đề = although + mệnh đề."],"examples":[["Although sales fell, profits increased.","Mặc dù doanh số giảm, lợi nhuận vẫn tăng."],["Despite the rain, the event was a success.","Bất chấp trời mưa, sự kiện vẫn thành công."],["The flight was delayed due to bad weather.","Chuyến bay bị hoãn do thời tiết xấu."],["Please silence your phone during the presentation.","Vui lòng tắt chuông điện thoại trong lúc thuyết trình."]],"memo":"Sau chỗ trống có S + V → liên từ; chỉ có danh từ → giới từ.","quiz":[{"q":"____ the high cost, the board approved the renovation plan.","opts":["Although","Despite","Because","However"],"a":1,"why":"Sau chỗ trống là cụm danh từ (the high cost), nghĩa nhượng bộ → giới từ Despite."},{"q":"The store will be closed on Monday ____ the public holiday.","opts":["because","although","because of","while"],"a":2,"why":"Sau chỗ trống là cụm danh từ, nghĩa nguyên nhân → because of."},{"q":"Please do not use your mobile phone ____ the flight.","opts":["during","while","when","since"],"a":0,"why":"Trước danh từ chỉ khoảng thời gian (the flight) → giới từ during."},{"q":"____ the project was finished on time, it went over budget.","opts":["Despite","In spite of","Due to","Although"],"a":3,"why":"Sau chỗ trống là mệnh đề (the project was finished), nghĩa trái ngược → liên từ Although."}]},{"id":"gt-11","lvl":"toeic","chap":"Liên từ & giới từ","title":"Liên từ tương quan (Correlative conjunctions)","sum":"Các cặp liên từ đi đôi để nối hai thành phần cùng loại: both … and, either … or, neither … nor, not only … but also.","forms":["both A and B (+ V số nhiều)","either A or B / neither A nor B (V chia theo B)","not only A but (also) B (V chia theo B)","whether A or B","A as well as B (V chia theo A)"],"points":["Cặp liên từ phải đi đúng đôi: both–and, either–or, neither–nor, not only–but also, whether–or.","both A and B làm chủ ngữ → động từ số nhiều.","either … or, neither … nor, not only … but also: động từ chia theo chủ ngữ gần nhất (B).","A và B phải cùng loại từ/cấu trúc (song song): both fast and reliable.","neither … nor đã mang nghĩa phủ định, không thêm not vào câu.","Mẹo: thấy and → both; thấy or → either; thấy nor → neither; thấy but also → not only."],"examples":[["Both the manager and her assistant attended the fair.","Cả quản lý và trợ lý của cô ấy đều dự hội chợ."],["You can pay either by card or in cash.","Bạn có thể thanh toán bằng thẻ hoặc tiền mặt."],["Neither the price nor the design was acceptable.","Cả giá lẫn thiết kế đều không chấp nhận được."],["The app is not only fast but also secure.","Ứng dụng không chỉ nhanh mà còn an toàn."]],"memo":"Nhìn vế thứ hai để chọn vế thứ nhất: and ↔ both, or ↔ either, nor ↔ neither, but also ↔ not only.","quiz":[{"q":"Applicants must have ____ a degree in finance and three years of experience.","opts":["either","both","neither","not only"],"a":1,"why":"Có and ở vế sau → both … and."},{"q":"Payment can be made ____ online or at any of our branches.","opts":["both","neither","either","nor"],"a":2,"why":"Có or ở vế sau → either … or."},{"q":"Neither the CEO nor the directors ____ available for comment.","opts":["was","is","has","were"],"a":3,"why":"Neither A nor B: động từ chia theo B (the directors, số nhiều) → were."},{"q":"The seminar was not only informative ____ entertaining.","opts":["but also","and also","or","nor"],"a":0,"why":"Not only … but also: cặp liên từ cố định."}]},{"id":"gt-12","lvl":"toeic","chap":"Đại từ","title":"Đại từ: phản thân, sở hữu, each other (Pronouns)","sum":"Chọn đúng dạng đại từ theo vị trí: chủ ngữ, tân ngữ, trước danh từ, đứng một mình hay phản thân.","forms":["Chủ ngữ: I, you, he, she, it, we, they","Tân ngữ: me, you, him, her, it, us, them","Tính từ sở hữu + N: my, your, his, her, its, our, their","Đại từ sở hữu: mine, yours, his, hers, ours, theirs","Phản thân: myself, yourself, himself, herself, itself, ourselves, themselves"],"points":["Dùng đại từ phản thân khi chủ ngữ và tân ngữ là một: She introduced herself.","by + đại từ phản thân = tự mình, không ai giúp: He completed the report by himself.","Phản thân để nhấn mạnh, đứng sau chủ ngữ hoặc cuối câu: The CEO herself greeted us.","each other / one another = lẫn nhau: The teams communicate with each other.","its (của nó) khác it's (= it is); their (của họ) khác they're (= they are).","Trước danh từ dùng tính từ sở hữu; không có danh từ theo sau dùng đại từ sở hữu."],"examples":[["Mr. Brown prepared the slides himself.","Ông Brown tự chuẩn bị các trang chiếu."],["The two departments help each other.","Hai phòng ban giúp đỡ lẫn nhau."],["Our proposal was accepted, but theirs was not.","Đề xuất của chúng tôi được chấp nhận, còn của họ thì không."],["The company updated its privacy policy.","Công ty đã cập nhật chính sách bảo mật của mình."]],"memo":"Trước N → tính từ sở hữu; tự làm → -self; hai bên qua lại → each other.","quiz":[{"q":"Ms. Rivera reviewed all the applications by ____.","opts":["her","hers","herself","she"],"a":2,"why":"By + đại từ phản thân = tự mình → by herself."},{"q":"Please submit ____ expense reports to the accounting department by Friday.","opts":["your","yours","yourself","you"],"a":0,"why":"Trước danh từ expense reports → tính từ sở hữu your."},{"q":"Dalton Inc. announced that ____ will expand into the Asian market.","opts":["its","it","itself","it's"],"a":1,"why":"Chỗ trống là chủ ngữ của mệnh đề that (trước will) → đại từ chủ ngữ it."},{"q":"The two firms have worked closely with ____ for many years.","opts":["their","they","itself","each other"],"a":3,"why":"Hai công ty hợp tác qua lại với nhau → each other."}]},{"id":"gt-13","lvl":"toeic","chap":"Động từ","title":"Động từ khuyết thiếu & thể giả định (Modals & subjunctive)","sum":"Modal + V nguyên mẫu diễn tả khả năng, bắt buộc, lời khuyên; sau recommend/request that … dùng V nguyên mẫu.","forms":["Modal (can, could, may, might, must, should, will, would) + V nguyên mẫu","Bị động: modal + be + V3","S + recommend / suggest / request / require / insist + that + S + V (nguyên mẫu)","It is essential / important / necessary / imperative + that + S + V (nguyên mẫu)","should have + V3: lẽ ra nên làm (nhưng đã không làm)"],"points":["Sau modal luôn là động từ nguyên mẫu không 'to', không chia: The fee must be paid.","must/have to: bắt buộc; should: nên; may/might: có thể (khả năng); can/could: có thể, xin phép.","Thể giả định: recommend, request, suggest, require, insist + that → V nguyên mẫu cho mọi chủ ngữ.","Phủ định giả định: that + S + not + V: We request that guests not smoke indoors.","Tương tự với tính từ: It is essential/vital/important that he attend the meeting.","Bẫy TOEIC: chủ ngữ số ít vẫn dùng V nguyên mẫu (that she submit, không phải submits)."],"examples":[["Employees must wear ID badges at all times.","Nhân viên phải đeo thẻ tên mọi lúc."],["The manager requested that Tom revise the budget.","Quản lý yêu cầu Tom chỉnh sửa ngân sách."],["It is important that every guest register in advance.","Điều quan trọng là mọi khách mời phải đăng ký trước."],["You should have booked the room earlier.","Lẽ ra bạn nên đặt phòng sớm hơn."]],"memo":"recommend/request/suggest that + S + V nguyên mẫu — bỏ s, bỏ to, không chia thì.","quiz":[{"q":"The consultant recommended that the company ____ its delivery process.","opts":["simplify","simplifies","simplified","simplifying"],"a":0,"why":"Recommend that + S + V nguyên mẫu (thể giả định) → simplify."},{"q":"All visitors ____ sign in at the reception desk.","opts":["must to","must","musts","must be"],"a":1,"why":"Modal must + V nguyên mẫu không to, không thêm s → must sign."},{"q":"It is essential that each participant ____ the form before the workshop.","opts":["completes","completed","complete","completing"],"a":2,"why":"It is essential that + S + V nguyên mẫu → complete (dù chủ ngữ số ít)."},{"q":"Damaged items ____ returned within 30 days of purchase.","opts":["can return","can returning","can returned","can be returned"],"a":3,"why":"Hàng bị trả lại (bị động) → modal + be + V3: can be returned."}]},{"id":"gt-14","lvl":"toeic","chap":"Liên từ & giới từ","title":"Giới từ thời gian & nơi chốn trong kinh doanh (by, until, within, in/on/at)","sum":"Phân biệt by/until, within, in/on/at và các giới từ hay gặp trong thư từ, thông báo công việc.","forms":["by + mốc thời gian: hạn chót, không muộn hơn","until / till + mốc: kéo dài liên tục đến","within + khoảng thời gian / phạm vi: trong vòng, không vượt quá","in + tháng/năm/khoảng thời gian; on + ngày/thứ; at + giờ/địa điểm cụ thể","for + khoảng thời gian; since + mốc; from … to/through …"],"points":["by = trước hoặc đúng hạn (hoàn tất): submit by Friday; until = kéo dài đến: open until 9 P.M.","within + khoảng thời gian/phạm vi: trong vòng, không vượt quá: within 24 hours, within budget.","in + khoảng thời gian ở tương lai = sau bao lâu nữa: The CEO will arrive in ten minutes.","on + ngày/thứ/ngày lễ cụ thể; at + giờ, at the conference, at the front desk.","Nơi chốn hay gặp: in the lobby, on the third floor, at the reception desk, throughout the building.","Cụm khác: prior to (trước), following (sau), throughout (suốt), as of (kể từ ngày)."],"examples":[["Please return the signed contract by May 5.","Vui lòng gửi lại hợp đồng đã ký trước ngày 5/5."],["The sale will continue until Sunday.","Đợt giảm giá sẽ kéo dài đến Chủ nhật."],["Refunds are issued within ten business days.","Tiền hoàn trả được chuyển trong vòng mười ngày làm việc."],["The meeting room is on the fifth floor.","Phòng họp ở tầng năm."]],"memo":"by = hạn chót (xong trước), until = kéo dài tới, within = không quá.","quiz":[{"q":"All expense reports must be submitted ____ Friday at 5 P.M.","opts":["until","by","within","during"],"a":1,"why":"Nộp là hành động hoàn tất trước hạn chót → by."},{"q":"The library will remain open ____ 10 P.M. during exam week.","opts":["until","by","within","since"],"a":0,"why":"Remain open là trạng thái kéo dài liên tục đến 10 giờ tối → until."},{"q":"Customers will receive a confirmation e-mail ____ 24 hours of placing an order.","opts":["by","until","within","on"],"a":2,"why":"Trong vòng 24 giờ kể từ khi đặt hàng → within + khoảng thời gian + of."},{"q":"The annual shareholders' meeting will be held ____ March 15.","opts":["in","at","for","on"],"a":3,"why":"Trước ngày tháng cụ thể dùng on → on March 15."}]}]};

<script>/* Pure logic shared by the app and the Node tests: dates, Leitner review schedule, streaks, quizzes, scoring. */
(function (root) {
  "use strict";

  // ===== CONFIG =====
  const INTERVALS = [1, 2, 4, 7, 15, 30, 60]; // days until next review, by box
  const MASTER_BOX = 5;                        // box at which a word counts as "thuộc"
  const BATCH = 5;                             // new words per learn session
  // ==================

  const pad = (n) => String(n).padStart(2, "0");
  const dstr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return dstr(d); };
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  /** ISO-8601 week of a local date, e.g. "2026-W43" (weeks start on Monday). */
  function isoWeek(s) {
    const d = parse(s);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); // Thursday of this week decides the year
    const jan4 = new Date(d.getFullYear(), 0, 4, 12);
    const wk = 1 + Math.round((daysBetween(dstr(jan4), dstr(d)) - 3 + ((jan4.getDay() + 6) % 7)) / 7);
    return `${d.getFullYear()}-W${pad(wk)}`;
  }

  /** Word id "word|pos", from a raw data row [word, pos, …] or a word object { w, pos }. */
  const wkey = (w) => (Array.isArray(w) ? `${w[0]}|${w[1]}` : w.key || `${w.w}|${w.pos}`);

  // ---- Leitner schedule ----

  /** Word objects: { w, pos, ipa, vi, ex, emo }. Returns one question per word, mixing three types. */

    const types = shuffle(["meaning", "word", "spell", "meaning", "word"], r);
    return batch.map((word, i) => {
      const type = types[i % types.length];
      if (type === "spell") return { type, word, answer: word.w };

      prev = cur;

  }

    ["🎓", "Đủ 44 âm", (s) => s.ipa >= 44],
    ["⭐", "1000 XP", (s) => s.xp >= 1000],
  ];

    f.coins -= cost; f.plots.push({ c: null, at: 0 });
    return { ok: true };
  }

  // ---- Animals ----
  const animalReady = (a, now) => remaining(a.at, ANIMAL[a.a].min, now) === 0;
  function buyAnimal(f, id, now) {
    const a = ANIMAL[id];
    if (!a) return fail("Không có con vật này");
    if (a.lv > level(f.xp)) return fail(`Cần nông trại cấp ${a.lv}`);
    if (f.animals.filter((x) => x.a === id).length >= MAX_PER_ANIMAL) return fail(`Tối đa ${MAX_PER_ANIMAL} ${a.vi.toLowerCase()}`);
    if (f.coins < a.cost) return fail("Chưa đủ xu");
    f.coins -= a.cost; f.animals.push({ a: id, at: now });
    return { ok: true };
  }
  function collect(f, i, now) {
    const a = f.animals[i];
    if (!a || !animalReady(a, now)) return fail("Chưa có sản phẩm");
    if (stock(f) >= f.cap) return fail("Nhà kho đầy — bán bớt hoặc nâng cấp kho");
    const p = ITEMS[ANIMAL[a.a].prod];
    f.barn[p.id] = (f.barn[p.id] || 0) + 1; a.at = now;
    return { ok: true, item: p.id, levelUp: addXp(f, p.xp) };
  }
  function feedBoost(f, i, now) {
    const a = f.animals[i];
    if (!a || animalReady(a, now)) return fail("Con vật đã sẵn sàng");
    if (f.fert < 1) return fail("Hết phân bón — hoàn thành bài học để nhận thêm");
    f.fert--; a.at = now - ANIMAL[a.a].min * MIN;
    return { ok: true };
  }

  // ---- Barn & shop ----
  function sell(f, id, qty = 1) {
    const it = ITEMS[id], have = f.barn[id] || 0;
    if (!it || have < qty || qty < 1) return fail("Không đủ hàng để bán");
    f.barn[id] = have - qty; if (!f.barn[id]) delete f.barn[id];
    f.coins += it.sell * qty;
    return { ok: true, coins: it.sell * qty };
  }
  const barnCost = (f) => 100 * ((f.cap - START.cap) / CAP_STEP + 1);
  function upgradeBarn(f) {
    const cost = barnCost(f);
    if (f.coins < cost) return fail("Chưa đủ xu để nâng cấp kho");
    f.coins -= cost; f.cap += CAP_STEP;
    return { ok: true };
  }
  function buyDeco(f, id) {
    const d = DECO[id];
    if (!d) return fail("Không có món này");
    if (f.deco.includes(id)) return fail("Bạn đã có món này");
    if (d.lv > level(f.xp)) return fail(`Cần nông trại cấp ${d.lv}`);
    if (f.coins < d.cost) return fail("Chưa đủ xu");
    f.coins -= d.cost; f.deco.push(id);
    return { ok: true };
  }

  // ---- Orders (Hay Day style delivery board) ----
  function makeOrder(lv, r) {
    const pool = unlockedItems(lv), kinds = Math.min(pool.length, 1 + Math.floor(r() * (lv >= 3 ? 3 : 2)));
    const need = {};
    while (Object.keys(need).length < kinds) {
      const it = pool[Math.floor(r() * pool.length)];
      need[it.id] = 1 + Math.floor(r() * (it.sell <= 25 ? 4 : 2));
    }
    const value = Object.entries(need).reduce((n, [id, q]) => n + ITEMS[id].sell * q, 0);
    const xp = Object.entries(need).reduce((n, [id, q]) => n + ITEMS[id].xp * q, 0) + 3;
    return { need, coins: Math.round(value * 1.5), xp };
  }
  function fillOrders(f, r) { while (f.orders.length < ORDERS) f.orders.push(makeOrder(level(f.xp), r)); }
  const canDeliver = (f, o) => Object.entries(o.need).every(([id, q]) => (f.barn[id] || 0) >= q);
  function deliver(f, i, r) {
    const o = f.orders[i];
    if (!o) return fail("Không có đơn hàng này");
    if (!canDeliver(f, o)) return fail("Chưa đủ hàng cho đơn này");
    for (const [id, q] of Object.entries(o.need)) { f.barn[id] -= q; if (!f.barn[id]) delete f.barn[id]; }
    f.coins += o.coins;
    const levelUp = addXp(f, o.xp);
    f.orders.splice(i, 1); fillOrders(f, r);
    return { ok: true, coins: o.coins, levelUp };
  }
  function skipOrder(f, i, r) { if (!f.orders[i]) return fail("Không có đơn hàng này"); f.orders.splice(i, 1); fillOrders(f, r); return { ok: true }; }

  // ---- Play-time gate ----
  const gateLive = (g, now) => !!g && now - g.start < GATE.WINDOW;
  /** Effective gate state now: study/play ms in the current window, play budget left, open or locked. */
  function gate(g, now) {
    const live = gateLive(g, now), study = live ? g.study : 0, play = live ? g.play : 0;
    const budget = Math.max(0, study * GATE.RATIO - play);
    return { study, play, budget, open: study >= GATE.MIN_STUDY && budget > 0,
      need: Math.max(0, GATE.MIN_STUDY - study), resetIn: live ? g.start + GATE.WINDOW - now : null };
  }
  /** Count study time; starts a new window when the previous one has expired. */
  function addStudy(g, ms, now) {
    const w = gateLive(g, now) ? { ...g } : { start: now, study: 0, play: 0 };
    w.study += ms;
    return w;
  }
  function addPlay(g, ms, now) {
    if (!gateLive(g, now)) return g;
    return { ...g, play: Math.min(g.play + ms, g.study * GATE.RATIO) };
  }

  // ---- Spirit beasts (Linh Thú) ----
  const has = (f, items) => Object.entries(items).every(([id, q]) => (f.barn[id] || 0) >= q);
  const take = (f, items) => { for (const [id, q] of Object.entries(items)) { f.barn[id] -= q; if (!f.barn[id]) delete f.barn[id]; } };
  const missing = (f, items) => Object.fromEntries(Object.entries(items).filter(([id, q]) => (f.barn[id] || 0) < q).map(([id, q]) => [id, q - (f.barn[id] || 0)]));
  /** Effect of a beast at a level: { speed, price } in %. */
  function beastPower(id, lv) {
    const b = BEAST[id], t = (lv - 1) / (BEAST_MAX_LV - 1);
    return { speed: Math.round(b.speed[0] + (b.speed[1] - b.speed[0]) * t), price: Math.round(b.price[0] + (b.price[1] - b.price[0]) * t) };
  }
  /** Stamina left today (refills to STAMINA at each new day). */
  const stamina = (f, id, today) => { const s = f.beasts[id]; return !s ? 0 : s.day === today ? s.st : STAMINA; };
  /** Stamina for buffing n crops: more crops cost more, higher levels cost less per crop. */
  const castCost = (lv, n) => (n <= 0 ? 0 : Math.ceil(n * STAMINA_PER_CROP[lv - 1] - 1e-9));
  /** Study goals of a beast's challenge not met yet: { key: needed }. stats: { words, best, sents, ipa, mastered }. */
  function learnMissing(id, stats) {
    const out = {};
    for (const [k, q] of Object.entries(BEAST[id].learn)) if (((stats && stats[k]) || 0) < q) out[k] = q;
    return out;
  }
  function buyBeast(f, id, today, stats) {
    const b = BEAST[id];
    if (!b) return fail("Không có Linh Thú này");
    if (f.beasts[id]) return fail("Bạn đã có Linh Thú này");
    if (b.lv > level(f.xp)) return fail(`Cần nông trại cấp ${b.lv}`);
    if (Object.keys(learnMissing(id, stats)).length) return fail("Chưa hoàn thành thử thách học tập");
    if (f.coins < b.cost) return fail("Chưa đủ xu");
    if (!has(f, b.need)) return fail("Chưa đủ nguyên liệu trong kho");
    f.coins -= b.cost; take(f, b.need);
    f.beasts[id] = { lv: 1, st: STAMINA, day: today };
    return { ok: true };
  }
  /** Coins and harvested crops needed to go from the current level to the next; null at max level. */
  function upgradeCost(f, id) {
    const s = f.beasts[id], b = BEAST[id];
    if (!s || s.lv >= BEAST_MAX_LV) return null;
    const L = s.lv, need = { [b.fav[0]]: 3 + 2 * L };
    if (L >= 3) need[b.fav[1]] = L;
    return { coins: Math.round(b.cost * 0.35 * L), need };
  }
  function upgradeBeast(f, id) {
    const c = upgradeCost(f, id);
    if (!c) return fail(f.beasts[id] ? `Đã đạt cấp tối đa ${BEAST_MAX_LV}` : "Bạn chưa có Linh Thú này");
    if (f.coins < c.coins) return fail("Chưa đủ xu để nâng cấp");
    if (!has(f, c.need)) return fail("Chưa đủ nông sản để nâng cấp");
    f.coins -= c.coins; take(f, c.need); f.beasts[id].lv++;
    return { ok: true, lv: f.beasts[id].lv };
  }
  /** Plots this beast can buff now: planted, not yet buffed by it; ripe plots only if it raises the price. */
  function castTargets(f, id, now) {
    const pw = f.beasts[id] ? beastPower(id, f.beasts[id].lv) : null;
    if (!pw) return [];
    return f.plots.map((p, i) => [p, i]).filter(([p]) => p.c && !(p.bf || []).includes(id) && (!plotReady(p, now) || pw.price > 0)).map(([, i]) => i);
  }
  function cast(f, id, idxs, now, today) {
    const s = f.beasts[id];
    if (!s) return fail("Bạn chưa có Linh Thú này");
    const ok = new Set(castTargets(f, id, now)), list = [...new Set(idxs)].filter((i) => ok.has(i));
    if (!list.length) return fail("Không có cây nào để ban phúc");
    const cost = castCost(s.lv, list.length), st = stamina(f, id, today);
    if (cost > st) return fail(`Không đủ thể lực (cần ${cost}, còn ${st})`);
    const pw = beastPower(id, s.lv);
    for (const i of list) {
      const p = f.plots[i];
      if (pw.speed && !plotReady(p, now)) p.at -= Math.round(remaining(p.at, CROP[p.c].min, now) * pw.speed / 100);
      if (pw.price) p.pb = Math.min(PRICE_CAP, (p.pb || 0) + pw.price);
      p.bf = [...(p.bf || []), id];
    }
    s.st = st - cost; s.day = today;
    return { ok: true, n: list.length, cost };
  }

  /** What a farm level unlocks, for the level-up message. */
  const unlocks = (lv) => [...CROPS, ...ANIMALS, ...DECOS, ...BEASTS].filter((x) => x.lv === lv);

  const Farm = {
    MIN, CROPS, PRODUCTS, ANIMALS, DECOS, ITEMS, CROP, ANIMAL, DECO, LVXP, START, MAX_PLOTS, plotLevel, MAX_PER_ANIMAL, REWARD, GATE, gate, addStudy, addPlay,
    fresh, level, nextXp, bonus, stock, unlockedItems, earn, reward, remaining, plotReady, plant, harvest, fertilize, plotCost, buyPlot,
    animalReady, buyAnimal, collect, feedBoost, sell, barnCost, upgradeBarn, buyDeco, makeOrder, fillOrders, canDeliver, deliver, skipOrder, unlocks, uproot,
    BEASTS, BEAST, BEAST_MAX_LV, STAMINA, STAMINA_PER_CROP, PRICE_CAP, beastPower, stamina, castCost, buyBeast, learnMissing, LEARN_KEYS, upgradeCost, upgradeBeast, castTargets, cast, missing,
  };
  if (typeof module === "object" && module.exports) module.exports = Farm;
  else root.Farm = Farm;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* Online leaderboard client: Supabase RPC calls with a timeout, one request per function at a time, and exponential
   backoff after failures. The app is local-first and never waits on this; when the server is down it just shows cached data. */
(function (root) {
  "use strict";

  // ===== CONFIG =====
  const TIMEOUT = 8000;               // abort a request after this
  const SYNC_EVERY = 60 * 1000;       // push my numbers at most this often
  const BOARD_TTL = 60 * 1000;        // reuse the fetched leaderboard this long
  const BACKOFF_MIN = 15 * 1000, BACKOFF_MAX = 15 * 60 * 1000;
  const ERRORS = {
    no_room: "Không tìm thấy mã lớp này", bad_name: "Tên cần 2–20 ký tự, không dùng ký hiệu đặc biệt", bad_pin: "PIN gồm 4–6 chữ số",
    wrong_pin: "Sai PIN. Tên này đã có trong lớp — nếu là bạn, hãy nhập đúng PIN", locked: "Nhập sai PIN quá nhiều lần, thử lại sau 15 phút",
    room_full: "Lớp đã đủ chỗ", name_taken: "Tên này vừa có người dùng, hãy chọn tên khác", no_player: "Tài khoản lớp không còn — hãy tham gia lại",
    offline: "Chưa kết nối được máy chủ, thử lại sau nhé", server: "Máy chủ đang bận, thử lại sau nhé", bad_response: "Máy chủ trả lời lạ — báo người quản lý lớp",
    not_configured: "Chế độ trực tuyến chưa được thiết lập",
    no_teacher: "Lớp này chưa có mật khẩu giáo viên — người quản lý đặt trong Supabase (xem ONLINE.md)",
    wrong_secret: "Sai mật khẩu giáo viên", admin_locked: "Nhập sai mật khẩu giáo viên quá nhiều lần, thử lại sau 15 phút",
    too_big: "Học liệu quá lớn (tối đa 512 KB) — bớt bớt bài hoặc chia sang lớp khác", too_fast: "Vừa đăng xong, đợi vài giây rồi thử lại",
    bad_pack: "Học liệu không hợp lệ", server_old: "Máy chủ lớp chưa được cập nhật — người quản lý chạy lại file supabase/schema.sql (xem ONLINE.md)",
  };
  // ==================

  const fail = (code) => Object.assign(new Error(code), { code });

  /** cfg: { url, key }; deps (for tests): { fetch, now, random } */
  function create(cfg, deps = {}) {
    const doFetch = deps.fetch || ((...a) => root.fetch(...a)), now = deps.now || Date.now, random = deps.random || Math.random;
    const configured = !!(cfg && /^https?:\/\//.test(String(cfg.url || "").trim()) && String(cfg.key || "").trim());
    const st = { fails: 0, until: 0, inflight: {} };
    // Accept the Project URL with or without the "/rest/v1/" suffix Supabase shows on its API page.
    const base = configured ? cfg.url.trim().replace(/\/+$/, "").replace(/\/rest\/v1$/, "") : "";
    const jwt = configured && cfg.key.startsWith("eyJ"); // legacy "anon" key; new "sb_publishable_" keys go in apikey only

    function call(fn, args) {
      if (!configured) return Promise.reject(fail("not_configured"));
      if (now() < st.until) return Promise.reject(fail("offline"));
      if (st.inflight[fn]) return st.inflight[fn];
      const p = (async () => {
        const ctl = typeof AbortController === "function" ? new AbortController() : null;
        const timer = setTimeout(() => ctl && ctl.abort(), TIMEOUT);
        try {
          let res;
          try {
            res = await doFetch(`${base}/rest/v1/rpc/${fn}`, {
              method: "POST", body: JSON.stringify(args), signal: ctl ? ctl.signal : undefined,
              headers: { "Content-Type": "application/json", apikey: cfg.key, ...(jwt ? { Authorization: `Bearer ${cfg.key}` } : {}) },
            });
          } catch (e) { throw fail("offline"); }
          if (res.status === 429 || res.status >= 500) throw fail("server");
          if (res.status === 404) throw fail("server_old"); // a function this app version needs is not on the server yet
          const data = await res.json().catch(() => null);
          if (!res.ok || !data || typeof data !== "object") throw fail("bad_response");
          st.fails = 0; st.until = 0;
          return data;
        } catch (e) {
          if (e.code === "server_old") throw e; // the server answers fine: no need to back off
          st.fails++;
          st.until = now() + Math.min(BACKOFF_MAX, BACKOFF_MIN * 2 ** (st.fails - 1)) * (0.8 + 0.4 * random());
          throw e;
        } finally {
          clearTimeout(timer);
          delete st.inflight[fn];
        }
      })();
      st.inflight[fn] = p;
      return p;
    }

    return {
      configured, state: st,
      offline: () => now() < st.until,
      join: (room, name, pin) => call("nhip_join", { p_room: room, p_name: name, p_pin: pin }),
      sync: (token, stats) => call("nhip_sync", { p_token: token, p_stats: stats }),
      board: (token, week) => call("nhip_board", { p_token: token, p_week: week }),
      leave: (token) => call("nhip_leave", { p_token: token }),
      packGet: (token, ver) => call("nhip_pack_get", { p_token: token, p_ver: ver }),
      admin: (room, secret) => call("nhip_admin", { p_room: room, p_secret: secret }),
      packPut: (room, secret, pack) => call("nhip_pack_put", { p_room: room, p_secret: secret, p_pack: pack }),
    };
  }

  const METRICS = {
    week: { label: "Tuần này", unit: "XP", get: (p) => p.week_xp },
    xp: { label: "Tổng XP", unit: "XP", get: (p) => p.xp },
    streak: { label: "Chuỗi ngày", unit: "ngày", get: (p) => p.streak },
    words: { label: "Từ đã học", unit: "từ", get: (p) => p.words },
    farm: { label: "Nông trại", unit: "cấp", get: (p) => p.farm_lv * 100 + p.beasts },
  };
  /** Sort players by a metric; ties share a rank (1, 2, 2, 4). */
  function rank(players, by) {
    const get = METRICS[by].get;
    const list = players.slice().sort((a, b) => get(b) - get(a) || String(a.name).localeCompare(String(b.name)));
    let prev = null, pos = 0;
    return list.map((p, i) => { if (get(p) !== prev) { pos = i + 1; prev = get(p); } return { ...p, rank: pos, value: get(p) }; });
  }
  const message = (code) => ERRORS[code] || ERRORS.offline;

  const Online = { create, rank, message, METRICS, TIMEOUT, SYNC_EVERY, BOARD_TTL, BACKOFF_MIN, BACKOFF_MAX };
  if (typeof module === "object" && module.exports) module.exports = Online;
  else root.Online = Online;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* Interactive visuals for the Toán & Vật lí lessons. Each visual type has sliders (ctrls) and a pure draw(params, state)
   that returns { svg, info }: an SVG drawing (viewBox 0 0 360 220) and a short HTML readout of the numbers.
   No DOM access here, so every visual can be drawn and checked in Node. */
(function (root) {
  "use strict";

  const W = 360, H = 220;
  const rad = (d) => (d * Math.PI) / 180, deg = (r) => (r * 180) / Math.PI;
  /** Vietnamese number format: decimal comma, at most d decimals, no trailing zeros, true minus sign. */
  const fmt = (n, d = 2) => (Math.abs(n) < 1e-9 ? "0" : String(+n.toFixed(d)).replace(".", ",").replace("-", "−"));
  const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
  function frac(x) { // x is a multiple of 1/4
    const n = Math.round(x * 4), g = gcd(n, 4) || 1, p = n / g, q = 4 / g;
    return q === 1 ? fmt(p) : `${p < 0 ? "−" : ""}${Math.abs(p)}/${q}`;
  }
  const svgw = (body, extra = "") => `<svg class="viz-svg" viewBox="0 0 ${W} ${H}" role="img"${extra}>${body}</svg>`;
  const T = (x, y, s, o = {}) => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${o.size || 12}" fill="${o.fill || "#22324A"}"${o.anchor ? ` text-anchor="${o.anchor}"` : ""}${o.bold ? ' font-weight="700"' : ""}>${s}</text>`;
  const L = (x1, y1, x2, y2, c = "#22324A", w = 2, dash) => `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ""} stroke-linecap="round"/>`;
  const C = (x, y, r, fill, stroke = "none", w = 0) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${w}"/>`;
  const P = (pts, fill, stroke = "#22324A", w = 2, extra = "") => `<polygon points="${pts.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ")}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round"${extra}/>`;
  /** Point at angle a (degrees, counter-clockwise from +x, as in maths) and radius r around (cx, cy). */
  const pol = (cx, cy, r, a) => [cx + r * Math.cos(rad(a)), cy - r * Math.sin(rad(a))];
  /** Filled angle sector from a1 to a2 (degrees, counter-clockwise). */
  function sector(cx, cy, r, a1, a2, fill, label, lr) {
    let span = a2 - a1; while (span < 0) span += 360;
    const [x1, y1] = pol(cx, cy, r, a1), [x2, y2] = pol(cx, cy, r, a1 + span);
    const path = `<path d="M${cx.toFixed(1)} ${cy.toFixed(1)}L${x1.toFixed(1)} ${y1.toFixed(1)}A${r} ${r} 0 ${span > 180 ? 1 : 0} 0 ${x2.toFixed(1)} ${y2.toFixed(1)}Z" fill="${fill}" opacity=".75"/>`;
    if (!label) return path;
    const [lx, ly] = pol(cx, cy, lr || r + 13, a1 + span / 2);
    return path + T(lx, ly + 4, label, { anchor: "middle", size: 11, bold: true });
  }
  /** The angle at vertex v between rays to points a and b (always the non-reflex one). */
  function vertexAngle(v, a, b, r, fill, label, lr) {
    const d1 = deg(Math.atan2(-(a[1] - v[1]), a[0] - v[0])), d2 = deg(Math.atan2(-(b[1] - v[1]), b[0] - v[0]));
    let span = d2 - d1; while (span < 0) span += 360;
    return span <= 180 ? sector(v[0], v[1], r, d1, d2, fill, label, lr) : sector(v[0], v[1], r, d2, d1, fill, label, lr);
  }
  const arrow = (x1, y1, x2, y2, c = "#22324A", w = 2) => {
    const a = Math.atan2(y2 - y1, x2 - x1), h = 8;

        const needle = Math.max(-60, Math.min(60, dx * 12));
        g += `<g transform="rotate(${needle.toFixed(1)} 210 186)">${L(210, 186, 210, 152, RED, 3)}</g>` + C(210, 186, 3.5, "#22324A");
        const st = Math.abs(dx) < 0.5 ? "Nam châm <b>đứng yên</b> ⇒ từ trường qua cuộn dây không đổi ⇒ <b>không có</b> dòng điện cảm ứng" : dx > 0 ? "Đưa nam châm <b>vào</b> cuộn dây ⇒ số đường sức qua cuộn dây tăng ⇒ có dòng điện cảm ứng (kim lệch một phía)" : "Kéo nam châm <b>ra</b> ⇒ số đường sức giảm ⇒ dòng điện cảm ứng <b>đổi chiều</b> (kim lệch phía kia)";
        return { svg: svgw(g), info: st };
      },
    },
    ac: {
      ctrls: () => [ctl("a", "Góc quay của khung dây", 0, 720, 15, 90, "°")],
      draw: (p, s) => {

        let g = `<rect x="14" y="40" width="34" height="80" fill="${RED}"/><rect x="138" y="40" width="34" height="80" fill="${BLUE}"/>` + T(31, 85, "N", { anchor: "middle", fill: "#fff", bold: true }) + T(155, 85, "S", { anchor: "middle", fill: "#fff", bold: true });

        const v = Math.sin(rad(s.a));
        return { svg: svgw(g), info: `Khung dây quay đều trong từ trường ⇒ dòng điện cảm ứng i ${Math.abs(v) < 0.05 ? "= 0 lúc này" : v > 0 ? "chạy theo <b>chiều dương</b>" : "chạy theo <b>chiều ngược lại</b>"} · cứ nửa vòng quay dòng điện <b>đổi chiều</b> một lần ⇒ dòng điện xoay chiều (ở Việt Nam 50 Hz)` };

    },
  };

  /** Initial slider state for a visual. */
  function init(viz) {
    const v = VIZ[viz.type];
    return v ? Object.fromEntries(v.ctrls(viz).map((c) => [c.k, c.val])) : {};
  }
  function draw(viz, state) {
    const v = VIZ[viz.type];
    if (!v) return { svg: svgw(T(180, 110, "—", { anchor: "middle" })), info: "" };

  }

  const motionKey = (viz) => (VIZ[viz.type] && VIZ[viz.type].motion) || null;

  const Stem = { VIZ, TYPES: Object.keys(VIZ), init, draw, ctrls, motionKey, fmt };
  if (typeof module === "object" && module.exports) module.exports = Stem;
  else root.Stem = Stem;
})(typeof window !== "undefined" ? window : globalThis);

<script>/* Class study material ("học liệu lớp"), like Quizlet sets: a teacher adds, edits or removes words, sentences, grammar
   lessons and Toán/Vật lí lessons, and shares them with the class. A pack only stores the changes; apply() lays one or more
   packs over the built-in data. Packs arrive from the server or from a file, so clean() checks every field. Pure: node-tested. */
(function (root) {
  "use strict";

  // ===== CONFIG =====
  const KINDS = ["words", "sents", "grammar", "stem"];
  const MAX_ITEMS = { words: 3000, sents: 2000, grammar: 200, stem: 300 };
  const MAX_BYTES = 450 * 1024;        // the server accepts up to 512 KB per class
  const LEVELS = ["kids", "toeic"], TRACKS = ["daily", "work", "toeic"], STAGES = ["Basic", "Intermediate", "Advanced"];
  const POS = ["n", "v", "adj", "adv", "phr", "prep", "conj"];
  const NEW_TOPIC = "Bộ từ của lớp", NEW_GROUP = "Câu của lớp";
  // Visual types a lesson can use: [preset key, label]. The key is "type" or "type:mode" (mode/kind/shape per type).
  const VIZ_PRESETS = [
    ["numberline", "Trục số"], ["angles:vertical", "Góc đối đỉnh, kề bù"], ["angles:parallel", "Hai đường thẳng song song"],
    ["triangle", "Tổng ba góc tam giác"], ["pythagoras", "Định lí Pythagore"], ["proportion:direct", "Tỉ lệ thuận y = kx"],
    ["proportion:inverse", "Tỉ lệ nghịch y = k/x"], ["linear", "Hàm số y = ax + b"], ["system", "Hệ hai phương trình"],
    ["parabola:ax2", "Đồ thị y = ax²"], ["parabola:quadratic", "Phương trình bậc hai (Δ)"], ["identity", "Hằng đẳng thức (a + b)²"],
    ["thales", "Định lí Thalès"], ["trig", "Tỉ số lượng giác"], ["circle:inscribed", "Góc nội tiếp"], ["circle:arc", "Cung tròn, hình quạt"],
    ["polygon", "Đa giác đều"], ["solid:cuboid", "Hình hộp chữ nhật"], ["solid:prism", "Lăng trụ đứng tam giác"], ["solid:cylinder", "Hình trụ"],
    ["solid:cone", "Hình nón"], ["solid:sphere", "Hình cầu"], ["chart:bar", "Biểu đồ cột"], ["chart:pie", "Biểu đồ hình quạt"],
    ["chart:line", "Biểu đồ đoạn thẳng"], ["dice", "Xác suất (gieo xúc xắc)"],
    ["motion", "Tốc độ, quãng đường"], ["sound", "Sóng âm"], ["reflection", "Phản xạ ánh sáng"], ["refraction", "Khúc xạ ánh sáng"],
    ["lens:converging", "Thấu kính hội tụ"], ["lens:diverging", "Thấu kính phân kì"], ["magnet", "Nam châm, từ trường"],
    ["density", "Khối lượng riêng"], ["pressure:solid", "Áp suất chất rắn"], ["pressure:liquid", "Áp suất chất lỏng"],
    ["lever", "Đòn bẩy, mômen lực"], ["circuit:ohm", "Định luật Ohm"], ["circuit:series", "Mạch nối tiếp"], ["circuit:parallel", "Mạch song song"],
    ["power", "Công suất, điện năng"], ["energy", "Cơ năng"], ["heat", "Nhiệt năng, sự nở vì nhiệt"], ["induction", "Cảm ứng điện từ"],
    ["ac", "Dòng điện xoay chiều"],
  ];
  const PARAM = { angles: "mode", proportion: "kind", parabola: "mode", circle: "mode", solid: "shape", chart: "kind", lens: "kind", pressure: "mode", circuit: "mode" };
  // ==================

  const PRESET = new Set(VIZ_PRESETS.map(([k]) => k));
  const fresh = () => ({ app: "nhip-pack", v: 1, name: "", at: 0, words: [], sents: [], grammar: [], stem: [] });
  const str = (x, max) => (typeof x === "string" || typeof x === "number" ? String(x) : "").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, "").trim().slice(0, max);
  const one = (x, max) => str(x, max).replace(/\s+/g, " ");
  const list = (x, n, max) => (Array.isArray(x) ? x : []).map((s) => str(s, max)).filter(Boolean).slice(0, n);
  const pairs = (x, n, max) => (Array.isArray(x) ? x : []).filter(Array.isArray).map(([a, b]) => [one(a, max), one(b, max)]).filter(([a, b]) => a && b).slice(0, n);
  const okId = (id) => typeof id === "string" && id.length > 0 && id.length <= 120;
  const newId = (prefix, r = Math.random) => `${prefix}${Date.now().toString(36)}${Math.floor(r() * 1e8).toString(36)}`;
  const vizKey = (v) => (v && v.type ? (PARAM[v.type] ? `${v.type}:${v[PARAM[v.type]]}` : v.type) : "");

  /** A lesson visual from the preset list (charts also carry up to 7 [label, value ≥ 0] rows), else null. */
  function cleanViz(v) {
    if (!v || typeof v !== "object" || !PRESET.has(vizKey(v))) return null;
    const out = { type: v.type };
    if (PARAM[v.type]) out[PARAM[v.type]] = v[PARAM[v.type]];
    if (v.type === "chart") {
      const plain = (x, n) => one(x, n).replace(/[<>&"']/g, "");
      out.title = plain(v.title, 60) || "Biểu đồ";
      out.data = (Array.isArray(v.data) ? v.data : []).filter(Array.isArray).map(([l, n]) => [plain(l, 20), +n])
        .filter(([l, n]) => l && Number.isFinite(n) && n >= 0 && n <= 1e9).slice(0, 7);
      if (out.data.length < 2) return null;
    }
    return out;
  }
  function cleanQuiz(q) {
    return (Array.isArray(q) ? q : []).map((x) => {
      if (!x || typeof x !== "object") return null;
      const opts = (Array.isArray(x.opts) ? x.opts : []).map((o) => one(o, 200)), a = Number.isInteger(x.a) ? x.a : -1;
      const q2 = str(x.q, 400);
      if (!q2 || opts.length < 2 || opts.length > 4 || opts.some((o) => !o) || new Set(opts).size !== opts.length || a < 0 || a >= opts.length) return null;
      return { q: q2, opts, a, why: str(x.why, 300) };
    }).filter(Boolean).slice(0, 10);
  }

  const CLEAN = {
    words(x) {
      if (!LEVELS.includes(x.lvl)) return null;
      if (x.del) return { id: x.id, lvl: x.lvl, del: true };
      const w = one(x.w, 60), vi = one(x.vi, 160);
      if (!w || !vi) return null;
      return { id: x.id, lvl: x.lvl, topic: one(x.topic, 60) || NEW_TOPIC, w, pos: POS.includes(x.pos) ? x.pos : "n", ipa: one(x.ipa, 60).replace(/^\/|\/$/g, ""),
        vi, ex: one(x.ex, 240), emo: one(x.emo, 16) || "📝" };
    },
    sents(x) {
      if (!TRACKS.includes(x.track)) return null;
      if (x.del) return { id: x.id, track: x.track, del: true };
      const en = one(x.en, 300), vi = one(x.vi, 300);
      if (!en || !vi) return null;
      return { id: x.id, track: x.track, group: one(x.group, 60) || NEW_GROUP, stage: STAGES.includes(x.stage) ? x.stage : "Basic", en, vi, note: one(x.note, 200) };
    },
    grammar(x) {
      if (!LEVELS.includes(x.lvl)) return null;
      if (x.del) return { id: x.id, lvl: x.lvl, del: true };
      const title = one(x.title, 120);
      if (!title) return null;
      return { id: x.id, lvl: x.lvl, chap: one(x.chap, 80) || "Ngữ pháp của lớp", title, sum: str(x.sum, 600), forms: list(x.forms, 8, 200),
        points: list(x.points, 12, 300), examples: pairs(x.examples, 10, 300), memo: str(x.memo, 300), quiz: cleanQuiz(x.quiz) };
    },
    stem(x) {
      if (x.subj !== "math" && x.subj !== "phys") return null;
      if (x.del) return { id: x.id, subj: x.subj, del: true };
      const title = one(x.title, 120), grade = +x.grade;
      if (!title || ![7, 8, 9].includes(grade)) return null;
      const ex = x.example && typeof x.example === "object" ? x.example : {};
      return { id: x.id, subj: x.subj, grade, chap: one(x.chap, 80) || "Bài của lớp", title, sum: str(x.sum, 600), points: list(x.points, 12, 300),
        formulas: list(x.formulas, 8, 200), viz: cleanViz(x.viz), vizNote: str(x.vizNote, 300), memo: str(x.memo, 300),
        example: { q: str(ex.q, 600), a: str(ex.a, 1500) }, terms: pairs(x.terms, 8, 120), quiz: cleanQuiz(x.quiz) };
    },
  };
  function cleanItem(kind, x) {
    if (!x || typeof x !== "object" || !okId(x.id)) return null;
    return CLEAN[kind](x);
  }
  /** Keep the last change per id at the place the id first appeared (so a set keeps its word order). */
  function compact(items) {
    const m = new Map();
    for (const x of items) m.set(x.id, x);
    return [...m.values()];
  }
  /** Anything (parsed JSON) → a valid pack, or null when it is not a pack at all. */
  function clean(o) {
    if (!o || typeof o !== "object" || (o.app !== undefined && o.app !== "nhip-pack")) return null;
    const p = fresh();
    p.name = one(o.name, 60);
    p.at = Number.isFinite(+o.at) ? +o.at : 0;
    for (const k of KINDS) p[k] = compact((Array.isArray(o[k]) ? o[k] : []).map((x) => cleanItem(k, x)).filter(Boolean)).slice(0, MAX_ITEMS[k]);
    return p;
  }
  const count = (p) => (p ? KINDS.reduce((n, k) => n + p[k].length, 0) : 0);

  /** Record a change in a pack (replaces an earlier change of the same item). */
  function put(p, kind, item) {
    const x = cleanItem(kind, item);
    if (!x) return false;
    const i = p[kind].findIndex((y) => y.id === x.id);
    if (i >= 0) p[kind][i] = x; else p[kind].push(x);
    return true;
  }
  /** Remove an item: forget it if only this pack had it, otherwise record a deletion (`under` = it exists below this pack). */
  function remove(p, kind, item, under) {
    p[kind] = p[kind].filter((y) => y.id !== item.id);
    if (under) put(p, kind, { ...item, del: true });
  }
  /** Publish: the class pack with my changes laid on top, deletions of things that no longer exist dropped. */
  function combine(a, b, baseIds) {
    const out = fresh();
    out.name = (b && b.name) || (a && a.name) || "";
    for (const k of KINDS) {
      out[k] = compact([...(a ? a[k] : []), ...(b ? b[k] : [])]);
      if (baseIds) out[k] = out[k].filter((x) => !x.del || baseIds.has(x.id));
    }
    return out;
  }

  // ---- Lay packs over the built-in data. Every item keeps an id and a source: 0 built-in, 1 edited, 2 added. ----
  const wkey = (w, pos) => `${String(w).toLowerCase()}|${pos}`;
  const wordId = (lvl, w, pos) => `${lvl}:${w}|${pos}`;
  const sentId = (track, en) => `${track}:${en}`;
  /** Generic grouping layer: base groups [{name, extra, rows}], changes → groups with new groups first. */
  function layer(baseGroups, changes, opt) {
    const ent = new Map(), byKey = new Map(), meta = new Map(), order = [], fresh2 = [];
    for (const g of baseGroups) {
      meta.set(g.name, g.extra); order.push(g.name);
      for (const r of g.rows) { const id = opt.id(r); ent.set(id, { g: g.name, row: r, src: 0 }); byKey.set(opt.key(r), id); }
    }
    for (const c of changes) {
      const prev = ent.get(c.id);
      if (c.del) { if (prev) { ent.delete(c.id); byKey.delete(opt.key(prev.row)); } continue; }
      const row = opt.row(c), k = opt.key(row), clash = byKey.get(k);
      if (clash && clash !== c.id) ent.delete(clash); // same word / sentence added twice: the newer one wins
      if (prev) byKey.delete(opt.key(prev.row));
      const g = c[opt.group];
      if (!meta.has(g)) { meta.set(g, opt.extra(c)); fresh2.push(g); }
      ent.set(c.id, { g, row, src: prev && prev.src !== 2 ? 1 : 2 });
      byKey.set(k, c.id);
    }
    const out = new Map([...fresh2, ...order].map((n) => [n, { name: n, extra: meta.get(n), cls: fresh2.includes(n), rows: [] }]));
    for (const [id, e] of ent) out.get(e.g).rows.push(opt.out(e.row, id, e.src));
    return [...out.values()].filter((g) => g.rows.length);
  }
  function applyList(base, changes) {
    const m = new Map(base.map((l) => [l.id, { ...l, src: 0 }])), added = new Map();
    for (const c of changes) {
      if (c.del) { m.delete(c.id); added.delete(c.id); continue; }
      const { del, ...x } = c;
      if (m.has(c.id)) m.set(c.id, { ...x, src: 1 }); else added.set(c.id, { ...x, src: 2 });
    }
    return [...added.values(), ...m.values()];
  }
  /**
   * base: APP_DATA-like { levels, sentences, grammar, stem }; packs: cleaned packs, lowest first.
   * Returns the same shapes; word rows get [.., id, src], sentence rows [en, vi, note, id, src], lessons { …, src }.
   */
  function apply(base, packs) {
    const ch = (k) => packs.filter(Boolean).flatMap((p) => p[k]);
    const levels = {}, sentences = {};
    for (const lvl of Object.keys(base.levels || {})) {
      levels[lvl] = layer((base.levels[lvl] || []).map((t) => ({ name: t.vi, extra: t.en, rows: t.words })), ch("words").filter((c) => c.lvl === lvl), {
        id: (r) => wordId(lvl, r[0], r[1]), key: (r) => wkey(r[0], r[1]), group: "topic", extra: (c) => c.topic,
        row: (c) => [c.w, c.pos, c.ipa, c.vi, c.ex, c.emo], out: (r, id, src) => [r[0], r[1], r[2], r[3], r[4], r[5], id, src],
      }).map((g) => ({ en: g.extra, vi: g.name, cls: g.cls, words: g.rows }));
    }
    for (const track of Object.keys(base.sentences || {})) {
      const stageOf = new Map();
      sentences[track] = layer((base.sentences[track] || []).map((g) => (stageOf.set(g.vi, g.stage), { name: g.vi, extra: { en: g.en, stage: g.stage }, rows: g.items })),
        ch("sents").filter((c) => c.track === track), {
          id: (r) => sentId(track, r[0]), key: (r) => String(r[0]).toLowerCase(), group: "group", extra: (c) => ({ en: "", stage: c.stage }),
          row: (c) => [c.en, c.vi, c.note], out: (r, id, src) => [r[0], r[1], r[2] || "", id, src],
        }).map((g) => ({ stage: g.extra.stage, en: g.extra.en, vi: g.name, cls: g.cls, items: g.rows }));
    }
    return { levels, sentences, grammar: applyList(base.grammar || [], ch("grammar")), stem: applyList(base.stem || [], ch("stem")) };
  }

  /** Quizlet-style bulk import: one item per line, fields split by tab, " | " or " - ". */
  function parseLines(text, fields) {
    return String(text || "").split(/\r?\n/).map((ln) => ln.trim()).filter(Boolean).map((ln) => {
      const [sep, glue] = ln.includes("\t") ? ["\t", " "] : ln.includes("|") ? ["|", " | "] : [/\s+[-–—]\s+/, " - "];
      const parts = ln.split(sep).map((s) => s.trim());
      return Object.fromEntries(fields.map((f, i) => [f, i === fields.length - 1 ? parts.slice(i).filter(Boolean).join(glue) : parts[i] || ""]));
    });
  }

  const Content = { KINDS, MAX_ITEMS, MAX_BYTES, LEVELS, TRACKS, STAGES, POS, VIZ_PRESETS, NEW_TOPIC, NEW_GROUP,
    fresh, clean, cleanItem, cleanViz, vizKey, count, put, remove, combine, apply, parseLines, newId, wordId, sentId, compact };
  if (typeof module === "object" && module.exports) module.exports = Content;
  else root.Content = Content;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* UI: views (Hôm nay, Từ vựng, Câu, Ngữ pháp, IPA, Toán & Vật lí, Lớp học: xếp hạng + học liệu, Tiến độ, Nông trại), local storage, speech, and custom word pictures. */
(function () {
  "use strict";
  const C = window.Core, D = window.APP_DATA, F = window.Farm, Online = window.Online, Content = window.Content;

  // ===== CONFIG =====
  const KEY = "nhip.v1";
  const SAVE_MS = 250;
  const LEVELS = { kids: "Tiếng Anh 7", toeic: "TOEIC 750" };
  const TRACKS = { daily: "Hằng ngày", work: "Công sở", toeic: "TOEIC LR & SW" };
  const STAGES = { Basic: "Cơ bản", Intermediate: "Trung cấp", Advanced: "Nâng cao" };
  const POS = { n: "danh từ", v: "động từ", adj: "tính từ", adv: "trạng từ", phr: "cụm từ", prep: "giới từ", conj: "liên từ" };
  const XP = { learn: 10, quiz: 5, review: 3, sent: 8, scramble: 2, ipa: 5, pair: 1, stem: 15, gram: 12 };
  const PERDAY = [3, 30], SENTPER = [1, 10];
  const EMOJIS = ("🎯 🎨 📚 ✏️ 📝 💡 🧠 ⭐ ❤️ 🔥 🌱 🌳 🌸 🍎 🍜 ☕ 🏠 🏫 🏢 🚗 🚌 ✈️ 🚲 ⚽ 🏀 🎵 🎬 📷 💻 📱 ⏰ 📅 💰 💼 " +
    "🤝 👍 👀 🗣️ 👂 ✋ 🙂 😀 😢 😮 😴 🐶 🐱 🐟 🐦 ☀️ 🌧️ ❄️ 🌈 🌍 🗺️ 🎁 🎉 🏆 🔑 🔒 🔍 🧩 🛠️ 📦 🛒 🧾 📈 📉 ⚖️ 🧪 🩺 💊 " +
    "🍽️ 🧳 🏖️ 🎓 👪 👩‍🏫 🧑‍💼 🏥 🚦 🎤 🎮 🧸 🪴 🧹 🛏️").split(" ");

  function week() {

  function hlEx(w) {

  function startLearn(topic) {

  function startQuiz() {

  function vQuiz() {
    const v = U.vocab, q = v.qs[v.i], w = q.word, done = v.answered != null, last = v.i === v.qs.length - 1;

    } else {

      }).join("")}</div>`;
    }
    const fb = !done ? "" : `<p class="feedback ${ok ? "ok" : "no"}">${ok ? `Chính xác! +${XP.quiz} XP` : `Chưa đúng — đáp án: <b>${esc(q.type === "meaning" ? w.vi : w.w)}</b>`}</p>
      <div><button class="btn primary" data-quiznext>${last ? "Xem kết quả" : "Câu tiếp →"}</button></div>`;
    return `<div class="row" style="justify-content:space-between">${back('data-vocab="home"', "Từ vựng")}<span class="chip num">Câu ${v.i + 1}/${v.qs.length}</span></div>
      <h1>Kiểm tra nhanh</h1>
      <section class="panel stack">${prompt}${answers}${fb}</section>`;
  }
  function answerQuiz(correct, picked) {
    const v = U.vocab; if (v.answered != null) return;
    v.answered = correct; v.picked = picked;
    if (correct) { v.right++; addXP(XP.quiz); }

  function vResult() {
    const v = U.vocab;

        <div class="list">${v.words.map((w) => `<div class="item">${pic(w, "sm")}<span class="t"><b>${esc(w.w)}</b> <span class="ipa small muted">/${esc(w.ipa)}/</span><br><span class="small muted">${esc(w.vi)}</span></span>
          <button class="btn icon-btn ghost" data-say="${esc(w.w)}" aria-label="Nghe">${I.speak}</button></div>`).join("")}</div>

  function startReview() {
    const queue = C.dueKeys(prog(), today()).map((k) => BYKEY[k]).filter(Boolean);
    if (!queue.length) { toast("Chưa có từ nào cần ôn"); return; }
    U.vocab = { mode: "review", queue, i: 0, reveal: false, done: 0, again: {} };
    go("words");
  }
  function vReview() {
    const v = U.vocab;
    if (v.i >= v.queue.length) {
      return `<h1>Ôn tập</h1><section class="panel stack"><p class="score">Đã ôn xong 🎉</p>
        <p class="muted">Bạn vừa ôn ${v.done} lượt từ. Hẹn gặp lại ở lượt ôn tiếp theo.</p>
        <div class="row"><button class="btn primary" data-vocab="home">Về Từ vựng</button><button class="btn" data-go="today">Hôm nay</button></div></section>`;
    }
    const w = v.queue[v.i], c = prog()[w.key];
    const nxt = (g) => { const n = C.grade(c, g, today()); return C.daysBetween(today(), n.due); };
    return `<div class="row" style="justify-content:space-between">${back('data-vocab="home"', "Từ vựng")}<span class="chip num">${v.i + 1}/${v.queue.length}</span></div>
      <h1>Ôn tập</h1>
      ${card(w, v.reveal)}
      ${v.reveal ? `<div class="grid g3" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
        ${[["0", "Quên"], ["1", "Khó"], ["2", "Nhớ"], ["3", "Dễ"]].map(([g, l]) =>
          `<button class="btn${g === "2" ? " primary" : ""}" data-grade="${g}">${l} <span class="small" style="opacity:.75">· ${nxt(+g)} ngày</span></button>`).join("")}</div>`
        : `<div><button class="btn primary" data-reveal>Hiện nghĩa</button> <span class="small muted">Hãy nhớ nghĩa trước khi lật thẻ.</span></div>`}`;
  }
  function gradeReview(g) {
    const v = U.vocab, w = v.queue[v.i], p = prog();
    p[w.key] = C.grade(p[w.key], g, today());
    bump("r"); v.done++;
    addXP(XP.review);
    if (g === 0 && !v.again[w.key]) { v.again[w.key] = 1; v.queue.push(w); }
    v.i++; v.reveal = false;
    render();
    if (v.i >= v.queue.length && !v.rewarded) { v.rewarded = true; farmReward("review", "Ôn tập xong"); }
  }
  function vBrowse() {
    const topics = LV[S.level];
    return `<div class="row">${back('data-vocab="home"', "Từ vựng")}</div><h1>Tra cứu từ</h1>
      <section class="panel stack">
        <div class="row"><input type="search" id="bq" placeholder="Tìm từ hoặc nghĩa…" value="${esc(U.bq)}" style="flex:1 1 200px" aria-label="Tìm từ">
          <select id="btopic" aria-label="Chủ đề" style="flex:1 1 160px"><option value="">Tất cả chủ đề</option>${topics.map((t, i) =>
            `<option value="${i}"${String(i) === U.btopic ? " selected" : ""}>${esc(t.vi)}</option>`).join("")}</select></div>

  function browseList() {
    const q = C.norm(U.bq), p = prog();

      (!q || C.norm(w.w).includes(q) || C.norm(w.vi).includes(q)));
    if (!all.length) return `<p class="muted">Không tìm thấy từ nào.</p>`;
    const LIMIT = 80;
    return all.slice(0, LIMIT).map((w) => {
      const c = p[w.key];

      return `<div class="item"><button class="linkish" data-open="${esc(w.key)}" style="grid-column:span 2">${pic(w, "sm")}<span class="t"><b>${esc(w.w)}</b> <span class="ipa small muted">/${esc(w.ipa)}/</span><br><span class="small muted">${esc(w.vi)}</span></span></button>
        <span style="display:flex;gap:6px;align-items:center">${chip}<button class="btn icon-btn ghost" data-say="${esc(w.w)}" aria-label="Nghe ${esc(w.w)}">${I.speak}</button></span></div>`;
    }).join("") + (all.length > LIMIT ? `<p class="small muted" style="padding-top:10px">Hiện ${LIMIT}/${all.length} từ — gõ để tìm nhanh hơn.</p>` : "");
  }

  // ---------- Modal: word detail + picture editor ----------
  let lastFocus = null;
  function sheet(html, label, wide) {
    const m = $("#modal"), s = $("#sheet");
    if (m.hidden) lastFocus = document.activeElement;
    s.innerHTML = html; s.setAttribute("aria-label", label || ""); s.classList.toggle("wide", !!wide);

  }
  function closeModal() {
    $("#modal").hidden = true; $("#sheet").innerHTML = ""; draft = null;
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }
  function openWord(key) {
    const w = BYKEY[key]; if (!w) return;
    const c = S.progress[w.lvl][w.key];
    sheet(`<div class="row" style="justify-content:space-between"><h2>${esc(w.w)} <span class="pos">${POS[w.pos] || ""}</span></h2>
        <button class="btn icon-btn ghost" data-close aria-label="Đóng">${I.x}</button></div>
      <div class="row" style="align-items:flex-start;gap:16px">${pic(w, "md")}
