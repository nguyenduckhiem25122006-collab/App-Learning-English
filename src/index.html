<title>Nhịp Học Tiếng Anh</title>
<meta name="claude:viewport-fit-sides" content="cover">

<!--PWA_HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* Layout concept: a student's notebook — ruled index cards on cool paper, the one bold mark is a yellow highlighter swipe on what to remember. */
:root {
  --paper: #F3F5F9; --card: #FFFFFF; --ink: #15223A; --muted: #59687F; --rule: #DAE1EC; --chip: #E7EDF7;
  --hl: #FFE066; --hl-swipe: #FFE066; --hl-ink: #3A2F00; --action: #2450B8; --action-ink: #FFFFFF;
  --good: #1D8556; --warn: #A86A12; --bad: #BE3B35;
  --soil: #EEDFC6; --soil-edge: #C8A97E; --soil-ink: #5A4026; --sky: #DDEEFF; --grass: #BFE3A6;
  --f-display: "Lexend", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ipa: "Noto Sans", "Lucida Sans Unicode", "DejaVu Sans", "Segoe UI", sans-serif;
  --r: 14px; --shadow: 0 1px 2px rgba(21,34,58,.06), 0 6px 18px rgba(21,34,58,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0D1421; --card: #142034; --ink: #E4EBF5; --muted: #98A7BD; --rule: #24324B; --chip: #1C2A43;
  --hl: #E3C23C; --hl-swipe: rgba(227, 194, 60, .34); --hl-ink: #211A00; --action: #84A6FF; --action-ink: #0A1430;
  --good: #4BC48B; --warn: #E2A64C; --bad: #F2807A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark;
  --soil: #3A2D20; --soil-edge: #6B5136; --soil-ink: #EBD8BC; --sky: #1B2A44; --grass: #23452C } }
:root[data-theme="dark"] {
  --paper: #0D1421; --card: #142034; --ink: #E4EBF5; --muted: #98A7BD; --rule: #24324B; --chip: #1C2A43;
  --hl: #E3C23C; --hl-swipe: rgba(227, 194, 60, .34); --hl-ink: #211A00; --action: #84A6FF; --action-ink: #0A1430;
  --good: #4BC48B; --warn: #E2A64C; --bad: #F2807A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark;
  --soil: #3A2D20; --soil-edge: #6B5136; --soil-ink: #EBD8BC; --sky: #1B2A44; --grass: #23452C }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card) }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; border-radius: 6px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2 }
h2 { font-size: 1.35rem } h3 { font-size: 1.05rem }
p { margin: 0 }
.ipa { font-family: var(--f-ipa); letter-spacing: .01em }
.hl { background: linear-gradient(transparent 52%, var(--hl-swipe) 52%, var(--hl-swipe) 90%, transparent 90%); color: inherit; padding: 0 .08em }
.muted { color: var(--muted) }
.small { font-size: .86rem }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.num { font-variant-numeric: tabular-nums }

/* Shell */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid var(--rule) }
.top-in { max-width: 980px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto }
.brand b { font: 700 1.25rem var(--f-display); letter-spacing: -.01em }
.brand b span { background: linear-gradient(transparent 58%, var(--hl-swipe) 58%, var(--hl-swipe) 92%, transparent 92%); padding: 0 .06em }
.levels { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px }
.levels button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: .9rem; color: var(--muted) }
.levels button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow) }
.streak { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .9rem }
.tabs { max-width: 980px; margin: 0 auto; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)) }
.tabs::-webkit-scrollbar { display: none }
.tabs button { border: 0; background: none; padding: 10px 12px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 6px }
.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--hl) }
.tabs svg { width: 18px; height: 18px }
main { max-width: 980px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px }
@media (max-width: 640px) {
  .tabs-wrap { position: fixed; inset: auto 0 0 0; z-index: 25; background: var(--card); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px) }
  .tabs { justify-content: space-between; gap: 0 }
  .tabs button { flex-direction: column; gap: 2px; font-size: .7rem; padding: 8px 4px 6px; border-bottom: 0; border-top: 3px solid transparent; flex: 1 }
  .tabs button[aria-current="page"] { border-top-color: var(--hl) }
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) }
  .streak .xp { display: none }
}

/* Building blocks */
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px; min-width: 0 }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
.grid { display: grid; gap: 14px }
.g3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }
.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)) }
.stack { display: grid; gap: 10px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--rule); background: var(--card); padding: 9px 14px; border-radius: 10px; font-weight: 600; min-height: 40px }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--action); color: var(--action-ink); border-color: var(--action) }
.btn.primary:hover { filter: brightness(1.08) }
.btn.ghost { border-color: transparent; background: transparent }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: .86rem }
.btn:disabled { opacity: .5; cursor: not-allowed }
.icon-btn { width: 40px; height: 40px; padding: 0; border-radius: 50% }
.btn svg, .icon-btn svg { width: 18px; height: 18px; flex: none }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--chip); font-size: .78rem; font-weight: 600; color: var(--muted) }
.chip.good { color: var(--good) } .chip.warn { color: var(--warn) } .chip.new { color: var(--action) }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--chip); padding: 3px; border-radius: 10px }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: .88rem; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow) }
.bar { height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden }
.bar > i { display: block; height: 100%; background: var(--action); border-radius: inherit }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden }
.stepper button { border: 0; background: var(--chip); width: 38px; height: 38px; font-size: 1.1rem; font-weight: 700 }
.stepper output { min-width: 46px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums }
input[type=search], input[type=text], select { border: 1px solid var(--rule); background: var(--card); border-radius: 10px; padding: 9px 12px; min-height: 40px; min-width: 0 }
input[type=range] { accent-color: var(--action); width: 100% }

/* Today */
.hello { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px }
.hello h1 { font-size: clamp(1.5rem, 4vw, 2rem) }
.goal { display: grid; gap: 10px; align-content: start }
.goal .big { font: 700 2rem var(--f-display); font-variant-numeric: tabular-nums }
.goal .big small { font-size: 1rem; color: var(--muted); font-weight: 600 }
.goal.done { border-color: var(--good) }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 84px }
.week div { display: grid; gap: 4px; justify-items: center; align-content: end; height: 100% }
.week i { width: 100%; max-width: 30px; border-radius: 6px 6px 3px 3px; background: var(--chip); min-height: 4px }
.week i.on { background: var(--action) }
.week i.today { outline: 2px solid var(--hl); outline-offset: 1px }
.week span { font-size: .72rem; color: var(--muted) }

/* Flashcard */
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-columns: minmax(0, 240px) 1fr }
.card .pic-wrap { position: relative; padding: 18px; border-right: 1px solid var(--rule); display: grid; place-items: center }
.card .body { padding: 20px 22px 20px 26px; display: grid; gap: 10px; align-content: start; min-width: 0;
  box-shadow: inset 3px 0 0 color-mix(in srgb, var(--bad) 35%, transparent) }
.word { font: 700 clamp(1.8rem, 6vw, 2.6rem) var(--f-display); letter-spacing: -.015em; overflow-wrap: anywhere }
.pos { font-style: italic; color: var(--muted); font-weight: 600 }
.meaning { font-size: 1.15rem; font-weight: 600 }
.example { padding: 4px 0; border-top: 1px dashed var(--rule); padding-top: 10px }
.example em { font-style: normal }
@media (max-width: 640px) { .card { grid-template-columns: 1fr } .card .pic-wrap { border-right: 0; border-bottom: 1px solid var(--rule) } }
.pic { width: 100%; max-width: 200px; aspect-ratio: 1; border-radius: 16px; display: grid; place-items: center; background: var(--chip); overflow: hidden; font-size: clamp(64px, 18vw, 110px); line-height: 1; user-select: none }
.pic img { width: 100%; height: 100%; object-fit: cover }
.pic.sm { width: 44px; height: 44px; max-width: 44px; font-size: 26px; border-radius: 10px }
.pic.md { max-width: 120px; font-size: 64px }
.edit-pic { position: absolute; right: 12px; bottom: 12px }
.dots { display: flex; gap: 6px; flex-wrap: wrap }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--chip) }
.dots i.on { background: var(--action) } .dots i.cur { background: var(--hl); outline: 2px solid var(--ink) }

/* Quiz */
.choices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) }
.choice { text-align: left; border: 2px solid var(--rule); background: var(--card); border-radius: 12px; padding: 12px 14px; font-weight: 600; min-height: 52px }
.choice:hover:not(:disabled) { border-color: var(--action) }
.choice.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--card)) }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--card)) }
.feedback { font-weight: 600 } .feedback.ok { color: var(--good) } .feedback.no { color: var(--bad) }

/* Lists */
.list { display: grid }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--rule); min-width: 0 }
.item:last-child { border-bottom: 0 }
.item .t { min-width: 0 }
.item .t b { font-family: var(--f-display) }
.item button.linkish { all: unset; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; min-width: 0 }
.item button.linkish:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; border-radius: 6px }
.topic { display: grid; gap: 6px }
.topic-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline }

/* Sentences */
.sent { display: grid; gap: 10px }
.sent .en { font: 600 clamp(1.15rem, 3.2vw, 1.4rem)/1.4 var(--f-display) }
.sent .vi { color: var(--muted) }
.note { font-size: .86rem; border-left: 3px solid var(--hl); padding-left: 10px }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; min-height: 44px; padding: 6px; border: 1px dashed var(--rule); border-radius: 10px }
.tile { border: 1px solid var(--rule); background: var(--chip); padding: 4px 10px; border-radius: 8px; font-weight: 600 }
.score { font: 700 1.6rem var(--f-display) }

/* IPA */
.ipa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px }
.snd { position: relative; border: 1px solid var(--rule); background: var(--card); border-radius: 12px; padding: 10px 4px 8px; display: grid; justify-items: center; gap: 2px }
.snd b { font: 600 1.6rem var(--f-ipa) }
.snd span { font-size: .7rem; color: var(--muted); text-align: center; line-height: 1.2 }
.snd.learned { border-color: var(--good) }
.snd.learned::after { content: ""; position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--good) }
.snd[aria-pressed="true"] { border-color: var(--action); box-shadow: 0 0 0 2px var(--action) inset }
.snd-detail { display: grid; gap: 14px }
.snd-sym { font: 600 3.4rem/1 var(--f-ipa) }
.ex-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px }
.ex { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--rule); border-radius: 10px; padding: 6px 6px 6px 12px; min-width: 0 }
.ex div { min-width: 0 }
.path { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px }
.path button { text-align: left; border: 1px solid var(--rule); background: var(--card); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px }
details { border-top: 1px solid var(--rule); padding: 10px 0 }
details summary { cursor: pointer; font-weight: 600; font-family: var(--f-display) }
details[open] summary { margin-bottom: 8px }

/* Progress */
.boxes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 110px }
.boxes div { display: grid; justify-items: center; gap: 4px; align-content: end; height: 100% }
.boxes i { width: 100%; max-width: 34px; background: var(--action); border-radius: 6px 6px 2px 2px; min-height: 2px }
.boxes span { font-size: .72rem; color: var(--muted) }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px }
.badge { border: 1px solid var(--rule); border-radius: 12px; padding: 10px; display: grid; gap: 4px; justify-items: center; text-align: center; font-size: .82rem; font-weight: 600 }
.badge .m { font-size: 1.7rem; filter: grayscale(1); opacity: .45 }
.badge.on { border-color: var(--hl) } .badge.on .m { filter: none; opacity: 1 }
.setting { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule) }
.setting:last-child { border-bottom: 0 }
@media (max-width: 520px) { .setting { grid-template-columns: 1fr } }

/* Farm */
.farm-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid color-mix(in srgb, var(--good) 45%, var(--rule)); background: color-mix(in srgb, var(--good) 12%, var(--card));
  padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: .9rem; min-height: 38px }
.farm-btn b { font-family: var(--f-display); color: var(--good) }
.farm-btn[aria-pressed="true"] { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset }
.scene { border-radius: var(--r); border: 1px solid var(--rule); background: linear-gradient(var(--sky) 0 52%, var(--grass) 52%); padding: 14px 16px 10px;
  display: flex; flex-wrap: wrap; align-items: end; gap: 6px 10px; font-size: 2rem; line-height: 1; min-height: 92px }
.scene .sun { margin-left: auto; align-self: start; font-size: 1.6rem }
.field { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px }
.plot { position: relative; aspect-ratio: 1; border: 2px solid var(--soil-edge); border-radius: 14px; color: var(--soil-ink); font-size: .74rem; font-weight: 600;
  background: repeating-linear-gradient(0deg, var(--soil) 0 11px, color-mix(in srgb, var(--soil-edge) 35%, var(--soil)) 11px 13px);
  display: grid; place-items: center; align-content: center; gap: 3px; padding: 6px; min-width: 0 }
.plot .e { font-size: 2.1rem; line-height: 1 }
.plot.empty { border-style: dashed } .plot.empty .e { font-size: 1.6rem; opacity: .6 }
.plot.ready { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset }
.plot .bar { width: 80%; height: 5px } .plot .bar > i, .animal .bar > i { background: var(--good) }
@media (prefers-reduced-motion: no-preference) { .plot.ready .e { animation: bob 1.4s ease-in-out infinite } @keyframes bob { 50% { transform: translateY(-4px) } } }
.orders { display: grid; gap: 10px }
.order { border: 1px solid var(--rule); border-radius: 12px; padding: 12px; display: grid; gap: 10px }
.need { display: flex; flex-wrap: wrap; gap: 6px }
.need span { padding: 3px 10px; border-radius: 999px; background: var(--chip); font-weight: 600; font-size: .86rem }
.need .ok { color: var(--good) } .need .no { color: var(--bad) }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px }
.shop .it { border: 1px solid var(--rule); border-radius: 12px; padding: 10px; display: grid; gap: 4px; align-content: start; min-width: 0 }
.shop .it .e { font-size: 1.8rem; line-height: 1.1 }
.shop .it.owned { border-color: var(--good) }
.earn { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px }

/* Modal + toast */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(10,16,28,.55); display: grid; place-items: center; padding: 16px }
.sheet { background: var(--card); border-radius: 18px; width: min(560px, 100%); max-height: calc(100% - 24px); overflow: auto; padding: 18px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35) }
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; max-height: 200px; overflow: auto }
.emoji-grid button { font-size: 1.5rem; border: 1px solid var(--rule); background: var(--card); border-radius: 10px; aspect-ratio: 1 }
.swatches { display: flex; flex-wrap: wrap; gap: 8px }
.swatches button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--rule) }
.swatches button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--card) inset }
canvas.draw { width: 100%; max-width: 320px; aspect-ratio: 1; border: 1px solid var(--rule); border-radius: 12px; background: #fff; touch-action: none }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--paper);
  padding: 10px 16px; border-radius: 12px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--shadow) }
@media (max-width: 640px) { .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)) } }
@media (prefers-reduced-motion: no-preference) {
  .card, .sheet, .sent { animation: rise .22s ease-out }
  @keyframes rise { from { transform: translateY(6px); opacity: .6 } to { transform: none; opacity: 1 } }
}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b><span>Nhịp</span></b><span class="muted small">Học tiếng Anh mỗi ngày</span></div>
    <div class="levels" role="group" aria-label="Chọn level">
      <button type="button" id="lv-kids" data-level="kids">Lớp 7</button>
      <button type="button" id="lv-toeic" data-level="toeic">TOEIC 750</button>
    </div>
    <button type="button" class="farm-btn" id="farm-btn" data-farm aria-pressed="false"><span aria-hidden="true">🌾</span> Nông trại <b class="num" id="coins"></b></button>
    <div class="streak" id="streak" aria-live="polite"></div>
  </div>
  <div class="tabs-wrap">
    <nav class="tabs" aria-label="Chế độ học" id="tabs"></nav>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>/*DATA*/</script>
<script>/*CORE*/</script>
<script>/*FARM*/</script>
<script>/*APP*/</script>
